<blockquote>
  <p style="text-align:center;"><span class="text-big"><mark class="pen-red">⚠️ <strong>最重要的一句先说在最前面：</strong></mark></span></p>
  <p style="text-align:center;"><span class="text-big"><mark class="pen-red">一旦怀疑有人因为摄入亚硝酸钠 / 亚硝酸盐而中毒，</mark></span><br><span class="text-big"><mark class="pen-red"><strong>第一步永远是：立刻拨打 120（或当地急救电话）。</strong></mark></span></p>
  <p style="text-align:center;"><span class="text-big"><mark class="pen-red">请以急救调度员和医生的指示为最高优先级，</mark></span><br><span class="text-big"><mark class="pen-red">本页面只是帮你把他们可能会说的话讲得更清楚、更有条理，</mark></span><br><span class="text-big"><mark class="pen-red"><strong>不能代替专业诊断和治疗。</strong></mark></span></p>
</blockquote>
<hr>
<h2 style="text-align:center;" id="h-0-使用说明-适用范围" class="toc-header"><a class="toc-anchor" href="#h-0-使用说明-适用范围">¶</a> 0. 使用说明 &amp; 适用范围</h2>
<p style="text-align:center;">本页面向两类人：<br>1）<strong>旁人 / 朋友 / 家属</strong>：刚发现有人吞了亚硝酸盐；<br>2）<strong>本人</strong>：你自己刚吞了亚硝酸盐，还能看手机、还能做决定。</p>
<p style="text-align:center;">本页面<strong>只谈中毒后的急救与求生</strong>，不会提供任何关于：</p>
<p style="text-align:center;">购买渠道</p>
<p style="text-align:center;">具体剂量</p>
<p style="text-align:center;">配方和“成功率”</p>
<p style="text-align:center;">任何时候，只要你觉得情况危急，<mark class="pen-red"><strong>别浪费时间在 wiki 上纠结细节，直接听 120 调度和医生的</strong>。</mark></p>
<hr>
<h2 style="text-align:center;" id="一-旁人视角现在立刻可以做的事按时间顺序" class="toc-header"><a class="toc-anchor" href="#一-旁人视角现在立刻可以做的事按时间顺序">¶</a> 一、旁人视角：现在立刻可以做的事（按时间顺序）</h2>
<h3 style="text-align:center;" id="h-1-立刻拨打-120-急救电话" class="toc-header"><a class="toc-anchor" href="#h-1-立刻拨打-120-急救电话">¶</a> <span class="text-big"><mark class="pen-red">1. 立刻拨打 120 / 急救电话</mark></span></h3>
<p style="text-align:center;"><mark class="pen-red"><strong>别等症状“更严重一点再叫车”。</strong></mark><br>亚硝酸钠可以在短时间内让血液失去携氧能力，导致严重缺氧、意识改变、心律紊乱甚至心跳骤停。</p>
<p style="text-align:center;">拨打 120 时，可以按这个结构说（可以直接照读）：</p>
<blockquote>
  <p style="text-align:center;">“这里是（地址/大概位置）。<br>有一名 <strong>疑似摄入亚硝酸钠（亚硝酸盐）自杀/误服的病人</strong>。<br>现在表现为：<strong>嘴唇/指甲发紫，呼吸困难 / 剧烈头晕 / 恶心呕吐 / 说话含糊 / 好像要昏过去</strong>。<br>请尽快派车。<br>请同时提醒急诊科：<strong>可能是亚硝酸盐引起的高铁血红蛋白血症，需要准备亚甲蓝注射液、高流量氧气、静脉通路和必要时的血液净化设备。</strong>”</p>
</blockquote>
<p style="text-align:center;">（不用纠结术语读得准不准，只要让“<span class="text-big"><mark class="pen-red"><strong>亚硝酸盐 + 可能要用亚甲蓝</strong></mark></span>”这两个信息传到医院就行。）</p>
<blockquote>
  <p style="text-align:center;"><strong>通话时建议：</strong></p>
  <p style="text-align:center;"><strong>开免提 / 耳机，一边听调度员指导，一边做下面的步骤；</strong></p>
  <p style="text-align:center;"><strong>不要因为“怕麻烦”或“怕被问细节”而隐瞒“这是自杀”的事实，这些信息会直接影响医生在急诊室的优先级和准备。</strong></p>
</blockquote>
<hr>
<h3 style="text-align:center;" id="h-2-快速判断意识和呼吸摆好体位" class="toc-header"><a class="toc-anchor" href="#h-2-快速判断意识和呼吸摆好体位">¶</a> 2. 快速判断意识和呼吸，摆好体位</h3>
<blockquote>
  <p style="text-align:center;"><strong>你不用会专业医学，只要分三种情况：</strong><br>还算清醒 / 意识模糊 / 完全叫不醒。</p>
</blockquote>
<h4 style="text-align:center;" id="h-21-还能说话-有反应-视为清醒但危险" class="toc-header"><a class="toc-anchor" href="#h-21-还能说话-有反应-视为清醒但危险">¶</a> 2.1 还能说话、有反应 → 视为“清醒但危险”</h4>
<p style="text-align:center;">让 TA <strong>尽量半坐位或舒适坐姿</strong>，不要强迫其走动或站着说话，避免加重缺氧。</p>
<p style="text-align:center;">松开领口、围巾、腰带，保持空气流通，但不要吹冷风。</p>
<p style="text-align:center;">安抚情绪，不要逼问“为什么要这样做”，<mark class="pen-red"><strong>此刻先以保命为第一优先</strong>。</mark></p>
<h4 style="text-align:center;" id="h-22-说话含糊-反应迟钝-反复呕吐-视为意识模糊" class="toc-header"><a class="toc-anchor" href="#h-22-说话含糊-反应迟钝-反复呕吐-视为意识模糊">¶</a> 2.2 说话含糊、反应迟钝 / 反复呕吐 → 视为“意识模糊”</h4>
<p style="text-align:center;">让 TA <strong>改为侧卧位</strong>：</p>
<p style="text-align:center;">头偏向一侧，下巴略抬起，保持气道尽量通畅；</p>
<p style="text-align:center;">防止呕吐物倒流、堵住气道。</p>
<p style="text-align:center;">用纸巾 / 毛巾轻轻清理口鼻可见呕吐物或异物。</p>
<p style="text-align:center;">观察呼吸：胸廓有没有起伏、有没有异常打鼾声或喘不过气的样子。</p>
<h4 style="text-align:center;" id="h-23-完全叫不醒怀疑没呼吸-没脉搏-视为极危重" class="toc-header"><a class="toc-anchor" href="#h-23-完全叫不醒怀疑没呼吸-没脉搏-视为极危重">¶</a> <mark class="pen-red">2.3 完全叫不醒，怀疑没呼吸 / 没脉搏 → 视为“极危重”</mark></h4>
<p style="text-align:center;"><mark class="pen-red">立刻告诉 120 调度员 <strong>“叫不醒、怀疑没呼吸 / 没脉搏”</strong>。</mark></p>
<p style="text-align:center;"><mark class="pen-red">如果你学过 CPR，按当地流程立即开始心肺复苏。</mark></p>
<p style="text-align:center;"><mark class="pen-red">没学过，也可以在调度员电话指导下进行<strong>胸外按压</strong>：</mark></p>
<p style="text-align:center;"><mark class="pen-red">按压频率和深度由调度员教你，你跟着做就行。</mark></p>
<blockquote>
  <p style="text-align:center;"><mark class="pen-red"><strong>你此刻做得不完美，也比什么都不做强。</strong></mark></p>
</blockquote>
<hr>
<h3 style="text-align:center;" id="h-3-防止继续暴露-明确不要做的事" class="toc-header"><a class="toc-anchor" href="#h-3-防止继续暴露-明确不要做的事">¶</a> 3. 防止继续暴露 &amp; 明确“不要做”的事</h3>
<h4 style="text-align:center;" id="h-31-防止更多人接触" class="toc-header"><a class="toc-anchor" href="#h-31-防止更多人接触">¶</a> 3.1 防止更多人接触</h4>
<p style="text-align:center;">如果有散落的白色粉末 / 开口包装袋：</p>
<p style="text-align:center;">不要徒手抓，用纸巾 / 手套简单装进袋子，避免其他人误触或误食；</p>
<p style="text-align:center;">不要在风口、阳台等地方撒得到处都是。</p>
<h4 style="text-align:center;" id="h-32-很多人第一反应是错的请尽量避免" class="toc-header"><a class="toc-anchor" href="#h-32-很多人第一反应是错的请尽量避免">¶</a> 3.2 很多人第一反应是错的，请尽量避免：</h4>
<p style="text-align:center;">❌ <strong>不要催吐</strong></p>
<p style="text-align:center;">亚硝酸钠有一定腐蚀性，强行催吐可能加重食管和咽喉损伤，还增加呕吐物误吸风险。</p>
<p style="text-align:center;">❌ <strong>不要疯狂灌水</strong></p>
<p style="text-align:center;">大量喝水既不能真正“解毒”，反而增加呕吐和误吸的风险。</p>
<p style="text-align:center;">❌ <strong>不要给酒、可乐、奇怪的“解毒偏方”</strong></p>
<p style="text-align:center;">酒精会进一步影响循环系统；各种民间偏方没有可靠证据，可能拖延就医。</p>
<p style="text-align:center;">❌ <strong>不要因为症状暂时缓解就取消去医院</strong></p>
<p style="text-align:center;">亚硝酸盐导致的是血液携氧能力下降，早期症状有时会波动，<strong>并不意味着危险已经过去</strong>。</p>
<h4 style="text-align:center;" id="h-33-家用氧气可以用但不能当治好了" class="toc-header"><a class="toc-anchor" href="#h-33-家用氧气可以用但不能当治好了">¶</a> 3.3 家用氧气可以用，但不能当“治好了”</h4>
<p style="text-align:center;">如果家里刚好有正规<strong>医用氧气瓶</strong>，按说明给 TA 吸氧，能稍微缓解缺氧感。</p>
<p style="text-align:center;">但要知道：</p>
<blockquote>
  <p style="text-align:center;">氧气只是“撑一撑”，<strong>不能把已经变成高铁血红蛋白的那部分血红蛋白变回来</strong>，真正的解毒需要专业治疗。</p>
</blockquote>
<hr>
<h3 style="text-align:center;" id="h-4-帮医生准备的关键信息和物品" class="toc-header"><a class="toc-anchor" href="#h-4-帮医生准备的关键信息和物品">¶</a> 4. 帮医生准备的关键信息和物品</h3>
<p style="text-align:center;">在不耽误急救的前提下，尽量做这些：</p>
<p style="text-align:center;"><strong>带上 / 拍照</strong>所有可疑的东西：</p>
<p style="text-align:center;">亚硝酸盐粉末、包装袋、瓶子</p>
<p style="text-align:center;">同时发现的其他药片、空药板、酒瓶等</p>
<p style="text-align:center;">记下（哪怕是大概的）：</p>
<p style="text-align:center;"><strong>摄入时间</strong>（大约多久以前？）</p>
<p style="text-align:center;">可能摄入的大致量（比如“饭勺两勺”“整袋倒进去”等模糊描述也有用）</p>
<p style="text-align:center;">是否合并其他药物或酒精</p>
<p style="text-align:center;">如果知道 TA 原本有的疾病或长期在吃的药（比如：</p>
<p style="text-align:center;">抗抑郁药 / 抗焦虑药 / 抗精神病药</p>
<p style="text-align:center;">HRT（雌二醇、抗雄药物）</p>
<p style="text-align:center;">心血管疾病药物<br>就记在纸上或手机备忘录里，<strong>一起交给急诊医生</strong>。</p>
<p style="text-align:center;">这些信息会直接影响：</p>
<p style="text-align:center;">医生是否考虑给予<strong>亚甲蓝解毒</strong>以及采用何种剂量；</p>
<p style="text-align:center;">如何避免与既往药物发生相互作用（例如部分抗抑郁药与亚甲蓝合用存在 5-HT 综合征风险）。</p>
<hr>
<h2 style="text-align:center;" id="二-本人视角如果你就是吞了亚硝酸盐的那个人" class="toc-header"><a class="toc-anchor" href="#二-本人视角如果你就是吞了亚硝酸盐的那个人">¶</a> 二、本人视角：如果你就是吞了亚硝酸盐的那个人</h2>
<p style="text-align:center;">如果你现在是边难受边拿着手机看的那一个，请先深呼吸一下（哪怕很难），然后<strong>把注意力先放在“如何活下来”</strong>。</p>
<p style="text-align:center;"><strong>你还能看字、还能操作手机，就说明你离“完全没机会”还有距离。</strong><br>亚硝酸盐中毒如果尽早用上亚甲蓝和支持治疗，很多病例是完全可以恢复的。</p>
<p style="text-align:center;">你不需要向任何人证明“你是认真的”。<br>你已经做了一件非常极端、非常决绝的事。<br><strong>现在最极端的做法，是亲手把自己送进急诊室。</strong></p>
<p style="text-align:center;">你可以这样打 120（照抄也可以）：</p>
<blockquote>
  <p style="text-align:center;"><mark class="pen-red">“我刚刚出于自杀想法服用了亚硝酸钠（亚硝酸盐）。</mark><br><mark class="pen-red">现在已经出现头晕 / 心慌 / 嘴唇发紫 / 呼吸困难。</mark><br><mark class="pen-red">我现在后悔了，想活下去。</mark><br><mark class="pen-red">地址在（准确地址或能被找到的位置），请尽快派车，</mark><br><mark class="pen-red">请提醒急诊准备亚甲蓝、吸氧、输液和抢救设备。”</mark></p>
</blockquote>
<p style="text-align:center;">如果你是 MTF / TGN / 非二元：</p>
<p style="text-align:center;">你<strong>有权利</strong>告诉医护你希望怎么被称呼，用什么称谓；</p>
<p style="text-align:center;">同时请告诉他们：你在用哪些<strong>激素类药物（雌激素、抗雄）、抗抑郁药、抗精神病药、其他精神科药物</strong>。</p>
<p style="text-align:center;">这不是多此一举，而是实实在在关系到他们<strong>怎么用解毒药（例如亚甲蓝）以及怎样监测你有没有药物相互作用问题</strong>。</p>
<p style="text-align:center;">你现在做的一切，不是为了“打扰别人”，而是为了让接下来的人生有资格说一句：</p>
<blockquote>
  <p style="text-align:center;"><mark class="pen-red">“我死过一次，后来决定试试活下去。”</mark></p>
</blockquote>
<hr>
<h2 style="text-align:center;" id="三-亚硝酸钠中毒它在身体里做了什么" class="toc-header"><a class="toc-anchor" href="#三-亚硝酸钠中毒它在身体里做了什么">¶</a> 三、亚硝酸钠中毒：它在身体里做了什么？</h2>
<p style="text-align:center;">这一段是为那些想要多知道一点来安抚不确定感的人写的。<br><strong>如果你现在正处在急性现场，优先看前面那几节就足够了。</strong></p>
<h3 style="text-align:center;" id="h-1-机制为什么会缺氧到发紫" class="toc-header"><a class="toc-anchor" href="#h-1-机制为什么会缺氧到发紫">¶</a> 1. 机制：为什么会“缺氧到发紫”</h3>
<p style="text-align:center;">亚硝酸盐进入体内后，会把血红蛋白里的铁从“二价铁”氧化成“高铁”，变成<strong>高铁血红蛋白</strong>。</p>
<p style="text-align:center;">这种变了形的血红蛋白 <strong>不能好好抓住氧气</strong>，血液看上去还是红的在流，但器官等于在“干吸没有氧气的空气”。</p>
<p style="text-align:center;">结果就是：</p>
<p style="text-align:center;">明明在呼吸，却像被人掐住脖子一样喘不上气；</p>
<p style="text-align:center;">大脑、心脏等对缺氧最敏感的器官会很快出问题，出现头痛、意识模糊、心律失常甚至心跳骤停。</p>
<h3 style="text-align:center;" id="h-2-典型症状可能出现的一部分" class="toc-header"><a class="toc-anchor" href="#h-2-典型症状可能出现的一部分">¶</a> 2. 典型症状（可能出现的一部分）</h3>
<p style="text-align:center;">症状会因剂量、体重、个体差异而不同，常见的包括：</p>
<p style="text-align:center;">皮肤、嘴唇、指甲发<strong>青紫 / 灰蓝 / 异常暗红</strong></p>
<p style="text-align:center;">剧烈头晕、乏力、胸闷、呼吸困难</p>
<p style="text-align:center;">心跳加快或乱跳（心悸）</p>
<p style="text-align:center;">恶心、呕吐、腹痛</p>
<p style="text-align:center;">视物模糊、说话含糊、行为异常</p>
<p style="text-align:center;">意识模糊、抽搐、昏迷</p>
<p style="text-align:center;">这些表现的共同本质就是——<strong>全身在缺氧</strong>。</p>
<blockquote>
  <p style="text-align:center;"><mark class="pen-red"><strong>重点：</strong></mark><br><mark class="pen-red">一旦出现“发紫 + 呼吸困难 + 意识改变”，不要继续在家观察，</mark><br><mark class="pen-red">把它当成心梗、中风那种等级的危重情况来处理。</mark></p>
</blockquote>
<h3 style="text-align:center;" id="h-3-医院大致会做些什么科普向说明" class="toc-header"><a class="toc-anchor" href="#h-3-医院大致会做些什么科普向说明">¶</a> 3. 医院大致会做些什么？（科普向说明）</h3>
<p style="text-align:center;">具体操作由医生根据情况决定，这里只是帮助你理解，不是自救教程：</p>
<p style="text-align:center;"><strong>监测与检查</strong></p>
<p style="text-align:center;">生命体征：血压、心率、呼吸频率、血氧饱和度；</p>
<p style="text-align:center;">实验室检查：动脉血气分析、血中高铁血红蛋白水平等。</p>
<p style="text-align:center;"><strong>基础支持治疗</strong></p>
<p style="text-align:center;">高流量氧气吸入（面罩 / 高流量鼻导管）；</p>
<p style="text-align:center;">建立静脉通路、输液维持循环稳定；</p>
<p style="text-align:center;">必要时使用升压药、抗惊厥药等。</p>
<p style="text-align:center;"><strong>特异性解毒药：亚甲蓝（Methylene Blue）</strong></p>
<p style="text-align:center;">是<strong>获得性高铁血红蛋白血症的一线解毒药物</strong>，可以帮助把高铁血红蛋白还原回正常血红蛋白，让血液恢复携氧能力。</p>
<p style="text-align:center;">一般通过静脉缓慢推注 / 输注，根据病情和体重由医生计算剂量。</p>
<p style="text-align:center;">通常在给药后 30–60 分钟内，血氧和症状会明显改善（如果在可逆阶段及时用上）。</p>
<p style="text-align:center;"><strong>重症时的进一步措施</strong></p>
<p style="text-align:center;">若出现呼吸衰竭：可能需要气管插管、呼吸机；</p>
<p style="text-align:center;">若对亚甲蓝反应不好或病情极重：可能考虑换血、血液透析等高级支持。</p>
<p style="text-align:center;"><strong>延迟就医 / 大剂量摄入可能的后果</strong></p>
<p style="text-align:center;">若长时间严重缺氧，即使抢救成功，也可能留下脑功能受损、认知障碍等后遗症。</p>
<p style="text-align:center;">简单说：</p>
<blockquote>
  <p style="text-align:center;"><strong>越早到医院，越早用上合适的治疗，越有可能“完全恢复而没有后遗症”。</strong></p>
</blockquote>
<hr>
<h2 style="text-align:center;" id="四-对-mtf-长期用药人群和同伴的特别提醒" class="toc-header"><a class="toc-anchor" href="#四-对-mtf-长期用药人群和同伴的特别提醒">¶</a> 四、对 MTF / 长期用药人群和同伴的特别提醒</h2>
<p style="text-align:center;">这一节不止亚硝酸盐。</p>
<h3 style="text-align:center;" id="h-1-请尽量带上-拍照这些东西" class="toc-header"><a class="toc-anchor" href="#h-1-请尽量带上-拍照这些东西">¶</a> 1. 请尽量带上 / 拍照这些东西</h3>
<p style="text-align:center;">所有日常在吃的<strong>精神科药物</strong>：</p>
<p style="text-align:center;">抗抑郁药（SSRI / SNRI / 三环类等）</p>
<p style="text-align:center;">抗焦虑药、镇静催眠药</p>
<p style="text-align:center;">抗精神病药、心境稳定剂</p>
<p style="text-align:center;">所有在用的<strong>HRT 药物</strong>：</p>
<p style="text-align:center;">雌二醇（口服 / 透皮）、醋酸环丙孕酮、螺内酯等</p>
<p style="text-align:center;">若有其他慢性病：降压药、心脏病药、抗癫痫药等</p>
<p style="text-align:center;">这些信息对医生来说不是“隐私八卦”，而是<strong>用药安全的关键参数</strong>。比如：</p>
<p style="text-align:center;">亚甲蓝本身是一个强效的可逆 MAOI，<strong>与部分抗抑郁药（特别是 SSRI / SNRI）合用时存在 5-HT 综合征风险</strong>；但在生命威胁的高铁血红蛋白血症场景下，医生会评估利弊后决定使用方式。</p>
<p style="text-align:center;">&nbsp;</p>
<h3 style="text-align:center;" id="h-2-在急诊可以这样介绍-ta如果-ta-没法自己讲" class="toc-header"><a class="toc-anchor" href="#h-2-在急诊可以这样介绍-ta如果-ta-没法自己讲">¶</a> 2. 在急诊可以这样介绍 TA（如果 TA 没法自己讲）</h3>
<blockquote>
  <p style="text-align:center;">“TA 是跨性别女性 / 男性 / 非二元，<br>长期在用（列出激素）和（列出精神科药物），<br>这次是疑似亚硝酸盐自杀中毒。”</p>
</blockquote>
<p style="text-align:center;">这么说既能让医护更快进入状态，也能减少反复追问造成的二次伤害。</p>
<hr>
<h2 style="text-align:center;" id="五-写给正在考虑用亚硝酸盐自杀的你" class="toc-header"><a class="toc-anchor" href="#五-写给正在考虑用亚硝酸盐自杀的你">¶</a> <mark class="pen-red">五、写给正在考虑用亚硝酸盐自杀的你</mark></h2>
<p style="text-align:center;"><mark class="pen-red">这段话，是写给那些<strong>在搜索时就已经想好了要用亚硝酸盐</strong>的人看的。</mark></p>
<h3 style="text-align:center;" id="h-1-现实一点这是一个非常痛苦-非常难控制的方式" class="toc-header"><a class="toc-anchor" href="#h-1-现实一点这是一个非常痛苦-非常难控制的方式">¶</a> <mark class="pen-red">1. 现实一点：这是一个非常痛苦、非常难控制的方式</mark></h3>
<p style="text-align:center;"><mark class="pen-red">法医和临床报告里反复提到：</mark></p>
<p style="text-align:center;"><mark class="pen-red">急性亚硝酸盐中毒的死者，全身会呈现<strong>蓝灰 / 巧克力色</strong>的尸斑；</mark></p>
<p style="text-align:center;"><mark class="pen-red">生前则常常经历<strong>严重的气促、焦虑、胸痛、头痛、恶心、抽搐</strong>等症状。</mark></p>
<p style="text-align:center;"><mark class="pen-red">很多案例里，<strong>当事人在快窒息的时候其实已经后悔了</strong>，求救或者被旁人发现，但因为剂量、体质、就医时间等问题，最后仍然死亡或留下重度后遗症。</mark></p>
<p style="text-align:center;"><mark class="pen-red">它既不是“平静”，也不是“干净”，更不是“有尊严”。</mark></p>
<h3 style="text-align:center;" id="h-2-现实一点这个方法的失败结局很糟糕" class="toc-header"><a class="toc-anchor" href="#h-2-现实一点这个方法的失败结局很糟糕">¶</a> <mark class="pen-red">2. 现实一点：这个方法的“失败结局”很糟糕</mark></h3>
<p style="text-align:center;"><mark class="pen-red">有人被救回来，却因为长时间缺氧，留下<strong>记忆力减退、情绪改变、运动障碍</strong>等后遗症；</mark></p>
<p style="text-align:center;"><mark class="pen-red">有人从此需要长期服药、复诊、复健，</mark><br><mark class="pen-red">每次回想那一天都会觉得——</mark><br><mark class="pen-red"><strong>“如果当时能提前停下或者早点求救就好了。”</strong></mark></p>
<p style="text-align:center;"><mark class="pen-red">也就是说：</mark></p>
<blockquote>
  <p style="text-align:center;"><mark class="pen-red">用亚硝酸盐自杀，你付出的代价不只是“死或没死”，</mark><br><mark class="pen-red">中间还有一大片“活着但被严重后遗症困住”的可能。</mark></p>
</blockquote>
<h3 style="text-align:center;" id="h-3-你已经极端到这种程度了其实你还有另外一种极端的选择" class="toc-header"><a class="toc-anchor" href="#h-3-你已经极端到这种程度了其实你还有另外一种极端的选择">¶</a> <mark class="pen-red">3. 你已经极端到这种程度了，其实你还有另外一种极端的选择</mark></h3>
<p style="text-align:center;"><mark class="pen-red"><strong>你都已经狠下心来吞这种东西了，</strong></mark><br><mark class="pen-red"><strong>说明你并不是怕疼、怕麻烦、怕别人怎么想。</strong></mark></p>
<p style="text-align:center;"><mark class="pen-red"><strong>那为什么不把这份狠劲用在“再试一试活下去”上？</strong></mark></p>
<p style="text-align:center;"><mark class="pen-red"><strong>狠一点去找医生、找心理咨询、找能帮忙的人；</strong></mark></p>
<p style="text-align:center;"><mark class="pen-red"><strong>狠一点去撕开自己现在生活里那些让你崩溃的东西，</strong></mark><br><mark class="pen-red"><strong>不再假装一切正常，而是承认你真的撑不住了、需要帮忙。</strong></mark></p>
<blockquote>
  <p style="text-align:center;"><mark class="pen-red">你他妈都有勇气吞亚硝酸盐了，</mark><br><mark class="pen-red">还没勇气试着烂活着一下？</mark></p>
</blockquote>
<p style="text-align:center;"><mark class="pen-red">我不知道你以后能不能过上“好得不得了”的生活，</mark><br><mark class="pen-red">但至少，如果你现在选择拨打 120、跟医生合作活下去，</mark><br><mark class="pen-red">几年后的你有资格回头骂一句：</mark></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>“当年那个决定真他妈危险，不过幸好最后活下来了。”</strong></mark></span></p>
<p style="text-align:center;"><mark class="pen-red">而不是让故事停在一个完全没得改写的结局。</mark></p>
<p style="text-align:center;">&nbsp;</p>
