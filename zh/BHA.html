<h3 id="h-1-bha-原理与作用机制" class="toc-header"><a class="toc-anchor" href="#h-1-bha-原理与作用机制">¶</a> 1. BHA 原理与作用机制</h3>
<p><strong>定义</strong>：BHA（Beta Hydroxy Acid，β-羟基酸）中最常见的就是 <strong>水杨酸（Salicylic Acid）</strong>。</p>
<p><strong>溶解特性</strong>：油溶性，能够<strong>深入毛孔</strong>，溶解毛孔内部的皮脂和堵塞物，减少粉刺和黑头。</p>
<p><strong>主要功效</strong>：</p>
<p><strong>溶解毛孔内油脂</strong>：减少粉刺、黑头生成；</p>
<p><strong>抗炎镇静</strong>：对痘痘型炎症（红肿痘痘）有良好舒缓效果；</p>
<p><strong>弱角质剥脱</strong>：温和去除表层死皮，提升肤色通透度。</p>
<blockquote>
  <p><strong>特别提醒</strong>：</p>
  <p>BHA 对轻度敏感肌也友好，因为它同时具有<strong>抗炎作用</strong>；</p>
  <p>对 <strong>阿司匹林过敏者</strong>（与水杨酸同属化合物）需规避。</p>
</blockquote>
<hr>
<h3 id="h-2-bha-适合人群与常见用途" class="toc-header"><a class="toc-anchor" href="#h-2-bha-适合人群与常见用途">¶</a> 2. BHA 适合人群与常见用途</h3>
<p><strong>适合人群</strong>：</p>
<p><strong>油性 / 痘痘肌</strong>：可以深入毛孔清除多余油脂；</p>
<p><strong>毛孔粗大、闭口、黑头</strong>：针对性溶解；</p>
<p><strong>轻度敏感肌</strong>：适用 0.5%~1% 低浓度配方。</p>
<p><strong>慎用人群</strong>：</p>
<p><strong>极干性皮肤</strong>、<strong>破损性痘痘</strong>：可能过度刺激；</p>
<p><strong>正在使用高浓度 AHA / 视黄醇</strong>：需轮替使用，避免叠加刺激。</p>

<h3 id="h-4-bha-如何刷安全步骤与注意事项" class="toc-header"><a class="toc-anchor" href="#h-4-bha-如何刷安全步骤与注意事项">¶</a> 4. BHA 如何刷？安全步骤与注意事项</h3>
<p><strong>前期准备</strong>：</p>
<p>晚间洁面后，用清洁棉片/化妆棉沾取适量<strong>BHA 精华</strong>，轻轻擦拭面部（可重点T区部位）；</p>
<p>初次可以“擦一层后等 3~5 分钟再用清水洗净”，观察皮肤反应。</p>
<p><strong>作用时间与频率</strong>：</p>
<p><strong>新手</strong>：使用 0.5%~1%水杨酸，每周12次；</p>
<p><strong>进阶</strong>：逐渐增至隔天一次，或连续使用3-5天后停2-3天；</p>
<p><strong>若出现轻微泛红，可延长停用时间</strong>，待皮肤修复后再继续。</p>
<p><strong>刷后修护</strong>：</p>
<p>及时涂抹<strong>高保湿型修复霜</strong>，如：</p>
<p><strong>薇诺娜 舒敏特护霜（¥168）</strong> ；</p>
<p><strong>理肤泉 B5 修复霜（¥219）</strong>；</p>
<p>后续 48 小时内减少使用含刺激成分的产品，保持皮肤屏障稳定。</p>
<p><strong>防晒要到位</strong>：</p>
<p>刷酸后皮肤极度敏感，白天必须使用SPF50+/PA++++防晒：</p>
<p><strong>碧柔 水感防晒（¥60/50ml）</strong> ；</p>
<p><strong>优佳 敏感肌防晒乳（¥80/40ml）</strong>；</p>
<p>避免直射紫外线和长时间在强光下活动，否则容易反黑或长斑。</p>
<hr>
<h3 id="h-5-典型-bha-刷酸方案举例" class="toc-header"><a class="toc-anchor" href="#h-5-典型-bha-刷酸方案举例">¶</a> 5. 典型 BHA 刷酸方案举例</h3>
<p><strong>新手级（轻度油皮）</strong>：</p>
<p>使用 <strong>Stridex 红盒 2% BHA 棉片（¥80）</strong>，清洁后以棉片轻擦T区，停留 3 分钟洗净；</p>
<p>一周 1 次，观察皮肤状态，如无红痒可逐步增至周 2 次。</p>
<p><strong>进阶级（油皮痘肌）</strong>：</p>
<p>晚间洁面后使用 <strong>COSRX 4% BHA（¥179）</strong>，均匀涂抹全脸，停留 5~10 分钟；</p>
<p>一周 2~3 次，配合每周 1 次泥膜深层清洁。</p>
<p><strong>专家级（顽固闭口/黑头）</strong>：</p>
<p>晚间先用 <strong>Paula’s Choice 2% BHA（¥420）</strong> 涂抹全脸，包括眼周下方轻微位置（避开眼球）；</p>
<p>配合“湿敷”方式：先涂一层，稍等 5 分钟再叠加第二层；</p>
<p>次日早上涂<strong>温和修复霜</strong>，然后严防晒（+物理隔离）。</p>
