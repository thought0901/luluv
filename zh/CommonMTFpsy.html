<p>在这一篇中，我们主要会讨论trans各种各样常见的心理困境，并尝试给出一种比较健康和实用的建议。</p>
<h2 id="性别焦虑gender-dysphoria与其心理过程" class="toc-header"><a class="toc-anchor" href="#性别焦虑gender-dysphoria与其心理过程">¶</a> <strong>性别焦虑（Gender Dysphoria）与其心理过程</strong></h2>
<p>很明显，性别焦虑是因为自我的性别认同（心理性别）与生理意义上的性别不一致所导致的。性别焦虑通常会带来各种困扰自己的问题，例如<strong>对自己的阴茎与睾丸感到极度厌恶</strong>，<strong>有强烈的想要切除阴茎与睾丸的冲动</strong>等等。</p>
<p>对于有性别焦虑的人群来说，生活都是较为痛苦的。因为无论再怎么试着忽视或者说服自己，外人对自己的看法，自己器官的客观存在都是难以摆脱的。这种内外双重的折磨通常会导致TA出现心理上的问题。这种问题有时也会演变成心理疾病，但鉴于心理问题与心理疾病都是由性别焦虑引起的，所以假如可以通过药物、手术等方式，再辅佐以一定的心理指导，心理问题应当会很容易地解决，或是大大地缓解。</p>
<p>以下是部分有性别焦虑的人群的可能的心理活动：</p>
<ol>
  <li>已经出现了对于“性别错位”的认知，主观想要改变自己的性别</li>
  <li>在上一条的基础上，假如自己生活过得并不好，或是家庭环境恶劣，或是遭受他人的歧视或被欺凌，亦或只是面对着亲朋好友的不解，都有可能会在极度的痛苦与纠结的心理活动中，树立一个，“我遭受的苦难都是因为我并不是正确的性别”的认知。这种认知是难以被轻易克服的，宛如思想钢印一般刻在TA的心灵上，且遭受的苦难越多，自己越痛苦，这种认知就会越顽固。</li>
  <li>在产生了第2条所提到的想法之后，如果继续遭受刺激，或是长期遭受苦难，则会慢慢派生出对自己肉体，对自己的生殖器（如阴茎与睾丸）与生理活动（如月经）的极端厌恶。这种认知是建立在“转换了性别就可以改善生活”这一想法的基础上的，其根本逻辑是将他人对自己的折磨“合理化”，放弃考虑这或许是他人的过错，而把自己的苦难统统归因于自己身上，认为都是自己的过错。同样的，此认知也难以被克服。</li>
  <li>既然已经把苦难都归因在自己身上，就必然要寻求一个解决办法，或是发泄途径。解决办法自然是吃药与SRS。但出于各种各样的条件因素影响下，大多数人都没有办法顺利地实施解决办法。这时候就会开始寻找发泄途径，而最经典的例子是自残。需要注意的是，此处的自残并不仅仅是戏称“改花刀”的割腕，还可能包含对自己生殖器官的折磨，例如使用滚烫的热水来浸泡自己的睾丸，或是尝试用刀自行切除等等。</li>
</ol>
<p>当TA走到了第3、4步，则证明TA已经明显地处于长期痛苦之中。假如这个时候去做心理咨询，大概率会确诊心理疾病。心理疾病的康复并不容易，但只要进行一定的心理辅导，改善家庭环境，并且完成性别转换的流程的话，那么TA将有可能会非常快速地好起来。</p>
<p>另外一点值得注意的是，虽然长期的心理疾病有可能会导致精神疾病，但有性别焦虑，并不能直接与有心理疾病/精神疾病划等号。人人都有焦虑的时候，焦虑是人正常的心理活动，而性别焦虑也只是其中一种。</p>
<h2 id="自我异化-自体分裂与自我回归" class="toc-header"><a class="toc-anchor" href="#自我异化-自体分裂与自我回归">¶</a> <strong>自我异化、自体分裂与自我回归</strong></h2>
<p>这一小节，我们会更详细地讨论可能存在的心理困境，但会着重于讨论人格分裂症状的出现原因。也许看到这里的你会觉得自己没有患上人格分裂，与我无关。但考虑到trans普遍存在的“两种性别的自己待在同一个身体”的现象，这部分依然需要拿出来讨论一下，用以补充相关知识。</p>
<h3 id="自我异化" class="toc-header"><a class="toc-anchor" href="#自我异化">¶</a> 自我异化</h3>
<p>“异化“一词，最早由马克思提出，写出《资本论》的那位。它原本的含义是资本主义社会下，资本家会将劳动者的劳动成果从他们手上夺走，从而导致劳动者的奋斗目标从衣食住行转为一昧追求金钱的现象。而在心理学的语境下，这个词有了别样的诠释。</p>
<p>让我们作个比喻：从你作为婴儿诞生的那一刻起，作为人，便有了人格，即使这个人格是无比的稚嫩，宛如一片未被书写过的白纸。随着年岁的增长，阅历的增加，在慢慢长大的同时，人格也会逐渐从稚嫩走向成熟。倘若我们把人格比作一张白纸，那么人格逐渐走向成熟的过程，便是在这张白纸上不断书写的过程。可以想见的，如果没有什么非常严重的外部因素干扰的话，尽管每个人的人格不一样，写于纸上的字也各不相同，但它们都应该是连贯的、上下通顺、有条有理的。而假如一个人遭受到了重大挫折，那么就好比有人打翻了墨水，漆黑的颜色在纸上肆意蔓延，将已写下的部分（即你的过去）与尚未写下的部分（即你的未来）都沾染上了墨色。</p>
<p>打翻了墨水之后，如果我们可以及时处理，擦去墨水，那么墨色便不会沾染得太远，对人的人生影响也就不大；但若是没有及时处理，那么墨色就会蔓延出一大片来，深刻地影响着你的人生。其深刻程度甚至到了当你回忆往昔的时候，那些美好的回忆似乎也变得模糊不清，不再美好了。</p>
<p>当然人总是要向前看的，无论有没有及时处理，你总要写下新的内容。而作为“自适应调整”的一环（这个名词在心理学篇的上一个页面提到过），你会自主或不自主地，为了适应大片的墨色，而改变一以贯之的书写方式。受到创伤的人本是外向的，在遭受创伤之后便可能会变为内向，等等等等诸如此类。这个为了“适应墨色”而改变人格本身特性、扭曲你的心灵的过程，便称为“自我异化”。做出如此重大的变化，实际上只是为了修复心灵上的创口，或是仅仅地让其不再汩汩流血，以及为了使自己免受更多的伤害。</p>
<h3 id="自我分裂" class="toc-header"><a class="toc-anchor" href="#自我分裂">¶</a> 自我分裂</h3>
<p>自我分裂则是自我异化进一步发展的产物。当无论如何都没办法免受更多的伤害，再做出多重大的调整都没有办法封住伤口的时候，同样的，“自适应调整”再次发挥了作用。为了抚慰你的心灵，加固心中的城墙以承受更多的伤害，本来的那个无比脆弱的你（后文称为主人格）便会暂时让位，将抗压一线的位置，让给新生的人格。由此，你便有了两个，乃至更多的人格。</p>
<p>这些人格毫无疑问都属于你的一部分，或许你会遇到与你的性格截然相反，乃至会伤害主人格的人格。它们实际上更多是某种“可能性”，是你不曾选择的，或是曾经放弃的生活方式。我们也可以延续上面白纸的例子，不同的人格对应着不同的书写方式（文风）。在自我分裂现象出现之后，我们便得到了一位，临床医学上称为人格分裂症（DID）的精神疾病的患者。人格分裂是很严重的疾病，人格之间可能会相互争抢身体的主导权，或者内斗，但我们要说的是，患上DID也并非毫无希望。</p>
<h3 id="自我回归痊愈" class="toc-header"><a class="toc-anchor" href="#自我回归痊愈">¶</a> 自我回归/痊愈</h3>
<blockquote>
  <p>破镜无法重圆，但人格可以融合</p>
</blockquote>
<p>并非每个走到自我回归阶段的人，都经历了自我分裂，或是患上了DID。事实上，在自我异化阶段直接跳到自我回归阶段的人才是更常见的情况。不过我们依然主要讨论经历了自我分裂阶段，患上了DID的情况。</p>
<p>总体而论，想要使DID的各个人格合为一体，最重要的事情是与别的人格“和解”并且”达成协议“。</p>
<p>在他们消失之前，最好把他们当成一个独立的人来看待。你需要善待他们，与他们互相理解，来首先避免人格之间的互相冲突。</p>
<p>随后就是达成协议，这一点很复杂，每个人都有自己的情况与困难之处，然而，达成协议的根本理由是<strong>与自己的过去和解。</strong>其他人格的出现，归根到底是心理问题导致的。想要与其他人格进行融合，你就得一个个解决你自己的精神问题。</p>
<p>值得注意的是，也有直接“杀过去”，强行抹消其他人格的痊愈办法，但我并不推荐如此，也不做讨论。</p>
