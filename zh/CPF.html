<p>你可能听过很多人跟你说“减肥要少吃碳水”，“我现在不吃主食了”，“蛋白质吃得越多越好”……<br>这些话，有的是真的，有的是彻头彻尾的减肥神话，甚至是商家和健身网红为了搞流量编出来的伪科学。</p>
<p>你该听谁的？听我现在告诉你的这一章——<strong>一顿饭决定不了你的瘦，但长期吃错结构，能让你变得越来越“虚胖”或“虚弱”。</strong></p>
<hr>
<h2 id="h-1-碳水-蛋白质-脂肪的本质与热量值" class="toc-header"><a class="toc-anchor" href="#h-1-碳水-蛋白质-脂肪的本质与热量值">¶</a> 1. 碳水、蛋白质、脂肪的本质与热量值</h2>
<p>人类摄入的三大营养素：</p>
<p><strong>碳水化合物（Carbohydrates）</strong>：1g = 4 kcal</p>
<p><strong>蛋白质（Protein）</strong>：1g = 4 kcal</p>
<p><strong>脂肪（Fat）</strong>：1g = 9 kcal</p>
<p>也就是说，你吃下一块面包、一个鸡蛋、半瓶奶茶，它们都可以转化为热量供身体使用或者储存为脂肪。关键就在于比例、来源和时间点。</p>
<hr>
<h2 id="h-2-脂肪隐藏得最深-热量最高的陷阱" class="toc-header"><a class="toc-anchor" href="#h-2-脂肪隐藏得最深-热量最高的陷阱">¶</a> 2. 脂肪：隐藏得最深、热量最高的陷阱</h2>
<p>脂肪不是你吃的那块五花肉那么好识别，它藏在你每天“以为不多”的小零嘴里：</p>
<h3 id="常见高脂肪食物你可能想不到" class="toc-header"><a class="toc-anchor" href="#常见高脂肪食物你可能想不到">¶</a> 常见高脂肪食物（你可能想不到）：</h3>
<p>星巴克的芝士蛋糕（一块高达 400~500 kcal，脂肪约 25g）</p>
<p>沙拉酱（20g 脂肪/100g）比薯条更可怕</p>
<p>便利店里的鸡蛋三明治（别看蛋白质多，黄油酱爆表）</p>
<p>花生、杏仁、腰果（每 100g 均超过 45g 脂肪）</p>
<p>榴莲、牛油果、椰子肉（天然脂肪王者）</p>
<p>中餐炒菜（特别是用猪油、黄油或混合调和油的）</p>
<h3 id="脂肪摄入建议" class="toc-header"><a class="toc-anchor" href="#脂肪摄入建议">¶</a> 脂肪摄入建议：</h3>
<p>对于减脂人群，建议每日摄入为体重×<strong>0.4g/公斤体重</strong></p>
<p>也就是说一个体重 70kg 的人，每天摄入约 28g 脂肪为宜<br>（仅相当于一勺花生酱+一片五花肉+一份调味酱）</p>
<blockquote>
  <p><strong>结论：你不是饿死了，而是被油“养”胖了。</strong></p>
</blockquote>
<hr>
<h2 id="h-3-碳水被误解最深的所谓的邪门玩意儿" class="toc-header"><a class="toc-anchor" href="#h-3-碳水被误解最深的所谓的邪门玩意儿">¶</a> 3. 碳水：被误解最深的所谓的邪门玩意儿</h2>
<p>首先，必须打破“低碳神话”：</p>
<p><strong>碳水是身体首选的能量来源</strong>，缺碳＝疲惫、易怒、无力、运动能力下降</p>
<p>碳水吃得太少，身体反而会分解肌肉转化葡萄糖，导致代谢率下降</p>
<p>你越不吃碳水，越容易暴食，因为你缺乏快速提供能量的“安抚剂”</p>
<h3 id="h-31-快碳-vs-慢碳吃碳水吃对才重要" class="toc-header"><a class="toc-anchor" href="#h-31-快碳-vs-慢碳吃碳水吃对才重要">¶</a> 3.1 快碳 vs 慢碳：吃碳水，吃对才重要</h3>
<p><strong>快碳（高GI）</strong>：白面包、糯米饭、蛋糕 —— 快速升糖，容易胰岛素激增</p>
<p><strong>慢碳（低GI）</strong>：糙米、全麦面包、红薯、黑麦、燕麦、藜麦 —— 升糖缓慢，饱腹更久，不易转脂肪</p>
<h3 id="常见主食含碳量估算" class="toc-header"><a class="toc-anchor" href="#常见主食含碳量估算">¶</a> 常见主食含碳量（估算）：</h3>
<p><strong>软米饭</strong>：100g 含碳约 25g</p>
<p><strong>硬米饭</strong>：100g 含碳约 30g</p>
<p><strong>燕麦片</strong>：100g 含碳约 60g（偏慢碳）</p>
<p><strong>红薯</strong>：100g 含碳约 20g</p>
<p><strong>面条</strong>：100g 含碳约 25-30g</p>
<h3 id="正确吃碳水的方法" class="toc-header"><a class="toc-anchor" href="#正确吃碳水的方法">¶</a> 正确吃碳水的方法：</h3>
<p><strong>分餐摄入</strong>：三餐均匀分布，避免一顿吃爆升糖后转脂肪</p>
<p><strong>运动前吃慢碳，运动后补快碳</strong>：提升运动表现与修复速度</p>
<p><strong>早餐不要断碳水</strong>：不然你上午都会像灵魂没插电一样虚无游荡</p>
<blockquote>
  <p><strong>减肥不是断碳，而是“控碳”——精准摄入才是正解。</strong></p>
</blockquote>
<hr>
<h2 id="h-4-蛋白质减脂期间不可缺" class="toc-header"><a class="toc-anchor" href="#h-4-蛋白质减脂期间不可缺">¶</a> 4. 蛋白质：减脂期间不可缺</h2>
<p>蛋白质不是“健美男专属”，更不是“增肌限定”。<br>在减脂期间，<strong>摄入足够蛋白质 = 保住肌肉 + 保住代谢 + 控制饥饿感</strong></p>
<h3 id="常见食物蛋白含量估算" class="toc-header"><a class="toc-anchor" href="#常见食物蛋白含量估算">¶</a> 常见食物蛋白含量（估算）：</h3>
<p>鸡蛋（1个中等）：约 6g 蛋白</p>
<p>鸡胸肉（100g）：约 23g</p>
<p>牛肉（100g）：约 21g</p>
<p>豆腐（100g）：约 8g</p>
<p>牛奶（250ml）：约 8g</p>
<p>黄豆（100g）：约 36g</p>
<h3 id="蛋白摄入建议" class="toc-header"><a class="toc-anchor" href="#蛋白摄入建议">¶</a> 蛋白摄入建议：</h3>
<p>吃优质蛋白，吃干净蛋白，避免混合物</p>
<hr>

<h2 id="h-6-针对-mtf-群体的特殊调整建议" class="toc-header"><a class="toc-anchor" href="#h-6-针对-mtf-群体的特殊调整建议">¶</a> 6. 针对 MTF 群体的特殊调整建议</h2>
<p>MTF群体在HRT治疗期间会普遍出现以下现象：</p>
<p><strong>睾酮下降</strong> → 肌肉保持力变弱，训练适应性降低</p>
<p><strong>雌激素主导</strong> → 脂肪更易储存于臀腿，但代谢速率下降</p>
<p><strong>多数生活形态偏文静</strong> → TDEE（总日能量消耗）普遍低于同龄男性</p>
<h3 id="建议摄入修正" class="toc-header"><a class="toc-anchor" href="#建议摄入修正">¶</a> 建议摄入修正：</h3>
<p>如果HRT变化期，运动量极低，那么以图表为参考基础，<strong>整体将碳水与蛋白统一下调 5%-10%，并把脂肪摄入降低为0.35g/kg</strong>：</p>
<p>&nbsp;</p>
<p>你每天吃的每一口，都要为你的<strong>低 TDEE、高脂倾向体质负责</strong>。MTF 群体在节食期间更容易出现疲劳、低血糖、情绪问题，这些都不是矫情，是激素带来的生理现实，是我们都需要对抗的敌人，所以采取更合理的战斗方式才是正解。</p>
