<p><span class="text-big"><mark class="pen-red"><strong>严重警告：本指南旨在提供信息参考与知识科普，绝不能取代专业医疗建议。激素替代疗法（HRT）是一项严肃的医疗行为，所有药物的使用、剂量调整、方案更换都必须在具有相关经验的专业医生指导下进行。私自用药或模仿他人方案可能导致严重后果，包括但不限于肝损伤、血栓、心血管疾病、内分泌紊乱等，甚至危及生命。请务必珍视自己的健康，遵循专业意见。</strong></mark></span></p>
<p><span class="text-big"><mark class="pen-red"><strong>这篇文章为何而写：</strong></mark><mark class="marker-yellow"><strong>在成为真正自我的过程中，HRT是许多跨性别女性（MTF）探索与重塑身体的重要一步。然而，这条道路常常被碎片化的信息、真假难辨的传言所迷雾笼罩。社群中以讹传讹的“经验”、以及现实中医疗资源对跨性别健康经验的缺乏，都让我们在决策时感到迷茫与不安。</strong></mark></span></p>
<p><span class="text-big"><mark class="pen-red"><strong>我们深知，当一位寻求帮助的人得到的仅是一份“通用模板”式的用药方案，却对背后的原理、风险以及适合自己的其他可能性一无所知时，那种被动与焦虑是多么强烈。因此，</strong></mark><mark class="marker-yellow"><strong>本指南的核心目的是为每一位正在或即将踏上HRT旅程的姐妹，提供一份系统、深入且易懂的药物信息参考。</strong></mark><mark class="pen-red"><strong>我们希望通过拆解复杂的药理知识，打破信息壁垒，让你</strong></mark><mark class="marker-yellow"><strong>在医生的指导下</strong></mark><mark class="pen-red"><strong>更好地理解自己正在使用或将要使用的药物。</strong></mark></span></p>
<p><span class="text-big"><mark class="pen-red"><strong>我们坚信，真正的“知情同意”源于对自身情况和可用选项的充分理解。</strong></mark></span><span class="text-huge"><mark class="pen-red"><strong>这篇指南不是让你自行照方抓药的说明书</strong></mark></span><span class="text-big"><mark class="pen-red"><strong>，而是旨在赋予你知识与力量，使你能够提出更有价值的问题，和医生一起制定最适合你的高度个体化治疗方案。在这段旅程中，希望你能获得本就属于你的选择权和掌控感。</strong></mark></span></p>
<h1 id="核心概念辨析开启旅程前的必修课" class="toc-header"><a class="toc-anchor" href="#核心概念辨析开启旅程前的必修课">¶</a> <strong>核心概念辨析：开启旅程前的必修课</strong></h1>
<h2 id="h-1-雌二醇-estradiol-vs-戊酸雌二醇-estradiol-valerate有什么不同这是hrt中最常见的困惑之一-简单来说" class="toc-header"><a class="toc-anchor" href="#h-1-雌二醇-estradiol-vs-戊酸雌二醇-estradiol-valerate有什么不同这是hrt中最常见的困惑之一-简单来说">¶</a> <strong>1. 雌二醇 (Estradiol) vs. 戊酸雌二醇 (Estradiol Valerate)：有什么不同？</strong><br><span class="text-big"><mark class="marker-yellow">这是HRT中最常见的困惑之一。简单来说：</mark></span></h2>
<p><span class="text-big"><mark class="pen-green">雌二醇 </mark>(E2, Estradiol)：我们体内真正起作用、最有活性的本体雌激素。它直接与雌激素受体结合，产生女性化的生理效应。</span></p>
<p><span class="text-big"><mark class="marker-yellow">戊酸雌二醇 </mark>(EV, Estradiol Valerate)：一种<i>“前体药物”</i>（prodrug）。可以理解为在雌二醇分子上额外附加了一个“戊酸酯”侧链，就像给雌二醇穿上了一层“保护壳”。这个酯化侧链让雌二醇更稳定，更适合制成药物剂型。当戊酸雌二醇进入体内后，体内酶会把这层“保护壳”脱去，释放出活性的雌二醇（E2）来发挥作用。换言之，戊酸雌二醇本身并不直接起作用，必须先转化成雌二醇才能生效。</span></p>
<p><span class="text-big">两者的关键区别在于<mark class="marker-blue">药代动力学</mark>（体内吸收、分布、代谢过程）的不同。戊酸雌二醇由于转化过程，吸收和作用时间有所延迟，其适合的给药方式和效果也与直接使用雌二醇略有不同。例如，戊酸雌二醇常用于制成长效制剂（如肌肉注射液），而未酯化的雌二醇则更多用于凝胶、贴片等形式。</span></p>
<p><span class="text-huge"><strong>雌二醇是最终起效的活性激素</strong>，而<strong>戊酸雌二醇只是它的运输和储存形式</strong></span><span class="text-big">。</span></p>
<h2 id="h-2-化合物名-商品名与剂型学会看懂你的药盒正如本站在抗抑郁药篇中所强调的你需要了解手中药物的几个重要信息" class="toc-header"><a class="toc-anchor" href="#h-2-化合物名-商品名与剂型学会看懂你的药盒正如本站在抗抑郁药篇中所强调的你需要了解手中药物的几个重要信息">¶</a> <strong>2. 化合物名、商品名与剂型：学会看懂你的药盒</strong><br>正如本站在《抗抑郁药》篇中所强调的，你需要了解手中药物的几个重要信息：</h2>
<p><mark class="marker-yellow"><strong>化合物名/通用名 (Generic Name)：</strong></mark><mark class="pen-green"><strong>药物的有效化学成分名称，是全球通用的学名，例如「醋酸环丙孕酮」或「螺内酯」。本指南主要使用化合物名来避免混淆。</strong></mark></p>
<p><mark class="marker-yellow"><strong>商品名 (Brand Name)：</strong></mark><mark class="pen-green"><strong>厂家为药品取的名称，例如醋酸环丙孕酮的商品名有“色普龙”等，螺内酯的商品名有“安体舒通”等。不同厂家和地区可能使用不同的商品名。</strong></mark></p>
<p><mark class="marker-yellow"><strong>剂型 (Dosage Form)：</strong></mark><mark class="pen-green"><strong>药物的物理形态，如口服片剂、透皮贴片、透皮凝胶、肌肉注射液等。剂型决定了药物的给药途径和吸收方式，对疗效和副作用有重大影响。</strong></mark></p>
<p><mark class="marker-yellow"><strong>以上概念了解后，我们就可以深入具体药物的介绍。接下来将分为三个部分：</strong></mark><span class="text-big"><mark class="marker-yellow"><strong>雌激素、抗雄激素、孕激素</strong></mark></span><mark class="marker-yellow"><strong>，分别介绍HRT中常用的药物类别和具体药物信息。</strong></mark></p>
<p>&nbsp;</p>
<h1 id="关于药物供应商和防骗科普" class="toc-header"><a class="toc-anchor" href="#关于药物供应商和防骗科普">¶</a> !!&gt;关于药物供应商和防骗科普</h1>
<p><span class="text-big"><mark class="pen-red">目前在 X（原 Twitter）等社交平台上，围绕 HRT 药物的所谓“药商”“代购”非常多，其中一部分的确在为跨性别社群提供了现实条件下可行的用药渠道，<strong>但也不可避免地混入了骗子、倒卖假药或操作非常不规范的卖家。</strong>常见风险包括：收款不发货、以假药或过期药冒充正规制剂、从不明渠道大量低价进货后散装分装、随意更改说明书剂量，甚至鼓吹所谓“无副作用高效配方”“黑科技研究级雌激素”等等。对普通使用者来说，一旦踩坑，轻则花冤枉钱、用不到有效药物，重则可能影响肝功能、血栓风险或其他长期安全性问题。出于减害和信息整理的目的，</mark><mark class="marker-yellow"><strong>我们在这里单独提醒：请尽量选择在社群内有较长时间公开记录、可追溯评价、且不刻意煽动极端用药的渠道，而不是看到广告就立刻下单。</strong></mark></span></p>
<p><i><mark class="marker-yellow">一般来说，判断一个药商是否“靠谱”，可以从几个最基础的方面入手：例如，该账号是否长期稳定存在，而不是几个月就换名跑路；是否愿意提供清晰的原包装照片、批号和生产厂家信息；是否如实区分“正式上市药物”“研究用试剂”“个人自配/分装”这几类完全不同的东西；在被问到风险和副作用时，是如实回答、提醒注意，还是一味轻描淡写、甚至鼓励超剂量使用。那些价格明显低于正常水平、承诺“绝对无副作用”“想长多快就多快”的账号，往往更值得警惕。对于跨境邮寄的药物，还要意识到海关政策、运输条件等额外风险，这些都不是任何药商或本 Wiki 能替你兜底的。</mark></i></p>
<p>特别需要强调的是：不建议为了追求“更快”“更猛”的效果而购买来历不明的实验性雌二醇试剂，尤其是标注为“研究用”“实验用”“未获批新配方”的高浓度制剂。这类产品往往缺乏公开的药代动力学数据与大样本安全性资料，有些甚至连具体成分和溶剂比例都说不清楚。对于已经因为性别焦虑、抑郁等原因身心负担较重的跨性别人群来说，再把自己当成“试验品”，一旦出现意料之外的副作用，很难找到专业人士来针对这些特殊制剂给出处理方案。相较之下，选择成分明确、制剂形式成熟、在海外有上市历史和规范说明书的药物会更稳妥一些。</p>
<p><span class="text-big"><strong>基于透明和可追溯的原则，有必要说明本页中提到的少数药商名称是如何出现的：</strong></span></p>
<blockquote>
  <p><span class="text-big"><mark class="pen-green"><strong>目前本 Wiki主本人长期使用的<u>比卡鲁胺、日版雌二醇制剂以及补佳乐等口服雌激素</u>，其购买渠道主要是来自常年稳定供应的 </strong></mark></span><a href="https://x.com/HRT_pharmacist" class="is-external-link"><span class="text-big"><mark class="marker-blue"><strong>药商 Kanna</strong></mark></span></a><span class="text-big"><mark class="pen-green"><strong>；而Wiki主所使用的<u>高倍雌二醇凝胶，则是通过稳定且完成血检谷峰测试的高倍雌二醇凝胶供应者 </u></strong></mark></span><a href="https://x.com/MiaoZephyr" class="is-external-link"><span class="text-big"><mark class="marker-blue"><strong><u>小怪兽实验室 </u></strong></mark></span></a><span class="text-big"><mark class="pen-green"><strong><u>获得。</u></strong></mark></span><strong>这两家会在页面上被点名，并不是因为收取了任何广告费用，而是单纯出于“如实交代自己的实际用药来源”这一考虑：既然 Wiki 维护者在条目中谈论 HRT 药物和不同制剂的个人体验，那么相应的供药渠道也有必要写清楚，以便读者理解这些经验背后的前提条件。换句话说，它们出现在这里，是一种信息披露，而不是对任何人“应该”选择谁的推荐或导流。</strong></p>
</blockquote>
<p><span class="text-big"><mark class="pen-red">即便如此，本 Wiki 仍然无法、也不打算对任何具体药商做出“完全可靠”的背书。药商的口碑和经营状况会随着时间变化，如果将来出现严重负面事件，本页所引用的描述也会被相应更新或删除。读者在每一次购买前，都仍然需要自己再次核对包装信息、剂型浓度、有效期和相应风险；如发现药片外观、包装语言与预期完全不符，应当提高警惕，必要时直接放弃使用，而不是“既然买都买了就先吃一点试试”。在任何情况下，能在本国法律允许的框架内，通过正式医疗体系、由专业医生（如内分泌科、精神科等）开具处方并定期随访，始终是更安全、也更推荐的选择。</mark></span></p>
<p><span class="text-big"><mark class="pen-red"><strong>最后再强调一次：本页整理的内容本质上是社群内经验和信息的归纳，仅用于帮助读者理解现实环境下跨性别群体在获取 HRT 药物时可能遇到的渠道与风险，并不构成对任何个人的具体用药、购药建议，也不构成对特定药商的商业宣传或担保。请结合自身情况、所在地区法律与医疗资源，谨慎决策。</strong></mark></span></p>

<h1 id="第一部分雌激素-estrogen-女性化的基石" class="toc-header"><a class="toc-anchor" href="#第一部分雌激素-estrogen-女性化的基石">¶</a> <strong>第一部分：雌激素 (Estrogen) —— 女性化的基石</strong></h1>
<p><span class="text-big"><strong>雌激素是开启女性化身体变化的基石。其核心作用包括</strong><mark class="marker-yellow"><strong>诱导乳房发育，使皮肤柔软细腻，重新分布体脂（更多脂肪堆积在臀部、大腿和胸部），以及</strong></mark><mark class="pen-red"><strong>对情绪和心理状态</strong></mark><mark class="marker-yellow"><strong>产生女性化影响。</strong></mark><strong>在跨性别女性HRT方案中，雌激素类药物是最主要的组成部分。本节我们将介绍雌激素的主要给药途径，包括各自的机制、优缺点和注意事项。</strong></span></p>
<h2 id="h-1-口服雌激素例口服戊酸雌二醇片剂" class="toc-header"><a class="toc-anchor" href="#h-1-口服雌激素例口服戊酸雌二醇片剂">¶</a> <strong>1. 口服雌激素</strong>（例：口服戊酸雌二醇片剂）</h2>
<p>机制与特点：口服服用是最常见、方便且经济的给药方式。历史上，自20世纪中叶起，许多雌激素制剂以口服形式投入使用，例如早在1940年代就上市的由马雌尿提取的共轭雌激素（商品名Premarin）。现代HRT常用的是口服17-β雌二醇或其酯化形式戊酸雌二醇片。这类药物吞服后经胃肠道吸收，进入血液循环。</p>
<p>然而，口服途径有其固有的<strong>核心问题①：肝脏首过效应 (First-Pass Effect)</strong>。药物经消化道吸收入血后，首先通过门静脉运输到肝脏，在进入全身循环前经受肝脏的第一轮代谢处理。在这个过程中，大部分雌二醇会被肝脏迅速代谢为活性较弱的雌酮（E1）。其结果有两方面：<strong>一是生物利用度低</strong>——真正进入全身发挥作用的E2剂量大减；<strong>二是体内雌酮/雌二醇比例（E1/E2）显著高于生理水平</strong>。长期来看，这种异常比例可能带来一些安全性隐忧，例如促进凝血因子合成从而增加血栓风险，以及加重肝脏负担等。因此，在需要长期高剂量雌激素治疗（如部分跨性别女性HRT）时，单纯依赖口服可能不是最佳选择。</p>
<p><strong>核心问题②：与其他药物的代谢冲突（尤其是精神科药物）</strong>。口服雌激素主要通过肝脏中的CYP3A4酶代谢。许多常见药物（如部分抗抑郁药：舍曲林、氟西汀等，以及抗焦虑药、一些抗真菌药等）也需要CYP3A4代谢。如果同时服用这些药物，可能出现竞争代谢通路的情况，导致某一种药物代谢受阻、血药浓度异常升高，<strong>显著增加副作用风险</strong>。因此，如果你正在服用或计划服用精神科药物，一定要让内分泌科医生和精神科医生充分沟通，协调用药方案，必要时调整雌激素剂量或改用不同途径。</p>
<p>关于“舌下含服” (Sublingual)：有些人为了绕开肝脏首过效应，选择将雌二醇片舌下含化。理论上，舌下丰富的毛细血管可以直接吸收药物进入血液，从而避免第一轮肝代谢，获得更高的E2血浓度和更理想的E1/E2比例。这在药理学上可行，也有部分跨性别者报告舌下含服后感觉效果更佳。然而实践中舌下给药存在不便：需要含服15～30分钟且不能吞咽唾液，操作繁琐；每次吸收剂量难以保证一致，可能导致血药浓度波动较大。因此，除非专业医生有明确建议，一般不建议长期依赖舌下含服——标准的服药方式依然是口服吞咽或考虑其他非口服途径。</p>
<h2 id="h-2-透皮雌激素包括凝胶与贴片" class="toc-header"><a class="toc-anchor" href="#h-2-透皮雌激素包括凝胶与贴片">¶</a> <strong>2. 透皮雌激素</strong>（包括凝胶与贴片）</h2>
<p><span class="text-big"><mark class="pen-green"><strong>机制与特点：透皮给药是目前公认在生理上较为优越的一种雌激素给药方式。药物通过皮肤吸收，直接进入皮下毛细血管，再进入全身循环，完全避开了肝脏首过效应。这意味着透皮途径对肝脏更友好，血清中的E1/E2比例更接近顺性别女性的生理状态，在理论上安全性更高。临床研究也显示，相比口服，透皮雌激素对凝血机制的影响显著更小：透皮使用者的静脉血栓栓塞发生风险远低于口服使用者。因此，许多医疗指南建议，对于40岁以上、有肥胖或吸烟等血栓风险因素的跨性别女性，优先选择透皮方式。</strong></mark></span></p>
<p>透皮制剂主要有两种：<strong>凝胶 (gel)</strong> 和 <strong>贴片 (patch)</strong>。它们各有特点：</p>
<p><span class="text-big"><strong>雌二醇凝胶：</strong></span><mark class="pen-green"><strong>每日将规定剂量的凝胶涂抹在皮肤上（如上臂、腹部、大腿内侧等容易吸收的部位），药物经皮吸收入血。</strong></mark><br><mark class="pen-green"><strong>优点：剂量调整非常灵活，可根据需要增减涂抹量；吸收稳定，每日给药形成类似生理节律的雌激素水平波动（接近人体自然的日间脉冲）。研究显示，每日使用标准剂量（例如2.5克凝胶）可以维持血浆雌二醇稳态浓度在约60～80 pg/mL的理想范围，避免雌激素水平过低的谷底。由于每日给药，还可避免周期性的大起大落。</strong></mark><br>缺点：需要每天坚持涂抹且等待10～15分钟使其干燥；在药物尚未完全吸收前，涂药部位需避免与他人皮肤接触，以防药物转移。生活中要养成每日按时涂抹的习惯。</p>
<p><span class="text-big"><strong>雌二醇贴片：</strong></span>将含有雌激素的贴片粘贴在皮肤上，药物会持续缓慢释放。<br>优点：使用方便，一般每贴可维持数天（常见如每3～4天更换一次），能够持续、平稳地释放雌二醇进入血液。对不想每天用药的人来说是个省心的选择。<br>缺点：剂量调整没有凝胶灵活（贴片有固定规格，很难精细调整剂量）；部分使用者对贴片的黏胶过敏，出现皮肤刺激或红斑；少数人由于个人皮肤吸收差异，可能从贴片获得的雌激素水平略低于预期。贴片也需要注意黏贴部位要定期更换，以避免皮肤长期受刺激。</p>
<p>值得一提的是，<strong>透皮凝胶通常被视为目前最契合HRT需求的雌激素给药方式之一</strong>。因为每日间断给药既避免了口服的肝脏负担，又带来较稳定的血药浓度，不至于像肌肉注射那样产生剧烈峰谷波动，也不像贴片那样剂量死板。对于很多希望精细控制雌激素水平的跨性别女性，凝胶提供了理想的平衡。</p>
<h2 id="关于阴囊涂雌二醇凝胶会致癌的流言" class="toc-header"><a class="toc-anchor" href="#关于阴囊涂雌二醇凝胶会致癌的流言">¶</a> <mark class="pen-red"><strong>关于“阴囊涂雌二醇凝胶会致癌”的流言</strong></mark></h2>
<p><span class="text-big">很多人在群里被<mark class="pen-red"><strong>“凝胶涂蛋会致癌”</strong></mark>这句话吓过，<strong>但现有证据并不支持这一说法</strong>。对跨性别女性的大样本随访显示，<mark class="pen-green">接受标准激素治疗的人群<strong>睾丸癌发生率并未上升</strong>，而<strong>前列腺癌风险反而显著降低</strong>；</mark>研究者的结论是：<mark class="marker-yellow">长期激素治疗本身不似乎增加睾丸癌风险，且在雄激素被抑制的背景下前列腺癌总体更少见，这些结果对“阴囊涂抹会致癌”的担心并不相符。</mark>更重要的是，为什么有人会选阴囊？因为这是<strong>吸收效率最高</strong>的皮肤区域之一：<strong>经典的人体经皮研究早就证明，阴囊皮肤的通透性远高于其他部位（相对前臂可达数十倍），属于天然的高通道。</strong></span><a href="https://pubmed.ncbi.nlm.nih.gov/6020682/?utm_source=chatgpt.com" class="is-external-link"><span class="text-big">PubMed</span></a><span class="text-big"> 在类固醇激素的现实用药中也能看到同样规律——例如把<strong>睾酮乳膏/凝胶涂在阴囊</strong>，产生的血药浓度比常规部位<strong>高出约5–8倍</strong>；由于雌二醇与睾酮同属脂溶性甾体，<mark class="pen-green">雌二醇凝胶在阴囊的高吸收具有明确的药理可推性，且已有综述文章系统梳理了这一路径的依据与安全性观点。</mark>这并不等于“无限加量就更好”，而是告诉你：若与你的医生讨论后选择在阴囊涂抹，<strong>这是一个高效且当前证据不提示致癌风险增加</strong>的给药位点；实际操作上只需注意让凝胶完全干燥并<strong>避免短时皮肤接触转移</strong>（至少等待约1小时更稳妥），基本就可以安心使用。</span></p>
<h2 id="为什么雌二醇凝胶不能涂胸" class="toc-header"><a class="toc-anchor" href="#为什么雌二醇凝胶不能涂胸">¶</a> <mark class="pen-red"><strong>为什么“雌二醇凝胶不能涂胸”</strong></mark></h2>
<p><span class="text-big"><mark class="pen-green"><strong>再强调一遍：阴囊是一个高效、目前证据不提示致癌风险增加的给药位点；</strong></mark><mark class="pen-red">但<strong>胸部（乳房/乳头周围）千万别涂</strong>。这不是“讲究”，而是各国正规说明书的<strong>硬性禁忌</strong>：<strong>任何透皮给药的药物，</strong></mark><strong>患者用药指引都明确写着</strong><mark class="pen-red"><strong>“不得涂抹于乳房或其周围”</strong></mark><strong>。这类禁忌的立场非常一致，优选上臂/肩或大腿内侧等区域。</strong></span></p>
<p><span class="text-big"><strong>原理上</strong>，透皮给药会在涂抹部位形成较高的<strong>局部组织暴露</strong>与“皮下药物库”，邻近组织（如果就是乳腺组织）会比全身其他部位<strong>承受更高的雌激素浓度</strong>。正因这种“就近高暴露”效应，肿瘤预防领域甚至在研究“乳房局部经皮给药”（把药直接经皮送到乳腺以减少全身副作用）——这恰好反证：乳房皮肤涂抹能显著提高乳腺局部药物接触量。对跨性别HRT而言，<mark class="marker-yellow"><strong>我们并不希望把雌激素定向加量给乳腺组织。</strong></mark><strong>风险层面</strong>，乳腺上皮对雌激素高度敏感，长期处在较高雌激素暴露下与乳腺增殖风险相关；虽然HRT总体风险需综合剂量与疗程评估，但把凝胶直接涂在乳房，相当于给最敏感的器官“打局部强心针”，长期安全性更不可控。另外，胸部更容易与伴侣或亲密的人产生<strong>皮肤接触</strong>；新近研究提示，涂抹后短时间内确有<strong>药物转移</strong>的可能，因此建议至少等待约 60 分钟再有密切接触。胸部作为高接触区域更不安全。<strong>还有一个常被忽略的细节</strong>：文胸等衣物的<strong>“闭塞效应”</strong>会增加角质层含水量，<strong>显著提升经皮渗透</strong>，使得局部吸收进一步不可预测；对脂溶性甾体（如雌二醇）这种影响尤其明显。</span></p>
<p><span class="text-big"><strong>最后，它并不会让乳房更快/更大——缺乏这方面的有效证据，反而增加了上面这些风险与不确定性。规范建议仍是按说明书选定上臂/肩或大腿内侧（或与你的医生讨论后按计划使用阴囊位点），让凝胶完全干燥，避免短时接触转移。</strong></span></p>
<p>&nbsp;</p>
<h2 id="h-3-注射用雌激素例戊酸雌二醇肌肉注射液" class="toc-header"><a class="toc-anchor" href="#h-3-注射用雌激素例戊酸雌二醇肌肉注射液">¶</a> <strong>3. 注射用雌激素</strong>（例：戊酸雌二醇肌肉注射液）</h2>
<p><strong>机制与特点：通过肌内注射，将酯化的雌二醇（如戊酸雌二醇、环戊丙酸雌二醇等）注入肌肉。药物溶解在油剂中，会在肌肉组织内形成一个缓慢释放的“药物储库”。随着时间推移，酯键逐步被酶水解，雌二醇持续释放进入血液。这类制剂通常长效</strong>，根据剂型不同可每1～2周注射一次。</p>
<p>优点：<strong>注射途径完全绕过首过效应，不需要每日用药。生物利用度极高，几乎全部药物都可以被吸收利用。注射剂常被认为是</strong>“火力最强”**的雌激素给药方式——相同剂量下，它能达到的血药浓度往往高于口服或透皮方式。对于难以通过口服/透皮将睾酮压低到目标范围的个体，注射剂可以提供更有力的打击。此外，注射频率低（每几周一次），适合不方便每天用药的人群。</p>
<p><strong>缺点：</strong><mark class="pen-red"><strong>药代动力学的“峰谷效应”明显。一次注射后，雌二醇水平会在前几天飙升达到峰值，远高于顺性别女性的生理浓度。此后浓度逐日下降，在下一次注射前降至谷底。</strong></mark><strong>很多使用者报告，这样的大幅波动使她们在</strong><span class="text-big"><mark class="pen-red"><strong>生理和情绪上都经历过山车般起伏</strong></mark></span>——例如注射后的高峰期感觉情绪高涨或乳房胀痛，而接近下次注射时则情绪低落、精力不足。为缓解这种问题，有些人尝试将大剂量间隔注射改为小剂量更频繁地注射（如每周或每半周一次）以平稳激素水平，但这需要医生的支持和注射条件的保证。<br>另外，注射需要严格的无菌操作。自行注射存在感染或操作不当的风险，必须充分接受专业培训。如果在医疗体系内由护士或医生注射，又涉及医疗资源的可及性。在国内，目前可供跨性别HRT使用的雌激素注射剂获取难度较高，这一点也限制了其广泛应用。<strong>因此，</strong><mark class="marker-yellow"><strong>对于一般HRT使用者而言，注射方案通常作为其他方法无法奏效时的备选，而非首选方案。</strong></mark></p>
<h1 id="第二部分抗雄激素-anti-androgens-抑制男性化的力量" class="toc-header"><a class="toc-anchor" href="#第二部分抗雄激素-anti-androgens-抑制男性化的力量">¶</a> <strong>第二部分：抗雄激素 (Anti-androgens) —— 抑制男性化的力量</strong></h1>
<p><span class="text-big"><mark class="pen-red"><strong>对于大多数MTF而言，在HRT初期仅靠雌激素往往不足以将体内睾酮（T）水平压低到理想的女性范围。</strong></mark></span><mark class="pen-green"><strong>因此，需要联合使用抗雄激素药物来拦截或减少雄激素的作用，为雌激素的女性化效果扫清障碍。在睾丸未切除的情况下，抗雄激素几乎是HRT方案中不可或缺的一环。本部分介绍几种常用的抗雄药物，各有不同的作用机制和风险需权衡。</strong></mark></p>
<p><span class="text-small">（需要说明的是，去势（睾丸切除术）或GnRH激动剂等医学手段也能有效地降低睾酮，但前者涉及不可逆手术，后者价格昂贵且多用于青春期阻滞，在此不作详细讨论。）</span></p>
<h2 id="h-1-醋酸环丙孕酮cyproterone-acetate简称cpa常见商品名色普龙等" class="toc-header"><a class="toc-anchor" href="#h-1-醋酸环丙孕酮cyproterone-acetate简称cpa常见商品名色普龙等">¶</a> <strong>1. 醋酸环丙孕酮</strong>（Cyproterone Acetate，简称CPA，常见商品名：色普龙等）</h2>
<p><strong>机制：CPA是一种强效的合成孕激素。它通过其强大的孕激素活性作用于下丘脑-垂体轴，大幅抑制促性腺激素（LH和FSH）的分泌。促性腺激素减少后，睾丸便接收不到“制造睾酮”的指令，从源头上大幅减少睾酮的产生。简单形容，CPA就像发送了一个“停止出货睾酮”的命令给睾丸，使体内雄激素水平显著下降。此外，CPA本身也具有一定的雄激素受体拮抗作用，但主要效果还是来自于对睾丸生殖的化学阉割式抑制。</strong></p>
<p><strong>优点：</strong><mark class="pen-green"><strong>抗雄效果极强且起效迅速。通常小剂量（例如每天12.5mg，一片的一半）即可在数周内显著降低睾酮到女性范围。</strong></mark><strong>这种强效使CPA成为许多欧洲和亚洲国家HRT的一线抗雄药物。在尚无法手术去势的情况下，CPA能较好地模拟去势后的低睾酮状态。相较于螺内酯，CPA压低雄激素的可靠性更高</strong>，对绝大多数患者都有效。</p>
<p>风险与副作用：强效往往伴随高风险，CPA就是一把需要小心掌握的“双刃剑”。主要潜在问题包括：</p>
<p><mark class="pen-red"><strong>情绪抑郁：CPA可能诱发或加重抑郁情绪，这是使用CPA过程中需要密切留意的心理副作用。有抑郁症病史的患者需慎用，或在医生监测下使用。</strong></mark></p>
<p>高泌乳素血症及催乳素瘤：CPA可导致泌乳素（Prolactin）水平升高。长期高泌乳素有诱发良性垂体瘤（催乳素瘤）的风险。在长期服用CPA时，内分泌科医生通常会<strong>定期监测血清泌乳素水平</strong>，一旦持续升高需考虑停药或减量。</p>
<p>肝功能影响：CPA有一定肝毒性，可能导致<mark class="marker-yellow">肝酶升高。</mark>虽然正常剂量下发生严重肝损伤的几率不高，但已有罕见案例报告CPA引起肝炎和肝衰竭，必须引起重视。建议治疗前检查肝功能，使用过程中定期复查肝酶。</p>
<p><mark class="pen-red">血栓风险：</mark>CPA本身的孕激素性质可能略增加血栓倾向，但相比口服雌激素，其对凝血的影响并不算突出。不过在与高剂量雌激素联用时，仍需综合考虑整体血栓风险。</p>
<p><span class="text-small">维生素B12缺乏：有研究发现，无论高剂量（每日50mg）还是低剂量（每日2mg）CPA配合雌激素使用，都可能导致血清维生素B12水平下降。长期使用者应注意监测营养状况，必要时补充B12。</span></p>
<p><mark class="pen-red"><strong>脑膜瘤风险：这是近年来发现的重要风险点。长期高剂量（累计数年每日25mg或以上）使用CPA会大幅增加良性脑膜瘤的发生概率。法国的一项研究表明，使用≥25mg/天超过6个月者脑膜瘤风险增加约7倍，若每月使用50mg/天累计5年风险可增至20倍。鉴于此，2020年欧洲药品管理局已限制高剂量CPA的使用，仅在其他疗法无效时才可考虑，并建议一旦控制病情应尽量降至最低有效剂量。对于HRT用途，很多医生现倾向于使用尽可能低的剂量</strong>（例如12.5～25mg/天），并避免不必要的长期连续使用。一旦患者完成性别重置手术或达到了理想的激素水平，往往会考虑停用CPA以消除脑膜瘤隐患。</mark></p>
<p>注意：由于上述风险，CPA未被美国FDA批准用于跨性别HRT。然而在欧洲和亚洲不少地区，CPA仍是常用的一线药物，只是使用时会更加谨慎。在使用CPA期间，请务必遵医嘱定期监测情绪、肝功能、泌乳素等指标。如出现剧烈头痛、视力听力改变等可疑脑膜瘤症状，更要立即就医排查。</p>
<h2 id="h-2-螺内酯spironolactone简称螺-spiro商品名安体舒通等" class="toc-header"><a class="toc-anchor" href="#h-2-螺内酯spironolactone简称螺-spiro商品名安体舒通等">¶</a> <strong>2. 螺内酯</strong>（Spironolactone，简称“螺”、Spiro，商品名：安体舒通等）</h2>
<p><strong>机制：螺内酯原本是一种利尿剂（醛固酮拮抗剂），后来发现它也具有雄激素受体阻断</strong>作用。简单来说，它分子结构与雄激素相似，能和雄激素受体结合但不激活受体，相当于用“假钥匙”占据了受体锁孔，让睾酮无法发挥作用。螺内酯不会直接减少睾酮的分泌（抑制雄激素生产的效果较弱），主要作用在<strong>末梢阻断</strong>——阻止睾酮对毛囊、皮脂腺等组织的雄激素效应。此外，由于其利尿作用，螺内酯会增加钠排出、保留钾离子，是一种保钾利尿剂。</p>
<p><strong>优点：安全性记录相对良好。螺内酯自20世纪60年代投入医学使用以来，用于心衰、高血压等治疗已有几十年历史，副作用谱较为明确且大多可逆。在北美，螺内酯一直是跨性别女性HRT最常用的抗雄药物之一，被视为一线标准用药。这部分是因为美国无法使用CPA，只能选择螺内酯或GnRH类似物等替代。同时螺内酯价格低廉，获取容易。对于许多患者而言，螺内酯不会带来像CPA那样严重的情绪低落</strong>，对心理影响较小。此外，它不影响泌乳素水平，也未见严重肿瘤风险报道，长时间使用总体上是相对安心的。</p>
<p>风险与副作用：螺内酯的副作用主要源自其利尿和内分泌作用，需要注意以下几点：</p>
<p>高血钾 (高钾血症)：这是螺内酯最主要的风险之一。由于它拮抗醛固酮，会导致体内排钾减少，钾离子潴留。血钾过高可能引发心律失常等严重后果。因此在服用螺内酯期间，需要避免高钾饮食（如过量香蕉、椰子水、菠菜等富钾食物）并定期监测血钾水平。幸好年轻无肾脏病史的患者一般代偿能力较强，但仍不可掉以轻心。任何肌肉无力、心悸等症状都应及时就医验血。</p>
<p>利尿作用：<strong>螺内酯本是利尿剂</strong>，常见副作用是尿量增多、尿频。这意味着你可能需要更频繁地上厕所，并注意多饮水以防脱水。一些人还会出现轻度低血压，表现为改变体位时头晕（体位性低血压）。这些症状通常在用药初期明显，身体适应后会减轻。</p>
<p><mark class="marker-yellow"><strong>抗雄效果相对温和：与CPA或GnRH类似物相比，螺内酯降低睾酮的效果较弱，有时需要较高剂量（如每日200mg甚至以上）才能达到理想的T抑制水平。这么高的剂量又会提高高钾等副作用风险。因此，部分使用者可能觉得螺内酯“压不下去T”。在这些情况下，医生可能会考虑换用其他抗雄药物或直接提高雌激素剂量来压制睾酮。需要指出的是，也有不少跨性别女性仅通过足量的雌激素（尤其是注射剂）便能将睾酮降至女性范围</strong>。是否需要螺内酯，应根据个人激素水平监测结果决定，没有固定答案。</mark></p>
<p>总的来说，螺内酯的使用体验因人而异。有的人耐受良好，抗雄效果也足够；也有人觉得副作用麻烦或效果不佳。如果选择螺内酯，一定严格遵从医嘱剂量，不可自行大幅加量，并定期复查电解质。针对其利尿作用，多和医生沟通调整服药时间（例如早晨服用避免夜间频尿）等，都能提高生活质量。</p>
<h2 id="h-3-比卡鲁胺bicalutamide国内未有商品名常用其通用名" class="toc-header"><a class="toc-anchor" href="#h-3-比卡鲁胺bicalutamide国内未有商品名常用其通用名">¶</a> <strong>3. 比卡鲁胺</strong>（Bicalutamide，国内未有商品名，常用其通用名）</h2>
<p><strong>机制：比卡鲁胺是一种非甾体类雄激素受体拮抗剂</strong>，它与螺内酯不同，专门且强力地阻断雄激素受体，<mark class="marker-yellow">但<strong>不影响睾酮在体内的生成水平</strong></mark>。简单理解，比卡鲁胺直接在全身各组织的雄激素受体处“占坑”，让睾酮和双氢睾酮(DHT)无法与受体结合，从而阻断了雄激素信号的发挥。由于不降低睾酮分泌，比卡鲁胺在作用机制上更类似于“屏蔽”而非“去除”雄激素。</p>
<p><span class="text-big"><mark class="pen-green"><strong>优点：抗雄效果强劲。在等剂量下，比卡鲁胺对雄激素受体的拮抗效力远高于螺内酯。临床用于前列腺癌的经验表明，其抗雄效应可以媲美去势手术。对于跨性别HRT来说，比卡鲁胺不会降低血中睾酮水平</strong>，</mark></span><strong>这意味着理论上它对性欲、能量水平等影响可能比CPA更小，部分人士认为它保留了一些睾酮的益处（如心情稳定、性功能）而只阻断了雄激素的有害作用。此外，比卡鲁胺不具有孕激素活性，所以不会产生CPA那类孕激素相关副作用（如高泌乳素等）。对那些无法耐受CPA或螺内酯的人来说，它提供了一种不同机制的选择。</strong></p>
<p><span class="text-big"><mark class="pen-red"><strong>风险与副作用：比卡鲁胺最令医生担忧的副作用是肝毒性</strong>。</mark></span>虽然总体发生率不高（大约1-2%使用者出现明显肝酶升高，需要停药），但一旦发生可能相当严重，甚至危及生命。具体包括：</p>
<p><strong>严重肝损伤风险：在使用比卡鲁胺治疗前列腺癌的男性中，约有1%的患者因肝功能异常而停药，极罕见情况下出现重度肝炎甚至死亡。在跨性别人群中也已有严重肝衰竭甚至死亡的报告。例如</strong><span class="text-big"><mark class="pen-red"><strong>近期一篇病例报告描述了一位17岁跨性别少女，服用比卡鲁胺3个月后出现急性肝损伤住院，虽一度好转出院但不久后因肝衰竭不幸去世</strong></mark></span><strong>。虽然这类极端案例罕见，但警钟必须长鸣</strong>。基于此，许多专家不再将比卡鲁胺视为首选抗雄方案。如果确需使用，必须在开始用药前检查肝功能，服药后最初几个月尤其要频繁监测肝酶。一旦出现恶心、呕吐、上腹痛、极度疲倦、尿色深黄、巩膜发黄等肝损伤迹象，应立即停药并就医。</p>
<p><strong>监测困难</strong>：由于<strong>比卡鲁胺不降低睾酮水平</strong>，<mark class="pen-red"><strong>常规的测睾酮血检无法评估其效果</strong></mark>。<strong>HRT患者在使用螺内酯或CPA时，可以通过复查睾酮浓度来判断药物是否足量；但用比卡鲁胺时，睾酮可能仍维持在男性水平，却因受体被阻断而不起作用。因此只能根据身体女性化的进展和睾酮作用的抑制情况来间接评估。这给疗效判断带来了一定难度，需要医生有丰富经验。</strong></p>
<p><strong>其他副作用：</strong>比卡鲁胺可能引起胃肠不适（如恶心）、皮疹或光敏感等，但发生率较低。值得一提的是，在生物学男性中使用比卡鲁胺常见的副作用是乳房发育和乳房触痛: 因为睾酮作用被阻断后，体内相对雌激素效应占优势，男性患者也会出现一定程度女性化表现。这一点对跨性别女性来说不算负面效果。少数报告提示比卡鲁胺可能影响血糖代谢（尤其是若合用GnRH激动剂时），但在HRT单用情况下尚不明确。</p>
<p><strong>现状与建议：比卡鲁胺原本是前列腺癌药物</strong>，近年才逐渐在跨性别医学中<mark class="pen-red">尝试应用</mark>。<strong>目前多数指南并不将其作为常规推荐</strong>，主要原因正是缺乏长期安全性数据，以及上述严重肝毒性的风险。一些跨性别医疗团队在使用比卡鲁胺时采取了保守策略：比如避免与GnRH类似物联用、采用低剂量（如每周仅25mg～50mg两次，而非每天服用）、严格筛选无肝病史的患者等。初步的研究数据倒是显示，在小样本随访中，低剂量比卡鲁胺并未引起显著肝酶升高，很多患者耐受良好。然而这并不足以完全打消顾虑。在缺乏长期大规模研究的当下，如果有较安全的替代（如螺内酯配合高剂量雌激素，或直接使用GnRH针剂等），医生往往会优先考虑那些方案。</p>
<p><strong>总结</strong>：<strong>比卡鲁胺可能对部分人是有效的抗雄选择，但务必在专业医生指导下使用，全程密切监控安全指标。不宜自行采购或模仿他人使用。</strong></p>
<h1 id="第三部分孕激素-progestogens-模拟生理的进阶选项" class="toc-header"><a class="toc-anchor" href="#第三部分孕激素-progestogens-模拟生理的进阶选项">¶</a> <strong>第三部分：孕激素 (Progestogens) —— 模拟生理的进阶选项</strong></h1>
<p><mark class="pen-red">在MTF的HRT中，关于是否加入孕激素一直存在争议。严格来说，<strong>孕激素并非必需品</strong>：许多跨性别女性仅用雌激素+抗雄激素就达到了满意的女性化效果。孕激素通常被视为“可选的增强项”，有点类似于HRT的进阶课程。</mark></p>
<p>引入孕激素的动机：当雌激素和抗雄剂量已经将你的激素水平维持在理想的女性范围后，一些医生和使用者会考虑加入孕激素作为“锦上添花”。理论依据是模拟顺性别女性的黄体期荷尔蒙环境——顺性别女性在月经周期后半段会分泌黄体酮，有人推测这种周期性的孕激素可能在乳房发育等方面有独特作用。如果我们在跨性别HRT中补充孕激素，是否能让身体变化更接近“完整”的女性化？这是支持者们的主要论点。</p>
<p><strong>常用选项：可供选择的孕激素种类很多，但目前更推荐生物等同黄体酮</strong>（Micronized Progesterone，即微粒化天然黄体酮）。因为它与人体自身分泌的孕激素结构完全相同，理论上比人工合成的孕激素（如醋酸甲羟孕酮，MPA）更温和安全。微粒化黄体酮通常制成胶囊口服，每晚服用，可以较好地被机体吸收。而人工合成孕激素（如避孕针中的醋酸甲羟孕酮等）在一些研究中与血栓、心血管风险增加相关，因此不太被推荐用于跨性别HRT长期使用。</p>
<p><strong>潜在的益处</strong>（主要基于理论和有限的经验证据）：</p>
<p><mark class="marker-yellow"><strong>乳房发育：有观点认为，孕激素可能促进乳房终末阶段的发育，即乳腺腺泡的成熟，使乳房更饱满、轮廓更圆润（Tanner分期的最高阶段，第V期）。很多跨性别女性反映，在加入孕激素数月后乳房有进一步胀大和形态改善的感觉。不过，需要强调目前医学研究并没有确凿数据证明这一点，更多是经验之谈</strong>。</mark></p>
<p>情绪和其他：部分使用者报告，孕激素改善了她们的睡眠质量、提升了性欲或稳定了情绪。尤其是天然黄体酮具有一定镇静助眠作用（顺性别女性在黄体期也往往较嗜睡平静），所以有些人感觉晚上服用黄体酮有助于睡眠。同时，也有人认为孕激素让自己的性高潮感觉有所增强。这些效果因人而异，尚缺乏大规模验证。</p>
<p><strong>潜在的风险或副作用：</strong></p>
<p>情绪影响：孕激素（包括黄体酮）可能导致情绪波动，部分人会感到易怒、低落甚至抑郁。这在顺性别女性的经前综合征中就能体现——黄体期的高孕激素水平被认为是情绪起伏的原因之一。所以，如果你本身易抑郁或焦虑，添加孕激素需要慎重观察。</p>
<p>身体方面：一些人会出现水潴留（浮肿），体重略有增加。这与孕激素促进钠潴留的作用有关。长期而言，对于心血管健康和血栓风险，孕激素的影响尚不完全明确。有研究提示合成孕激素（如MPA）可能抵消部分雌激素对好胆固醇的提升作用，并略增血栓风险，但天然黄体酮是否有类似影响仍在研究中。总之，<strong>尚无定论</strong>。</p>
<p>结论：对于孕激素在MTF HRT中的应用，目前医疗界尚无共识。一些医生坚决支持其帮助乳房发育等，另一些医生则认为既无充分证据又增加副作用，不如省略。<span class="text-big"><mark class="pen-red"><strong>我们的建议是：谨慎对待。只有在你的基本HRT方案已经稳定、各项指标良好，并与你的医生充分讨论了孕激素的潜在利弊后，再考虑尝试加入孕激素。一旦决定使用，建议选择天然黄体酮，剂量和疗程遵医嘱（有些医生会采取周期性用药，比如每月用14天停14天，以模拟月经周期）。一旦出现明显不适或负面情绪，应及时停药并咨询医生。记住，孕激素是一把双刃剑——可能带来些许额外收益，也可能带来你并不情愿承担的副作用，务必量力而行。</strong></mark></span></p>
<h1 id="你的身体你的旅程" class="toc-header"><a class="toc-anchor" href="#你的身体你的旅程">¶</a> <strong>你的身体，你的旅程</strong></h1>
<p><span class="text-big">HRT是一段漫长、精细且高度个体化的旅程。本指南为你描绘了地图，列出了途中可能遇见的风景、岔路和风暴。但最终握住方向盘的，永远是你自己和你值得信赖的专业医生。请永远不要将网络上的任何信息（包括本文）视作自行用药的依据。相反，应将其当作你的知识武器，用以武装自己：去理解身体正在或将要发生的深刻变化，去与医生建立更加平等高效的沟通，在医疗决策中积极参与。</span></p>
<p><span class="text-big">医疗科学在不断进步，新药物、新研究层出不穷。作为处于HRT旅程中的你，也请保持学习和更新的心态。同时一定要倾听自己身体的反馈，每个人对药物的反应都可能不同。<strong>你的身体，你最有发言权</strong>。当感觉哪里不对时，相信自己的直觉并及时与医生讨论调整。</span></p>
<p><span class="text-big">这条路或许漫长，但你为成为真正自我所付出的每一份勇气、所学习的每一个知识点、所做出的每一次谨慎选择，都是无比珍贵的。愿你在这段旅程中善待自己的身体，耐心观察和体会变化，最终收获你期待的蜕变。牢记：<strong>你并不孤单，专业的医疗帮助和社区支持会一直在你身旁</strong>。祝愿你早日抵达心之所向的彼岸。</span></p>
