<h3 id="一-什么是双a" class="toc-header"><a class="toc-anchor" href="#一-什么是双a">¶</a> 一、什么是双A？</h3>
<p>双A，正式名称为“AuDHD”，即<mark class="pen-green">自闭症谱系障碍（ASD）</mark>与<mark class="pen-green">注意缺陷多动障碍（ADHD）</mark>的共病状态，临床写称<mark class="marker-yellow">孤独症谱系障碍与注意缺陷与多动障碍共病体</mark>。这并非一种独立疾病，而是两种不同但经常同时出现的神经发育障碍。</p>
<h3 id="二-分别认识asd和adhd" class="toc-header"><a class="toc-anchor" href="#二-分别认识asd和adhd">¶</a> 二、分别认识ASD和ADHD</h3>
<h4 id="asd自闭症谱系障碍简介" class="toc-header"><a class="toc-anchor" href="#asd自闭症谱系障碍简介">¶</a> ASD（自闭症谱系障碍）简介</h4>
<p>ASD是一种神经发育障碍，以社交沟通困难、重复和局限的行为兴趣为主要特征。</p>
<h4 id="adhd注意缺陷多动障碍简介" class="toc-header"><a class="toc-anchor" href="#adhd注意缺陷多动障碍简介">¶</a> ADHD（注意缺陷多动障碍）简介</h4>
<p>ADHD则表现为注意力难以集中、多动和冲动控制困难，影响个体的日常学习、工作和生活。</p>
<h3 id="三-asd与adhd的医学诊断代码" class="toc-header"><a class="toc-anchor" href="#三-asd与adhd的医学诊断代码">¶</a> 三、ASD与ADHD的医学诊断代码</h3>

<h3 id="四-双a的常见亚型共病与共病率" class="toc-header"><a class="toc-anchor" href="#四-双a的常见亚型共病与共病率">¶</a> 四、双A的常见亚型共病与共病率</h3>
<p>双A最常见的组合包括：</p>
<p>ASD共病ADHD混合型（最常见）</p>
<p>ASD-F84.1共病ADHD注意缺陷型</p>
<p>ASD-F84.0共病ADHD多动冲动型</p>
<p>研究显示，在ASD患者中，约50%-70%同时存在ADHD；而在ADHD患者中，也有约20%-50%符合ASD诊断标准</p>
<p>（来源：<a href="https://www.frontiersin.org/articles/10.3389/fpsyt.2022.837424/full" class="is-external-link">https://www.frontiersin.org/articles/10.3389/fpsyt.2022.837424/full</a>）。</p>
<h3 id="五-共享的神经生物学机制" class="toc-header"><a class="toc-anchor" href="#五-共享的神经生物学机制">¶</a> 五、共享的神经生物学机制</h3>
<p>ASD和ADHD共病共享多个神经生物学基础：</p>
<p><strong>前额叶皮层功能异常</strong>：导致执行功能和注意力障碍。</p>
<p><strong>神经递质失衡</strong>：多巴胺和去甲肾上腺素功能异常。</p>
<p><strong>突触发育异常</strong>：特别是<mark class="marker-yellow">SHANK3</mark>、<mark class="marker-yellow">CACNA1C</mark>基因的变异影响突触形成及功能</p>
<p>（来源：<a href="https://pubmed.ncbi.nlm.nih.gov/22749736/" class="is-external-link">https://pubmed.ncbi.nlm.nih.gov/22749736/</a>，<a href="https://pubmed.ncbi.nlm.nih.gov/31805042/" class="is-external-link">https://pubmed.ncbi.nlm.nih.gov/31805042/</a>）。</p>

<h3 id="七-mtf群体中双a的患病率推测" class="toc-header"><a class="toc-anchor" href="#七-mtf群体中双a的患病率推测">¶</a> 七、MTF群体中双A的患病率推测</h3>
<p>目前缺乏明确数据，但根据ASD与ADHD分别在跨性别群体中的高患病率<mark class="pen-green">（ASD约24%，ADHD约20%）</mark>，可以合理推测双A在MTF群体中并不少见（来源：<a href="https://www.thetransmitter.org/spectrum/largest-study-to-date-confirms-overlap-between-autism-and-gender-diversity" class="is-external-link">https://www.thetransmitter.org/spectrum/largest-study-to-date-confirms-overlap-between-autism-and-gender-diversity</a>）。</p>
<h3 id="八-双a日常生活表现" class="toc-header"><a class="toc-anchor" href="#八-双a日常生活表现">¶</a> 八、双A日常生活表现</h3>
<p><mark class="pen-green">注意力无法集中</mark>，常被误解为懒惰或漫不经心。</p>
<p>对不感兴趣任务极难完成，但在兴趣领域（如特定爱好）中表现出<mark class="pen-green">超专注状态</mark>。</p>
<p><mark class="pen-green">社交困难，难以理解非语言社交暗示，沟通时经常出现误解。</mark></p>
<p><mark class="pen-red">感官敏感，如声音、光线或触摸，可能造成强烈不适。</mark></p>
<p><mark class="pen-red">常常遗忘物品，如钥匙、手机，或忘记重要约定。</mark></p>
<p>容易冲动消费或做出未深思熟虑的决定。</p>
<p>&nbsp;</p>
<h3 id="九-遗传因素与基因研究" class="toc-header"><a class="toc-anchor" href="#九-遗传因素与基因研究">¶</a> 九、遗传因素与基因研究</h3>
<p>双A的遗传因素主要集中在以下基因：</p>
<p><mark class="marker-yellow"><strong>SHANK3</strong>：参与神经突触形成，影响ASD与ADHD。</mark></p>
<p><mark class="marker-yellow"><strong>CACNA1C</strong>：编码钙离子通道，与多种神经精神障碍相关。</mark></p>
<p>这些基因的异常可能导致神经发育过程中突触连接异常，影响个体的认知和行为表现。</p>
<p>&nbsp;</p>
<h3 id="十-国内双a临床治疗" class="toc-header"><a class="toc-anchor" href="#十-国内双a临床治疗">¶</a> 十、国内双A临床治疗</h3>
<p>国内常见治疗方案包括：</p>
<p><strong>药物治疗</strong>：ADHD常用药为<mark class="marker-green">哌甲酯</mark>或<mark class="marker-green">托莫西汀</mark>；ASD暂无针对核心症状药物，但<mark class="marker-green">利培酮</mark>可用于情绪和行为控制。</p>
<p><strong>行为干预</strong>：应用行为分析（ABA）、认知行为治疗（CBT）、社交技能训练。</p>
<p><strong>个性化教育支持计划（IEP）</strong>：学校提供针对性的教学支持。</p>
<p>&nbsp;</p>
<h3 id="十一-成人双a诊断流程" class="toc-header"><a class="toc-anchor" href="#十一-成人双a诊断流程">¶</a> 十一、成人双A诊断流程</h3>
<p>诊断成人双A相当复杂，包括：</p>
<p><strong>ASD诊断</strong>：临床观察、标准化访谈（ADOS-2）、问卷评估（AQ量表）。</p>
<p><strong>ADHD诊断</strong>：回顾童年行为史、成人ADHD量表（ASRS）评估，可能需家长或老师的回顾性信息。</p>
<p><mark class="marker-green">在中国，由于成人双A诊断资源有限，推荐关注微信公众号“</mark><span class="text-big"><mark class="marker-green"><strong>青衫Neuro</strong></mark></span><mark class="marker-green">”，寻找能诊断双A的医院和医生。</mark></p>
<p>&nbsp;</p>
<h3 id="十二-双a与mtf群体的生活困难" class="toc-header"><a class="toc-anchor" href="#十二-双a与mtf群体的生活困难">¶</a> 十二、双A与MTF群体的生活困难</h3>
<p>双A个体普遍面临着显著的社会和生活困难：</p>
<p>工作或学业表现不稳定，常常难以融入传统社会模式。</p>
<p>社交误解与人际关系冲突频发，增加孤立和焦虑。</p>
<p>而MTF双A群体则叠加了性别认同相关的歧视与社会压力，<mark class="pen-red">一定面临更高的精神健康风险</mark>，亟需家庭和社会更多理解与支持。</p>
<p>&nbsp;</p>
<h3 id="十三-双a或许是awesome-adorable" class="toc-header"><a class="toc-anchor" href="#十三-双a或许是awesome-adorable">¶</a> <span class="text-huge">十三、双A或许是Awesome &amp; Adorable ！！！</span></h3>
<p><span class="text-big">如果你或身边的人属于双A，请记住你们的困难并非自身过错。每个个体都有其独特的天赋和价值，寻求专业的支持和理解，你们完全有能力实现美好的生活。MTF双A群体更需勇气和耐心，找到接纳你们的人与环境，你们并不孤单，总有人会陪伴你们走过困难，你的双A可以是Awesome 完美 与 超级Adorable 可爱 ！</span></p>
