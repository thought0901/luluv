<blockquote>
  <p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>本文适用于你已经大致知道“他/她吃了什么/吸了什么”，</strong></mark></span><br><span class="text-big"><mark class="pen-red"><strong>想快速确认：</strong></mark></span></p>
  <p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>这个东西最致命的点是什么？</strong></mark></span></p>
  <p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>合并其他药时会不会更危险？</strong></mark></span></p>
  <p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>现场最关键要做哪几件事？</strong></mark></span></p>
</blockquote>
<hr>
<h1 style="text-align:center;" id="总原则" class="toc-header"><a class="toc-anchor" href="#总原则">¶</a> 总原则</h1>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>第一优先永远是：立刻拨打 120。</strong></mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>不要指望“用另一种药把中毒状态抵消掉”。</strong></mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>不要强行催吐，不要再给酒 / 咖啡 / 能量饮料“顶一顶”。</strong></mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>能做的基本都只有三件：</strong></mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>把人挪到安全位置（远离窗户/楼梯/浴室）</strong></mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>侧卧位 + 保持呼吸道畅通</strong></mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>把所有药盒 / 药瓶 / 包装袋打包带去急诊</strong></mark></span></p>
<hr>
<h2 style="text-align:center;" id="h-1-联用型药物中毒急救速查表" class="toc-header"><a class="toc-anchor" href="#h-1-联用型药物中毒急救速查表">¶</a> 1. 联用型药物中毒急救速查表</h2>
<blockquote>
  <p style="text-align:center;"><mark class="pen-red"><strong>说明：</strong></mark></p>
  <p style="text-align:center;"><mark class="pen-red">“主要致命点”= 真正会把人送进 ICU / 死亡的机制，而不是“只是很难受”。</mark></p>
  <p style="text-align:center;"><mark class="pen-red">“现场关键应对”= 在救护车来之前你能做、又不会添乱的部分。</mark></p>
  <p style="text-align:center;"><mark class="pen-red">任何一行写到“呼吸抑制”“心律失常”“高热”，基本都 = <strong>重症风险。</strong></mark></p>
</blockquote>
<h3 style="text-align:center;" id="表-1常见单药-联用组合致命点速查" class="toc-header"><a class="toc-anchor" href="#表-1常见单药-联用组合致命点速查">¶</a> <span class="text-big"><mark class="pen-red">表 1：常见单药 / 联用组合致命点速查</mark></span></h3>
<figure class="table" style="text-align:center;">
  <table>
    <thead>
      <tr>
        <th>药物 / 组合</th>
        <th>主要致命点（机制）</th>
        <th>典型危险表现（需要立即送医）</th>
        <th>现场关键应对</th>
        <th>特别注意（联用 / 禁忌）</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><strong>苯二氮卓类单用</strong>（阿普唑仑、劳拉西泮等）</td>
        <td>过量多为<strong>中枢神经抑制</strong>，单药致死率相对低；危险在于<strong>昏迷 + 误吸</strong>。</td>
        <td>深度嗜睡、叫不醒、呼吸变浅、无法保护气道</td>
        <td>侧卧位、清理口鼻，持续观察呼吸；打 120，说明是疑似 BZD 过量。</td>
        <td><strong>不要随便用氟马西尼</strong>；混合中毒或有癫痫史时会诱发惊厥。</td>
      </tr>
      <tr>
        <td><strong>BZD + 阿片 / 酒精 / 其他镇静剂</strong></td>
        <td><strong>呼吸抑制叠加 → 呼吸停、低氧死亡</strong>。</td>
        <td>呼吸极慢或几乎看不到、皮肤发灰/发紫、意识丧失</td>
        <td>立刻 120，持续监测呼吸和胸廓起伏；若无呼吸按院前 CPR 流程；不要离人。</td>
        <td>高危组合，任何怀疑都按<strong>重症中毒</strong>处理；不要再加任何镇静药。</td>
      </tr>
      <tr>
        <td><strong>SSRI / SNRI 单用</strong></td>
        <td>大多轻中度，最严重风险是<strong>血清素综合征（Serotonin Syndrome）</strong> + 癫痫 + 心律失常。</td>
        <td>焦躁、意识混乱、肌肉震颤、发热、大汗、心跳快；严重时高热 &gt;40℃、抽搐</td>
        <td>打 120，说明“疑似 SSRI/SNRI 过量，有血清素综合征风险”；保持环境凉爽、不要盖厚被；不要乱加药。</td>
        <td><strong>文拉法辛 SNRI 风险更高</strong>：癫痫和心律失常更常见。严重病例多需 ICU。</td>
      </tr>
      <tr>
        <td><strong>SSRI/SNRI + DXM（右美沙芬）</strong></td>
        <td>典型<strong>血清素综合征组合</strong>：5-HT 活性叠加 → 高热、肌强直、多器官损伤。</td>
        <td>高热、大汗、肌肉僵硬、持续震颤、意识紊乱、瞳孔放大、心率/血压飙升</td>
        <td>立刻 120，说明“SSRI/SNRI + 含右美沙芬感冒药 OD，疑似血清素综合征”；主动给医生看所有抗抑郁药和感冒药。</td>
        <td>这是现实中最常见的“感冒药 + 抗抑郁药玩脱”组合之一；轻率叠加非常危险。</td>
      </tr>
      <tr>
        <td><strong>SSRI / SNRI + MAOI</strong></td>
        <td><strong>极高致死率的禁忌组合</strong>：暴走的血清素综合征 + 自主神经崩坏。</td>
        <td>高热、严重肌强直、意识障碍、血压极不稳定、可能迅速进入休克</td>
        <td>必须 ICU 级别救治；旁人只能按重症处理：降温、侧卧位、120。</td>
        <td>这类组合几乎不应在现实中出现；一旦出现，就是典型“教科书级灾难型中毒”。</td>
      </tr>
      <tr>
        <td><strong>TCA（三环类抗抑郁药）</strong></td>
        <td><strong>致命性心律失常 + 深度昏迷 + 癫痫</strong>，心肌传导阻滞、QRS 延长。</td>
        <td>意识快速下降、抽搐、心跳乱、血压低、呼吸抑制</td>
        <td>重要的是尽快到有监护 + 碳酸氢钠治疗能力的医院；现场只能保证气道和呼吸。</td>
        <td>在所有抗抑郁药里<strong>毒性天花板</strong>级；任何 TCA OD 都当重症中毒处理。</td>
      </tr>
      <tr>
        <td><strong>普瑞巴林 / 加巴喷丁 单用</strong></td>
        <td>多为<strong>中枢抑制</strong>，通常轻中度；重症少见，但可有癫痫、昏迷。</td>
        <td>嗜睡、步态不稳、眼震、说话含糊，少数癫痫、明显意识下降</td>
        <td>侧卧、守在旁边，打 120；把所有盒子带上。</td>
        <td>单药多可逆，但肾功能差 / 合并其他抑制剂时风险显著上升。</td>
      </tr>
      <tr>
        <td><mark class="pen-red"><strong>普瑞巴林/加巴喷丁 + 阿片 / BZD / 酒精</strong></mark></td>
        <td><mark class="pen-red"><strong>呼吸抑制叠加 → 昏迷 + 呼吸停</strong>。</mark></td>
        <td><mark class="pen-red">呼吸变浅或停顿、皮肤发灰 / 紫、对痛刺激无反应</mark></td>
        <td><mark class="pen-red">立刻 120；监测呼吸和脉搏，必要时按 CPR 流程；旁人不要再加任何药。</mark></td>
        <td><mark class="pen-red">这是现实中<strong>很常见的致死组合</strong>，很多人以为“止疼 + 助眠”没问题。</mark></td>
      </tr>
      <tr>
        <td><strong>DXM（右美沙芬）单用</strong></td>
        <td>高剂量下为 <strong>NMDA 拮抗 + 5-HT 作用</strong>：解离状态、昏迷、癫痫；极端剂量也可呼吸抑制。</td>
        <td>步态严重不稳、说话混乱、幻觉、攻击性、甚至突然昏迷</td>
        <td>安全隔离 + 120；不要外出、不要让他接触高处/道路/浴室。</td>
        <td>与任何抗抑郁药尤其 SSRI/SNRI/NaSSA 联用时 → 按血清素综合征高危组合看待。</td>
      </tr>
      <tr>
        <td><strong>金刚烷胺（amantadine）</strong></td>
        <td><strong>复杂室性心律失常 + 癫痫 + 呼吸/循环衰竭</strong>，毒性波及心脏、中枢和呼吸系统。</td>
        <td>明显心悸、心跳极快或不规则、胸痛、意识模糊、抽搐、猝然倒地</td>
        <td>立刻平躺、避免活动；120 时明确说“怀疑金刚烷胺 OD，有心律失常风险”；尽快心电监护。</td>
        <td>有报道少量即出现致命室速 / 心搏骤停，是<strong>心脏毒性非常凶的药</strong>。</td>
      </tr>
      <tr>
        <td><strong>美金刚（memantine）</strong></td>
        <td>高剂量时强 NMDA 拮抗 → <strong>高血压急症 + 急性精神症状 + 癫痫</strong>。</td>
        <td>极高血压、行为异常、幻觉、木僵、重复语句（echolalia）、意识障碍</td>
        <td>尽量测血压并记录；120 时报“美金刚 OD + 高血压 +精神症状”；警惕脑血管事件。</td>
        <td>不要自行服用降压药乱压，交由急诊医生处理。</td>
      </tr>
      <tr>
        <td><strong>5-MeO-DMT / 强致幻剂（含 MAOI 联用）</strong></td>
        <td><strong>呼吸停止 + 血压剧烈波动 + 血清素综合征 + 高危行为（跳楼、自残）</strong>。</td>
        <td>几秒内突然倒地、呼吸停顿或极浅、剧烈抽动、惊恐尖叫、极端躁动</td>
        <td>第一件事看呼吸，必要时 CPR；迅速清空周围危险物（玻璃、锐器、开着的窗/阳台）；120。</td>
        <td>与 MAOI/SSRI/SNRI 联用时可触发致命性血清素综合征 + 心血管崩溃。</td>
      </tr>
      <tr>
        <td><strong>亚硝酸盐（亚硝酸钠）</strong></td>
        <td><strong>高铁血红蛋白血症 → 血液不能运氧 → 组织窒息死亡</strong>。</td>
        <td>口唇 / 指甲紫灰、皮肤灰蓝但呼吸听上去还在、脉搏存在；常伴头晕、气促、意识模糊</td>
        <td>立刻 120，说明“怀疑亚硝酸盐中毒，高铁血红蛋白血症”，需亚甲蓝；不要浪费时间在自行催吐上。</td>
        <td>进展非常快，有药有床就能救回来；拖延和瞎搞是主要致死原因。</td>
      </tr>
    </tbody>
  </table>
</figure>

<h2 style="text-align:center;" id="h-2-超高危联用组合" class="toc-header"><a class="toc-anchor" href="#h-2-超高危联用组合">¶</a> 2. 超高危联用组合</h2>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>BZD + 阿片 + 普瑞巴林/加巴喷丁 + 酒精</strong> → </mark><mark class="marker-yellow"><strong>呼吸抑制死</strong></mark></span></p>
<p style="text-align:center;"><a href="https://x.com/Edward_8964" class="is-external-link"><mark class="pen-red"><strong>一名X用户</strong></mark></a><mark class="pen-red"><strong> 于2026年2月2日 使用普瑞巴林 + 唑吡坦 + 阿片类 呼吸抑制致死，活生血案在眼前，珍爱生命远离阿片！</strong></mark></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>SSRI/SNRI + DXM + 其他致幻剂（MDMA 等）</strong> → </mark><mark class="marker-yellow"><strong>血清素综合征 + 高热 + 肌溶解</strong></mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>SSRI/SNRI + MAOI</strong> → </mark><mark class="marker-yellow"><strong>经典禁止组合：致死性血清素综合征</strong></mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>Amantadine 大量 + 任何影响心律/电解质的药</strong> → </mark><mark class="marker-yellow"><strong>室速 / 心搏骤停</strong></mark></span></p>
<p style="text-align:center;">极度危险组合，不存在安全剂量。</p>
<hr>
<h2 style="text-align:center;" id="h-3-严肃一点写给有-od-念头的孩子" class="toc-header"><a class="toc-anchor" href="#h-3-严肃一点写给有-od-念头的孩子">¶</a> <mark class="pen-red">3. 严肃一点：写给有 OD 念头的孩子</mark></h2>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red">这篇指南的目标读者里，有一部分其实就是那些在犹豫：“要不要一把吃掉试试”的人。</mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red">说几句不绕弯子的——</mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>这些药没有一个是“平静、优雅地死去”的工具。</strong></mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red">你看到的所谓“睡一觉走了”的故事，大量是被粉饰和删减过的版本。</mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red">在急诊、ICU 和法医学报告里，这些死亡前几乎都伴随<strong>极度痛苦、恐惧和身体崩溃</strong>。</mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>它们的失败率，比你以为的高得多，而且失败得非常难看。</strong></mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red">金刚烷胺没死成 → 可能带着心肌损伤、癫痫体质过完下半辈子。</mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red">SSRI/SNRI/DXM 触发一次重度血清素综合征 → 以后对所有药物、甚至日常生活都会心有余悸。</mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red">普瑞巴林/加巴喷丁 + 阿片差点死 → 很多人从此终身做<strong>呼吸、心脏、认知的慢性病人。</strong></mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>你现在想摆脱的是一段时间的痛，但这些药很可能给你换来一辈子的痛。</strong></mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red">你现在看到的是一个点，未来是好几年、十几年、几十年。</mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red">真正能把你从这个点搬到下一格的，不是药瓶，而是<strong>人</strong>——朋友、陌生人、医生、热线的接线员、哪怕是你不喜欢的亲戚。</mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>你已经能看到这篇 wiki，说明你对“活和死之间的缝”还有兴趣。</strong></mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red">死亡不会给你“反悔”的机会，但急诊可以。</mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red">你随时可以选择“现在先不死，去医院挨一顿输液和批评，等以后再骂现在的自己蠢”。</mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red">只要你还在犹豫，这个选择永远都在——<strong>拿起电话求救，比拿起药瓶要勇敢得多。</strong></mark></span></p>
<p style="text-align:center;">&nbsp;</p>
<p>&nbsp;</p>
