<h2 id="h-1-镇静安眠药sedatives-中枢神经抑制剂镇静剂人话安眠药" class="toc-header"><a class="toc-anchor" href="#h-1-镇静安眠药sedatives-中枢神经抑制剂镇静剂人话安眠药">¶</a> 1. 镇静安眠药（Sedatives）/ 中枢神经抑制剂／镇静剂（人话：安眠药）</h2>
<p><strong>药理作用</strong><br>中枢神经抑制剂主要通过增强GABA（γ-氨基丁酸）受体介导的抑制性神经传递，使大脑皮层与下丘脑的兴奋性下降，从而产生镇静、助眠效果。另有少数药物如褪黑素受体激动剂通过调节褪黑素受体来促进生物钟同步，并非直接作用于GABA。</p>
<p><strong>迭代脉络</strong></p>
<p><mark class="marker-pink"><strong>Gen.1 巴比妥类（Barbiturates）(已淘汰）</strong></mark></p>
<p><strong>时间</strong>：20世纪初至中期广泛使用，后因耐受性、依赖性与呼吸抑制风险高逐渐淘汰。</p>
<p><strong>代表药物</strong>：苯巴比妥（Phenobarbital）、硫喷妥钠（Thiopental）。</p>
<p><mark class="marker-pink"><strong>Gen.2 非巴比妥类GABA增强剂（已完全淘汰）</strong></mark></p>
<p><strong>特点</strong>：早期尝试通过其他结构提高GABA活性，但临床效果与安全性未优于巴比妥类或苯二氮卓类，已退出市场。</p>
<p><mark class="marker-green"><strong>Gen.3 苯二氮卓类镇静剂（Benzodiazepines）</strong></mark></p>
<p><strong>时间</strong>：1950年代起进入临床，成为主流。</p>
<p><strong>代表药物</strong>：地西泮（Diazepam）、劳拉西泮（Lorazepam）、阿普唑仑（Alprazolam）。</p>
<p><strong>机制</strong>：与GABA_A受体共结合，增加Cl⁻内流，迅速镇静、抗焦虑、抗惊厥。</p>
<p><mark class="marker-green"><strong>Gen.3.5 非苯二氮卓类催眠药（Z-drugs）</strong></mark></p>
<p><strong>时间</strong>：1990年代初出现，意在减少苯二氮卓相关的依赖与戒断问题。</p>
<p><strong>代表药物</strong>：唑吡坦（Zolpidem）、唑吡克隆（Zopiclone）、右佐匹克隆（Eszopiclone）。</p>
<p><strong>机制</strong>：选择性作用于GABA_A受体ω1亚型，镇静催眠效果显著。</p>
<p><mark class="marker-green"><strong>Gen.4 褪黑素受体激动剂（Melatonin Receptor Agonists）</strong></mark></p>
<p><strong>时间</strong>：2000年代后期开始临床应用，效果较温和，常用于轻度失眠、老年失眠或需要生物节律调节者。</p>
<p><strong>代表药物</strong>：雷美替胺（Ramelteon）、阿戈美拉汀（Agomelatine，兼具抗抑郁功能）。</p>
<p><strong>机制</strong>：激动MT1/MT2受体，调节睡眠─觉醒周期。</p>
<p><mark class="marker-blue"><strong>Gen.5: 食欲素受体拮抗剂（DORAs，如Suvorexant等）</strong></mark></p>
<p><strong>时间</strong>：2010年代进入市场，国内尚未大规模临床应用（部分国家已上市）。</p>
<p><strong>代表药物</strong>：苏沃雷生（Suvorexant）、莱博雷生（Lemborexant）。</p>
<p><strong>机制</strong>：拮抗脑内食欲素（Orexin）受体，减少中枢兴奋性，促进入睡。</p>
<p><span class="text-big"><strong>常见适应症状</strong></span></p>
<p><strong>睡眠障碍（失眠）</strong></p>
<p><strong>抑郁症伴睡眠障碍</strong></p>
<p><strong>焦虑症伴睡眠障碍</strong></p>
<p><strong>狂躁发作期所致的失眠或亢奋</strong></p>
<p><strong>双相情感障碍伴睡眠障碍</strong></p>
<p><strong>精神分裂症伴睡眠障碍</strong></p>
<p><strong>其他需短效催眠的状况（如术前镇静）</strong></p>
<blockquote>
  <p><strong>补充说明</strong>：临床上亦有用于慢性酒精戒断、惊厥发作控制等情况，但此处主要聚焦精神科失眠相关用药。</p>
</blockquote>
<hr>
<h2 id="h-2-抗抑郁剂" class="toc-header"><a class="toc-anchor" href="#h-2-抗抑郁剂">¶</a> 2. 抗抑郁剂</h2>
<p><strong>药理作用</strong><br>大多数抗抑郁药通过干预单胺类神经递质（5-HT、NE、DA）的再摄取或受体调节，提高突触间隙中神经递质浓度，进而改善情绪。近年来部分药物（如NMDA受体拮抗剂）通过快速激活下游神经可塑性通路达到抗抑郁效果。</p>
<p><strong>迭代曲线</strong></p>
<p><mark class="marker-pink"><strong>Gen.1：单胺氧化酶抑制剂（MAOIs）与三环类抗抑郁药（TCAs）</strong></mark></p>
<p><strong>MAOIs</strong>（如酚乙肼Phenelzine、苯乙肼Tranylcypromine）因与食物酪氨酸作用导致高血压危象，现多作为最后选择或特殊情况应用。</p>
<p><strong>TCAs</strong>（如阿米替林Amitriptyline、丙咪嗪Imipramine），副作用多（口干、便秘、心电图改变），在安全性与耐受性方面已不具优势。</p>
<p><mark class="marker-pink"><strong>Gen.2：非典型抗抑郁药（</strong></mark><mark class="marker-green"><strong>NaSSA、NDRI</strong></mark><mark class="marker-pink"><strong>、SARI、四环类等）</strong></mark></p>
<p><strong>NaSSA</strong>（如米氮平Mirtazapine）多数已退出一线，仍用于耐受TCAs不良或特殊副作用需求。</p>
<p><strong>NDRI</strong>（如安非他酮Bupropion），因不影响性功能且能增加能量、减轻体重，近年来回归市场一部分。</p>
<p><strong>SARI</strong>（如曲唑酮Trazodone），主要用于失眠兼抑郁，较少被单独用作首选。</p>
<p><strong>四环类</strong>（如媚莱宠Maprotiline）多已退出或仅限二线。</p>
<p><mark class="marker-green"><strong>Gen.3：SSRI（选择性5-HT再摄取抑制剂）</strong></mark></p>
<p><strong>代表药物</strong>：氟西汀（Fluoxetine）、舍曲林（Sertraline）、西酞普兰（Citalopram）、艾司西酞普兰（Escitalopram）等。</p>
<p><strong>特点</strong>：耐受性好，副作用相对温和，仍为主流一线用药。</p>
<p><mark class="marker-green"><strong>Gen.3.5：褪黑素受体激动剂（用于轻度抑郁/老人失眠）</strong></mark></p>
<p>详见第一类内容。</p>
<p><mark class="marker-green"><strong>Gen.4：SNRIs／新NaSSA（Serotonin–Noradrenaline Reuptake Inhibitors／新型NaSSA）</strong></mark></p>
<p><strong>代表药物</strong>：度洛西汀（Duloxetine）、文拉法辛（Venlafaxine）、米氮平的部分改良剂型。</p>
<p><strong>特点</strong>：兼具抑郁与焦虑治疗，亦用于慢性疼痛管理。</p>
<p><mark class="marker-blue"><strong>Gen.5：NMDA受体拮抗剂（如氯胺酮及其衍生物）</strong></mark></p>
<p><strong>代表药物</strong>：艾司氯胺酮（Esketamine）、经典氯胺酮（Ketamine）。</p>
<p><strong>特点</strong>：起效快，多用于难治性抑郁，但大规模临床使用尚在推广阶段，且国内上市将是严峻的管制问题。</p>
<p><span class="text-big"><strong>常见适应症</strong></span></p>
<p><strong>重性抑郁障碍（MDD）</strong></p>
<p><strong>青少年抑郁</strong></p>
<p><strong>老年抑郁（伴认知功能下降者优先考虑SSRI／褪黑素激动剂）</strong></p>
<p><strong>围产期抑郁／产后抑郁</strong></p>
<p><strong>难治性抑郁</strong></p>
<p><strong>双相情感障碍抑郁期（需与心境稳定剂合用，谨防诱发躁狂）</strong></p>
<p><strong>慢性疼痛综合征（如纤维肌痛）</strong></p>
<p><strong>身体形式障碍（躯体化症状常伴焦虑／抑郁）</strong></p>
<p><strong>神经性厌食／贪食症（辅助改善情绪与冲动控制）</strong></p>
<p><strong>神经内科扩展适应证（卒中后抑郁、帕金森病相关抑郁／焦虑）</strong></p>
<p><strong>禁忌与注意</strong></p>
<p><strong>轻度抑郁／焦虑情绪（首选心理干预）</strong></p>
<p><strong>双相混合发作或躁郁未稳定者（单用抗抑郁剂可诱发躁狂）</strong></p>
<p><strong>癫痫患者（TCA／高剂量SSRI易降低癫痫发作阈值）</strong></p>
<p><strong>老年低钠血症高风险（如利尿剂使用者，SSRIs也会导致低钠血症，优先考虑褪黑素激动剂）</strong></p>
<hr>
<h2 id="h-3-心境稳定剂" class="toc-header"><a class="toc-anchor" href="#h-3-心境稳定剂">¶</a> 3. 心境稳定剂</h2>
<p><strong>药理作用</strong><br>心境稳定剂通过调节离子通道（钠通道、钙通道）或神经递质（如多巴胺、5-羟色胺、谷氨酸）等，使脑内神经网络“过度激活”时得到抑制，“情绪低谷”时获得保护，而非直接让人“镇静”或“兴奋”，核心在于降低情绪波动幅度，预防躁狂或抑郁发作。</p>
<p><strong>迭代脉络</strong></p>
<p><mark class="marker-green"><strong>第一代：锂盐时代（Gen.1）</strong></mark></p>
<p><strong>代表药物</strong>：碳酸锂（Lithium Carbonate）。</p>
<p><strong>特点</strong>：自20世纪40年代发现，至今仍被视为双相障碍一线用药，疗效确凿，对自杀风险降低显著。</p>
<p><mark class="marker-green"><strong>第二代：广义抗癫痫药物（Gen.2）</strong></mark></p>
<p><strong>代表药物</strong>：丙戊酸钠（Valproate）、卡马西平（Carbamazepine）、拉莫三嗪（Lamotrigine）。</p>
<p><strong>特点</strong>：原用于癫痫，后发现对双相情感障碍的躁狂期或抑郁期均有效，且耐受性相对较好。</p>
<p><mark class="pen-green"><strong>第三代：第二代抗精神病药（SGAs）暂不归入本分类</strong></mark></p>
<p>虽部分SGA（如喹硫平Quetiapine）具备心境稳定作用，但学界通常将其归类于抗精神病剂，此处不再重复。</p>
<p><mark class="marker-blue"><strong>第四代：实验性新型稳定剂（Gen.4）(部分已临床)</strong></mark></p>
<p><strong>代表药物</strong>：如<mark class="marker-green">鲁拉西酮（Lurasidone）</mark>等，新型APD有时具备稳定心境作用，但主要定位仍在抗精神病领域。</p>
<p><span class="text-big"><strong>常见适应症</strong></span></p>
<p><strong>双相I型障碍（Bipolar I）</strong></p>
<p><strong>双相II型障碍（Bipolar II）</strong></p>
<p><strong>快速循环型双相障碍</strong></p>
<p><strong>情绪不稳定型人格障碍（如Borderline Personality Disorder）</strong></p>
<p><strong>重度抑郁合并躁狂家族史（预防情绪波动）</strong></p>
<p><strong>难治性抑郁（与抗抑郁剂联用，以防药物诱发躁狂）</strong></p>
<p><strong>老年或青少年特殊抑郁状态（锂盐或拉莫三嗪常被考虑）</strong></p>
<p><strong>伴随自杀风险的情绪障碍（锂盐有自杀预防效应）</strong></p>
<hr>
<h2 id="h-4-抗精神分裂剂抗精神病药" class="toc-header"><a class="toc-anchor" href="#h-4-抗精神分裂剂抗精神病药">¶</a> 4. 抗精神分裂剂（抗精神病药）</h2>
<p><strong>药理作用</strong><br>主要通过阻断中枢神经系统中D2受体（以及部分5-HT受体）来校正脑内多巴胺／5-HT信号异常，从而缓解妄想、幻觉、思维混乱等精神病性症状。</p>
<p><strong>迭代曲线</strong></p>
<p><mark class="marker-pink"><strong>第一代：典型抗精神病药（FGAs／T-APDs）</strong></mark></p>
<p><strong>代表药物</strong>：<mark class="marker-yellow">氯丙嗪（Chlorpromazine）</mark>、氟哌啶醇（Haloperidol）等。</p>
<p><strong>特点</strong>：强效阻断D2受体，但易引发锥体外系症状（EPS）、迟发性运动障碍等，现多作为急性精神病发作或躁狂期急救用药。</p>
<p><mark class="marker-green"><strong>第二代：非典型抗精神病药（SGAs／A-APDs）</strong></mark></p>
<p><strong>代表药物</strong>：喹硫平（Quetiapine）、奥氮平（Olanzapine）、利培酮（Risperidone）、阿立哌唑（Aripiprazole）等。</p>
<p><strong>特点</strong>：在阻断D2受体的同时，具备5-HT2A受体拮抗或部分激动作用，锥体外系副作用相对减少，但易导致体重增加、代谢综合征等。为临床一线首选。</p>
<p><mark class="marker-blue"><strong>第三代：新型抗精神病药（Gen.3）</strong></mark><mark class="marker-green"><strong>(部分已临床)</strong></mark></p>
<p><strong>代表药物</strong>：鲁拉西酮（Lurasidone）、布瑞匹酮（Brexpiprazole）等。</p>
<p><strong>特点</strong>：部分具有D2受体部分激动剂机制（如阿立哌唑属此类），副作用谱更宽、高代谢风险较低，在特殊需求（如体重管理、认知改善）时可考虑。</p>
<p><span class="text-big"><strong>常见适应症</strong></span></p>
<p><strong>精神分裂症（Schizophrenia）</strong></p>
<p><strong>分裂情感性障碍（Schizoaffective Disorder）</strong></p>
<p><strong>双相情感障碍躁狂发作或伴精神病性特征的抑郁发作</strong></p>
<p><strong>妄想障碍（Delusional Disorder）</strong></p>
<p><strong>短暂性精神障碍（Brief Psychotic Disorder）</strong></p>
<p><strong>边缘型人格障碍（BPD，重度冲动、情绪失控时辅助使用）</strong></p>
<p><strong>老年痴呆伴精神行为症状（Dementia-related Psychosis）</strong></p>
<p><strong>帕金森病精神病（如帕金森相关幻觉，可选性酮啡噻嗪Pimavanserin）</strong></p>
<p><strong>ASD伴发的严重攻击性或刻板行为（Aripiprazole、Risperidone获批）</strong></p>
<p><strong>强迫症（OCD）抗抑郁无效时辅助，或伴有精神病性思维者</strong></p>
<p><strong>抽动症（Tic Disorders）</strong></p>
<p><strong>进食障碍伴精神病性认知（如重度厌食伴幻觉／妄想）</strong></p>
<p><strong>重度抑郁伴精神病性特征</strong></p>
<p><strong>物质诱导的精神病（如酒精、兴奋剂等）</strong></p>
<hr>
<h2 id="h-5-抗adhdasd药物" class="toc-header"><a class="toc-anchor" href="#h-5-抗adhdasd药物">¶</a> 5. 抗ADHD／ASD药物</h2>
<p><strong>药理作用</strong></p>
<p><strong>ADHD药物</strong>：主要通过增强中枢多巴胺（DA）与去甲肾上腺素（NE）信号，改善注意力、冲动控制与行为调节。</p>
<p><strong>ASD药物</strong>：并非“治愈自闭症”，而是针对共病症状（如情绪激惹、冲动、刻板行为、睡眠障碍、攻击行为）进行控制。</p>
<p><strong>迭代脉络</strong></p>
<p><strong>ADHD药物：</strong></p>
<p><mark class="marker-pink"><s><strong>第一代：短效中枢神经兴奋剂（Gen.1）</strong></s></mark></p>
<p><s><strong>代表药物</strong>：苯丙胺（Amphetamine）、哌甲酯（Methylphenidate，Ritalin）。</s></p>
<p><s><strong>特点</strong>：起效快，半衰期短，需多次给药；由于依赖性及滥用风险较高，多数国家监管严格，国内划归毒品列表。</s></p>
<p><mark class="marker-green"><strong>第二代：长效缓释神经中枢兴奋剂（Gen.2）</strong></mark></p>
<p><strong>代表药物</strong>：<mark class="marker-green">哌醋甲酯缓释剂/专注达（Concerta）</mark>、<mark class="marker-pink">Adderall XR（在国内仅限难治且对专注达无效的患者才考虑小剂量开药）</mark>。</p>
<p><strong>特点</strong>：缓释制剂，降低给药频率，依赖与滥用风险相对可控，你能见到的Gen.2全部都是精神一类药品，受严格管制，需要凭身份证原件本人开药且量被限制。</p>
<p><mark class="marker-green"><strong>第三代：非兴奋剂类（Gen.3）</strong></mark></p>
<p><strong>代表药物</strong>：托莫西汀（Atomoxetine）、古安法辛（Guanfacine XR）。</p>
<p><strong>特点</strong>：作用于NE再摄取或α2受体，副作用少，适用于不能耐受兴奋剂或合并焦虑／心脏疾病者；现为临床一线。</p>
<p>&nbsp;</p>
<p><strong>ASD药物：</strong></p>
<p><mark class="marker-green"><strong>第一期（Gen.1）</strong>：利培酮（Risperidone）、阿立哌唑（Aripiprazole）等SGA，用于严重情绪激惹、攻击行为，但会带来代谢相关副作用。</mark></p>
<p><mark class="marker-yellow"><strong>第二期：SSRIs 或辅助镇静剂（Gen.2）</strong></mark></p>
<p><strong>代表药物</strong>：氟西汀（Fluoxetine）等SSRI，偶尔用于缓解刻板行为与焦虑；同时可用小剂量苯二氮卓类控制焦虑或严重失眠。</p>
<p><mark class="marker-blue"><strong>第三期及以后：实验性与针对性药物（Gen.3+）</strong></mark></p>
<p>如莫瑞司他汀（Methylphenidate）在ADHD合并ASD时有限研究，尚未成为常规。</p>
<p><span class="text-big"><strong>常见适应症</strong></span></p>
<p><strong>注意缺陷多动障碍（ADHD）</strong></p>
<p><strong>广泛性焦虑伴ADHD</strong></p>
<p><strong>成人ADHD</strong></p>
<p><strong>ADHD合并双相障碍（需谨慎与心境稳定剂联用）</strong></p>
<p><strong>ADHD合并精神分裂症（结合抗精神病药物）</strong></p>
<p><strong>自闭症谱系障碍（ASD）伴重度情绪激惹／攻击性／冲动行为</strong></p>
<p><strong>ASD伴严重焦虑或刻板行为（小剂量SSRI或SGA辅助）</strong></p>
<hr>
<h2 id="h-6-抗焦虑药物" class="toc-header"><a class="toc-anchor" href="#h-6-抗焦虑药物">¶</a> 6. 抗焦虑药物</h2>
<p><strong>药理作用</strong><br>抗焦虑药物通常通过增强GABA介导的抑制或拮抗交感活性，快速减轻过度警觉与紧张。与抗抑郁药相比，起效更快，但易产生耐受与依赖。</p>
<p><strong>主要药物类别</strong></p>
<p><strong>苯二氮卓类（BZDs）</strong></p>
<p><strong>代表药物</strong>：阿普唑仑（Alprazolam）、劳拉西泮（Lorazepam）、地西泮（Diazepam）、奥沙西泮（Oxazepam）等。</p>
<p><strong>特点</strong>：起效迅速（30分钟内），适用于急性焦虑发作、惊恐发作；长期使用戒断风险高。</p>
<p><strong>非苯二氮卓类抗焦虑药</strong></p>
<p><strong>丁螺环酮（Buspirone）</strong>：作用于5-HT1A受体，起效慢（需2–4周），无依赖性，可用于慢性广泛性焦虑障碍（GAD）。</p>
<p><strong>部分带抗广泛性焦虑作用的SSRI／SNRI</strong></p>
<p><strong>代表药物</strong>：舍曲林（Sertraline）、帕罗西汀（Paroxetine）、文拉法辛（Venlafaxine）等。</p>
<p><strong>特点</strong>：效果稳定，需数周起效，适用于GAD、社交焦虑、惊恐障碍、强迫症等。</p>
<p><strong>β受体阻断剂（β-blockers）</strong></p>
<p><strong>代表药物</strong>：普萘洛尔（Propranolol）等。</p>
<p><strong>特点</strong>：主要用于控制表型焦虑（如演讲恐惧），无情绪改善作用。</p>
<p><mark class="marker-pink"><strong>普瑞巴林（Pregabalin）（跨学科用药，国内未获批）</strong></mark></p>
<p><strong>特点</strong>：虽未获FDA焦虑适应证，但在欧洲多国用于GAD，有时作为辅助用药（目前在我国尚未获正式焦虑适应证）。</p>
<p><span class="text-big"><strong>常见适应症</strong></span></p>
<p><strong>广泛性焦虑障碍（GAD）</strong></p>
<p><strong>惊恐障碍（Panic Disorder）</strong></p>
<p><strong>社交焦虑障碍（Social Anxiety Disorder）</strong></p>
<p><strong>表现性焦虑（如表演焦虑，可用β-blockers）</strong></p>
<p><strong>强迫症（OCD，首选SSRIs，如辅助用药需苯二氮卓缓解急性焦虑）</strong></p>
<p><strong>创伤后应激障碍（PTSD）伴显著焦虑</strong></p>
<p><strong>其他焦虑相关症状（如戒断期焦虑）</strong></p>
<hr>
<h2 id="h-7-戒断辅助抗成瘾药物" class="toc-header"><a class="toc-anchor" href="#h-7-戒断辅助抗成瘾药物">¶</a> 7. 戒断辅助／抗成瘾药物</h2>
<p><strong>药理作用</strong><br>通过调节多巴胺、谷氨酸、内啡肽和阿片受体等途径，帮助戒断者缓解戒断症状、减少复吸风险。</p>
<p><strong>主要细分</strong></p>
<p><strong>酒精依赖</strong></p>
<p><mark class="marker-green"><strong>戒断急救</strong>：地西泮（Diazepam）等长效BZDs；苯二氮卓类需在戒断初期密切监测。</mark></p>
<p><strong>维持治疗</strong>：纳曲酮（Naltrexone，Opioid拮抗剂，可减少饮酒快感）、阿坎酸（Acamprosate，调节谷氨酸/GABA平衡）、双硫仑（Disulfiram，乙醛脱氢酶抑制剂，产生饮酒不适反应）。</p>
<p><strong>阿片类物质使用障碍（OUD）</strong></p>
<p><strong>替代治疗</strong>：美沙酮（Methadone）、布洛芬啡啶（Buprenorphine，常与纳洛酮合用，Suboxone）、纳曲酮（Naltrexone）。</p>
<p><strong>辅助戒断</strong>：克洛硝西泮（Clonidine，α2受体激动剂，缓解戒断症状）。</p>
<p><strong>尼古丁依赖</strong></p>
<p><strong>戒烟辅助</strong>：尼古丁替代治疗（Nicotine Patch、Nicotine Gum）、伐尼克林（Varenicline，Partial 5-HT3/Nicotinic受体激动剂）、<mark class="marker-green">安非他酮（Bupropion，用于戒烟时辅助减轻戒断）。</mark></p>
<p><mark class="marker-pink"><strong>刺激剂（如可卡因、甲基安非他命）依赖</strong></mark></p>
<p><strong>实验性用药</strong>：右旋安非他酮（Dexmethylphenidate）、莫达非尼（Modafinil）等，一般仍在研究阶段，无公认一线药物。</p>
<p><span class="text-big"><strong>常见适应症／适用人群</strong></span></p>
<p><strong>酒精依赖障碍（Alcohol Use Disorder）</strong></p>
<p><strong>肝病或精神共病者的酒精维持治疗</strong></p>
<p><strong>阿片类物质使用障碍（Opioid Use Disorder）</strong></p>
<p><strong>布洛芬啡啶（Buprenorphine）适用于孕妇或高风险人群</strong></p>
<p><strong>尼古丁依赖（Tobacco Use Disorder）</strong></p>
<p><strong>中枢兴奋剂（Cocaine／Methamphetamine）滥用者（主要是实验性或替代治疗）</strong></p>
<hr>
<h2 id="h-8-认知增强类药物cognitive-enhancers" class="toc-header"><a class="toc-anchor" href="#h-8-认知增强类药物cognitive-enhancers">¶</a> 8. 认知增强类药物（Cognitive Enhancers）</h2>
<p><strong>药理作用</strong><br>主要通过增强胆碱能（Acetylcholine）传导或调节谷氨酸系统来改善认知功能、记忆与学习能力，常用于阿尔茨海默病及其他痴呆患者。</p>
<p><strong>主要药物类别</strong></p>
<p><mark class="marker-yellow"><strong>乙酰胆碱酯酶抑制剂（AChEI）</strong></mark></p>
<p><strong>代表药物</strong>：多奈哌齐（Donepezil）、加兰他敏（Galantamine）、利斯的明（Rivastigmine）。</p>
<p><strong>机制</strong>：抑制ACh降解，增加突触间ACh浓度，改善认知。</p>
<p><mark class="marker-green"><strong>NMDA受体拮抗剂</strong></mark></p>
<p><strong>代表药物</strong>：<mark class="marker-yellow">美金刚（Memantine）</mark>。</p>
<p><strong>机制</strong>：拮抗病理性NMDA受体过度激活，减少兴奋性毒性，保护神经元。</p>
<p><strong>常见适应症</strong></p>
<p>阿尔茨海默病（Mild-to-Moderate AD）</p>
<p>路易体痴呆（Lewy Body Dementia）</p>
<p>帕金森病伴认知障碍（Parkinson’s Disease Dementia）</p>
<p>精神分裂症相关认知障碍（Schizophrenia-related Cognitive Deficits，通常与抗精神病药联用）</p>
<p>轻度认知障碍（Mild Cognitive Impairment，off-label）</p>
<hr>
<h2 id="h-9-抗癫痫药亦作情绪稳定辅助用" class="toc-header"><a class="toc-anchor" href="#h-9-抗癫痫药亦作情绪稳定辅助用">¶</a> 9. 抗癫痫药（亦作情绪稳定／辅助用）</h2>
<p><strong>药理作用</strong><br>部分抗癫痫药通过稳定神经元电位、调节钠／钙通道或增强GABA介导的抑制，既能预防惊厥，也常被用于情绪稳定或冲动控制。虽属神经科核心用药，但精神科广泛应用于双相障碍、边缘性人格障碍等。</p>
<p><strong>常见药物</strong></p>
<p>卡马西平（Carbamazepine）</p>
<p>丙戊酸钠（Valproate）</p>
<p><mark class="marker-yellow">拉莫三嗪（Lamotrigine）</mark></p>
<p>加巴喷丁（Gabapentin，off-label用于焦虑、疼痛）</p>
<p>普瑞巴林（Pregabalin，用于焦虑、神经性疼痛）</p>
<p><span class="text-big"><strong>常见适应症</strong></span></p>
<p><strong>伴有癫痫风险的双相情感障碍</strong></p>
<p><strong>边缘型人格障碍伴冲动／情绪失调</strong></p>
<p><strong>创伤后应激障碍（PTSD）伴冲动控制障碍</strong></p>
<p><strong>抽动症（Tourette Syndrome）</strong></p>
<p><strong>进食障碍伴冲动／情绪不稳</strong></p>
<p><strong>伴有神经病理性疼痛或纤维肌痛时辅助</strong></p>
