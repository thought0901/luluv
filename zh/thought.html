I6ZmFsc2UsImVkaXRNZW51QnRuIjp0cnVlLCJlZGl0TWVudUV4dGVybmFsQnRuIjp0cnVlLCJlZGl0TWVudUV4dGVybmFsTmFtZSI6IkdpdEh1YiIsImVkaXRNZW51RXh0ZXJuYWxJY29uIjoibWRpLWdpdGh1YiIsImVkaXRNZW51RXh0ZXJuYWxVcmwiOiJodHRwczovL2dpdGh1Yi5jb20vb3JnL3JlcG8vYmxvYi9tYWluL3tmaWxlbmFtZX0ifQ==" filename="thought.html"><template slot="contents"><div><p>这里是纸巾专业户，也可以叫我thought。在telegram上我也叫thought。犹豫了很长一段时间要不要也写个详细的自我介绍，思来想去还是写了，有很多很多东西我不吐不快。</p>
<h2 id="过往经历" class="toc-header"><a class="toc-anchor" href="#过往经历">¶</a> 过往经历</h2>
<p>不知道在看这篇东西的时候有没有人认识现实中的我？大概是没有的。先说这个名字的由来，很简单，因为我有鼻炎，经常使用纸巾，而且消耗量巨大，便给自己取了这个外号。</p>
<p>在我小学3年级的时候，我遭到了校园欺凌，原因不明，但我猜测是因为我学习成绩太好。校园欺凌持续了整整3年，我曾经试过反抗，告诉老师，叫过警察，然而都没有什么用。尤其是反抗，几乎完全不可能，因为我面对的是动辄十几号乃至二三十号人的群体，来几个人抓住我的四肢我就没办法动了。当时我天天带着淤青回家，抑郁症也是这个时候患上的。</p>
<p>上了初中，我仍然沉浸在痛苦中，成绩很差，全年级垫底。然后我遇见了我的初恋，成绩自此一路高攀（啊爱情的力量）。到了初三，我们不得不分手，这又让我陷入了深深的痛苦中，很长一段时间都一蹶不振。没办法上学，没办法出门，几乎不吃不喝，甚至见不得光。也是在这段时间，我正式确诊中度抑郁症。</p>
<p>高中……很遗憾因为过于严重的病情，我连高一都没有读完。在没办法上学的日子里，我用了非常非常非常漫长的时间来卧床康复，以及结交各个病友。跟他们在一起的时光给我一段短暂的快乐时光，也让我对于心理学有了独到的理解（尽管这个时候还没有形成系统性的理论体系）。以及，我确诊了双相情感障碍。</p>
<p>等到我好一点了之后，我尝试再次拾起学业，但失败了。一次次的失败让我意识到，肯定出了什么问题。经过我的总结，我发现每隔3年，我的病情都会严重复发一次。算上复发的过程和康复的时间，这会浪费我人生中的整整一年。我作出过很多努力，想要走上人生的正轨，却又一次次地脱轨，属实令人感叹。</p>
<p>但还好，我家庭的经济情况还算可以，与父母的关系也算尚可（尽管小学的时候并不好，但在我的努力下得以改善）。这让我少吃了很多苦头，而我也得以有效地运用我卧床修养时空出的大量空余时间，来精进自己。随着一年年过去，我学习了海量的知识，并得到了一个可称博学的头脑，与较为完善的心理学理论。这就是我的过往。</p>
<h2 id="烦恼" class="toc-header"><a class="toc-anchor" href="#烦恼">¶</a> 烦恼</h2>
<blockquote>
  <p><strong>“那么，古尔丹，代价是什么呢？”</strong></p>
</blockquote>
<p>……拥有大量的知识并非没有代价。我在学习的时候不怎么挑食，所以会看到某些人类黑暗面的东西。这些东西偶尔会浮上我的脑海，让我感到生理性的恶心难受。也许是因为学习了太多知识，又或者是别的原因，我时常会感到孤独。那种没有真心朋友的孤独、没有可以与同等知识水平的人交流学术理论的孤独。但总的来说影响不大，我也不会到处显摆这一点，或者看不起别人。</p>
<p>同时我也饱受没有精力的苦恼，有各种各样我在乎的事情需要我去做，但我没办法去做，真的非常遗憾。但好在我遇见了璐璐，他告诉了我安非他酮或许可以解决我的问题。虽然我还没有搞到安非他酮，但我期待充满精力的我的回归。</p>
<p>后续：医生没有给我开安非他酮，给我开了伏硫西汀。确实部分改善了我缺乏精力的情况，但程度十分有限，还要继续努力</p>
<h2 id="求知" class="toc-header"><a class="toc-anchor" href="#求知">¶</a> 求知</h2>
<blockquote>
  <p><strong>“吾生也有涯,而知也无涯” &nbsp;——庄子</strong></p>
</blockquote>
<p>我的最主要的知识来源是B站各种视频，需要付费的那种。但不包括心理学，我的心理学理论是年复一年地同他人交往，总结经验得来的。虽然并不是很学院派，很系统，但是确实能用。我也在一次又一次的验证当中，反复修订并验证着我的理论。</p>
<p>在学习，或者说求知的路上，我始终保持着一颗谦卑的心，与辩证的思想。人类的知识是我穷极一生都无法遍历的，总有人有我不知道的知识，因此我喜欢倾听别人的看法，了解更多的知识。有时候，我会把我脑内的知识输出，告诉别人，对他人进行描述。这看着是一件很普通的事情，但就像我的恩师讲的：只有说出来，你才会理清思绪，更进一步地了解那些知识，并找到不完善和错误的地方（大意）。</p>
<p>嘛，是个人都会犯错，我也乐意接受他人的批判。倘若有人不赞同我的观点，只要TA能给出论据，且他的逻辑是清晰的，足以说服我，那么我也会欣然接受他的观点而放弃自己的观点。所谓，茶杯里装满水之后，就没办法再倒水了。</p>
<p>我曾经遇到过一位恩师，他所教授我的不仅仅是普通的知识，他还告诉我，如何把这些杂七杂八的知识串联起来，连点成线，再织成一张网。虽然在遇到他之前，我已经在有意无意地做这件事情了，但是直到他告诉我的这一刻，我才知道这些事情的重要性。他告诉我的东西是无价的，而物质上，虽然收费，但也只是象征性地收些辛苦费，我一直感激着他。</p>
<h2 id="死中求活" class="toc-header"><a class="toc-anchor" href="#死中求活">¶</a> 死中求活</h2>
<p>一开始，我也是哭着闹着要自杀。有两次几乎成功了，但还好有家人与好友把我劝了下来。每当我极度悲伤的时候，我都会缩回房间，关上灯，蒙住被子，然后一边哭，一边在脑海里面胡思乱想。经历过数不清次数的默默思考，我探寻到了我内心的处境，以及我为何如此悲伤。这也是我心理学理论的重要来源之一。</p>
<p>那么我是怎么活下来的呢？一部分原因是因为，我患病之后，曾经体验过类似醍醐灌顶，扫清脑海内的乌云的经历。这些经历让我坚信，我的病是有可能好转乃至痊愈的。这种感觉好比是，在陷入无穷深渊，周遭都是绝对的黑暗的情况下，你走了漫漫长路，几乎力竭。而忽然间，你看到了一束白光。刺眼得过分，但无比明亮，刺破了苍穹，直插心灵。迷茫的游子大概总能归乡罢？</p>
<p>另外一个很重要的原因是，我有一个很重要的理念：人终有一死，或轻于鸿毛，或重于泰山。我不甘心就那么成为人口统计的数字，默默无闻，忙忙碌碌庸庸碌碌度过一生。<mark class="pen-red"><strong>我想改变这个世界</strong></mark>，哪怕只是一个微不足道的脚注，我也满足了。</p>
<p>所以我就这么活着，遭受着折磨，勉力前行。偶尔会运用自己的心理学理论帮助他人，让我的朋友好受一些。当然这也是我出现在这个wiki，成为编写者之一的原因。我想再帮到更多的人。无论是出于同情，人性，亦或是我的理念，我都有理由这么做。</p>
<p><strong>望共勉</strong></p>
