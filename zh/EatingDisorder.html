<h3 id="一-开篇说明与命名解释" class="toc-header"><a class="toc-anchor" href="#一-开篇说明与命名解释">¶</a> 一、开篇说明与命名解释</h3>
<p><span class="text-big"><strong>进食障碍（Eating Disorders, ED）是一类严重的精神与躯体共病性疾病，以进食行为异常和对体重、体型的极端关注为主要特征。进食障碍并不仅仅是单纯的饮食问题，它伴随复杂的心理因素、显著的神经系统异常及严重的躯体后果。本条目覆盖整个ED谱系，并突出其在</strong><mark class="pen-red"><strong>跨性别女性（MTF）</strong></mark><strong>群体中的特殊表现。</strong></span></p>
<p><strong>&nbsp;</strong><span class="text-huge"><mark class="pen-red"><strong>警告：进食障碍并非轻微的“节食问题”，而是一种可能致命的精神疾病。</strong></mark></span></p>
<p><span class="text-big"><mark class="pen-red"><strong>长期的进食限制、暴食与催吐行为不仅会导致体重骤降，还会引发严重的电解质紊乱、心律不齐、低血糖性昏迷甚至猝死。大脑会因营养匮乏而出现注意力下降、记忆障碍与情绪失控，极端者甚至发生脑萎缩。胃肠系统将长期处于反复损伤之中，常见并发食管破裂、胃麻痹、胃出血等危险并发症。月经失调、骨质疏松、免疫力下降也会随之而来。心理上，ED会加剧焦虑、抑郁、自伤冲动乃至自杀意念，且常与多种精神障碍共病。进食障碍不是“意志薄弱”或“追求变瘦”的生活方式选择，而是一种需要严肃对待的、长期治疗的疾病。</strong></mark></span></p>
<hr>

<h3 id="三-进食障碍的发病机制" class="toc-header"><a class="toc-anchor" href="#三-进食障碍的发病机制">¶</a> 三、进食障碍的发病机制</h3>
<p><strong>进食障碍涉及复杂的神经生物机制，主要包括前扣带皮层、下丘脑、胼胝体的异常，以及脑内多巴胺、血清素、瘦素等神经递质的失调。奖赏回路功能异常导致患者在进食控制与情绪调节方面严重受损。</strong></p>
<p>进食障碍并非简单的“心理问题”或“行为问题”，其本质是多系统交叉紊乱的结果，牵涉<strong>神经解剖、神经递质、激素调节、大脑功能区异常与遗传易感性</strong>等多个维度。</p>
<p>&nbsp;</p>
<h4 id="h-1-神经解剖异常" class="toc-header"><a class="toc-anchor" href="#h-1-神经解剖异常">¶</a> 1. <strong>神经解剖异常</strong></h4>
<p><strong>前扣带皮层（Anterior cingulate cortex, ACC）</strong>：该区域与冲动控制、自我监控、奖赏评估有关。在神经影像研究中，厌食症（AN）与贪食症（BN）患者常表现出ACC灰质体积减少和功能连接障碍。</p>
<p><strong>内侧前额叶皮层（mPFC）</strong>：调控自我评价与社会认知能力，研究表明AN患者在面对食物时mPFC活动过强，反映其过度思考进食后果。</p>
<p><strong>岛叶（Insula）</strong>：与内感受（interoception）相关，调控饥饿、饱腹感。AN患者常表现出岛叶活动不足，可能解释其“对饥饿不敏感”的现象。</p>
<p><strong>下丘脑（Hypothalamus）</strong>：调控食欲、体温、激素等，研究指出AN患者存在下丘脑—垂体—性腺轴（HPG axis）功能抑制，造成闭经、代谢率下降等一系列体征。</p>
<p>&nbsp;</p>
<h4 id="h-2-神经递质系统紊乱" class="toc-header"><a class="toc-anchor" href="#h-2-神经递质系统紊乱">¶</a> 2. <strong>神经递质系统紊乱</strong></h4>
<p><strong>血清素（5-HT）</strong>：</p>
<p>5-HT1A、5-HT2A受体活性异常与焦虑、强迫症状相关，AN患者多表现为高敏感、强迫完美主义。</p>
<p>长期饥饿导致色氨酸缺乏，进一步削弱血清素合成，形成恶性循环。</p>
<p><strong>多巴胺（DA）</strong>：</p>
<p>与奖赏回路高度相关，AN患者对高热量食物呈现“厌恶奖赏”反应。</p>
<p>DA通路（尤其是腹侧被盖区至伏隔核）的奖赏失调，被认为是患者“克制进食成瘾”背后的神经机制。</p>
<p><strong>去甲肾上腺素（NE）</strong>：</p>
<p>与觉醒度、注意力、压力反应相关，NE系统在BN和暴食障碍（BED）中尤其活跃，相关于暴食冲动。</p>
<p>&nbsp;</p>
<h4 id="h-3-激素机制" class="toc-header"><a class="toc-anchor" href="#h-3-激素机制">¶</a> 3. <strong>激素机制</strong></h4>
<p><strong>瘦素（Leptin）与胰岛素（Insulin）</strong>：长期饥饿使瘦素浓度降低，造成性腺抑制与骨质流失；同时瘦素低下削弱下丘脑对饥饿的反馈，使饥饿感持续“麻木”。</p>
<p><strong>胃饥饿素（Ghrelin）</strong>：在AN中反常升高，但饥饿信号对大脑奖赏系统响应减弱，提示生物性驱动已无法正常诱发进食行为。</p>
<p><strong>皮质醇（Cortisol）</strong>：ED患者常呈现高皮质醇状态，与慢性压力和焦虑密切相关，也会破坏记忆、增加抑郁风险。</p>
<p>&nbsp;</p>
<h4 id="h-4-认知神经机制" class="toc-header"><a class="toc-anchor" href="#h-4-认知神经机制">¶</a> 4. <strong>认知神经机制</strong></h4>
<p><strong>奖赏-惩罚系统紊乱</strong>：进食障碍被视为一种“对食物奖赏系统失调”的疾病。AN患者常表现为奖赏敏感性低、惩罚敏感性高，导致其对“瘦”产生异常的正性期待。</p>
<p><strong>执行功能障碍</strong>：研究发现AN群体普遍存在认知柔韧性差、注意力迁移困难、僵化思维，体现为饮食控制中的刻板性。</p>
<p><strong>身体图像畸变</strong>：颞顶联合区（temporo-parietal junction）与岛叶活动异常，造成患者“看不见自己瘦”的体象认知障碍（body dysmorphia）。</p>
<p>&nbsp;</p>
<h4 id="h-5-遗传与易感基因" class="toc-header"><a class="toc-anchor" href="#h-5-遗传与易感基因">¶</a> 5. <strong>遗传与易感基因</strong></h4>
<p>家族研究显示：一级亲属中，进食障碍的发病风险上升 <strong>6-10倍</strong>。</p>
<p>目前与ED相关的候选基因包括：</p>
<p><mark class="marker-yellow"><strong>BDNF</strong></mark><strong>（脑源性神经营养因子）</strong>：影响突触可塑性与食欲调节。</p>
<p><strong>HTR2A（血清素受体）</strong>：影响焦虑、冲动等共病特质。</p>
<p><strong>DRD2/DRD4（多巴胺受体）</strong>：关联奖赏系统易感性。</p>
<p><strong>ESRRA / HDAC4 交互调控轴</strong>：被认为可能参与厌食症的表观遗传机制（Nature Genetics, 2013）。</p>
<p>遗传力（Heritability）：AN估计约为 <strong>50-60%</strong>，BN约为 <strong>30-45%</strong>（Bulik et al., 2006）。</p>
<p>&nbsp;</p>

<h3 id="五-mtf群体与进食障碍" class="toc-header"><a class="toc-anchor" href="#五-mtf群体与进食障碍">¶</a> 五、MTF群体与进食障碍</h3>
<p>跨性别女性（MTF）群体中，进食障碍的患病率远高于顺性别男性与女性。这不仅是统计学的现象，更是一种深层的社会与心理撕裂。</p>
<p>在许多MTF的生活中，“女性化”并不是单纯的性别表达，而是通往被接纳与自我认同的唯一出口。她们被不断灌输一种危险的信号：<mark class="marker-yellow"><strong>“瘦即是女性”“瘦即是Pass”“瘦才能安全地生存在这个社会中”</strong></mark>。而对“瘦”的执念，往往演化为一种毁灭性的自我控制——也即进食障碍的起点。</p>
<h4 id="触目惊心的行为表现" class="toc-header"><a class="toc-anchor" href="#触目惊心的行为表现">¶</a> <strong>触目惊心的行为表现</strong></h4>
<p>很多MTF会在夜里偷偷暴食一整盒冰淇淋，接着跪在马桶前用牙刷抵住咽喉催吐，胃酸反复灼烧食道，直到吐出血来；有的则长时间绝食，每日只以半杯无糖咖啡和一片黄瓜维生，搭配高强度有氧运动，体重下降到危及生命的水平；还有的每天称体重数十次，每一克的变化都能决定她当天的自我价值。</p>
<p>她们清楚催吐会毁掉食管，清楚暴食会造成胰岛素抵抗，清楚骨骼密度正在迅速下降——但恐惧远远大于理智，身体只是被拴在焦虑与身份之间的“容器”。</p>
<blockquote>
  <p>“我只是想看起来再女性化一点。”<br>“如果我更瘦一点，就不会被看成男的了。”<br>“我不要那张‘男人的脸’，我想被叫小姐。”<br>“胖，意味着我不够格做女人。”</p>
</blockquote>
<p>这种极端的身体控制行为，在心理学上是一种“<strong>对失控身份的自我管束</strong>”，在精神病理学中则被视为一种与焦虑、强迫、抑郁共病的“<strong>躯体化逃避策略</strong>”。而这一幕幕，每天都发生在各个跨性别交流群组中。</p>
<h4 id="心理结构剖析为何执着于瘦" class="toc-header"><a class="toc-anchor" href="#心理结构剖析为何执着于瘦">¶</a> <strong>心理结构剖析：为何执着于瘦？</strong></h4>
<p><mark class="marker-yellow"><strong>性别认同焦虑</strong></mark><br>MTF常处于一种持续的自我怀疑中：“我够女性化了吗？我看起来像吗？”在被社会标签为“异类”的情况下，她们将瘦视为通行证，一种通往女性身份的验证手段。瘦，就像是逃离原生性别的敲门砖。</p>
<p><mark class="marker-yellow"><strong>女性刻板印象的内化</strong></mark><br>从小成长在男权社会中的MTF，普遍经历了严重的“女性美标准”投射与内化——骨感即美、瘦即安全、纤细即被接受。她们未被允许自然学习如何成为一个女人，却被迫以最极端的方式靠近那个她们无法成为的“理想女性”。</p>
<p><mark class="marker-yellow"><strong>身体异化与自我厌弃</strong></mark><br>许多MTF从青春期开始就对自己的身体充满憎恶，乳房的缺失、骨架的粗大、肌肉的轮廓，每一个“男性特征”都是她们无法面对镜子的理由。进食障碍成了一个“能被控制的战场”——瘦下去，就能少一点“他”的痕迹。</p>
<p><mark class="marker-yellow"><strong>HRT过程中的心理失衡</strong></mark><br>雌激素治疗过程可能强化对“身体变形”的期待，也可能带来内分泌系统的情绪波动，加重了原本脆弱的焦虑系统。当预期的身体变化迟迟未到时，进食障碍成为替代的“改造工具”。</p>
<p><mark class="marker-yellow"><strong>社会支持缺失与自我价值感塌陷</strong></mark><br>很多MTF在现实生活中得不到认同，孤独、羞耻、隐瞒、歧视……这一切最终叠加成一句无声的呐喊：“如果我美一点，是不是就会被接纳？”</p>
<p>&nbsp;</p>
<h4 id="精神共病的泥潭" class="toc-header"><a class="toc-anchor" href="#精神共病的泥潭">¶</a> <strong>精神共病的泥潭</strong></h4>
<p>ED在MTF中常与以下精神障碍共病：</p>
<p><strong>重度抑郁障碍</strong>（因身体与身份的不一致造成严重低落）</p>
<p><strong>广泛性焦虑障碍</strong>（长期社会歧视与性别焦虑）</p>
<p><strong>强迫症</strong>（对体重、热量、运动的执着控制）</p>
<p><strong>创伤后应激障碍（PTSD）</strong>（因童年性别压迫、性别暴力或校园霸凌）</p>
<p>这些共病形成一个相互加剧的闭环，使ED不再只是“吃饭的问题”，而是生存与死亡之间的游移。</p>

<p>进食障碍显著影响患者的社交功能、学业、职业发展。共病率极高的精神障碍包括抑郁症、焦虑障碍、OCD、PTSD、自残行为，特别在MTF群体中更加明显。【待继续完善】</p>

<h3 id="九-ed诊断流程与现实困境" class="toc-header"><a class="toc-anchor" href="#九-ed诊断流程与现实困境">¶</a> 九、ED诊断流程与现实困境</h3>
<p>ED诊断过程复杂，尤其在非典型病例中容易被忽视。国内能有效诊断进食障碍的精神科医生和机构极少，跨性别者的性别焦虑往往被忽视或误解。</p>

<p><span class="text-big"><i><strong>进食障碍从不是简单的饮食问题，而是对自我身份认同的深层次焦虑和挣扎。亲爱的，你不是你的体重或外表，你值得被关爱、被接纳，也值得享受食物带来的真正快乐与自由。你并不孤单，你的经历、痛苦与抗争都被看见。希望你能逐渐与身体和解，与自己和解。</strong></i></span></p>
