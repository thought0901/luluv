<h3 id="h-1-pha-原理与作用机制" class="toc-header"><a class="toc-anchor" href="#h-1-pha-原理与作用机制">¶</a> 1. PHA 原理与作用机制</h3>
<p><strong>定义</strong>：PHA（Polyhydroxy Acid，多羟基酸）如葡萄糖酸内酯（Glucono Delta-Lactone）、乳糖酸（Lactobionic Acid）等，分子量更大，所以<strong>渗透缓慢、亲水性更强</strong>。</p>
<p><strong>主要功效</strong>：</p>
<p><strong>温和去角质</strong>：与AHA相比，PHA对角质溶解更缓，以微剥脱方式让新细胞“水合”更新；</p>
<p><strong>保湿抗氧化</strong>：PHA分子中含多羟基，可吸附并锁住水分，且具备抗氧化能力，缓解光老化。</p>
<p><strong>修复屏障</strong>：适合极敏感肌，几乎不会引发刺痛和泛红，可帮助恢复受损角质层。</p>
<blockquote>
  <p><strong>亮点</strong>：PHA 因为“弱刺激 + 抗氧化 + 保湿”特性，被称为“温和果酸”，尤其适合以下人群：</p>
  <p><strong>极度敏感肌</strong>；</p>
  <p><strong>皮肤屏障薄弱/红血丝</strong>；</p>
  <p><strong>AHA/BHA 耐受不佳想轻度去角质者</strong>。</p>
</blockquote>
<hr>
<h3 id="h-2-pha-适合人群与常见用途" class="toc-header"><a class="toc-anchor" href="#h-2-pha-适合人群与常见用途">¶</a> 2. PHA 适合人群与常见用途</h3>
<p><strong>适合人群</strong>：</p>
<p><strong>极敏感肌</strong>，对 AHA/BHA 成分高度敏感的人；</p>
<p><strong>干性/干燥受损肌</strong>，渴望去角质的同时需要强效锁水；</p>
<p><strong>初次尝试化学去角质者</strong>，想要温和过渡。</p>
<p><strong>常见用途</strong>：</p>
<p><strong>日常轻度焕肤</strong>，与日常保湿程序无缝结合；</p>
<p><strong>配合抗氧化产品</strong>，形成温和去角质+抗氧双效；</p>
<p><strong>恢复期修复</strong>，当皮肤经历激光/脱毛/痘痘后，用 PHA 安抚修护。</p>

<h3 id="h-4-pha-如何刷安全步骤与注意事项" class="toc-header"><a class="toc-anchor" href="#h-4-pha-如何刷安全步骤与注意事项">¶</a> 4. PHA 如何刷？安全步骤与注意事项</h3>
<p><strong>日常拍打</strong>：</p>
<p>作为日常化妆水替代，<strong>洗脸后直接拍打</strong>，无需清水洗去；</p>
<p>可与温和保湿霜叠加，形成“弱去角+强保湿”组合。</p>
<p><strong>温和去角质</strong>：</p>
<p>如果使用 <strong>The Ordinary 7% PHA Peel（¥99）</strong>，每周 1 次；</p>
<p>熬夜、作息不规律时可适当减少至<strong>每两周 1 次</strong>。</p>
<p><strong>分区使用</strong>：</p>
<p>PHA 因温和可全脸使用；若有极敏感点（如痘印区），可先做局部测试；</p>
<p>对于干燥部位（如两颊），可将 PHA 产品与保湿产品混合后使用，减少局部干燥。</p>
<p><strong>后续修护</strong>：</p>
<p>PHA 属于“温和”去角质，但仍需及时<strong>涂抹修复保湿面霜</strong>；</p>
<p>对于“干燥季节”或“暖气房环境”，建议在 PHA 后涂厚润面霜（如科颜氏高保湿 ¥360/125ml）。</p>
<p>白天同样需要做好<strong>防晒</strong>（SPF30+/PA+++以上），因为去角质后皮肤对紫外线更敏感。</p>
<hr>
<h3 id="h-5-典型-pha-刷酸方案举例" class="toc-header"><a class="toc-anchor" href="#h-5-典型-pha-刷酸方案举例">¶</a> 5. 典型 PHA 刷酸方案举例</h3>
<p><strong>日常温和焕肤（干敏肌）</strong>：</p>
<p>每晚洁面后使用 <strong>Hada Labo PHA 化妆水（¥159）</strong>，无需冲洗，直接叠加保湿霜；</p>
<p>一周可额外加一次 <strong>The Ordinary PHA 7% Peel（¥99）</strong>，停留 10 分钟后洗净；</p>
<p><strong>敏感肌修复期</strong>：</p>
<p>节假日皮肤长时间暴晒或换季干燥，用 <strong>Paula’s Choice Calm 1% PHA（¥299）</strong> 代替平常爽肤水，疏通角质，<strong>每天早晚使用</strong>；</p>
<p>持续 4~6 周后，可根据耐受再增加一次“中浓度 PHA 去角质”。</p>
<p><strong>混合性/轻度出油+干燥</strong>：</p>
<p>晚间每隔夜使用 <strong>The Ordinary 7% PHA Peel</strong>，并在其他晚间用 <strong>Hada Labo PHA 化妆水</strong>；</p>
<p>这样可兼顾 T 区控油与 U 区补水。</p>
