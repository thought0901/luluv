<h3 id="h-1-aha-原理与作用机制" class="toc-header"><a class="toc-anchor" href="#h-1-aha-原理与作用机制">¶</a> 1. AHA 原理与作用机制</h3>
<p><strong>定义</strong>：AHA（Alpha Hydroxy Acid，α-羟基酸）包括甘醇酸（Glycolic Acid）、乳酸（Lactic Acid）、杏仁酸（Mandelic Acid）等，主要来源于水果、牛奶和杏仁。</p>
<p><strong>溶解特性</strong>：水溶性酸类，仅作用于角质层表面，能<strong>溶解角质细胞间的“胶水”</strong>，使老废角质松解脱落。</p>
<p><strong>主要功效</strong>：<strong>去除表层角质、</strong>提亮肤色、使皮肤更柔滑；</p>
<p><strong>促进天然保湿因子（NMF）生成</strong>：提高皮肤含水量，缓解干燥；</p>
<p><strong>刺激胶原蛋白合成</strong>：在一定浓度和频次条件下，AHA可以触发真皮胶原再生，对抗细纹。</p>
<p><strong>常见分子比较</strong>：</p>
<p><strong>甘醇酸</strong>：分子量最小，渗透最快，效果最显著，但刺激性最高；</p>
<p><strong>乳酸</strong>：分子较大，温和度更高，适合干敏肌；</p>
<p><strong>杏仁酸</strong>：分子量更大，渗透慢，温和性最佳，常作为初学者入门之选。</p>
<hr>
<h3 id="h-2-aha-适合人群与常见用途" class="toc-header"><a class="toc-anchor" href="#h-2-aha-适合人群与常见用途">¶</a> 2. AHA 适合人群与常见用途</h3>
<p><strong>适合人群</strong>：</p>
<p><strong>干性、中性肌</strong>，想要改善肤质粗糙、肤色暗沉者；</p>
<p><strong>轻度初老</strong>：想要淡化细纹、促进胶原再生；</p>
<p><strong>角质堆积/肤色不均</strong>：需要加速角质更新。</p>
<p><strong>慎用人群</strong>：</p>
<p><strong>极敏感肌</strong>（尤其对低pH刺激易过敏者）；</p>
<p><strong>严重痤疮炎症期</strong>，待炎症消退后再考虑。</p>

<h3 id="h-4-aha-如何刷安全步骤与注意事项" class="toc-header"><a class="toc-anchor" href="#h-4-aha-如何刷安全步骤与注意事项">¶</a> 4. AHA 如何刷？安全步骤与注意事项</h3>
<p><strong>前期准备</strong>：</p>
<p>晚间洁面后，使用 <strong>低浓度 AHA 精华</strong>（如乳酸5%~10%）或 AHA 化妆水；</p>
<p>使用棉片/化妆棉蘸取适量产品，均匀涂抹全脸（避开眼周）；</p>
<p><strong>作用时间</strong>：</p>
<p>初次使用建议<strong>3~5分钟后彻底洗净</strong>，逐渐观察皮肤耐受情况；</p>
<p>后续可延长至<strong>10~15分钟</strong>，或选择“免洗过夜”型（如双层果酸片第 2 层）；</p>
<p><strong>频率控制</strong>：</p>
<p><strong>前2周</strong>：一周 1 次；</p>
<p><strong>后续 2~4 周</strong>：一周 2 次（隔天使用）；</p>
<p><strong>建立耐受后</strong>：可增至“隔天一次”或“连续使用 5 天后停 2 天”；</p>
<p><strong>使用后护理</strong>：</p>
<p><strong>立即涂抹修复性保湿霜</strong>（如薇诺娜舒敏霜、科颜氏高保湿面霜）；</p>
<p><strong>次日持续轻柔保湿</strong>，且不要使用含高浓度维C或视黄醇的产品；</p>
<p><strong>防晒重要性</strong>：</p>
<p>AHA 会让皮肤变薄、敏感，避免阳光直射；</p>
<p>白天务必使用SPF50+/PA++++广谱防晒（如碧柔水感防晒 ¥60/50ml 、优佳防晒乳 ¥80/40ml ），并每 2 小时补涂一次；</p>
<p>如遇户外长时间活动，建议戴宽檐帽和墨镜，尽量在阴影处行走。</p>
<hr>
<h3 id="h-5-典型-aha-刷酸方案举例" class="toc-header"><a class="toc-anchor" href="#h-5-典型-aha-刷酸方案举例">¶</a> 5. 典型 AHA 刷酸方案举例</h3>
<p><strong>新手级（干/混干）</strong>：</p>
<p>使用 <strong>谷雨 5% 乳酸精华（¥79）</strong>，洁面后涂抹，停留5分钟后洗净；</p>
<p>一周 1 次，待耐受良好后可增至周 2 次；</p>
<p><strong>进阶级（中性/轻敏）</strong>：</p>
<p>使用 <strong>Paula’s Choice 10% 甘醇酸精华（¥420）</strong>，洁面后涂全脸，停留10分钟后洗净；</p>
<p>连续使用 2 周后，观察皮肤状态决定是否隔天使用；</p>
<p><strong>专家级（轻微初老/难缠暗沉）</strong>：</p>
<p>周一、周四晚间使用 <strong>Dr. Dennis Gross 原版双层果酸片（¥1,200）</strong>；</p>
<p>其他晚间使用 <strong>Dr. Wu 18% 杏仁酸焕肤精华（¥299）</strong>；</p>
<p>确保每次刷酸后至少间隔 48 小时再涂其它活性成分；</p>
<p>所有刷酸日早晚<strong>严格防晒</strong>。</p>
