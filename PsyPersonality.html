<h2 id="人格-自我-认同-性别" class="toc-header"><a class="toc-anchor" href="#人格-自我-认同-性别">¶</a> <strong>人格、自我、认同、性别</strong></h2>
<blockquote>
  <p><strong>“梦境是人潜意识的表观显现。” &nbsp; ——弗洛伊德，《梦的解析》</strong></p>
</blockquote>
<p>或许正在看这段文字的你，对弗洛伊德更深的印象是他对人的性欲解析的那部分荒唐内容。是的，对于性欲的这部分内容，很多人都会觉得荒唐、没有依据。但实际上，他说出了一个非常非常重要的，沿用至今的心理学现象，即人类在刚出生的时候，就拥有了，包括性欲在内的各类欲望。这些欲望，与你所经历过的各种事情一起，共同构成了如今我们所说的：<span class="text-big"><strong>潜意识</strong></span></p>
<p><strong>人是很复杂的一类动物。弗洛伊德提出，人的精神，或者使用现代点的词汇，人的人格，由本我、自我、超我所构成。我会分多段内容，来解析人的心理状态，并解释你自己，你的人格，你的潜意识以及你的性格之间的关联。这一节主要讲述你的人格。</strong></p>
<h3 id="本我" class="toc-header"><a class="toc-anchor" href="#本我">¶</a> <span class="text-big"><strong>本我</strong></span></h3>
<p>本我，顾名思义，就是人的本能，它由各种被总称为欲望的事物所构成：<span class="text-big">爱情、权力、色欲、饥饿、认同</span>等等，都可以算作本我的一部分。可以说，本我来源于原始的动物本能，以及你身上的基因。以下我会简单举几个例子来证明原始动物本能与本我间的关系。<strong><u>小注：下文会有对于各种传承下来的文化糟粕的讨论，这并不代表作者对它们的赞同，敬请注意</u></strong></p>
<hr>
<p><strong>爱情：</strong>不知道各位读者有没有谈过恋爱或者是早恋过。如果有，那么谈恋爱的时候，你大概率有一段时间，或长或短，会处于很欣赏对方的状态，这种欣赏甚至会让你忽视掉对方的缺点。恋爱的作用机理是，在你接触到某个异性（或者同性？）之后，对方散发的荷尔蒙与你的荷尔蒙相撞，通过呼吸吸入鼻腔，被身体所感受。如果对方的荷尔蒙恰好启动了身体有关奖赏机制等一系列复杂的反应，那么大脑会自行分泌一种或几种化学成分，让你感受到强烈的爱意，同时产生与TA相伴一生的冲动。当然考虑到现代人类社会的复杂性，人体所考虑的应当不仅仅只是荷尔蒙，还有其它因素，但最后总会回到分泌激素上来。</p>
<p>那么我们为什么要恋爱？其实质是繁衍后代的冲动，那种对于“优秀物种”和“优秀基因”的冲动。这部分用平常恋爱的例子来证明不太显著，但读者可以自行联想中国乃至全世界，饭圈或者追星现象的表现。这里不再赘述。</p>
<blockquote>
  <p><strong>璐璐 P.S.</strong><span class="text-small">: 在日常接触中，身体通过嗅觉潜移默化地感知对方释放出的<strong>信息素（pheromones）</strong>，这是一类通过空气传播的化学信号。虽然在人类中它的作用不像动物那么绝对，但研究表明某些基因组合（如 HLA 基因型）会影响个体对信息素的偏好。</span></p>

<hr>
<p><strong>权力与权利：</strong>看到这部分，读者可能会疑惑，<strong>权力与人类本能又有何联系？</strong>其实质是随着权力的集中，尤其是向你集中，你便成为了现代所称的“精英”。对于这部分人群，社会会主动或被动地，集中更多的资源来优先保证他们的存活。对上古社会与封建社会，他们是强壮的劳动力，尤其是男性，以及拥有丰富生产和人生经验的长者。这也是中国人有重男轻女，以及尊敬老人传统的由来。</p>
<p>让我们来到现代。不少非洲的部落依然保持着这种机制。例如：做好的食物，长者和部落首领第一个先吃，随后是成年男人，最后是女人和孩子。为什么会这样？长者拥有着丰富的知识，可以带领部落繁荣发展。成年男人是良好的劳动力，无论是狩猎，采摘，效率都比较高。优先养活他们可以确保部落的食物来源。至于女人与孩子，这就是很现实的问题了：对比男人的高劳动效率，<strong>女人某种意义上说，成为了繁衍机器，所以地位较低。而孩子，则是现下只能吃不劳动的人群。当饥荒来临，需要节衣缩食的时候，孩子这种群体某种意义上是第一个被“优化”的对象。</strong></p>

<p>借由上述这三个例子，我们可以了解到，人的欲望或多或少都与上古社会流传下来的经验相关。这些经验，经过了几千上万年的演进，随着一代又一代的重复实践，早早地通过自然选择的机制，被刻在了基因内部，成为了我们现在所称的本能，也就是本我的由来。</p>
<p>本我是源于过去的本能，是驱动你融入社会大家庭的机制，某种意义上，也是人类社会运行的较优解。</p>
<h3 id="自我" class="toc-header"><a class="toc-anchor" href="#自我">¶</a> <span class="text-big"><strong>自我</strong></span></h3>
<p>自我，是现下的人。在你出生之后，它伴随着你长大，经历了各种各样的事情，学习了各种各样的知识。在此期间，藉由人生观、世界观和价值观的建立，逐渐发展成为你的思考模式。</p>
<p>它是承前启后的部分，一方面受你的本能影响，另一方面，也受当前社会，即超我的影响。自我需要在本我和超我之间找到平衡点。人类，作为一种社会性动物，不能完全地释放自己的本能，也不能完全地压制自己的本能，要在独自相处与对外社交等方面找到平衡，等等等等。自我的理论不作太多讨论，每个人的自我都是不一样的。正如世界上没有两片完全一样的树叶，这个世界上也没有人生经历完全一样的人。<span class="text-big"><strong>你的未来，由你自己决定</strong>。</span></p>
<h3 id="超我" class="toc-header"><a class="toc-anchor" href="#超我">¶</a> <span class="text-big"><strong>超我</strong></span></h3>
<blockquote>
  <p><strong>“一千个人心里有一千个哈姆雷特。”</strong></p>
</blockquote>
<p>超我，是社会化的人，也是理想化的人。</p>
<p>一方面，随着你的成长，无论如何都无法逃避要与人类社会进行接触。超我会从社会的运行机制内汲取要素，慢慢地形成对于这个社会的认识并反哺给你。同时它也代表了这个社会对你的要求，即道德感。</p>
<p>人类社会是险恶的吗？人类社会是善良的吗？是乱中有序的吗？是没有希望的吗？你对于人类社会（与他人）的看法很大程度上来自超我，而超我很大程度上，也受你的人生经历，即自我的影响。</p>
<p>而另一方面，随着你的发展，随着你形成对于社会的认知，对于自己的认知，你会总从找到各种各样你不满足的点。你会觉得这些东西“有待改正”，也因此，你慢慢地会形成一个，对于更美好的自己，更美好的社会的期望。这种期望会映射成为超我的一部分，最终变成了你需要努力的目标，或是仰望的对象，催人奋进。同样的，每个人的超我也是不同的，但每个人都会有向良向善的一面。因此我也不对超我进行过多的评判。</p>
<p><span class="text-big"><strong>小结</strong></span></p>
<hr>
<p>洋洋洒洒几千字，到现在我们终于可以回到人格理论上来。本我、自我与超我，共同构成了你的人格。同样的，你也可以用某种特定的办法，来影响他们。除去日常生活中一直活跃的本我以外，你的自我与超我，一直潜藏在所谓的“潜意识”内。潜移默化地影响着你。</p>
<p><span class="text-big"><mark class="marker-yellow"><strong>请谨记，人是多种多样的。过去你或许受过苦难，当下你也许会饱受病痛折磨，但是你一直都可以做出改变，成为一个不一样的自己。你也一样可以藉由行动，改变你那可能恶劣无比的生活环境。不要放弃对于人生的希望，勇敢拼搏，坚持努力，命运掌握在你的行动之中。</strong></mark></span></p>
<h2 id="性别认同-vs-自我认同-vs-社会认同" class="toc-header"><a class="toc-anchor" href="#性别认同-vs-自我认同-vs-社会认同">¶</a> <span class="text-big"><strong>“性别认同” vs “自我认同” vs “社会认同”</strong></span></h2>
<p>性别认同是自我认同的一部分，自我认同被社会认同所影响，而社会认同一样会被包括性别认同在内的个人认同所塑造。鉴于自我认同与社会认同是两个更为繁琐，需要更长篇幅才能分析的东西，所以在这一小节，我会先说性别认同。</p>
<h3 id="性别认同" class="toc-header"><a class="toc-anchor" href="#性别认同">¶</a> <span class="text-big">性别认同</span></h3>
<p><strong><u>首先是防杠说明：这里为了方便讨论，行文会使用传统的男性/女性词汇，这不代表我不认同或者反对所谓的非二元性别（即除男性与女性以外的所有性别）。我个人包容男性，女性，MTF，FTM以及其它性别的人群</u></strong>。然后我们正式开始。</p>
<p>性别认同可以简单划分成两个部分。其一是<strong>你对于你自己的认同</strong>。你觉得自己是男的还是女的，亦或者是其他性别。另外一部分是<strong>他人对于你的态度</strong>，这个不必多说，我们在这里重点讨论性别认同产生改变的现象，并借由讨论为什么一个男性会变成男娘乃至药娘来掀开性别认同这个不甚熟悉的概念的一角。</p>
<p>大部分人的性别认同，在青少年时期随着肉体和心灵的成长，就会固定下来不再改变，也不会去考虑SRS之类的问题。毕竟男性就是男性，女性就是女性，这是很自然的事情。当然这世界上总有例外。有些人被“错误地装进了一个不属于自己性别的身体”，有些人因遭受了巨大的心灵创伤，不得不对自己内心的三观，各种认同等等进行大幅度的调整，来适应无比痛苦的日常生活。这就是性别认同的改变和性别转换产生的主要原因。</p>
<p>对于那部分“被错误装进了一个不属于自己性别的身体”的人群来说，性别认同的讨论并不是很复杂。从某种角度上来说，这种现象是天生的，有的男性极度厌恶自己的生殖器官而渴望成为女性。也有的女性因为某种原因，饱受他人的指指点点，所以索性成为男性。对于他们来说，只需要进行性别重置手术（SRS）就可以大幅改善自己因生理性别与性别认同（在欧美语境下称之为心理性别）错位而导致的痛苦的折磨。当然SRS之后也可能会遇到诸如旁人的不解等问题。但总的来说，这部分人群与性别认同的关联是较为容易理解的。</p>
<hr>
<p>另一种讨论起来较为复杂的情况是那些，因曾经遭受过重大的心理创伤，而患上了精神/心理疾病的人群。对于他们来说，这些心理创伤过于深刻，以至于不能用平常的手段来渡过，也难以修复那些创伤，必须使用一些更极端的方案。这里暂且称之为“自适应调整”。</p>
<p>自适应调整有很多很多种表现形式，这里着重讲性别认同相关的部分。治愈心灵创伤需要长时间的疗养，以及<strong>许许多多他人的关切与关爱（即缺爱）</strong>。相信看到这个wiki的读者，有很大一部分都有心灵创伤，亲身验证着你们是多么需求关切与关爱，所以这部分的合理性我不必多说。</p>
<p>因为缺爱，所以需要被爱。那么关爱从哪来呢？有人会选择伏低做小，以臣服的形式获得关爱，即bdsm中的主奴关系。有人会选择谈一场又一场的恋爱，交一个又一个的朋友。当然，也有人选择，<strong>“成为一个理所应当就能获得爱的人”</strong></p>
<p>人类社会对于男性与女性，有着很明显的刻板印象。男性阳刚，承受力强。女性则会关爱他人，爱护孩子，承受力稍弱。以及，最重要的是，在一位女性尚且年幼的时候，会获得来自成年男性的大量关爱。看出问题来了吗？<strong>年幼的女性会获得关爱。</strong>年幼的女性我们称之为萝莉，而后者我们称之为父爱。</p>
<p>所以这就是部分患上精神/心理疾病的男性患者，会选择改变自己的性别认知，成为男娘的本质。人类社会，对于尚且年幼的孩子，一直都有着特殊的照顾，特殊的关切。是的这些关切不分性别，但是倘若结合人类社会对于男性承受力更强的刻板印象，年幼的女性显然是更需要照顾的对象。</p>
<hr>
<p>那么，只需要变成女孩子就行了吗？不还不够。上面我们说过，年幼的女性，我们称之为萝莉。让我们再结合一下，中国人对于萝莉的定义是什么：可爱，娇小，稚气未脱。女孩子之间获取到的关爱亦有多寡之分，想要获得更多的关爱，则需要做出更多行动（当然也可以称之为“内卷”）。可爱如何达成呢？穿衣打扮，白丝白袜双马尾。娇小显然难以做到，毕竟骨骼的生长由不得你，但也有另外一种体现方式，即良好的体型与外表。白色皮肤与细嫩的双臂、大腿。至于稚气未脱？那又是另外一个值得长篇大论的东西了。</p>
<p>由此我们得到了一个，从成年男性蜕变为可爱男娘的心理/精神疾病患者。蜕变的期间，TA的性别认知也会慢慢随之改变。以及，伴随着性别认知的改变，TA的行为也会慢慢趋近于女性。至于从男娘变成药娘，只是对此条道路的极端化实践罢了。<strong>既然变成女性有那么那么多好处，那么为什么不真的变成女性呢？</strong></p>
<p>我无意批驳作出上述选择的人，因为我也曾经想过是否要成为一个男娘。虽然最后并没有实践，但却给了我理解他们的视角。对于心理/精神疾病患者，这个社会需要给予更多的关注与关爱。任何一位患者的痊愈，都少不了患者和身边人的共同努力。作为一位平常的普通人，我希望正在阅读的你，如果是患者，请不要放弃希望。如果不是患者，请尽力传播心理疾病领域的正确知识。或者你力有不逮，也请抱着一颗平和与包容的心，不带偏见地，与现在遇见的，和未来可能会遇见的患者好好相处。</p>
<h3 id="自我认同" class="toc-header"><a class="toc-anchor" href="#自我认同">¶</a> <span class="text-big">自我认同</span></h3>
<p>&nbsp;自我认同是一个很广泛的概念，上文的性别认同实际上也可以算为自我认同的一部分。由于篇幅原因，我只会讲述自我认同的其中几个部分。</p>
<p><strong>Part 1：我是谁？</strong></p>
<blockquote>
  <p><strong>“以铜为鉴，可以正衣冠。以人为鉴，可以明得失。以史为鉴，可以知兴替。” ——《旧唐书 · 魏徵传》</strong></p>
</blockquote>
<p>当你照镜子的时候，不妨抽个空想一想这个问题。这个问题乍看非常没有营养，但无可避免且难以回答。可以说，自我认同这个理念就根植于这个问题之上。你的性别是什么？你是学生，还是已经工作？你的性格是什么？你的行事风格是什么？我可以列举无数个这样子的问题，但这些问题加起来，实际上就是最开始的那个问题：<strong>我是谁</strong></p>
<p>自我认同感强与弱实际上决定了你是否对自己有自信。照照镜子，倘若你觉得自己浑身上下都是缺点，则证明你缺乏自我认同。当出现了这种情况之后，你就会转于满足他人对你的评价来获取认同感。<br>某些女性会有执拗般的想法来追寻更瘦的身材，手段之极端甚至令人咂舌。从少吃到不吃，从字面意义的勒紧裤腰带到使用“仙女管”催吐。他们的心理分析起来很简单，对自己并不自信，非常地在意他人的看法，即认同感不足。倘若对自己有充分的自信，便可以说服自己，胖瘦并没有那么重要，自己的性格与行事风格，才是决定他人看法的更重要的因素。</p>
<p>我不知道在看这一段的读者是否已经摆脱了学生这个身份，倘若你已经或曾经处于从学校毕业，准备进入社会的这个阶段，大概都会有同一个疑问：我该何去何从。实际上这段迷茫的时间段，恰好是你摆脱了“学生”这个已有的自我认同，却并没有获取到下一个自我认同的阶段。此时也正好是回答这个问题的最佳节点。</p>
<p>然而很遗憾，因为每个人对于“我是谁”这个问题各有各的答案，所以我并不能对这个问题进一步分析。我对于各位读者的建议是，倘若你觉得很迷茫，不妨多接触一点人和事，多尝试自己陌生的领域，以此来蹚出一条大道。</p>
<hr>
<p><strong>Part 2：我的理想</strong></p>
<p>人生长路漫漫，没有理想则没有目标，宛如失去了灯塔的航船，只能四处探索而不得归处。值得注意的是，本文指的理想并不是诸如世界和平一类假大空或者难以实现的东西，而是符合自身情况的，将会持续追求，且你在追求的过程中可以感到满足与快乐的理想。理想会融入你的人生，成为其中的一部分，而拥有一个自己将会热爱一生且能够实践的理想，会给予你莫大的快乐，也会赋予你前进的动力。</p>
<p>当然毫无疑问，理想或者前进的动力这种东西依然没有标准答案。但是这个社会、你的父母已经替你设定好了一个标准模板：勤奋读书上学，考个好学校，找个好工作，结婚生子，然后就此度过人生。可以说，这种人生一眼望得到头，甚至可以说是毫无希望、毫无意义与枯燥乏味的。<strong>我在此建议各位读者，大胆地多尝试各种东西，尝试涉足其他未曾熟知的领域。人生并不如考试般有标准答案，你做出的每个选择，无论是“正确”亦或是“错误”的，都可以得分。上面所提到的读书，工作的人生，是大多数所选择的，但并不一定适合你，你未必会感到快乐。</strong></p>

<p><strong>Part 3：我那苦痛的过去</strong></p>
<blockquote>
  <p><strong>“The past is never dead, it’s not even past”（过去从未消逝，它甚至从未过去）</strong></p>
</blockquote>
<p>……但你一直都可以改变看待它的方式。</p>
<p>过去发生的事情固然改变了你的人生轨迹，带给你了无数个失眠和痛苦的夜晚，但生命总是顽强的。尝试接纳你所已经经历的，与过去和解，你终有一日会发现，那些遭受过的苦难，也并不只会带给你痛苦。就像本文作者来说，我的过往的确摧毁了我本来的理想，带给我了极度的痛苦。但倘若没有这种痛苦，我也不会学习了那么多领域的知识，遇见了我的恩师，对心理学有那么多的研究，更不会在这里给你们写下几千字的页面。</p>
<p>人的大脑会通过遗忘，来让你从痛苦中摆脱。曾经刻骨铭心的经历，到现在或许也只是漫漫人生中的一点波折（这也是性别认同部分所提到的“自适应调整”的其中一环）。不妨想一想，正在阅读这篇文章的你，只有十几岁，二十几岁。而一个人的寿命可以达到七八十岁乃至更多。人生前三分之一所遭受的痛苦，完全可以在剩余的三分之二中痊愈。人最宝贵的东西是未来。只要有了未来，那么一切就都有可能。请相信自己</p>
<hr>
<p>自我认同可以细分为数不胜数的领域，每个领域都值得深究。我在此只分析“自我”，“理想”，“过去”三个领域。虽然它们未必是最具代表性的，但每一个都可以给人带来深刻的变化。</p>
<p>明晰了自我，你就不再是人生这个漫漫长流与世界这个汪洋大海之中的无根浮萍。从此你就有了对于现实的感知，有了真实感，不再成为“游戏中的一个角色”。</p>
<p>拥有了理想，你就从此有了所热爱的事物。你会感到开心，快乐，拥有了推进人生的动力与不自杀、不堕落、不自暴自弃的理由与勇气。</p>
<p>而不再沉溺于过去，则会使你远离日日夜夜的折磨，走出阴影，重新感受这个世界的美好与不美好。早晨的太阳光很舒适，尤其是七八点钟的时候。</p>
<p>至于这三个领域与自我认同的关系……人是很复杂的动物，曾经所经历的一切事情都会反映在你的性格之中；你的未来则一直都由你的行动亲手铸就。而你的性格与你的行动，归根到底还是你自己。认识了自己的复杂性，将自己的过去与未来与现下结合在一起，攥进手中，这就是不可否认的你，也就成为了你所看待的你。</p>
<h3 id="社会认同" class="toc-header"><a class="toc-anchor" href="#社会认同">¶</a> <span class="text-big">社会认同</span></h3>
<p>顾名思义，社会认同就是这个社会对你的认同、看法。人是社会性的动物，不可避免地要与其他人接触。此时，他人的对你的看法就会影响你的一举一动与各种想法。社会认同与社会学有很强的相关性，前者和后者都无比复杂。在这一小节，我会着重于论证社会认同与个人的关系，且是如何改变个人的看法和行为的。</p>
<blockquote>
  <p><i><strong>“中国人的性情总是喜欢调和折中的</strong></i><strong>，譬如你说，这屋子太暗，须在这里开一个窗，大家一定不允许的。但如果你主张拆掉屋顶，他们就来调和，愿意开窗了。” ——鲁迅，《无声的中国》</strong></p>
</blockquote>
<p><strong>淘宝好评：</strong>读者是否有过网购的经历？如果有，很明显在挑选商品的时候，你会大幅倾向有很多好评的商品，因为这在某种意义上代表着“品质”。但当你花了钱，买到了一个具有很多好评，但使用效果似乎不是很好，或者品质不佳的时候，你一般又会怎么想呢？大概很多情况下都是在思考，自己是否不懂这个商品的使用方法，亦或者这可能是单独的某个瑕疵品对吧？那么你有怀疑过好评是用机器人批量生成的情况吗？会经常思考或是考虑这个因素吗？实际上这是社会认同对于单独的个人的其中一种影响。当主流意见跟你不一致的时候，人更多会选择“合群”，转变自己的观点，而不是坚持己见。坚持己见就意味着你变成了“异类”，会多多少少受到某种潜在的压力。这种压力是人作为社会性动物，所本能拒绝或是尽力避免的。于此相似的例子还有外卖的好评，小红书上的各种小商品推荐等等等等。</p>
<p><strong>小圈子的形成：</strong>中文互联网上存在着数不胜数的各类圈子，有的不显山不露水，一片祥和，有的恶臭无比。这里不讨论圈子的性质与好坏，但我想告诉各位读者的是：通过“混圈”，人会在许许多多与自己有共同兴趣，亦或意见一致的人接触的时候，感受到某种正反馈。你很“合群”，同样的，这也是人作为社会性的动物，所本能追求的。</p>
<p><strong>人云亦云：</strong>当父母，好友，身边的人都抱持同一个观点的时候，你会保持自己不一样的观点多久？在潜意识中，人总会有种“主流意见就是正确的”的观点。当身边人都抱有和你不一致的观点的时候，总会不自禁地思考：是我的观点正确还是他们的观点正确？倘若他们的观点是错误的，那么为什么那么多人都接受了同一个错误的观点呢？总有其合理性吧？在一次又一次的思考中，你会有很大的概率，对于他们的观点“合理化”，随后说服自己，他们的观点是正确的，然后放弃自己的观点。这一过程可能是极其隐蔽，乃至你根本未曾意识到的。</p>
<p>同样的，这也是各类谣言传播速度非常快的原因。当你看到了一个又一个的人赞同一个表面上似乎很合理的论点，被各类短视频集中轰炸的时候，你就会倾向于接受这个论点。所谓“谎言说一千次，就成了真的”，就是这个道理。这种手段有时候也被政府机构用于给老百姓宣传特定的思潮，这里不作讨论。</p>
<hr>
<p>单独的个体总会有“合群”的冲动，而规避成为“异类”的情况，这就是社会认同对个体、对自我认同的的影响。或者我们可以使用另外一种说法：人会倾向于成为“他人与社会认知中的你”，而不经常“说服他人与社会改变认知中的你”。</p>
<p>当然，在讨论社会认同的时候，除去社会对个体的改变，别忘了，个体也是社会的组成部分。当个体通过各种各样的方式，输出自己的观点，被各种各样的人所接受之后，你的观点，也某种意义上成为了社会的其中一种认同。MTF/FTM等非二元性别的人群，要摆脱家人，朋友，社会对你的固有看法，是很困难的。毕竟你需要对抗人类的其中一种本能，与变成“异类”的压力。所以，如果看到这里的读者属于非二元性别，却天天饱受家人，好友与社会的不理解的时候，别忘了这并不是你的错。假如你心情低落，也不要怪罪到自己头上，这是外部因素和内部因素共同作用的结果。</p>
<p><span class="text-big"><strong>小结</strong></span></p>
<hr>
<p>又是洋洋洒洒几千字。实际上我对这一段的文字不甚满意，论证部分太过于简陋。但我并不专攻于此，便就此作罢。让我们回到正题。</p>
<p>性别认同毫无疑问是自我认同的一部分，毕竟性别是你这个人固有的一种属性，没有办法摆脱。当然，你也可以自行定义自己的性别，并成为自己所定义的那个性别。自我认同并不仅仅是一种认同，除了代表着你如何看待你自己以外，有了对自己的看法，你就可能会对自己的现状有所不满，产生某种追求。这种追求反过来也会激励你作出行动，改变你现下的自己，更加贴合你内心中的自己。</p>
<p>社会认同，是这个社会对个人的看法。出于各种各样的原因，这个社会对于包括个体在内的各类事物，都有着各种各样的刻板印象。诸如男性阳刚，承受力较强，不总是哭泣，而女性相反一样。社会认同一直都在默默地塑造每一个人，通过教育与社交的方式。让我们想一想，我们接受的教育是否都是让自己成为一个比较“温和”的人，拥有着包容的心？这种塑造多数时候都是无害的，但也会消灭掉个体的不一致性与自主性，让所有人都变成模板上的形象，千篇一律的无聊。</p>
<p>倘若你要作出改变，在成为内心中的自己的同时说服社会接纳真实的自己，就需要打破刻板印象。这并不容易，你会遇到重重阻力。家人与朋友的不理解，陌生人的恶意，内心的挣扎与胆怯，每一个都宛如天堑。但他们都可以被克服。<strong>切记，不要把遇到的阻力与苦难都怪罪到自己的身上。人本无罪。</strong></p>
<p>但从另外一个角度讨论，当你定义自己的性别，并尝试说服这个社会的时候，也不可以做得非常极端。欧美社会现下便受到了这种反噬。普罗大众不得不接受总共有几十种性别（甚至还在增加）的观点。它们的定义十分奇怪且复杂，杂糅了生理性别与心理性别（即性别认同）。某种意义上，这确实为非二元性别人群提供了便利与一个不受歧视的社会环境，但当情况发展到普罗大众甚至没有办法，为遇到的每个人都指定一个较为统一但可能不甚准确的性别代词（参考中文中的“他”可以指代男性与女性等各种性别），而时常感到困扰的时候，这就出了问题。</p>
<p>欧美社会有几个很吓人的例子。一位教师因为错误地使用使用了人称代词，而遭到辞退，其它学校都不敢再招聘这位教师。一座学校有十几种甚至几十种厕所，因为不同“性别”的人不想与其他“性别”的人公用一个厕所。在社会层面上，这大大地造成了混乱与困扰，也使非二元性别群体的名声大幅下降，反倒成了人人喊打和除之于后快的形象。<strong>所以此处也请各位读者铭记，任何事情都不要做得太过于极端。</strong></p>
