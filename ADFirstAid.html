<p style="text-align:center;">适用于： 舍曲林、氟西汀、帕罗西汀、艾司西酞普兰、西酞普兰、文拉法辛、度洛西汀、米氮平、安非他酮、三环类抗抑郁药（TCA）等。</p>
<hr>
<blockquote>
  <p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>怀疑有人吞下大量抗抑郁药（尤其是 SSRI / SNRI）时，第一步永远是：</strong></mark></span><br><span class="text-big"><mark class="pen-red"><strong>立刻拨打 120（或当地急救电话）。</strong></mark></span></p>
  <p style="text-align:center;"><span class="text-big"><mark class="pen-red">不要等待症状出现，SSRI/SNRI 的严重并发症往往是<strong>延迟性</strong>的。</mark></span><br><span class="text-big"><mark class="pen-red">医生的指示永远是最高优先级。</mark></span><br><span class="text-big"><mark class="pen-red">本文只是把医生可能会说的话写得更清晰、可执行。</mark></span></p>
</blockquote>
<hr>
<h2 style="text-align:center;" id="一-旁人视角现在立刻可以做的按时间顺序" class="toc-header"><a class="toc-anchor" href="#一-旁人视角现在立刻可以做的按时间顺序">¶</a> 一、旁人视角：现在立刻可以做的（按时间顺序）</h2>
<h3 style="text-align:center;" id="h-1-第一步立刻拨-120-不要犹豫" class="toc-header"><a class="toc-anchor" href="#h-1-第一步立刻拨-120-不要犹豫">¶</a> <span class="text-big"><mark class="pen-red">1. <strong>第一步：立刻拨 120</strong> —— 不要犹豫</mark></span></h3>
<p style="text-align:center;">你可以照念：</p>
<blockquote>
  <p style="text-align:center;"><span class="text-big"><mark class="pen-red">“这里有一名疑似大量吞服抗抑郁药物（可能是 SSRI / SNRI）的病人。</mark></span><br><span class="text-big"><mark class="pen-red">当前表现为：嗜睡 / 焦躁 / 呕吐 / 站立困难 / 手抖 / 出汗 / 心跳过快（选符合的）。</mark></span><br><mark class="pen-red">可能同时服用了：酒精 / BZD / 镇痛药 / 普瑞巴林 / 右美沙芬（如不确定就说‘不清楚是否合并其他药物’）。</mark><br><span class="text-big"><mark class="pen-red">请指导我们现场处理并尽快派车。”</mark></span></p>
</blockquote>
<p style="text-align:center;"><strong>为什么必须这么快？</strong><br><strong>因为抗抑郁药物中毒的严重并发症常常是 延迟 1～6 小时出现：</strong></p>
<blockquote>
  <p style="text-align:center;"><strong>血清素综合征（Serotonin Syndrome）</strong></p>
  <p style="text-align:center;"><strong>心律失常</strong>（尤其是 SNRI / TCA）</p>
  <p style="text-align:center;"><strong>癫痫发作</strong></p>
  <p style="text-align:center;"><strong>高热与肌肉溶解</strong></p>
</blockquote>
<p style="text-align:center;">这些都非常致命。</p>
<hr>
<h3 style="text-align:center;" id="h-2-保持气道通畅与安全体位" class="toc-header"><a class="toc-anchor" href="#h-2-保持气道通畅与安全体位">¶</a> 2. <strong>保持气道通畅与安全体位</strong></h3>
<p style="text-align:center;">让病人<strong>侧卧位</strong>（左侧或右侧都可），防止呕吐物误吸。</p>
<p style="text-align:center;">如果意识模糊或躁动，尽量保持环境安静、凉爽。</p>
<p style="text-align:center;">不要让病人站立、走动或去洗澡（跌倒 / 溺水风险极高）。</p>
<hr>
<h3 style="text-align:center;" id="h-3-观察以下危险信号任何一个都需紧急送医" class="toc-header"><a class="toc-anchor" href="#h-3-观察以下危险信号任何一个都需紧急送医">¶</a> 3. <strong>观察以下危险信号（任何一个都需紧急送医）</strong></h3>
<h3 style="text-align:center;" id="a-类危险信号提示血清素综合征" class="toc-header"><a class="toc-anchor" href="#a-类危险信号提示血清素综合征">¶</a> &nbsp;A 类危险信号（提示血清素综合征）</h3>
<p style="text-align:center;">肌肉抽动、颤抖、<strong>下颌抖动</strong></p>
<p style="text-align:center;">大量出汗、皮肤潮红</p>
<p style="text-align:center;">心跳持续 &gt;110 次/分</p>
<p style="text-align:center;">腿部无法控制地抖动</p>
<p style="text-align:center;">明显焦虑 / 激越 / 说话混乱</p>
<p style="text-align:center;"><strong>体温升高（&gt;38.5°C）</strong></p>
<blockquote>
  <p style="text-align:center;">SSRI + SNRI + 右美沙芬 或 SSRI + MAOI 是血清素综合征最常见的触发组合。</p>
</blockquote>
<h3 style="text-align:center;" id="b-类危险信号提示严重中毒" class="toc-header"><a class="toc-anchor" href="#b-类危险信号提示严重中毒">¶</a> &nbsp;B 类危险信号（提示严重中毒）</h3>
<p style="text-align:center;">叫不醒 / 意识下降</p>
<p style="text-align:center;">癫痫发作</p>
<p style="text-align:center;">呼吸变慢</p>
<p style="text-align:center;">心跳忽快忽慢</p>
<p style="text-align:center;">蓝紫色嘴唇 / 指甲（缺氧）</p>
<p style="text-align:center;">高热（&gt;39°C）</p>
<p style="text-align:center;">肌肉僵硬、全身硬撑</p>
<p style="text-align:center;">任何出现上述情况 → <strong>当作重度中毒处理</strong>。</p>
<hr>
<h3 style="text-align:center;" id="h-4-不要做的事情很重要" class="toc-header"><a class="toc-anchor" href="#h-4-不要做的事情很重要">¶</a> <mark class="pen-red">4. 不要做的事情（很重要）</mark></h3>
<p style="text-align:center;">❌ <strong>不要强行催吐</strong>（容易吸入呕吐物 → 致死性肺炎）<br>❌ <strong>不要给咖啡、能量饮料、酒</strong><br>❌ <strong>不要再给任何精神科药物“压惊”</strong><br>❌ <strong>不要给 BZD 来“对抗焦躁”</strong>（可能掩盖症状，且与 SSRI 中毒联用不一定安全）<br>✔️ 如果现场医生电话指导可以例外（BZD 在血清素综合征“激越型”中偶尔会用，但必须由专业人士判断）。</p>
<hr>
<h3 style="text-align:center;" id="h-5-帮医生准备信息同系列统一格式" class="toc-header"><a class="toc-anchor" href="#h-5-帮医生准备信息同系列统一格式">¶</a> 5. 帮医生准备信息（同系列统一格式）</h3>
<p style="text-align:center;">快速收集：</p>
<p style="text-align:center;">所有药盒 / 空药板 / 包装袋</p>
<p style="text-align:center;">模糊时间线（“大概什么时候吞的？”）</p>
<p style="text-align:center;">是否有合并饮酒、感冒药、止痛药、右美沙芬、普瑞巴林、兴奋剂</p>
<p style="text-align:center;">带去急诊时，把药物实物全部<strong>装袋直接交给医生</strong></p>
<p style="text-align:center;">这一步可以决定是否提前准备心电监护、退热、镇静或 ICU 床位。</p>
<hr>
<h2 style="text-align:center;" id="二-本人视角如果你就是吞药的人" class="toc-header"><a class="toc-anchor" href="#二-本人视角如果你就是吞药的人">¶</a> 二、本人视角：如果你就是吞药的人</h2>
<blockquote>
  <p style="text-align:center;">如果你还能看字，你还没到“无力回天”的程度。</p>
</blockquote>
<p style="text-align:center;">抗抑郁药自杀的失败后果极其痛苦，常见包括：</p>
<p style="text-align:center;">持续数小时的强烈焦躁感</p>
<p style="text-align:center;">肌肉抽搐、意识混乱</p>
<p style="text-align:center;">失禁</p>
<p style="text-align:center;">高热 + 肌肉分解 → 肾损伤</p>
<p style="text-align:center;">ICU 插管 / 除颤</p>
<p style="text-align:center;">甚至出现<span class="text-big"><mark class="pen-red"><strong>永久性肌肉损伤或脑部损伤</strong></mark></span></p>
<p style="text-align:center;"><span class="text-big"><strong>打 120 不丢脸。</strong></span><br><span class="text-big"><strong>你已经吞药了，没有比这更极端的表达方式了。</strong></span><br><span class="text-big"><strong>此时承认“我撑不住了，我需要帮助”，并不是软弱，而是真正的生存意志。</strong></span></p>
<p style="text-align:center;">你可以照念：</p>
<blockquote>
  <p style="text-align:center;">“我刚刚大量吞了抗抑郁药，是（氟西汀 / 舍曲林 / 文拉法辛等）。<br>出于自杀念头，但我现在后悔了。<br>我感觉到（心跳很快 / 手发抖 / 头很热 / 很焦躁）。<br>我在（准确地址）。请尽快派车。”</p>
</blockquote>
<hr>
<h2 style="text-align:center;" id="三-抗抑郁药过量医学解释" class="toc-header"><a class="toc-anchor" href="#三-抗抑郁药过量医学解释">¶</a> 三、抗抑郁药过量：医学解释</h2>
<h3 style="text-align:center;" id="h-1-为什么-ssri-过量是危险的" class="toc-header"><a class="toc-anchor" href="#h-1-为什么-ssri-过量是危险的">¶</a> 1. 为什么 SSRI 过量是危险的？</h3>
<p style="text-align:center;">SSRI 导致的问题与 BZD 完全不同，不是“睡死过去”，而是：</p>
<blockquote>
  <p style="text-align:center;"><strong>神经系统过度兴奋 → 高热 → 肌肉强直 → 代谢崩溃</strong></p>
</blockquote>
<p style="text-align:center;">这就是<strong>血清素综合征</strong>。</p>
<p style="text-align:center;">出现时间：</p>
<p style="text-align:center;">30 分钟 – 6 小时之间最常见。</p>
<hr>
<h2 style="text-align:center;" id="h-2-血清素综合征serotonin-syndrome核心三联征" class="toc-header"><a class="toc-anchor" href="#h-2-血清素综合征serotonin-syndrome核心三联征">¶</a> 2. 血清素综合征（Serotonin Syndrome）核心三联征</h2>
<p style="text-align:center;">✔️ <strong>精神状态改变</strong>：焦虑、激越、意识混乱<br>✔️ <strong>自主神经紊乱</strong>：发热、大量出汗、心跳快、血压波动<br>✔️ <strong>神经肌肉异常</strong>：肌肉抽动、震颤、腱反射亢进、肌肉强直</p>
<p style="text-align:center;">严重时：</p>
<p style="text-align:center;"><strong>体温 &gt;40°C</strong></p>
<p style="text-align:center;">肌肉分解（Rhabdomyolysis）</p>
<p style="text-align:center;">DIC</p>
<p style="text-align:center;">多器官衰竭</p>
<p style="text-align:center;">需要 ICU + 冷却 + 镇静 + 气管插管</p>
<blockquote>
  <p style="text-align:center;">若进入高热 + 肌强直阶段，生死取决于是否及时救治。</p>
</blockquote>
<hr>
<h2 style="text-align:center;" id="h-3-哪些组合尤其危险" class="toc-header"><a class="toc-anchor" href="#h-3-哪些组合尤其危险">¶</a> 3. 哪些组合尤其危险？</h2>
<p style="text-align:center;">&nbsp;<strong>SSRI + SNRI</strong><br>&nbsp;<strong>SSRI + 文拉法辛（SNRI）高剂量</strong><br>&nbsp;<strong>SSRI + 安非他酮（降低癫痫阈值）</strong><br>&nbsp;<strong>SSRI + 右美沙芬（感冒药）</strong><br>&nbsp;<strong>SSRI + MAOI（极高致死率）</strong><br>&nbsp;<strong>SSRI + 兴奋剂（Adderall、MDMA、甲卡西酮等）</strong></p>
<hr>
<h2 style="text-align:center;" id="四-不同抗抑郁药的特殊中毒表现非常重要" class="toc-header"><a class="toc-anchor" href="#四-不同抗抑郁药的特殊中毒表现非常重要">¶</a> 四、不同抗抑郁药的特殊中毒表现（非常重要）</h2>
<h3 style="text-align:center;" id="ssri氟西汀-舍曲林-帕罗西汀-艾司西酞普兰" class="toc-header"><a class="toc-anchor" href="#ssri氟西汀-舍曲林-帕罗西汀-艾司西酞普兰">¶</a> ✧ SSRI（氟西汀、舍曲林、帕罗西汀、艾司西酞普兰）</h3>
<p style="text-align:center;">血清素综合征</p>
<p style="text-align:center;">癫痫</p>
<p style="text-align:center;">心电图 QT 间期延长（尤其西酞普兰）</p>
<p style="text-align:center;">高热</p>
<h3 style="text-align:center;" id="snri文拉法辛-度洛西汀" class="toc-header"><a class="toc-anchor" href="#snri文拉法辛-度洛西汀">¶</a> ✧ SNRI（文拉法辛、度洛西汀）</h3>
<p style="text-align:center;"><mark class="pen-red">⚠️ <strong>危险性远高于 SSRI</strong></mark></p>
<p style="text-align:center;"><mark class="pen-red">癫痫风险更高</mark></p>
<p style="text-align:center;"><mark class="pen-red">心律失常更多见</mark></p>
<p style="text-align:center;"><mark class="pen-red">高血压危象</mark></p>
<p style="text-align:center;"><mark class="pen-red">血清素综合征概率显著上升</mark></p>
<blockquote>
  <p style="text-align:center;"><span class="text-big"><mark class="pen-red">文拉法辛是世界范围最常见的“抗抑郁药自杀失败 → 重症 ICU”药物之一。</mark></span></p>
</blockquote>
<h2 style="text-align:center;" id="ndri安非他酮" class="toc-header"><a class="toc-anchor" href="#ndri安非他酮">¶</a> ✧ NDRI（安非他酮）</h2>
<p style="text-align:center;">⚠️ 特点：<strong>极容易引起癫痫</strong></p>
<p style="text-align:center;">癫痫发作（非常常见）</p>
<p style="text-align:center;">心律问题</p>
<p style="text-align:center;">激越、幻觉</p>
<h2 style="text-align:center;" id="nassa米氮平" class="toc-header"><a class="toc-anchor" href="#nassa米氮平">¶</a> ✧ NaSSA（米氮平）</h2>
<p style="text-align:center;">相对温和，但过量时可能出现：</p>
<p style="text-align:center;">镇静 + 意识下降</p>
<p style="text-align:center;">心率加快</p>
<p style="text-align:center;">低血压</p>
<p style="text-align:center;">偶发癫痫</p>
<h2 style="text-align:center;" id="tca三环类阿米替林-丙咪嗪" class="toc-header"><a class="toc-anchor" href="#tca三环类阿米替林-丙咪嗪">¶</a> ✧ TCA（三环类：阿米替林、丙咪嗪）</h2>
<p style="text-align:center;">⚠️ <strong>本列表中毒性最强、最致命的类别</strong></p>
<p style="text-align:center;">快速致命性心律失常</p>
<p style="text-align:center;">深度昏迷</p>
<p style="text-align:center;">癫痫</p>
<p style="text-align:center;">低血压休克</p>
<p style="text-align:center;">必须 ICU + 碳酸氢钠静脉治疗</p>
<blockquote>
  <p style="text-align:center;">不过TCA基本上临床都看不见了，你手里大概率不太会有TCA抗抑郁药。</p>
</blockquote>
<hr>
<h2 style="text-align:center;" id="五-联用区" class="toc-header"><a class="toc-anchor" href="#五-联用区">¶</a> 五、联用区</h2>
<h3 style="text-align:center;" id="h-1-ssri-bzd" class="toc-header"><a class="toc-anchor" href="#h-1-ssri-bzd">¶</a> 1. SSRI + BZD</h3>
<p style="text-align:center;">BZD 可在医院用于控制激越、抽搐，但<strong>现场不要自行补吃</strong>。</p>
<p style="text-align:center;">有可能掩盖症状、延误血清素综合征诊断。</p>
<h3 style="text-align:center;" id="h-2-ssri-普瑞巴林-加巴喷丁" class="toc-header"><a class="toc-anchor" href="#h-2-ssri-普瑞巴林-加巴喷丁">¶</a> 2. SSRI + 普瑞巴林 / 加巴喷丁</h3>
<p style="text-align:center;">昏迷 + 呼吸抑制风险叠加</p>
<p style="text-align:center;">但不增加血清素综合征本身</p>
<h3 style="text-align:center;" id="h-3-ssri-右美沙芬常见感冒药" class="toc-header"><a class="toc-anchor" href="#h-3-ssri-右美沙芬常见感冒药">¶</a> <mark class="pen-red">3. SSRI + 右美沙芬（常见感冒药）</mark></h3>
<p style="text-align:center;"><span class="text-huge"><mark class="pen-red"><strong>⚠️ 极容易触发血清素综合征。</strong></mark></span></p>
<h2 style="text-align:center;" id="h-4-ssri-maoi罕见但极危险" class="toc-header"><a class="toc-anchor" href="#h-4-ssri-maoi罕见但极危险">¶</a> 4. SSRI + MAOI（罕见但极危险）</h2>
<p style="text-align:center;">⚠️ <strong>禁忌组合，致死率极高</strong>。</p>
<h2 style="text-align:center;" id="h-5-ssri-兴奋剂mdma-可卡因-卡西酮" class="toc-header"><a class="toc-anchor" href="#h-5-ssri-兴奋剂mdma-可卡因-卡西酮">¶</a> 5. SSRI + 兴奋剂（MDMA、可卡因、卡西酮）</h2>
<p style="text-align:center;">⚠️ 协同增加高热 + 肌肉分解风险。</p>
<blockquote>
  <p style="text-align:center;">任意组合一旦不确定 → <strong>按最危险情况处理</strong>，先送医。</p>
</blockquote>
<hr>
<h2 style="text-align:center;" id="六-mtf-hrt-人群的特别注意事项" class="toc-header"><a class="toc-anchor" href="#六-mtf-hrt-人群的特别注意事项">¶</a> 六、MTF / HRT 人群的特别注意事项</h2>
<p style="text-align:center;">长期使用 <strong>雌二醇 / 抗雄药物（螺内酯、比卡鲁胺）</strong> 不会直接影响抗抑郁药中毒，但会影响<strong>肝脏代谢</strong>。</p>
<p style="text-align:center;">同时服用多种精神科药物（SSRI + 抗精神病药 + 情绪稳定剂）的人：</p>
<p style="text-align:center;"><strong>药物间相互作用更复杂</strong></p>
<p style="text-align:center;">更容易出现 QT 延长 / 心律失常</p>
<p style="text-align:center;">医生更需要完整药物列表</p>
<p style="text-align:center;">请确保：</p>
<p style="text-align:center;">所有 HRT 药物名称写清楚</p>
<p style="text-align:center;">所有精神科药物包装带去急诊</p>
<hr>
<h2 style="text-align:center;" id="七-写给正在尝试吃抗抑郁药安静睡去的人" class="toc-header"><a class="toc-anchor" href="#七-写给正在尝试吃抗抑郁药安静睡去的人">¶</a> 七、写给正在尝试“吃抗抑郁药安静睡去”的人</h2>
<p style="text-align:center;">事实是：</p>
<blockquote>
  <p style="text-align:center;"><strong>抗抑郁药不会让人“安静睡去”，它们的失败后果通常是极度痛苦的。</strong></p>
</blockquote>
<p style="text-align:center;">包括但不限于：</p>
<p style="text-align:center;">持续数小时极度焦躁</p>
<p style="text-align:center;">全身肌肉抽搐</p>
<p style="text-align:center;">40°C 高热</p>
<p style="text-align:center;">肌肉溶解导致肾衰</p>
<p style="text-align:center;">ICU 插管</p>
<p style="text-align:center;">心脏电击</p>
<p style="text-align:center;">部分人留下永久性后遗症</p>
<p style="text-align:center;">这类方式的失败率远高于想象。<br>醒来后不仅痛苦，还要面对社工、精神科、心理干预、家属冲突。</p>
<p style="text-align:center;">你如果已经吞了药，现在还有意识，说明你仍处在<strong>可逆区间</strong>。<br>此时最狠、最有力量的选择是：</p>
<blockquote>
  <p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>给自己一次重开的机会。</strong></mark></span><br><span class="text-big"><mark class="pen-red"><strong>你现在还能打 120，就是你仍能选择命运的证明。</strong></mark></span></p>
</blockquote>
<hr>
<p>&nbsp;</p>
