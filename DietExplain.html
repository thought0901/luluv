mFtZX0ifQ==" filename="DietExplain.html"><template slot="contents"><div><h1 id="减肥原理" class="toc-header"><a class="toc-anchor" href="#减肥原理">¶</a> 减肥原理</h1>
<p>在你继续看这份指南之前，我只说一句话：<br><strong>请完整阅读本章，不要看了几句就急吼吼开始节食、闭眼跑步、买代餐粉减重。你搞错减肥原理，只会减掉肌肉、减掉生命力，最后反弹得更肿。</strong></p>
<hr>
<h2 id="h-1-所谓体质湿气重脂肪顽固多半是你懒得正视热量学" class="toc-header"><a class="toc-anchor" href="#h-1-所谓体质湿气重脂肪顽固多半是你懒得正视热量学">¶</a> 1. 所谓“体质湿气重”“脂肪顽固”，多半是你懒得正视热量学</h2>
<p>减肥的原理，从古至今，从中国到南极，从文献到医学院，<strong>始终只有一个：</strong><span class="text-big"><strong>热量摄入 小于 热量消耗</strong></span><strong>。</strong></p>
<p>这就是你瘦下去的唯一通行证。别和我扯什么湿气重、胖人喝水都长肉，<strong>不是你水喝多了，是你油炸东西吃得太多了。</strong></p>
<p>每个人身体都是个燃烧工厂：你每天睁开眼，心脏在跳，大脑在工作，肝肾在解毒，肌肉在收缩……这一切的基础维持叫做<strong>基础代谢率（BMR）</strong>，也就是：<strong>什么都不干、躺平一整天，你的身体为了维持生命仍然会烧掉的卡路里。</strong></p>
<p>请参考以下图表（图源：BC Campus Open Textbook）：</p>
<figure class="image"><img src="/1699248912-752790-image.png"></figure>
<blockquote>
  <p>肝脏和脾脏：27%<br>大脑：19%<br>骨骼肌：18%<br>其他组织（包括脂肪、皮肤、内脏等）：19%<br>肾脏：10%<br>心脏：7%</p>
</blockquote>
<p>也就是说，就算你躺着不动，你的身体也在燃烧这些能量。只不过，当你摄入超过所需，<strong>剩下的热量就被转化为脂肪储存起来。</strong></p>
<hr>
<h2 id="h-2-你胖是因为你吃得比身体消耗得多这不是侮辱是物理规律" class="toc-header"><a class="toc-anchor" href="#h-2-你胖是因为你吃得比身体消耗得多这不是侮辱是物理规律">¶</a> 2. 你胖，是因为你吃得比身体消耗得多，这不是侮辱，是物理规律</h2>
<p>每一天你摄入的食物都会被转化为热量，单位是千卡（kcal）。身体优先会满足基础代谢、活动消耗、食物热效应。多出来的，就被转存为<strong>甘油三酯（triglycerides）</strong>，储存在全身的脂肪细胞里。</p>
<p>你摄入多、消耗少 = 储存脂肪</p>
<p>储存多了，脂肪细胞不够用了，身体就新建更多的脂肪细胞</p>
<p>青少年时期肥胖尤其危险，因为脂肪细胞数量会永久增多</p>
<p>而成年人再胖，更多是脂肪细胞体积变大</p>
<p>减脂，就是逼身体<strong>调用脂肪里的甘油三酯作为燃料</strong>。前提是你得让身体的日常消耗<strong>超过</strong>你吃进去的热量，这个差值，就叫<strong>热量缺口</strong>。</p>
<hr>
<h2 id="h-3-一场关于挪用公司公款的比喻" class="toc-header"><a class="toc-anchor" href="#h-3-一场关于挪用公司公款的比喻">¶</a> 3. 一场关于“挪用公司公款”的比喻</h2>
<p>听起来有些难懂的话，我把它比喻一下，你的身体是一个很贪的公司高管，你的脂肪细胞就是公司公款，你公司里有超级多的公款，你的生活纸醉金迷，每天要花2500块钱。<br>正常情况下你每天都能赚2500块钱，正好够你去花天酒地，没有必要挪用公款，但如果有一天开始，你每天只能赚2000块钱，少了五百块的收入，这时候你就会开始挪用公司的公款，每天悄咪咪地挪五百块钱，一个月、两个月、一年过去，公司公款就被慢慢挪空了，你人就瘦下去了。<br>但是随着公款减少，公司也有点缺钱了，于是你的薪资更少了，来到了1800块钱，（也就是随着身体体重降低，你的基础代谢也降低了）此时如果还是按照每天花2500块的标准，你每天要挪用700块钱，风险就高了起来，如何解决呢？很简单，你的身体会自己意识到不能这么花钱了，于是他会把每天的开销从2500块降低到2300块，所以你拿1800块，还是挪500块，依旧够你生活。</p>
<p>你的最终任务就是把公司公款挪空。<br>这时候有的人就有大聪明想法了：如果我每天只给自己发500块钱，让身体挪用2000块钱的公款，不就能飞快吗？<br>no，当你每天打算挪用2000块的时候，前几天或许还有用，但你的公司很快就意识到钱对不上数了，为了应对这个情况，公司会极力保护他们的公款，增加安保，你无法再调用公款，与此同时你的生活质量发生巨大改变，你也不会再去花天酒地，原先一天花2500块的你可能会决定一天只花1000块，从而不需要挪用多少公款。<br>但1000块显然无法满足你的生活要求，你会开始浑身难受，想着不行，我要多赚一点钱，于是你会暴饮暴食，然后摄入超多的卡路里来弥补。<br>大概就是这么个意思了。<br>当你制造太大的热量缺口时，你的身体会启动应急响应，迅速降低你的代谢，导致你日常生活消耗都没有保障，甘油三酯也会进入紧急状态不会太多转化为能量，你对卡路里摄入的渴望会成倍增加，最终暴饮暴食，得不偿失。</p>
<p><strong>只有长期低热量缺口，才能让你不知不觉间挪光“公司”的“公款”，你才是一个合格的“贪官”。</strong></p>
<hr>
<h2 id="h-4-局部减脂你是在幻想烧手臂油脂的定向镭射枪" class="toc-header"><a class="toc-anchor" href="#h-4-局部减脂你是在幻想烧手臂油脂的定向镭射枪">¶</a> 4. 局部减脂？你是在幻想烧手臂油脂的定向镭射枪</h2>
<p>“怎么瘦腿？” “怎么瘦手臂？” “怎么瘦肚子？”<br>这些问题99%都是认知误区的典范。</p>
<p>局部减脂是伪命题。人体调动脂肪不是从“使用部位”开始的。你今天做了1000个仰卧起坐，不代表你的身体就会消耗肚子上的脂肪；你每天暴走8公里，不代表脂肪就从腿上消失。</p>
<p>脂肪的调动顺序，是由<strong>基因、性别、激素水平</strong>决定的。</p>
<p>男性多先瘦脸、瘦上身，腹部最后</p>
<p>女性则多从四肢开始瘦，腹部依然是最后堡垒</p>
<p>有的人减两个月脸像削了骨，有的人减一年腰围纹丝不动</p>
<p>所以不要幻想某一块局部会因为某个特定动作而“瘦下去”，<strong>只有全身性减脂，才是你最终的归宿</strong>。</p>
<hr>
<h2 id="h-5-你减的体重很可能不是脂肪而是你的肌肉和水分" class="toc-header"><a class="toc-anchor" href="#h-5-你减的体重很可能不是脂肪而是你的肌肉和水分">¶</a> 5. 你减的体重，很可能不是脂肪，而是你的肌肉和水分</h2>
<p>最容易被忽略的坑，就是体重数字误导你。</p>
<p>很多人节食一周，掉了三四斤，开心得不行。<br>但请你明白：</p>
<p>水分可以让你一夜之间上下浮动1~2kg</p>
<p>排泄物、肌糖原储存也会带来波动</p>
<p>真正的脂肪减少非常缓慢</p>
<p>极端节食掉的不是脂肪，而是：</p>
<p>肌肉流失（导致你更容易反弹）</p>
<p>水分丢失（第二周立刻反弹）</p>
<p>代谢降低（进入长期易胖体质）</p>
<p>所以，别太依赖体重秤的数据，每周称一次足够。<strong>你需要做的，是每个月站在镜子前看你的体型有没有变化</strong>，有没有凹线条、有没有穿衣更合身，这些才是实打实的进步。</p>
<hr>
<h2 id="h-6-关于热量缺口的合理范围" class="toc-header"><a class="toc-anchor" href="#h-6-关于热量缺口的合理范围">¶</a> 6. 关于热量缺口的合理范围</h2>
<p>热量缺口过大，身体就进入防御状态，基础代谢下降，脂肪不愿被调动，饥饿感爆棚，暴食反扑。</p>
<p>合理的热量缺口建议如下：</p>
<p><strong>BMI ≤ 28</strong>：每天控制热量缺口在300-600 kcal</p>
<p><strong>BMI ≥ 28</strong>：可以尝试600-1000 kcal的缺口，但一定要注意不是通过饿自己来制造缺口，而是增加活动量，提升基础代谢</p>
<hr>
<h2 id="h-7-提升基础代谢你要么多动要么多点肌肉" class="toc-header"><a class="toc-anchor" href="#h-7-提升基础代谢你要么多动要么多点肌肉">¶</a> 7. 提升基础代谢：你要么多动，要么多点肌肉</h2>
<p>基础代谢不是一成不变，它会因为你的体重、肌肉量、活动水平而上下波动。</p>
<p>想要让身体更愿意主动“燃烧”脂肪，就得提高代谢率。方式有两种：</p>
<h3 id="h-1-有氧运动短期" class="toc-header"><a class="toc-anchor" href="#h-1-有氧运动短期">¶</a> ① 有氧运动：短期</h3>
<p>来自 NIH 的研究表明：</p>
<p>有氧运动（如快走、游泳、跳操）能在活动后<strong>24小时内继续提升代谢</strong></p>
<p>每次有氧运动建议消耗 200-300 kcal，足以提升心肺功能，强化循环系统，长期有助于稳定代谢水平</p>
<h3 id="h-2-增加肌肉量中长期" class="toc-header"><a class="toc-anchor" href="#h-2-增加肌肉量中长期">¶</a> ② 增加肌肉量：中长期</h3>
<p>请把这句话刻进脑子里：<strong>肌肉是高代谢组织，脂肪是低代谢组织。</strong></p>
<p>多一点肌肉=多一点静息消耗</p>
<p>肌肉不只让你“练得结实”，更让你“保持轻盈”</p>
<p>尤其对 CD/TS 群体来说，不要对肌肉产生病态抗拒：</p>
<p><span class="text-big"><strong>女性化体型本身就需要核心肌群支撑，比如紧实的臀腿、纤细但有力的腰背</strong></span></p>
<p><span class="text-big"><strong>你练的不是肌肉男线条，而是为了美、为了稳、为了你的脂肪不会一松就掉</strong></span></p>
<p><span class="text-big"><strong>请放心，你不可能“练出肌肉男身材”，因为：</strong></span></p>
<p><span class="text-big"><strong>增肌非常困难，每年能长3-5kg已经是天赋异禀</strong></span></p>
<p><span class="text-big"><strong>少吃、热量缺口状态下，肌肉还会流失</strong></span></p>
<p><span class="text-big"><strong>没有雄性激素的帮助（例如HRT后人群），肌肉增长基本等于梦话</strong></span></p>
<hr>
<h2 id="h-8-真正的减脂需要什么" class="toc-header"><a class="toc-anchor" href="#h-8-真正的减脂需要什么">¶</a> 8. 真正的减脂，需要什么？</h2>
<p><strong>长期热量缺口</strong>：不是饿死自己的残酷计划，而是每顿饭少一口，换来一年瘦十斤</p>
<p><strong>每周一次体重检查</strong>：别每天称，那叫制造焦虑</p>
<p><strong>每月一次体型记录</strong>：脱光拍照，看看腰有没有细、腿有没有紧、背有没有挺</p>
<p><strong>有氧+无氧结合训练</strong>：能跑动、能举东西，才是健康身材的底子</p>
<p><strong>不幻想局部瘦身、不贪图速效</strong>：减脂就像你小时候攒压岁钱，时间换来的是沉甸甸的收获，不是天上掉下来的钱袋子</p>
<hr>
<h2 id="h-9-最后的忠告" class="toc-header"><a class="toc-anchor" href="#h-9-最后的忠告">¶</a> 9. 最后的忠告</h2>
<p><strong>如果你幻想“一个月瘦10斤”，你会得到“掉肌肉+烂代谢+爆反弹”三连击</strong></p>
<p><strong>如果你每天只吃水煮菜、水煮蛋、水煮心情，你离崩溃也只差一顿夜宵的距离</strong></p>
<p><strong>如果你拒绝训练、拒绝肌肉、拒绝科学规划，那你只能迎接反复反弹的人生</strong></p>
<p>你不胖，因为吃了一顿烧烤；你胖，是因为你吃了100顿烧烤，睡了100次懒觉，拒绝改变100次。</p>
<p><strong>减脂是最公平的事情之一。你不努力，不会有回报；你不坚持，成果一定溜走。</strong><br>你今天的每一口多吃，都是你明天肉眼可见的体积膨胀。你今天少摄入、你今天多动，都是你半年后线条清晰的底子。</p>
