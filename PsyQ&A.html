<h2 id="经典中的经典医患关系又名面对包括精神科在内的医生误诊创伤的信任修复" class="toc-header"><a class="toc-anchor" href="#经典中的经典医患关系又名面对包括精神科在内的医生误诊创伤的信任修复">¶</a> 经典中的经典，医患关系(又名面对包括精神科在内的医生误诊/创伤的信任修复）</h2>
<h3 id="医疗事故为何频发学新闻学学的" class="toc-header"><a class="toc-anchor" href="#医疗事故为何频发学新闻学学的">¶</a> 医疗事故为何频发（学新闻学学的）</h3>
<p>……<mark class="pen-red"><strong>你见过某年某月某日某位医生因为开出了符合某某病人病情的的药上新闻的吗？</strong></mark>除了医疗事故、医疗纠纷，你最多也就只能看到某位或者某些医生因为医术水平高超，解决了某位病人的疑难杂症/挽救了TA的性命。<mark class="pen-red"><strong>对于那些吸引不了大众目光的事情，媒体是不会报道的，你也没什么兴趣去看，因为这种事情到处都是。如果这种事情都要报道，新闻学相关从业人员数量起码得加两个0。学新闻学学的。</strong></mark></p>
<p>当然这里也不排除确实是个别医生水平很烂，但你可以换一个医生，也可以再约一次然后狠狠拷打人家（？）。就算你真的遇到了亡命医师，你换一个别的医生（或者医院），几乎有100%的概率你可以至少换到正牌医师，当然王牌医师也是会存在的，只是号会难约亿点点。</p>
<p>最后再做一个提示：尊重人类科技树的复杂程度。人类的科技树已经到了一个人终其一生都只能精通，并且为某个学科的某个领域的某个分支作出贡献的程度。所谓百闻不如一见，纸上谈兵不可取。对于大多数对于详细的医学知识一无所知的人来说，相信医生是你最好的选择。去医院不信医生你去干嘛？付费旅游？体验多样的人生？还是在逛超市？哪怕你确实懂了一点医学知识，但是相对于那些在医院干了几十年的老医生来说，你的经验依然不足。在某次就医中，我亲耳听见一位几十岁的主任医师感叹道：上个患者的情况没见过，在门诊呆久了，啥情况都能见到。经验丰富的医生尚且如此，何况是某个不是从事这方面的人呢？哎呀大不了再换一个医生嘛</p>
<h3 id="医生一直让我做各种检查浪费我的钱" class="toc-header"><a class="toc-anchor" href="#医生一直让我做各种检查浪费我的钱">¶</a> 医生一直让我做各种检查，浪费我的钱！</h3>
<p>我只举一个例子。</p>
<p>你去了内科，说你肚子痛。医学上，腹痛按照部位分类，可以分为上腹部、下腹部、全腹部疼痛。上腹部又可以分为左上、正上、右上三个部位，下腹部也可以分为左下和右下两个部位。请问你是哪里痛？哦对了，某个部位出了问题，有可能会是别的地方痛或者一起痛的哦~</p>
<p>假设你是左下部分痛而且没有疼痛转移或者疼痛辐射，那么摆在你面前的有：拉肚子、食物中毒、排泄物堆积太多、阑尾炎、急性肠胃炎、乙状结肠炎、结肠炎，肠穿孔、肠癌等等选择。不然你选一个？</p>
<p>开玩笑不给你照个CT就给你下诊断，正确的概率可能还不亚于你彩票中了一百万。老老实实做检查，可以让医生少掉点头发，也可以降低误诊率，免得癌症给你诊断成别的了。肠癌本身就难以发觉容易误诊，要真给你误诊了拖成中晚期了你闹多久也没用了。做些检查那么点钱你图啥，又不是不能再挣回来。而且你还有医保报销。</p>
<h3 id="这个医生毁了我的人生" class="toc-header"><a class="toc-anchor" href="#这个医生毁了我的人生">¶</a> 这个医生毁了我的人生！</h3>
<p><mark class="pen-red"><strong>人要用发展的眼光来看问题</strong></mark>。我的父辈正年轻的时候，40年前，世界上第一台手机才刚刚诞生，使用摩斯电码的，一直滴滴答答作响的电报机在中国和全世界依然到处都是。20年前，手机触摸屏的发明促使了世界上第一台智能手机的诞生，我们总算可以把那些只能对着几个按钮按来按去的老爷机扔到一边去了。10年前，我的父亲亲口告诉我，手机只是一个用来打电话的工具，根本不是用来玩游戏和干其他事情的。现在，就连我那个固执的父亲，都不得不接受了智能手机的便利性。现在他天天看短视频，出门坐网约车，甚至还会感叹点个外卖居然能比在家里做饭便宜。</p>
<p>那么尚且年轻，只有二三十岁的你呢？这个世界日新月异，你的人生才过四分之一。你有足够的时间可以挥霍，足够的时间用于痊愈那个曾经发生过的创伤。不要急着对你的人生做评判。10年前尚且处于青春期的我也一度想着我的心理疾病彻底毁了我的人生。而现在，我会说，上帝关掉一扇门的同时，给我开启了另外一扇门。偏离人生的正轨有时候并不是什么坏事，乡间小路也一样可以通行，或许你也可以收获别样的人生体验。我的人生体验确实无比“精彩”就是了。</p>
<h3 id="信任的修复" class="toc-header"><a class="toc-anchor" href="#信任的修复">¶</a> 信任的修复</h3>
<p>信任的修复确实是很困难的，而且需要一个过程。假如你确实被某位医生背刺过，我建议你抱着辩证的心态去就诊。医院无论如何还是要去的，但是你可以多花点钱，多去几家来证明医生没给你弄错情况。时间长了慢慢就会好了。</p>
