<a class="toc-anchor" href="#为什么我要这么仔细地整理精神科内容">¶</a> <span class="text-huge"><mark class="pen-red"><strong>为什么我要这么仔细地整理精神科内容：</strong></mark></span></h4>
<p><span class="text-big">根据 </span><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6830528/" class="is-external-link"><span class="text-big">https://pmc.ncbi.nlm.nih.gov/articles/PMC6830528/ </span></a><span class="text-big">的调查结果显示，<mark class="pen-red">在已确定的10,270名跨性别患者中，</mark></span><span class="text-huge"><mark class="pen-red"><strong>58%</strong></mark></span><span class="text-big"><mark class="pen-red">（</mark><i><mark class="pen-red">n</mark></i><mark class="pen-red"> =5940）至少有一种精神疾病诊断，而对照组患者中这一比例为13.6%（ </mark><i><mark class="pen-red">n =7,311,780）（ p</mark></i><mark class="pen-red"> &lt;0.0005）。精神疾病对于MTF群体就像一道永远不会散开的阴霾遮盖着她们，而太多太多的患有精神疾病的MTF没能得到正确的治疗，源自于医院的疏漏和知识的偏差，所以我才会熬夜一个个通宵写出来这些内容，哪怕我的wiki能让这个数字变成<strong>57.999%</strong>，那都值得了。</mark></span></p>
<blockquote>
  <p>在这片细雨迷蒙的世界里，许多人背负着看不见的伤口，却无处诉说。对跨性别及变装（Crossdressing/CD）、正在进行雌激素替代疗法（MTF/HRT）或性别焦虑的朋友而言，生活的阴冷不仅来自身体与身份的错位，更来源于周遭父权刻板的冷峻。那一滴滴落下的雨水，仿佛撞击着心头的坚冰，也打湿了每一次想要袒露的渴望。</p>
</blockquote>
<h5 id="一-社会撕裂下的心理创伤" class="toc-header"><a class="toc-anchor" href="#一-社会撕裂下的心理创伤">¶</a> <span class="text-big">一、社会撕裂下的心理创伤</span></h5>
<p>不论是偶尔偷偷换上一件女装，还是彻底迈入 HRT 的漫长征程，这条路都会因社会压力而布满荆棘。在中国这片父权深植的土地上，“有女性气息”的男人常被贴上丑陋的标签：说他们“不够阳刚”“不配做人”。在家庭里，压抑的教育方式让孩子连一丝不符合性别期待的想法都要小心翼翼；在学校里，霸凌的目光和言语随时可能将他们推入深渊。</p>
<p>青春期的校园，常常化作一场无言的审判：不敢在课间翻看女装论坛，不敢买下一件轻盈的短裙；甚至不敢跟室友提起内心的秘密，一声“你这样就是人妖”便能让他们在寂静的操场上愧色满面。步入社会后，或许租了房子可以换装，却在公司走廊里无法展示一丝女性味，私底下成为同事的笑柄。对于那些已经开始服用雌激素的 MTF 而言，即便身体正在发生变化，也难逃“人妖”二字的毒箭。这些伤口深埋在心底，久而久之便汇聚为压抑与绝望。</p>
<blockquote>
  <p><i><strong>“心理问题”在这种环境中如影随形：焦虑、抑郁、自我否定——当这些积聚到一定程度，便可能演变为“精神疾病”。躯体病变常见于身体表层，但精神的病变更为隐匿，它隐藏在脑海深处，让人无法轻易察觉，却以无声的方式吞噬一切。我们开设这一栏目，正是要将这些看不见的伤口呈现在光亮下，为 CD/TS 群体的心理创伤、精神困扰与药物干预提供一个尽可能透彻的分析。所谓“TS 死亡率高”，背后更多是因自杀而非 HRT 本身降低寿命。我们希望在这里与每一位跨性别者并肩：你并不孤单，狭隘的声音无法定义你的存在，我们愿意成为你遮风挡雨的港湾。你有我们，有璐哥。</strong></i></p>
</blockquote>
<hr>
<h5 id="二-心理疾病与精神疾病的界限" class="toc-header"><a class="toc-anchor" href="#二-心理疾病与精神疾病的界限">¶</a> <span class="text-big">二、心理疾病与精神疾病的界限</span></h5>
<p>在朦胧的阴天里，有时心理的阴影并不易被他人察觉。<strong>心理疾病（心理层面的困扰，如持续的焦虑、情绪低落、严重的自我怀疑）与精神疾病（如抑郁症、躁狂症等）既相互交织，却也有本质区别。</strong></p>
<blockquote>
  <p><strong>精神疾病</strong> 往往伴随着大脑生理层面的病变，虽然外部无法凭肉眼观测，但它们如同一块冰冷的岩石潜伏在脑区深处：当神经递质失衡、脑结构微小地改变，病症便悄然萌生。也就是说，是因为某些脑区功能或结构出现了病变，才导致情绪与认知失常，从而引发抑郁、狂躁等精神症状。</p>
</blockquote>
<blockquote>
  <p>而<strong>心理疾病</strong>，则更多表现为个体对环境刺激的应激反应或者情绪状态的紊乱。它可能源自于长期的社会排斥、自我认同冲突、亲密关系失衡等诸多外部因素，当心理负荷持续超出承受范围，就会形成持续的抑郁、焦虑、自我厌弃等表现。</p>
</blockquote>
<p>二者往往呈现螺旋上升的态势：心理困扰若得不到及时疏导，可能进展为精神疾病；同样，精神疾病引发的剧烈情绪波动，也会加剧个体对自我的否定与社会疏离。在本栏目中，我们会尝试剖析两者的差异与联系，帮助读者从脑科学与社会环境的角度更全面地理解自己或身边人的痛苦。</p>
<hr>
<h5 id="三-专业依据icd-1011-与-dsm-5" class="toc-header"><a class="toc-anchor" href="#三-专业依据icd-1011-与-dsm-5">¶</a> <span class="text-big">三、专业依据：ICD-10/11 与 DSM-5&nbsp;</span></h5>
<p>若无可靠的文献作为灯塔，所有的文字便会在黑暗中迷失方向。本 Wiki 所有涉及精神类专业内容的章节，都将以严谨的文献为支撑，遵循世界公认的疾病归类标准——ICD-10/11 与 DSM-5。</p>
<blockquote>
  <p><strong>ICD-10/11（国际疾病分类第十/十一版）</strong>：由世界卫生组织制定，用于疾病的国际标准化归类。在我们讨论抑郁症、躁郁症、创伤后应激障碍（PTSD）等诊断时，会参照其中的诊断标准与描述，确保信息的权威与统一。</p>
</blockquote>
<blockquote>
  <p><strong>DSM-5（美国精神障碍诊断与统计手册，第五版）</strong>：由美国精神病学学会发布，广泛应用于临床诊断与学术研究。它对各类精神障碍的诊断要点、症状评估及剧烈程度都有详细的分级与指导，被全球众多心理学家与精神科医生采纳。</p>
</blockquote>
<p>为什么要格外强调这些？原因很简单：<mark class="pen-green">Wiki 主璐哥虽然自学了不少知识，却终究不是受过完整医学教育的医生，无法使用临床经验来判断。为了让内容尽可能严谨并经得起推敲，我们将以这些权威分类为基础，引用最新的国内外文献，力求做到“言之有据，论之有理”。</mark></p>
<hr>
<h5 id="四-wiki-主的身份与亲历" class="toc-header"><a class="toc-anchor" href="#四-wiki-主的身份与亲历">¶</a> <span class="text-big">四、Wiki 主的身份与亲历</span></h5>
<p>我是一个敏感的人，感性而易于被环境吞噬。</p>
<p><mark class="pen-red"><strong>wiki主自己是一个重性精神病人，并且是一个HRT中的MtX，所以我这方面的心理类内容会有那么一点点权威性，作为一个被上报的重性精神病人，我亲眼目睹过死亡、自杀；我自身经历过濒死、洗胃、自残几百刀、嗑药逃避，我经历的这一切让我成为现在的这个重性精神病人，我靠药物活着，音乐、医学、爱人是我仅剩的活下去的希望，但我并不是一个想死的人，一刻都没有，经历这一切只让我更珍视生命，尤其是2022年亲眼目睹的自杀，这带给我PTSD，但也更让我珍爱生命。</strong></mark></p>
<p><mark class="pen-red"><strong>在这条道路上，我从没有想过放弃——因为在我最痛苦的深渊里，曾有人伸出双手告诉我：“你值得被听见，你并不孤单。”正是怀抱着这份温暖与渴望，我才有勇气把自己内心的伤口撕开，将它们化作笔下的文字，照亮他人的黑夜。</strong></mark></p>
<hr>
<h5 id="五-无尽的学习与开放的心态" class="toc-header"><a class="toc-anchor" href="#五-无尽的学习与开放的心态">¶</a> <span class="text-big">五、无尽的学习与开放的心态</span></h5>
<p>我并非全知、也绝不会声称自己不犯错。作为一名医学半吊子三脚猫学徒，也许我会在术语使用、数据解读、理论深度上出现不足，但我会用百分之百的严谨与真诚来对待每一个条目。<strong>如果你是精神心理领域的专家，在阅读中察觉到了任何偏差，请务必通过 Wiki 提供的联系方式联系我，指出错误，我会在最短时间内进行修订。</strong></p>
<p>我深知，<strong>知识不是冰冷的公式</strong>，而是活生生的经历和情感的交融。只有当专业与温度相融合，才能为那些在迷雾中徘徊的灵魂带来希望。我愿意在这条路上，带着一颗谦卑而开放的心，与所有关心跨性别心理与精神健康的人，一起探讨、学习、改进。</p>
<hr>
<h4 id="写在最后你并不孤单" class="toc-header"><a class="toc-anchor" href="#写在最后你并不孤单">¶</a> <span class="text-big">写在最后：你并不孤单</span></h4>
<p>当你在镜子前凝视着自己，感到那份不被理解的孤独，请记住：无数和你一样的朋友，都在这片暴雨里张望。也许你曾因父母不解而默默流泪，也许你因同学的嘲讽而避开人群，也许你因激素带来的情绪波动而心中迷惘——这一切都不奇怪，因为社会对我们的逼迫与误解让我们遍体鳞伤。</p>
<p>但请相信，在这纷乱的世界中，还有人在黑暗中点亮一盏盏灯火。Wiki 主璐哥在此承诺：每一篇文字，都将谨慎地检索文献、审视病例、结合自身经验；每一次修订，都将回应专业的质疑与关怀。我们想营造一片温暖、真实的净土，让 CD/TS 能在这里找到支持、找到共鸣、找到抚慰。</p>
<blockquote>
  <p><span class="text-big"><strong>你有我们，我们有你。无论未来的道路多么曲折，雨水多么冷冽，阳光终将透过乌云，</strong><mark class="pen-red"><strong>去你妈的父权刻板，去你妈的诋毁嘲笑</strong></mark><strong>，你就是你，愿你带着希望，向前行进，也愿这篇介绍，能在你疲惫的时刻，送上一点微光和温度。</strong></span></p>
</blockquote>
