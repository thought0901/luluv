<hr>
<p>开到了一直想开的双诊断大证！</p>
<figure class="image image_resized" style="width:38.03%;"><img src="/a7b5a9820d914a201221633205f239f6.jpeg"></figure>
<p>很早就有分开的两个大证了，现在经过一年观察期，终于获批开到了带双诊断 ICD10的正式证明！</p>
<p><strong>幸福的家: 璐哥有了新的女朋友！</strong><br>这一年，璐哥终于体会到久违的安心与温暖。我和她，是彼此的归宿——她包容我的一切，喜欢我的所有。在这座大房子里，我们建立了一个属于我们的工作室：白天，我潜心做游戏开发与 AI 项目，夜晚为unity定制地图的团队注入创意活力。小小的工作室里，我不仅继续迭代项目，还招募了新的学徒，让更多人参与到图块与代码的世界中；与此同时，我在打碟领域也有了一位徒弟，传授节拍与调音技巧。仅仅一年的时间，我从无人知晓的新人，逐渐成为“有咖位”的 DJ，如今不时与国际艺人同台，共同点燃舞池。</p>
<p><strong>情绪的平稳</strong><br>情绪一直保持着前所未有的平稳，若非碳酸锂的细腻调节，我难以想象自己如何走到现在。每天清晨睁眼，没有那种触目惊心的绝望，取而代之的，是一种栖息心灵的宁静。我感谢那微小却有力的分子，让躁动的思绪得以平静，也让我得以在纷乱的创作中找到节奏。</p>
<hr>
<p><strong>药理学的探求</strong><br>过去的迷雾，令我对“吃到嘴里的每一粒药片”充满好奇。于是，这一年里，我埋首于药理学的浩瀚中，努力弄清每种药物的源流与机理——为何 HRT 会带来抑郁？为何不同抗抑郁药在体内的代谢命运迥异？我检索临床文献，追溯历史踪迹，研究化学结构与药代动力学，用一双旁观者无法企及的眼光，审视每一张处方背后的意义。虽然我不大可能成为执业医生，但我觉得自己具备独特的角色：作为一个重性精神病患者，我既理解病痛的暗面，也懂得治疗的必要与难题。我希望用这段经历、用我所领悟的知识，帮助更多的“同行者”——这便是我创建 luluv.wiki 的初心。</p>
<figure class="image image_resized" style="width:30.76%;"><img src="/be5d6fe4-2ab7-433f-98bd-509cd6abd0d1.png"></figure>
<hr>
<p><strong>展望未来</strong><br>如今的我，不再为过去的迷途惶恐，也不再为辗转的焦虑所困。每当夜色降临，我会和她并肩走过院子，在微弱的灯光下谈及明天的新计划：或是迭代一个游戏模块，或是打磨一段新的 DJ Euler。我的脚步已不再迟疑，因为我知道自己正在走向一个被称为“自我”的方向，一步步令心底那片宁静更加厚实。</p>
<p>新的一年里，我将继续在药理学的道路上探寻，也会在音乐与创作中深耕。我愿将这份由痛苦与希望共同交织而成的经验，化作对他人最真切的帮助。愿 luluv.wiki 的每一行文字，都能为那些在黑夜中漂泊的人点亮一盏微光——因为在黑暗里，总该有人告诉你：你并不孤单。</p>

<p><span class="text-huge"><strong>是什么时候，我在无人的午后第一次触碰到那个似有若无的渴望？</strong></span></p>
<p>那年我刚满八九岁，家中只有我一人守着完不完的作业。母亲忙于操盘，周末被麻将桌的笑声吸引，姐姐匆匆离家去海外求学。空荡荡的屋里，只剩我和深夜的灯光作伴。</p>
<p>我怕黑，也怕独自一人，直到十一岁才敢搬出母亲的床铺。那天，我踮起脚尖，推开了母亲与姐姐共用的更衣间，眼前突然绽放出一幕万花筒般的色彩：黑、白、蓝的小短裙静静垂悬；浅蓝与樱桃红的薄纱轻盈铺展；还有那若隐若现的长袜，各种质地、各种花色，细碎的光泽仿佛在低语。那一刻，我惊愕得愣在原地，回想起自己朝夕相处的平凡装束，竟如陈旧的黑白照片，无半点动人。</p>
<p>一条海军蓝的半裙，好像呼唤我将自己包裹，虽不知如何安插，却忍不住轻柔地披在身上；大号的粉色上衣与脚踝处的长袜，在颤抖的指尖探索下，产生了一种奇异的触电感，涌向全身。镜中映出的影像，像从未来飞来的碎片——那里是另一个无忧的存在，纯粹而无限。</p>
<p>匆匆间，衣物重新堆回原位，仿佛从未发生过什么。我慌张地奔回房门，在母亲“吱呀”一声打开门的瞬间，心跳几乎要冲破胸膛，只能在暗处默默祈愿：千万别被看见。</p>
<p>同学们还在讨论那些流行的热血漫画，而我却沉浸在另一种影像里——电视屏幕上《灼眼的夏娜》那位少女的倩影，和想象中自己若能拥有的笑靥。我会想：如果能像她一般，不受繁杂束缚，是否就能被更多温柔地注视？</p>
<p>从那之后，童年的宁静房间里多了一个声音，轻轻在我心底叩问：何为真实的自己？</p>
<p>&nbsp;</p>
<p>那段时间，我刚步入社会，满心疲惫，哪怕脑海里偶尔闪过“她”的念头，也被忙碌淹没得无影踪：每天挤公交、急匆匆打卡，骑着电动车四处奔走，却始终难有建树；哪怕再怎么努力挨家挨户送名片，一天也不过勉强换来几十块零花。</p>
<p>直到某个午后，一个视频的出现，像轻轻拨动我心底的琴弦。我在 B 站偶然刷到一位姐姐的妆容与笑容，不再是那种“想要得到她”的模糊冲动，而是一种近乎羡慕的感触——那一刻，我忽然觉得，体内似乎有个声音在轻声提醒：她在等你。</p>
<p>回到南方，母亲留给我一套小屋，第一次让我有余裕去尝试那些以前只在镜中窥视的事物。我从廉价的小摊买来几支眼线笔，翻来覆去地在镜前涂抹，那些生涩的笔触与屡屡失误的线条，使我的妆容摇摇欲坠，似乎随时会坠入一片暗灰。可我并不气馁，用手指蘸着廉价指甲油，胡乱为指尖和脚趾描上一层金色的闪光，虽然看起来拙劣，却像是为沉默的自我点亮了一盏小灯。</p>
<p>2017 年 5 月 22 日，镜中那张带着初学痕迹的自拍，竟让我感到前所未有的完整：那是“她”第一次真正醒来。那张照片虽不算精致，却成为我心里的纪念碑，直到今天仍挂在微信头像里。那一刻，我才意识到，每个人都需要一个时机，才能在茫然里找到自己。</p>
<figure class="image image_resized" style="width:20.31%;"><img src="/age17.png"></figure>
<p>于是，从那以后，我开始时不时在家里试水女装。起初仅是穿上几件姐姐的旧衣，慢慢学着在 B 站上看化妆教程。几个月下来，我用半掩的女性面孔注册了探探，为好奇心添了一把火：不到两周，我收获了 16623 个喜欢——那种久违的认同感，像是一阵暖风冲散了我心底的寒霜。探探的截图还躺在相册里，每一次翻看，都像重新点燃当初的那份惊喜。</p>
<figure class="image image_resized" style="width:22.9%;"><img src="/tantan.png"></figure>
<p>2018 年初，Avicii 悄然离世。他的音乐曾陪伴我度过无数个黑夜，他那轻盈而略带悲伤的旋律，曾是我最温柔的依靠。听闻他离去的消息时，我的心骤然一沉，为了纪念，我又一次在皮肤上刻下了他的印记：他的生辰与辞世的日期。纹身尚未褪去的疼痛，却像再次提醒我——连最热爱的人，也有离去之时。自此，我不再愿意轻易踏出门槛，成天窝在家中，对着屏幕打游戏，将自己与世界隔绝。</p>
<p>某天夜里，群里朋友突发一个链接，链接里是一段视频——“Trap girl get pounded by e-boy on webcam”。我抱着好奇点开，瞬间就被那幕画面震住：她身体的曲线与眼神交织，从未想过那样的影像会让我心悸如鼓，脸颊发烫，仿佛少年的我在深夜里第一次听到远方教堂传来的钟声。回神后，我反复捂住耳朵，像被突如其来的眩光刺痛，却又无法完全收回那双渴望的目光。</p>
<p>从那一刻起，生活真正走入了新的章节：我不再只是少年，也不再只渴望成为别人眼中的“她”。我明白，那不过是我的一部分，而这段体验才是我真正的起点——一段真正属于自我、向内探寻的旅程，正缓缓展开。</p>
<p>&nbsp;</p>
<p>那段日子，我仿佛听见体内另一只声音愤怒地评判：</p>
<p>“你有如此精致的容颜和敏锐的心思，却将自己糟蹋成这般光景？”</p>
<p>那声音冷漠又带着嘲讽，像一面冰镜，映出我最深的怀疑与自厌。它已经存在于我的骨血间，很可能自 2018 年末便开始潜伏，只是我一直未曾察觉。我开始不停地拷问自己：为何在情感与欲望之中，要向那种极端的粗暴屈服？为何我渴望在这不适合我的身体里，演绎他人所编织的“柔弱”？是因为单纯的好奇与刺激？还是小时候那丝隐秘的想象，被放大后扭曲成了如今的模样？究竟缘由何在？</p>
<p>答案如同雾中微光般朦胧，我反复在心底翻搅，却始终无法捉住它的轮廓。内心的拉锯，在暗夜里像潮水般涌动，渐渐侵蚀理智。</p>
<p>更糟糕的是，那年年中的某个清晨，我在朋友圈里看到一则噩耗──曾经支撑我度过无数艰难时刻的说唱歌手XXXTENTACION，突然遭到枪击，溘然离世。整个人生仿佛刹那冻结，我投身于混沌的悲伤，自我用无数记忆的碎片将情绪切割，却发现那切口无法愈合。我夜深人静时突然扇了自己几记耳光，随即又暴饮暴食，抱着被子痛哭，泪水无声，却撕裂了整个灵魂。</p>
<p>面对镜中映出的自己，我再也不愿直视。我的存在不仅不像以往那样清晰，反而让我觉得自己活得毫无意义。有时，我渴望脱离这一切，去做一个飘在云端的“她”，无忧无虑，无需承担这具让我倍感折磨的躯壳。</p>
<p>我试图以纹身为自己带来真实的疼痛，刻下那位歌手的名字和生死日期，仿佛以此将心中沉重牢牢钉在躯壳之上。然而，刺青的灼热与鲜血并未换来丝毫慰藉，反而将我越推向无尽的黑暗。</p>
<p>终有一天，我累得再也支撑不下去，深陷一片无法回首的阴影。每夜都要服下一粒又一粒安眠药，才能暂时逃离噩梦；日间，我蜷缩在窗前，目光浑浊，望着外头流动的光影，仿佛隔着透明的墙壁，无法触碰那再也不会属于我的世界。母亲远在外地做生意，只知道我被诊断出重度抑郁，愧疚之下，她寄来了大笔钱财。可我顾不得感恩，将它们风卷残云般挥霍——购买奢侈衣物，让衣橱堆满繁华；在城中最贵的餐厅痛饮，卯足劲儿想用这些外表的华丽，掩盖心底的荒芜。可纵使食物入口时肥美无比，那份空洞仍未曾被填满。</p>
<figure class="image image_resized" style="width:22.93%;"><img src="/2018dpp.png"></figure>
<p>&nbsp;</p>
<p>我用很长时间去整理那些凌乱的情绪与日渐模糊的自我，终于发现，当我不再与另一个自己对抗，就开始了真正的和解。如今，她与我共生，事实上，生活的很多瞬间都是她在引领——她便是璐璐。</p>
<p>那时，我收养了一只猫，也在网络上结识了许多倾听者，其中有位远在芝加哥的说唱艺人，唯一知道我所有秘密，也唯一用坚定的目光告诉我：“无论你变成什么模样，我都会支持你。”他的话让我试着寻找些能带来微笑的事。那段时间，我甚至暂时放下了那些关于女装的冲动，忘记了那些刻意摧残自己的冲动。</p>
<p>2019 年中，医生告诉我，我已经不再被抑郁当头棒喝，但那更像是双相情感障碍（BD）与双重人格的潜伏。事实也证明，这些诊断并非空穴来风——我的 BD 症状偏轻，却在需要时能通过药物得到缓解。那时，我过得算是轻松：妈妈留给我一台宝马Z4，谈了一场意义非凡的初恋。虽不想细说那些与女孩子的往事，但可以肯定，那是我真正意义上的“正常生活”。</p>
<p>然而快乐总是转瞬，19 年底，那位芝加哥的朋友离世的噩耗如同巨石击中我的胸膛，我再度坠入泥泞。我心灰意冷，与他分手，一个人在空荡的房间里酗酒自虐，夜里反复问自己：我究竟是谁？于是，我在皮肤上再刻他的名字，却依旧寻不到慰藉。脑海里回响着他离开的回声，而我，却在沉默中再次与自己交战。What's the 27 club ? we ain't make it past 21.</p>
<p>我开始翻阅过往，重新打量那些曾给自己带去一丝安全感的物件。化妆品、女装与过去的玩具重回视线，我将自己装扮成理想中的模样：清纯、甜美、优雅，可同一时间，我买来寸级更大的“玩物”，那场面：我让自己浸入痛苦与快感交织的感受，血腥与玫瑰香气在房间空气里混合、弥漫。我并不在意溢出的鲜红，仿佛那些伤口才是我唯一能够触碰到的真实。</p>
<p>某个深夜，我不知为何吞下十多片褪黑素，沉睡近二十个小时。梦境里，我看见璐璐，她双臂交叉，倔强地立在阴暗角落，眼中充满质疑：“你想活成什么样子？”我问她：“什么时候才能离开我的身体？”她平静地对我说：她早就在我的体内，只是我们迟迟未曾对视。她说：我的五官、我的双眸，那些线条感与轮廓，早已是她的模样，而我的最初，她就住在这里。</p>
<p>那一刻，我才真正听到她的名字：璐璐。从此，我不再用一把把刻刀去伤害自己，而是开始慢慢读懂内心的对话。有了璐璐，我的思绪变得清澈，她比我更敏锐，能够辨识众人的表情与心事。2020 年初，我沉浸在剧本杀的世界里，发现自己不再抗拒那份“女性化”——我欣赏衣服的设计、配色与面料，这与性别无关，只是我对美的喜爱。渐渐地，我意识到自己并不需要一个确定的性别标签，我更倾向于一种中性状态。</p>
<p>在2021 年，我与另一位女孩有过一段交集，可终究未能走到最后。也正是那时，我开始审视为何自己渴望穿女装，为何在亲昵之时想要被轻抚与征服。经过长时间的思考，我终于得出答案：缺爱。</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p><strong>弃子</strong></p>
<p>我生在一个看似富足的家庭：父亲是检察官，母亲拥有一家酒店。然而，真正的温暖却并未照进我的生活，因为我是私生子。更让我难以逃避的是，母亲行事无拘无束，常常与情人纠缠不清——人说“儿不嫌母丑”，可我心中的阴影自八九岁起便悄然生根。当时的我好奇地问母亲：“为什么别的同学有父亲来接我却没有？”她只是说：“爸爸在外地忙，没有时间陪你。”那一句淡漠，仿佛在我稚嫩的心里埋下了“无人在意我”的种子。</p>
<p>初中时，同学的嘲讽与拳脚如影随形。我曾鼓起勇气向老师举报，换来的却是更残酷的打骂。母亲依旧忙于生意，只留给我一袋袋生活费，让我撑着继续“好好读书”。可那些腰间的钞票，却填不进我被冷落的空白。一句“你是个弃子”在走廊里回荡，让我一度以为自己真是社会的边角料。</p>
<p>迫于学业与孤立，我选择辍学。工作之后，我曾挣扎着要独自扛下所有，母亲也断言我能应付。然而，回到南方的那段日子，只有我一人蜷缩在自己的小房间里，直到成年。缺爱与被遗忘的阴影始终牵引着我，我常常幻想拥有一个能在我受伤时伸出手的父亲，或是一个能把我揽入怀抱的母亲：如果一阵委屈袭来，我可以扑进他们温暖的臂弯，让粗糙的大手拂去泪水，让他们的宽厚为我撑起一片天空。</p>
<p>或许正因如此，我逐渐形成了讨好型人格——另一个同样讨好型的“璐璐”也在这时诞生。我们在暗处交换目光，她让我明白：若没有得到来自他人的关爱与肯定，就无法在这世上找到立足点。于是，我把所有缺失的情感投射到别人身上，甘心去取悦、去忍受，哪怕要承受伤害，也要换来哪怕一丝不嘲讽的关注。</p>
<p>然而，久而久之，我意识到，这并不是我该有的样子——一个被动索取、臣服于别人的模样并非我的归宿。我该学会索取关心，也该扛起被关心的勇气。那时，我才明白自己内心深处并非单纯为了刺激或欲望，而是一种对“被接纳”的渴望在驱动我。于是，我渐渐停止把自己当作一个只会讨好和忍受的人，改以”Sub/M“的心态去检视：我能够承受痛，却并不意味着我只能屈服与牺牲。</p>
<p>当我真正认清这一点后，生活变得不再艰难。即使我依旧会借助玩具来寻求短暂的慰藉，却不再将这些当作唯一的出路；我不再用“性与色情”的标签去定义那个隐藏在身体下的“女孩”，而是把它当作一种个人的体验，逐步走出自我厌弃的泥淖。</p>
<p>&nbsp;</p>
<p><strong>学会爱自己</strong></p>
<p>自 2021 年中以来，我开始学着向自己投以柔光，学着去爱自己、投资自己、取悦自己。</p>
<p>我在屋里摆满了鲜花，粉色的、紫色的，各种花香在窗边弥漫。我买了加湿器与香薰灯，让空气荡漾着轻柔的香气，在每一个晚上都能安静地呼吸。这些细小的仪式，就像是对自我的温柔抚慰，让我在忙碌与焦虑中偶尔停下脚步。</p>
<p>护肤成为我新的兴趣：我在 B 站上学习各种护肤技巧，选购身体乳、手膜、足膜、面霜、精华、面膜，甚至连清洁和磨砂都要精心雕琢。那些日子里，我从花瓶拣来的小花瓣，到家里囤满的瓶瓶罐罐，都像是一种疗愈，让我学会欣赏皮肤的细腻与柔滑。随着时间流逝，我不再冲动地跟风买任何新产品，而是按需而行，在渐次摸索中找到真正适合自己的配方。</p>
<figure class="image image_resized" style="width:34.14%;"><img src="/skincare.jpg"></figure>
<p>曾经只买“男士香水”的我，突然跃入女香的世界：茉莉、玫瑰、琥珀香调，渐渐成为我心头的愉悦。那种花香缭绕，像是给我的气息披上了一层柔光，让我在夜晚出门时，都能轻微感到自信在胸腔中跃动。</p>
<p>衣橱里，我也渐渐摆脱了死板的男装：不再买那些尺寸过大的宽松衬衫，而是开始尝试中性风的搭配。连鞋码都从 44 号换成了 39 号，让脚步不再被多余的空间束缚。我在镜中看见的是一个更自在的自己，不必用沉重的布料去伪装。</p>
<p>我走进医美机构，先接受了几次激光除毛，再做了毛孔修复。尽管花费不菲，但看到镜中的皮肤逐渐恢复光洁，我真正体会到投资在自己身上的意义，它是一种对“我值得被好好对待”的肯定。</p>
<p>此外，我把锻炼纳入日常：先是几次随意的慢跑与游泳，然后慢慢加大强度，学着做臀推与力量训练，渐渐体会到身体的曲线被汗水雕塑出来的乐趣。当然，在最初几个月里，我像个三天打鱼两天晒网的孩子，有时半途而废，有时又自我苛责。毕竟，要把一连串细碎的步骤都连在日常里，每天补足加湿器的水量、每四小时都要涂抹身体乳、洗澡前提前准备贴满面膜与手膜、仔细清洁、打磨关节，再到外出前的全身防晒……这一套流程需要耐心与时间，而曾经的我总是急于求成，难以坚持。</p>
<p>我渐渐意识到，不该把所有事情都想在一夜之间完成。我要学会放慢节奏，给自己空间与宽容。在年底时，我终于适应了这些细碎的打理，让它们成为生活中的一部分。一个重要的契机是：我学会了延迟满足。每当想放弃时，我会想到完成任务后的满足感，让大脑分泌一点内啡肽，而不是一次次寻求快速的多巴胺刺激。正是这种从慢到快、从资源积累到奖励兑现的模式，才让我彻底从内耗中脱身。</p>
<figure class="image image_resized" style="width:21.31%;"><img src="/p1.jpg"></figure>
<figure class="image image_resized" style="width:20.47%;"><img src="/p2.jpg"></figure>
<p>时至今日，我依旧会偶尔松懈：有时跑步的节奏断断续续，护肤也会偷懒。但是，我已经知道，体重不必成为执念，美食也不必完全禁绝，只要健康始终放在首位，便能让心情自在。最重要的是，我学会了时不时奖励自己：一顿丰盛的甜点，一件新买的衣服，一次小小的旅行。那些看似微不足道的享受，都在提醒我：这具身体值得被宠爱，而“我”值得被温柔以待。</p>
<p>&nbsp;</p>
<p><strong>《雨天》</strong><br><i>“我不理解，你为什么如此渴望被爱。”</i><br>——《雨天》-积雨云1998</p>
<hr>
<p>两只扑火的飞蛾，最后一次互相救赎的尝试终究宣告失败，于是我们都义无反顾地扑向那炽烈的光，最终只剩满身伤痕，难以复原。</p>
<p><strong>初识</strong><br>2022 年的一个雨夜，我邂逅了他。那时，我刚结束与小我一岁的“弟弟”短暂相处后的情感纠葛，满城里无处可去，索性开着车四处游走。在一个加油站，我们相遇。他的车，正是我曾拥有的那辆旧时座驾。我有些惊讶，却也迅速将联系方式递给他。对方见我，似乎也一时未能分辨我是何种性别。眉间带着一种温和惊讶，他的嘴角泛起淡淡微笑，那一刻，我有种被温柔觅到的感觉。</p>
<figure class="image image_resized" style="width:39.98%;"><img src="/z4718.jpg"></figure>
<p>他留着眉钉、耳钉，面容带着些许亚洲特质，一如我心底对“模糊美”的那一丝执著。我们之间的对话并不多，只是偶尔隔几天随意聊聊路上见到的风景或食物。直到一个月后，雨终于停歇，他在深夜时分回复我的消息，邀请我一起去跑环湖。那晚，我们在环湖的跑道上并肩疾走，风声夹着雨后的清新。不到午夜，我们回到市区，一句“去吃顿海底捞吧”在虚空中响起，随后各自踏上回家的路。</p>
<p><strong>相互投影</strong><br>他来自北方，父母离异，跟随父亲生活；我则被母亲独自抚养，我们仿佛两个缺失家庭温暖的孩子。一句“我从没有完整的家”在他口中吐露，他的声音平静，却饱含疲惫与渴望。同是缺失爱，却从不同方向相拥前行。那夜，我在翻看他的朋友圈：满屏尽是汽车、餐厅、美景，以及工作琐事，可我被那份平静吸引——或许正是我苦苦寻觅已久的归属。</p>
<p>一周后，他分享了一张灯光柔和的餐厅照片。我知道，这一夜我们会有故事。我提前一天忌口，细致地从发根到脚尖清洗干净，挑选了一身精致的装扮，蕾丝之下，微剪的妆容恰到好处。夜幕降临，我坐上车，心中既忐忑又带着一丝期许。行驶在二环高架时，意外与一位旧友擦肩而过，朋友给了我一张侧脸的快照，那一刻，我觉得自己仿佛随时会崩溃，也随时会蜕变。</p>
<p>我们在昏黄灯光下相对而坐，推杯交盏，红酒微醺，空气中弥漫着一丝暧昧。他租住的酒店就在餐厅旁，夜还未至，我们便并肩走向那扇门。待门“啪嗒”一声关上，拥吻与温存便如一场急促的风暴席卷而来。热度与湿度交织，我记得那双手，温柔而坚定地抚摸我的头发；我记得身体紧贴在一起的瞬间，仿佛要在彼此的怀抱里寻找一丝被爱的感觉。</p>
<p><strong>夜深告白</strong><br>清理过后，我们并未立刻分离。凌晨一点，我们坐在翠湖边抽着冷风中的烟灰。他轻声告诉我，他是个“弃子”——</p>
<blockquote>
  <p>“妈妈曾经疯过，借酒赌博，把家里财产一掷而空。后来，我跟着爸爸，日夜听他说那些补偿与金钱，却始终填补不回那缺失的温暖。”</p>
</blockquote>
<p>我安静地听着，心中涌起共鸣。我回想起自己：</p>
<blockquote>
  <p>“我父亲从未给过我任何解释，母亲把我带回家后，只剩下我和她两个人相依。家中依旧富足，但父亲的背影却永远是我的缺口。”</p>
</blockquote>
<p>我们没有谁能彻底填补彼此的空虚，却在那一刻找到了短暂的相互取暖。雨已停，湖面倒映着微光，就像我们的关系，虽短暂，却烙下深刻印记。</p>
<p><strong>扑火飞蛾</strong><br>可扑火的飞蛾终究难逃灼伤。第一次雨季过去，新的风雨又悄然而至。两个人并肩经历过一轮温暖，可谁也无法替代对方心里最深的裂口。没有谁的爱能够填平另一段被遗忘的过往。我的手机里还留着他的截图，他与朋友的合照里隐约传递着孤独——当所有热烈退去，只剩沉静，他的世界又回到他独自面对的日子。</p>
<p>我不怨他，也不怨自己。那场“爱”，不过是一场注定燃尽的烟花。我们像两只飞蛾，在交汇后的瞬间曾温暖彼此，也终将归于各自的黑夜。</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p><strong>《雨天 Part.2》</strong><br><i>“我就是恋不得，为何总恋不舍；我就是见不得，你眼泪像雨水般的滴落。”</i><br>——积雨云1998</p>
<hr>
<p>我们的热恋期持续了一个多月，却在那短暂的四五十天里，几乎吞没了所有现实与忧虑。清晨醒来，我们相互依偎，睡意朦胧时一个轻吻便能驱散黑夜。白日里，我们牵着手漫步街头，漫无目的地逛到夕阳西下。我们在城市里每一家咖啡馆里停留，品味各自钟爱的甜点；在电影院里，用厚重的大衣将彼此包裹，碰触彼此的脚尖企图制造小小的惊喜；在窗外风雨交加时，我们在狭小的房间里缠绵，直到身心俱疲，彼此无言却又紧紧相拥，再在下一个清晨，用调皮的方式将对方从温暖的被窝里唤醒。</p>
<p>我们一起挑选礼物，将卧室打造成属于两个人的温馨小天地。他坐着，我替他剃去早晨未散的胡茬；我坐在他腿间，他为我修剪过长的发丝。那段时间，幸福仿佛伸手可及，我对他的依赖便像涌动的潮水，一波接着一波，愈发汹涌。</p>
<p>然而，没有任何热恋能在时间面前长驻。一年前，我尚在与一个女孩交往时已体会过那种华丽的过度与随后的冷落。但这一次，我以“女生”的身份融入他世界，想着只有这样才能赢得完整的爱。热恋过后，我反而觉得对他的依赖与深爱在平日里日益加深——我期盼着他同样无法自拔地眷恋我。可他没有。作为一个男生，他无法像我那般持续投入。当我试着用嘴唇轻抚他，他的呼吸平静得像一潭死水；当我邀请他出门散心，他只对着手机屏幕回以敷衍的点头。</p>
<p>为了重燃他的兴趣，我花尽心思：我尝试模仿更夸张的热情，让自己在他面前痛哭流涕；我让自己承受被他压制般的痛楚，用被踩踏、被掌掴——无不是一种卑微和取悦；我委身于他，像一条小狗一样在他离家时趴在门口等待；甚至甘愿让他以我为烟灰缸，在我舌尖点燃一支烟……我以各种方式把自己拆解，祈求换来他的目光。</p>
<p>我不怪他。曾几何时，我也用同样的方式对待那些曾经的爱人；而此刻，我被迫成为他曾伤害过的女孩。若要追本溯源，那我们都不过是彼此幼年缺爱的投影。他的母亲在混乱中离弃，他的寒冷被金钱暂时掩盖，却无法填补那深处的裂缝；而我，自幼被父亲遗忘，这是我对母亲母性依赖的投射。我为他做一切：为他准备温热的饭菜，深夜为他的汽车添些油，给他挑选合适的鞋袜……我制造每一个温馨的瞬间，却终究换不回他对我的执着与珍惜。</p>
<p>那段日子并不简单。我仍欠着百万债务，信用卡借贷的数字像枷锁一样束缚着我。每每想到要拖他一同承受，我便在心底告诫自己：“我不想连累你。”可无形的压力与“爱的债务”却如影随形。一场激烈的争吵终成导火索，他摔破杯盏，只留下一句：“我只想一个人静静，你太过烦人。”我听到那话时，胸口仿佛被数根针尖狠狠刺中，痛彻心扉。刹那间，我想起自己曾把同样的情绪呈现给母亲时，她躲闪的眼神便浮现眼前。那种被拒绝的刺痛，让我想逃离一切。</p>
<p>争吵后，我依旧像个机器：为他烹调他所喜的菜肴，深夜为他的车添油加水，为他挑选最合适的衣物，只为换来他短暂的欢愉。直到我在一个偶然的瞬间，看到他在兄弟面前说我“廉价、烦人”，那一刻，仿佛骤雨击打我最后的念想。我终于明白：不论我付出多少，对方的心中早已有他自己的世界，而我只是一位可有可无的陪衬。</p>
<p>我决定逃离。深夜里，我收拾行囊，开车驶向抚仙湖畔，暂时与所有牵绊告别。前几日，我只说“去看老师”，他冷漠地附和几句便再无问津。湖边的一周，我与自己对话：或许只要我愿意，仍可继续无条件奉献，只要他开心，我便愿意。但那种爱，已经偏离了爱的本质。</p>
<p>一周后，他发来消息：“宝贝，你怎么还没回来？我想你了。”我心中忽然泛起一丝错意：或许，他失去了我，才真正意识到我的存在价值？我忍不住开了车回家，回屋后他只是轻轻靠我，却未曾再给我一个真正的拥抱。直到一切再度如常般分离，我才明白：他只是想满足自己的需要而已。</p>
<p>那一夜的拥抱没有温度，甚至没有一句问候的迟疑，我感受到的只有冷漠。我洗去那夜余留的体香，便下定决心提出分手。他满不在乎地问我：“你是不是有了别人？”我没有争论，只是静静开口：“我们，就此别过吧。”他点头同意，果断离去。</p>
<p>分开后，我没有删除他的联系方式，反而在接下来的日子里，他无数次地试图挽回。他的每一次索求，都如同梦魇般淹没我。我只回以简单的敷衍，渐渐，他的执念愈发明显，可我心中的裂缝早已扩大。</p>
<p>他的每一次接近，都让我更加想逃离；每一次逃离，都让我更加陷入绝望。我明白，那已经不再是爱情，而是一种病态的依赖。我们再也无法回到从前，我也不再需要这样的爱。这场风雨过后，我决定落在自己的岸上，让飞蛾扑向那不可触及的火光。</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p><strong>《雨天 Part.3 最后的雨》</strong><br><i>“</i>每每当我回忆起，我会活在回忆里，回忆你，找不到方向可以眺望北极星；找不到你的我，看不见你的我，这空谷里面没有你的背影<i>。”</i></p>
<hr>
<p>一旦火焰熄灭，感情便难再熊熊燃烧。我们终究没能坚持多久。</p>
<p><strong>余温余怨</strong><br>分手后，他时常送来各种衣物与食物；一箱箱的零食，一瓶瓶不同香调的香水，像是想用物质弥补某种空缺。他说，没有我，他几日三餐都难以下咽，仿佛要用自我惩罚来洗刷他曾犯下的错。他会拿出截屏，展示我与他相拥的旧照，甚至将我们的合影挂在社交平台上；他偶尔发来生活日常的照片与碎碎念，好像在模仿昔日我对他的关心。然而，那一切皆已为时已晚——当我试图在他困境时伸手援助，他回报的却只是敷衍，甚至带着一丝莫名的多余。</p>
<p>我无法分辨自己究竟在天堂还是坠崖：那种失落与解脱交织的心境，让我一次次试图远走他乡，换个城市重启生活。然而，无处可逃，我的日子在颓废与酗酒中渐渐腐蚀。偶尔深秋的雨会无声飘落，将清晨的闹钟替代成雨声；我躺在床上，听着雨点敲打窗台，也想让这漫长的雨停下，却发现若是晴天来临，刺眼的阳光又会把整个世界渲染成冷色调，使我更加怀念这片阴郁。</p>
<p><strong>暮秋绝望</strong><br>房间里一片狼藉：桌面上，笔记本电量耗尽，还没来得及充电；玄关处，那贴着行李托运标签的大行李箱静静矗立；洗衣筐里堆满未折叠的衣物；阳台上，刚刚洗净却因雨水再次湿透的衣服在风中颤抖。厨房里，平底锅里油花四溅，我的思绪却已经飞远。<br>我从抽屉里拿出一个鸡蛋，磕入滚烫的油锅，那简单的烹饪动作反差令人心酸。油花迸溅到手臂上，痛感瞬间传来，我颤抖着从冰箱取冰块，按在刚起的水泡上，再拽出创可贴贴好。跌跌撞撞回到锅前，发现鸡蛋早已焦糊。这些寻常琐事仿佛都成了折磨我灵魂的审判，我瘫坐在厨房地板，泪水悄然滑落。那一刻，我仿佛变回了年幼时那个被困在无助中的孩子，一切都那么抽离、那么不真实，那么压抑。</p>
<p><strong>回归母亲</strong><br>心中的寂寞与孤独如同暴雨，我突然想起母亲。驱车越过半城夜色，我从城北奔向城南。家门开启，熟悉的灯光与饭香扑面而来：番茄鸡蛋、糖醋鱼、蒸南瓜——那是我最熟悉的味道。妈妈的笑容依旧温柔，她用那双熟练的手把饭菜摆满餐桌。一口咬下，味道竟和我自己做的完全不同——多了份心灵的温度。</p>
<p>曾几何时，我开始寻求独立，有了自己的想法，也习惯了一个人的世界。但不论成长到何种模样，我永远是她怀里那个被捧在手心的孩子。此刻，我才明白：即便我曾在他面前感到委屈，我在母亲面前，也从未丢掉孩提时的依赖。</p>
<p>我想起他在我面前摔杯的那一瞬，想起自己当年也曾以同样的方式让母亲担惊受怕。我的心中涌起无声的悔痛，我放下筷子，窜向沙发，扑入她温暖的怀抱。呼啸的风雨与心底的痛楚在那一刻尽数消融。母亲并不需要我解释，她的声音依旧温柔：“不知道你经历了什么，但没关系，一切都会过去。”</p>
<p>我在她怀里痛哭，像个十岁孩童。她紧紧抱住我，说：“你怎么这么不会心疼自己？你应该学会爱自己。”那一刻我大彻大悟，明白自己将自己放得太低，竟将所有温柔与爱都施舍给不值得的人。</p>
<p><strong>重生</strong><br>我想起母亲已经年近六十，独自一人撑起家中重担；我亏欠她太多太多，却无法用言语表达。回想起她为我染白的双鬓，渐失的利索步伐，让我心中充满愧疚。她用最简单的行动告诉我：无论性别、身份、或过往如何变化，只要我快乐，她就快乐。</p>
<p>我哭得嘶哑，却涌出前所未有的力量：无论风雨多猛烈，母亲始终是那个用身体遮挡一切的港湾。她告诉我：人生并非必须迎合他人，只要活成自己想成为的样子，那便是最好的归宿。</p>
<p><strong>回报</strong><br>于是，我用那笔卖掉自己原本名下的 718 旧车换来一辆保时捷 Panamera，送给了母亲。再也没有过对妈妈的争吵，我将余生的时间都交给她：带她游遍城市的各个角落，像儿时坐在摇篮上的我们，一起在秋千上轻轻摇摆。</p>
<p>我不再渴求那份被伤害的爱，也不再强求有人剖开心扉。那个男孩子后来也从困境中走出，我们渐行渐远，再无牵绊。</p>
<p>最大的改变，是我学会了爱自己：在感情里，亦要珍惜自己；照顾身旁最该被珍惜的人，也要将晚安送给自己。那些曾令我心碎的回忆，终将归为尘土；而我，将在雨停之后，迎来属于自己的晴天。</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p><span class="text-big">上述文字皆为我在 2023 年留下的心声。自那之后，2024 年在我身上发生了太多变故，生活的基调骤然拐弯，迷茫如同深夜的迷雾，无论如何也找不到痛苦的源头，前路仿佛陷入无边的黑暗。不知所措的我，直到这篇文字成形之时，已连续 23 天服用比卡鲁胺与爱斯妥，也许在药物与重新审视生活的过程中，我找到了值得为之坚持的方向，才有勇气再次坐下来，把这些文字写下。</span></p>
<hr>
<p><strong>财务崩塌</strong><br>过去几个月，我已不成形。最先动摇我，是2020年那笔首付 85 万、贷款 207 万、房价骤降至 160 万的住房。面对无意义的还款压力，我索性选择放任——任由银行随时起诉或冻结账户，终将房产推向法拍的洪流。那些被强取豪夺的日子里，我先期把名下一切车产、房产转移开户，生怕被一夜之间债台高筑。当法拍结束，我或许还要背负 50–60 万的债务，卖光我所有，换来一句“从零开始”。</p>
<p>一切看似简单的投资失败，无非是风口一转，跌向深渊；可在我心底，这击倒我的力量，比起 2022 年家中那千万生意债更凌厉——那笔债是缓缓攀升，而此刻，似乎整个世界都在以迅疾的速度朝我砸来。我没有选择愤怒或哀怨，只是选择自我麻痹，貌似“躺平”，再也不想以任何姿态去正视这件事。然而，这种麻痹不过是导火索，让我沉沦到更为失控的境地。</p>
<hr>
<p><strong>药物与自残</strong><br>也许正是那股麻痹，让 5 月的双相复发如疾风暴雨般降临。每天，我的生活都浸润在各种精神药物中：安眠药从艾司唑仑换到阿普唑仑、劳拉西泮、唑吡坦、氯硝西泮；抗抑郁药从文拉法辛换到舍曲林、度洛西汀、帕罗西汀、艾司西酞普兰；抗精神分裂药从喹硫平猛增到碳酸锂、鲁拉西酮、利培酮。</p>
<p>所有药物都带来一个共同副作用：体重飙升。喹硫平更是凶猛，一个月就能让我增重四五斤；如今回望，那时我已朝着 90 公斤奔去。体重每一次攀升，都成为新的焦虑源，让我更加绝望。曾尝试停药，换回的是彻夜难眠：即便熬通宵，也睡不着，焦躁地在床上翻来覆去。直到夜晚逼不得已再吃下几粒喹硫平，半小时后方能陷入昏沉的睡眠。</p>
<p>越陷越深的病症，让我在每日工作中被拖延吞噬——面对那些枯燥的数据，我毫无心力；缺乏社交的孤独，又让我莫名染上了自残的冲动。不是因为想要死，只是那刀刃划过皮肤时的灼痛，能让我暂时逃离无尽的心绪：每一次用刀子触及皮肉，仿佛都在替我赎罪，让我相信自己值得受到惩罚。医生说，只要在绝对安全的情况下，如果这能让我缓解痛苦，就先这样吧；但他也叮嘱我，要尽量寻找其他方式来替代。可我知道，让自己受伤的冲动，源自更深的焦虑。</p>
<hr>
<p><strong>焦虑的雪球</strong><br>一年前年底，我便发现自己无端焦虑，甚至抑制不住：那时我并不缺钱，也没有明显的烦恼，却每天提心吊胆。时至今日，我仍无法说清，究竟为何会对生活如此担忧。</p>
<p>自那时起，我时不时地靠药物寻求一丝安宁，仿佛只要脑海里有药的存在，就能暂时逃离心中“有东西在吞噬我”的恐惧。然而，药物从未是真正的良方，它们只会把焦虑搅动得更猛烈：当我缓解片刻，又会被接踵而来的症状折磨得更惨，焦虑像滚雪球一般越滚越大，最终让我陷入更深的深渊。</p>
<p>今年，一些人通过 Telegram 私信我，向我询问生活中的种种细节；更多人，却只是问一个问题：“璐姐，我好想做一个女孩子，怎么办？”对他们，我总能给出标准答案：活自己想活的样子，不要给自己贴标签，你就是你。可当我听回我自己那句话，却不禁陷入沉思：我真的像我说的那般做到了吗？</p>
<hr>
<p><strong>HRT 的思考</strong><br>我这次的 HRT（激素替代疗法），目标并非为了 SRS（性别重置手术）。我并不指望借此拥有他人难以企及的身材；我的意图，更像是寻找一扇通往自我认同的窗口。或许我一生都无法拥有专家口中的“标准罩杯”，但这并不妨碍我尝试。我不想为任何人而活，也不想让身体的外在特征限制我的喜好：我不讨厌自己的男性身份，也并不坚决要成为“一个标准的女人”。我只迷恋那种美学上的细节：光滑细腻的皮肤、柔和流畅的线条、浓密修长的睫毛、闪烁如星辰的光亮、令人迷醉的红丝绒……那是既不局限于男性，也不局限于女性的审美。</p>
<p>我接受 HRT 所带来的一切后果——可逆或不可逆，疼痛或舒适。23 岁的我，已经做好了孤单一人生的准备。爱情可以被亲情与友情替代，性伴侣仅是短暂的存在。与其继续活在与自己格格不入的人生里，我更愿意挺身而出，站在聚光灯下，用自己选择的方式，去拥有理想中的皮肤、发丝与线条。至于那些在暗处指指点点的人，“FUCK THEM ALL”——放手去喜欢你想喜欢的，哪怕全世界都不懂。</p>
<p>如今，我再次审视自己，发觉自己已深陷多年无法摆脱的漩涡：重重焦虑、不断增胖的身体、私服行业的波动、断供房贷的恐惧、药物依赖的牢笼……这些焦虑像无数次冲击浪潮，将我任其摆弄。而我，竟一次次试图把一切放在同一个担忧框中，结果令自己彻底崩溃。</p>
<hr>
<p><strong>剥离焦虑的线索</strong><br>我悟出一个道理：不要让焦虑同时指向多件事。若心里充斥着五条线索，最终你会发现自己陷入无尽的泥沼，根本无法前行。</p>
<p><strong>焦虑点 1：长胖</strong><br>体重的增加源于精神药物的副作用，也来自情绪紊乱时的暴饮暴食。解决方法其实适用所有人：长期坚持锻炼+饮食管控、自家烹饪。只要认真对待饮食与运动，这个问题并非无解。</p>
<p><strong>焦虑点 2：私服事业</strong><br>潮流无法一蹴而就，需要日复一日的积累与沉淀。想让玩家追随，你只能耐心经营，文火慢炖，给时间一点时间。</p>
<p><strong>焦虑点 3：债务压力</strong><br>如今波动只是暂时的：法院通常会先处理 2023 年夏季开始断供的案件，而对于 2024 年断供的我们，起诉尚需时日。只要时间拉长，压力也就缓释。</p>
<p><strong>焦虑点 4：药物成瘾</strong><br>住在福建的那段日子里，我身边没有能与我并肩作战的朋友，社交枯涸让我更依赖药物。只要我能回到云南，与家人相处、与挚友相聚，再投入新的小生意，自然能慢慢摆脱药物成瘾。</p>
<hr>
<p><strong>优先级排序与行动计划</strong><br>看清这几件事的难点后，我发现当下唯一能真正让我重振的是：完成客户订单，拿到一大笔款项。其他一切，皆可打后。</p>
<p><strong>私服运营</strong>：由我亲自盯梢固然高效，却消耗我大量时间。若找几位信任的管理员分担监控，我就能腾出更多时间去处理订单。</p>
<p><strong>订单优先</strong>：只要我把手头较高单价的订单完成，眼前便能囊括足够的资金。</p>
<p><strong>回归云南</strong>：若能迅速拿到款项，我便可回到云南老家——煮饭、制定饮食计划、出门锻炼，再也不用每天吃淘宝预制菜。</p>
<p><strong>重拾人际</strong>：回到云南，我便能与最好的朋友相聚，疯狂地玩乐，将精力从药物依赖中转移。</p>
<p>一旦我回到云南，家人自然能给予我更多温暖；同时，朋友们真实的陪伴，也能化解我对药物的执念。至于体重，一切都可以暂时搁置两三个月，等资金到手后再集中精力应对；自残冲动亦可暂时放任，因为——只要我坚定地完成订单，焦虑便只剩一件：那就是完成订单本身。</p>
<p>当焦虑仅剩一件时，才有可能集中精力去解决。现在，我计划明日一早起床，就开始切入订单。药照旧吃，饭照旧吃；想自残时，就划两刀解压，想吃肥肉时就大快朵颐。</p>
<hr>
<p><strong>HRT 带来的平静</strong><br>HRT 的一大好处是，我可以在这段时间里保持相对平静：性欲低落，不再急躁。那种渴望暂时搁浅，让我能更从容地面对眼前的一切。</p>
<hr>
<p><strong>写给同样焦虑的姐妹们</strong><br>至今仍在为身体缺陷焦虑的姐妹们，你们也有权利反击这操蛋的生活。只看你是否愿意捡起地上的利剑。</p>
<p><strong>若你想 HRT</strong></p>
<p>先去医院做相关检查，开好证明；</p>
<p>仔细权衡所有可能出现的问题：并非所有人都适合 HRT；</p>
<p><strong>若你暂不服用激素</strong></p>
<p>不要过于纠结所谓的男性化、女性化；</p>
<p>先把可控范围内的事情做好：减肥、增肌、保养皮肤、定期脱毛、培养更好的审美；</p>
<p>当你完成这一切，若仍不满意，再考虑 HRT。</p>
<p>焦虑如同被缠绕成团的线团，一旦结打得再紧，便永远走不完任何一根线。学会先解开结，再逐根完成。</p>
<hr>
<p><strong>致 2024 年沉浮后的自己</strong><br>读完这篇文字，也像在与曾经的自己对话：2024 年，你不该这样过。不要再让自己坠入与人生不匹配的深渊；即便跌入谷底，也要挣扎着寻找出路。</p>
<p>你该光鲜亮丽地活着，穿上那些美丽的衣裙，化上精致的妆容，爱粉色，爱裙摆，爱每一个能让你心动的瞬间。你本该如此自由，找到你自己为何而生。</p>
<p>&nbsp;</p>
<p><strong>一、漂泊与尝试</strong><br>2024年初，我曾计划与一位洛阳的兄弟一起创业。二月，我学会了打碟，三月便肩负着音乐梦想奔赴他的城市，原本打算共同开启一段新旅程。谁料对方因有望加入职业电竞队，全心投入游戏，无暇兼顾我的计划。于是，我转而在一家酒吧打工，靠着灯红酒绿里略显倦怠的节奏为生。</p>
<p>到了四月底，我离开洛阳，前往福建另一位兄弟位于乡间的自建别墅。那段时间，我埋头研究音乐，也继续用 Unity 做地图赚取零花。可生活并不如我期盼的安稳——双相的阴霾再度来袭。</p>
<hr>
<p><strong>二、自残与崩溃</strong><br>九月，我回到昆明。那时，我已陷入彻底的疯狂：手臂上布满三百多道浅浅的刀痕，鲜血干涸后只剩零星疤痕。精神崩塌的程度前所未有。我清晰记得那时的每一个夜晚都被恶魔般的想法吞噬，自残成了我唯一的“解药”。</p>
<p>入院后，我被云南省精神病院接纳，正式确诊为双相情感障碍。医生为我申请了特病卡，从此我购买精神类药物只需承担 1% 的自付部分，医保报销高达 90%，连抽血、心电图都可报销约 80%。</p>
<hr>
<p><strong>三、记忆与疗愈</strong><br>在住院期间，我接受了两次经络电休克疗法（MECT）。实话实说，那次经历让我的部分记忆模糊——一些痛苦的片段被麻木抹去，可真正想要忘记的人与场景，却依然像胶片般反复映现。或许，这种“选择性遗忘”并不能解决本质问题。</p>
<p>如今，我在医生的指导下进行长期稳定用药，情绪得以空前平稳。自那以后，我再无自残的冲动，也不再被毁灭性的念头困扰，仿佛蒙上阴霾的心，开始有了看见光线的机会。</p>
<hr>
<p><strong>四、药物与身体</strong><br>尽管情绪稳定，药物的副作用却对我产生毁灭性影响。我必须长期服用喹硫平，才能维持情感与思维的平衡。随之而来的是，喹硫平改变了我的内分泌，并让人长时间困倦、饥饿难耐。短短几个月里，“璐哥”从 75 公斤一路飙升到 100 公斤。脂肪堆积让我再也无法享受女装，也无法细致化妆。恍若一夕之间，我从一个自信的佳人，变成胡子懒得修理、轮廓尽显中年男子感的陌生人。</p>
<p>出院不久，我便为自己办理了 HRT（激素替代疗法）的“大证”，既然要与身体和解，就要不留遗憾。</p>
<hr>
<p><strong>五、音乐与重生</strong><br>进入年末，我重拾创作：在夜色中制作音乐，时不时收到俱乐部的邀请——去那昏暗的舞池打碟，赚点小钱，也赚点名声。渐渐地，我在喧嚣与节拍中重新找到自己的节奏。</p>
<p>回望这一年，大多是负面情绪与痛苦的交织。但经历过崩塌之后，我只能坦然面对：若我能挺过这一年，明年便要为自己制定新的计划。打算攒一些钱、认真减减体重；停止服用喹硫平虽然意味着要应对失眠，但我早已不愿再受这“破药”的长久折磨，只愿恢复到更轻盈的状态，期待传统安眠药能带来好眠。</p>
<hr>
<p><strong>六、放下与前行</strong><br>此刻，我说话再也没有当初那么多华丽辞藻，因为实在说不动了。感情方面，我已然置身“圣人状态”，对任何浪漫都毫无兴趣。或许短暂的孤独，是我疗愈的一部分。</p>
<p>岁末之时，我只愿对所有仍在挣扎的自己与他人说：新的一年，请保重。愿我们都能在混乱中找到新的重心，心想事成。</p>
