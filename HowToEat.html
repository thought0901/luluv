<p><strong>明确每日碳水、蛋白、脂肪的总量后，将碳水分配到三餐与加餐，避免血糖骤升；</strong></p>
<p><strong>学会用薄荷APP查询每种食物的碳蛋脂含量与热量；</strong></p>
<p><strong>别因为学校或办公室没秤就胡吃熬煎，先用假期买个克数秤，训练目测食物重量；</strong></p>
<p><strong>外卖并非减肥死敌，只要避开油炸烧烤，多点常规炒菜，不吃油浸菜，沙县小吃这类“饭是饭，肉是肉”的反而靠谱；</strong></p>
<p><strong>鸡腿必须去皮，肥肉、肉皮、油浸菜这类“摄入额外脂肪”要坚决剔除；</strong></p>
<p><strong>碳水按 3:4:1:2 比例分配给早餐、午餐、加餐、晚餐，蛋白质可按 2:4:2:2 或 2:3:1:3 分配，晚餐离睡眠近，碳水要最少；</strong></p>
<p><strong>脂肪若是外卖，由其油量大可不用另算；若在家做减脂餐，你需要一些脂肪，完全不吃反而错误；</strong></p>
<p><strong>知道自己每天到底吃了多少克，才能在减肥路上不迷路。</strong></p>
<hr>
<h2 id="h-1-先确立每日碳蛋脂目标的配比公式" class="toc-header"><a class="toc-anchor" href="#h-1-先确立每日碳蛋脂目标的配比公式">¶</a> 1. 先确立每日碳蛋脂目标的配比公式</h2>
<h3 id="h-11-目标量基准假设此人的碳水需求是2g蛋白质需求是16g脂肪为默认04g" class="toc-header"><a class="toc-anchor" href="#h-11-目标量基准假设此人的碳水需求是2g蛋白质需求是16g脂肪为默认04g">¶</a> 1.1 目标量基准（假设此人的碳水需求是2g，蛋白质需求是1.6g，脂肪为默认0.4g）</h3>
<p>碳水：2.0g × 体重 (kg)</p>
<p>蛋白：1.6g × 体重 (kg)</p>
<p>脂肪：0.4g × 体重 (kg)</p>
<p>那么碳水≈120g、蛋白≈96g、脂肪≈24g；总热量≈(120×4 + 96×4 + 24×9) = 1680 kcal。具体依据可参考第二章热量计算方法。</p>
<h3 id="h-12-碳水按-3412-分配到餐次" class="toc-header"><a class="toc-anchor" href="#h-12-碳水按-3412-分配到餐次">¶</a> 1.2 碳水按 3:4:1:2 分配到餐次</h3>
<p><strong>早餐 3 份</strong>（占全天碳水的 3/10）</p>
<p><strong>午餐 4 份</strong>（占全天碳水的 4/10）</p>
<p><strong>加餐 1 份</strong>（占全天碳水的 1/10）</p>
<p><strong>晚餐 2 份</strong>（占全天碳水的 2/10）</p>
<p>为何要这么分？</p>
<p>早餐需要足够的碳水来唤醒血糖，维持上午活力。</p>
<p>午餐是体力最充沛的时段，碳水需求量最大；</p>
<p>加餐给下午补充能量，防止血糖骤降带来暴饮；</p>
<p>晚餐离睡眠近，碳水留得越少，越不易在夜间转化为脂肪。</p>
<h3 id="h-13-蛋白质可按-2422-或-2313-分配" class="toc-header"><a class="toc-anchor" href="#h-13-蛋白质可按-2422-或-2313-分配">¶</a> 1.3 蛋白质可按 2:4:2:2 或 2:3:1:3 分配</h3>
<p>方法一：早餐 2 、午餐 4 、加餐 2 、晚餐 2&nbsp;</p>
<p>方法二：早餐 2 、午餐 3 、加餐 1 、晚餐 3&nbsp;</p>
<p>蛋白质分配更灵活，但原则是全天保持充足、均匀，才能防止肌肉流失并延长饱腹感。</p>
<h3 id="h-14-脂肪无需按餐细分" class="toc-header"><a class="toc-anchor" href="#h-14-脂肪无需按餐细分">¶</a> 1.4 脂肪无需按餐细分</h3>
<p><strong>若吃外卖</strong>，外卖菜肴本身油量较高，一天的脂肪需求基本够用，不必额外加黄油、坚果；</p>
<p><strong>若在家做饭</strong>，每天摄入 0.4g/kg 脂肪足矣，可选橄榄油、牛油果或鱼油等优质脂肪，绝不能全断油，否则会引起激素失衡与皮肤干燥。</p>
<hr>
<h2 id="h-2-如何用薄荷app查询食物营养" class="toc-header"><a class="toc-anchor" href="#h-2-如何用薄荷app查询食物营养">¶</a> 2. 如何用薄荷APP查询食物营养</h2>
<p><strong>下载并注册薄荷营养成分数据库</strong><br>安装后打开“食物搜索”，输入“米饭”、“鸡蛋”、“鸡腿”、“西兰花”等关键词。</p>
<p><strong>选择最贴近的条目</strong><br>比如想查“中等硬度米饭 100g”的碳蛋脂含量，先选择“主食→米饭→白米饭（硬）”，看营养数据：</p>
<p>碳水约 27g、蛋白约 2.8g、脂肪约 0.3g；热量约 130 kcal。</p>
<p><strong>记录常见食物的“每 100g 碳蛋脂”</strong><br><strong>可以自己写个记事本，记下你常吃的食物碳蛋脂比例。</strong></p>
<p><strong>鸡腿（去皮）100g</strong>: 碳水 0g、蛋白 24g、脂肪 4g</p>
<p><strong>瘦牛里脊 100g</strong>: 碳水 0g、蛋白 20g、脂肪 3g</p>
<p><strong>鸡蛋（一个 50g）</strong>: 碳水 0.3g、蛋白 6g、脂肪 5g</p>
<p><strong>西兰花 100g</strong>: 碳水 7g、蛋白 2.8g、脂肪 0.4g</p>
<p><strong>通过薄荷APP估算一餐的摄入量</strong><br>比如你准备吃一碗米饭（大约 150g），打开“米饭”条目，勾选 150g，即可看到碳水约 40g、蛋白约 4.2g、脂肪约 0.5g、热量约 195 kcal。</p>
<p>通过一两周不断记录，你就能在心里大致估算：一碗米饭大概是 40g 碳水、200 kcal；一块去皮鸡腿大概 120g 肉、28g 蛋白、9g 脂肪；一份沙县扁肉干拌面大概 80g 碳水、20g 蛋白、10g 脂肪。</p>
<hr>
<h2 id="h-3-必须学会目视估量克数称是你的减肥必修课" class="toc-header"><a class="toc-anchor" href="#h-3-必须学会目视估量克数称是你的减肥必修课">¶</a> 3. 必须学会目视估量，克数称是你的减肥必修课</h2>
<p>许多人抱怨：在学校食堂、公司食堂，没法随时用厨房秤精确称重。这时，你应该：</p>
<p><strong>利用假期时间，买一个 克数秤，开始训练目测。</strong></p>
<p><strong>随机称常见菜品、碗碟</strong>：例如先把饭盒里装满米饭，用秤量出 200g，常见 200g 米饭可以在碗中看到的“大概量”；</p>
<p><strong>记住桌上那碗米饭的高度与碗口距离、那份炒菜堆起来的厚度、那块肉排大约是多大</strong>。</p>
<p>一旦训练几天，今后在食堂点餐时，就能大概判断：这个盒饭里大约有 250g 米饭，这盘菜大概 150g 肉、50g 蔬菜。<br><strong>不要再盲目猜“我随便吃点儿，总差不到几个克”，那差的几个克，加起来就是你减肥进度的全部。</strong></p>
<hr>
<h2 id="h-4-外卖也能减肥不过你需要避开油炸烧烤锁定常规炒菜" class="toc-header"><a class="toc-anchor" href="#h-4-外卖也能减肥不过你需要避开油炸烧烤锁定常规炒菜">¶</a> 4. 外卖也能减肥，不过你需要避开油炸烧烤，锁定常规炒菜</h2>
<p>外卖综合平台琳琅满目，你只要记住两个原则：</p>
<p><strong>原则一：绝对不碰油炸、烧烤</strong>。</p>
<p>油炸鸡、烤串、煎饼果子、炸酱面都要果断划掉。</p>
<p>因为这类食物的“隐藏脂肪”极高，一份外卖足以抵消你一天的脂肪和热量配额。</p>
<p><strong>原则二：选那种“饭是饭、菜是菜、肉能选的”店</strong>。</p>
<p>沙县小吃、兰州拉面这类，主食和配菜分明。</p>
<p>你能精准点出“鸭腿饭+青菜少油炒+米饭”，去掉鸭腿皮后就可以把碳蛋脂大致对齐。</p>
<p><strong>示例</strong>：</p>
<p><strong>沙县扁肉干拌面</strong>：</p>
<p>面条 150g → 碳水 45g、蛋白 10g、脂肪 8g；</p>
<p>扁肉 80g → 碳水 0g、蛋白 12g、脂肪 6g；</p>
<p>半份青菜 → 碳水 5g、蛋白 1.5g、脂肪 0.2g。</p>
<p>总计：碳水 50g、蛋白 23.5g、脂肪 14.2g；热量≈ (50×4 + 23.5×4 + 14.2×9)= 50×4 + 94 + 127.8 ≈ 415.8 kcal。</p>
<p><strong>油焖春笋+蒜蓉空心菜+去皮鸡腿饭</strong>：</p>
<p>春笋 100g → 碳水 5g、蛋白 1g、脂肪 0.2g；</p>
<p>空心菜 100g → 碳水 3g、蛋白 2g、脂肪 0.4g；</p>
<p>去皮鸡腿 120g → 碳水 0g、蛋白 28g、脂肪 4g；</p>
<p>半碗米饭 100g → 碳水 27g、蛋白 2.8g、脂肪 0.3g。</p>
<p>总计：碳水 35g、蛋白 33.8g、脂肪 4.9g；热量≈ (35×4 + 33.8×4 + 4.9×9) = 140 + 135.2 + 44.1 ≈ 319.3 kcal。</p>
<p>有了这两套示例，你只要记住“主食+青菜+去皮肉”的黄金组合，外卖也能吃得明明白白，不用担心油量让你崩盘。</p>
<hr>
<h2 id="h-5-肉脂肪大头在皮里" class="toc-header"><a class="toc-anchor" href="#h-5-肉脂肪大头在皮里">¶</a> 5. 肉脂肪大头在皮里</h2>
<p>肉类是最常见的蛋白来源，但大部分人吃肉时不去皮，结果一碗下去脂肪就占一半。</p>
<p><strong>鸡腿、鸡翅、鸡胸，要先去皮</strong>。</p>
<p><strong>鱼皮、猪皮、鸭皮都要撕掉</strong>。</p>
<p>只有肉的纤维和少量脂肪留在里头，才能保证高蛋白、低脂肪。</p>
<blockquote>
  <p>专业解析：</p>
  <p>鸡腿（去皮）100g，脂肪约 4g；</p>
  <p>鸡腿（带皮）100g，脂肪可达 8~10g。<br>去皮后，蛋白质量不变，但脂肪砍掉了近一半。为了目标身材，请忍住“皮脆肉嫩”的诱惑，等你瘦下来，全身线条出来，那颗皮就只会让你倒退。</p>
</blockquote>
<hr>
<h2 id="h-6-知道你吃了多少精确到克才不是幻想" class="toc-header"><a class="toc-anchor" href="#h-6-知道你吃了多少精确到克才不是幻想">¶</a> 6. 知道你吃了多少，精确到克才不是幻想</h2>
<h3 id="h-61-用克数秤做一周饮食记录预设" class="toc-header"><a class="toc-anchor" href="#h-61-用克数秤做一周饮食记录预设">¶</a> 6.1 用克数秤，做一周“饮食记录”预设</h3>
<p>用小秤称每次吃的主食（米饭、面条、馒头）重量、菜量（炒菜、炖菜）重量、肉量（鸡腿、牛排）重量；</p>
<p>把每餐在薄荷APP里一一登记：XXX 食物，XXX 克。记住最常吃的几种饭菜，将数据搬进你的脑子里；</p>
<p>一周后，你会发现：一碗看着不大的米饭大概在 130~180g 之间；一碟青菜大约 80g；一块去皮鸡腿重约 120g。这些经验值，让你以后点餐时“心里有本账”，不用刻意称重也能大约判断。</p>
<h3 id="h-62-目测训练终于能在食堂里准" class="toc-header"><a class="toc-anchor" href="#h-62-目测训练终于能在食堂里准">¶</a> 6.2 目测训练，终于能在食堂里“准”</h3>
<p>对着同学桌上的焖面，想想自己曾经称过 150g —— 下次就把那份面条大致装到 150g 的“距离”；</p>
<p>餐托里那盘红烧肉看着 5 块，想想之前（150g）的肉块堆起来大概就是那样。<br>等你习惯了，不必每顿都称，随心所欲地走进食堂，也能给自己留出“碳水 40g、蛋白 25g、脂肪 5g” 的误差范围。</p>
<hr>
<h2 id="h-7-把公式套进三餐与加餐让饮食不再瞎吃" class="toc-header"><a class="toc-anchor" href="#h-7-把公式套进三餐与加餐让饮食不再瞎吃">¶</a> 7. 把公式套进三餐与加餐：让饮食不再“瞎吃”</h2>
<p>以体重刚刚的数值为例，总量为 碳水120g｜蛋白96g｜脂肪24g。</p>
<p><strong>早餐（碳水 3 份=36g｜蛋白 2 份=19.2g｜脂肪 24g×0.4=9.6g）</strong></p>
<p>例：一碗 130g 软米饭（碳水≈32g、蛋白≈3.6g、脂肪≈0.4g）</p>
<p>加一只水煮鸡蛋（蛋白≈6g、脂肪≈5g）</p>
<p>加 40g 瘦牛肉（蛋白≈8g、脂肪≈1g）</p>
<p>再略微加点橄榄油拌青菜（脂肪≈2g、碳水≈2g、蛋白≈1g）</p>
<p>合计≈ 碳水36g、蛋白18.6g、脂肪8.4g</p>
<p><strong>午餐（碳水 4 份=48g｜蛋白 4 份=38.4g｜脂肪 9.6g）</strong></p>
<p>例：一碗 180g 硬米饭（碳水≈54g、蛋白≈5g、脂肪≈0.6g）</p>
<p>100g 去皮鸡腿（蛋白≈24g、脂肪≈4g）</p>
<p>100g 清炒西兰花（碳水≈7g、蛋白≈3g、脂肪≈0.4g）</p>
<p>30g 荞麦面（加餐或午后食用，略微调配）</p>
<p>合计≈ 碳水≈48g、蛋白≈32g、脂肪≈5g</p>
<p><strong>加餐（碳水 1 份=12g｜蛋白 2 份=19.2g｜脂肪 9.6g）</strong></p>
<p>例：一杯低脂酸奶（300ml，蛋白≈10g、碳水≈15g、脂肪≈5g）</p>
<p>半根香蕉（碳水≈12g、蛋白≈1g、脂肪≈0.2g）</p>
<p>合计≈ 碳水≈27g、蛋白≈11g、脂肪≈5.2g（略高出，加以微调或缩减香蕉重量）</p>
<p><strong>晚餐（碳水 2 份=24g｜蛋白 2 份=19.2g｜脂肪 9.6g）</strong></p>
<p>例：一碗 90g 软米饭（碳水≈23g、蛋白≈2.5g、脂肪≈0.3g）</p>
<p>100g 瘦里脊炒青椒（蛋白≈20g、脂肪≈2g、碳水≈4g）</p>
<p>半碗紫菜汤（碳水≈3g、蛋白≈2g、脂肪≈0.1g）</p>
<p>合计≈ 碳水≈30g、蛋白≈24.5g、脂肪≈2.4g（可用少量坚果或橄榄油补足脂肪）</p>
<p>这样一天下来＝ 碳水≈144g、蛋白≈85g、脂肪≈25g，总热量≈ (144×4 + 85×4 + 25×9)= 576 + 340 + 225= 1141 kcal。<br>实际目标仍需与基础代谢、活动量、TDEE 配合微调，但这个框架足以让你不再怀疑自己是否在超量胡吃海塞。</p>
<hr>
<h2 id="h-8-为什么这样吃更好一点" class="toc-header"><a class="toc-anchor" href="#h-8-为什么这样吃更好一点">¶</a> 8. 为什么这样吃更好一点？</h2>
<p><strong>防止血糖骤升</strong><br>三餐碳水均衡分配，避免一顿吃完米饭马上就攀上血糖高峰。血糖峰值过高会引发胰岛素分泌狂飙，导致葡萄糖快速转为脂肪，进而肥胖加重。</p>
<p><strong>保持全天饱腹感</strong><br>HRT人群激素会导致体力低，所以更需要合理给碳，早上吃 3 份碳水，上午精力充沛；加餐 1 份碳水，下午不会因为能量不足而狂吐垃圾食物。晚餐碳水压得最少，则避免深夜餐后身体“还在燃料堆里加柴火”而导致脂肪囤积。</p>
<p><strong>蛋白质均匀供给</strong><br>全天保持稳定的蛋白摄入，可在减脂期保护基础代谢（肌肉量），防止身体因热量缺口过大而分解肌肉当燃料。</p>
<p><strong>脂肪不必死磕0摄入</strong><br>完全无脂饮食会让你丢失必需脂肪酸，引起肌肤瘙痒、激素更混乱、饥饿感暴增。外卖本身就有大量脂肪，若在家做饭，只需适量加入优质油脂即可。</p>
<hr>
<h2 id="h-9-具体操作步骤" class="toc-header"><a class="toc-anchor" href="#h-9-具体操作步骤">¶</a> 9. 具体操作步骤</h2>
<h3 id="步骤一先用薄荷app记录一周饮食" class="toc-header"><a class="toc-anchor" href="#步骤一先用薄荷app记录一周饮食">¶</a> 步骤一：先用薄荷APP记录一周饮食</h3>
<p>假期买个克数秤，称常吃的一碗米饭、一份鸡腿、一根香蕉各自多少克；</p>
<p>在薄荷APP里逐一录入，或者记在手机记事本；</p>
<p>整理出你常吃食物的每 100g 碳蛋脂数据，方便以后快速查阅。</p>
<h3 id="步骤二设定每日目标" class="toc-header"><a class="toc-anchor" href="#步骤二设定每日目标">¶</a> 步骤二：设定每日目标</h3>
<p>按照第二章公式，计算出每日目标总量（碳水、蛋白、脂肪）。</p>
<p>拆分成早餐/午餐/加餐/晚餐四个部分，使用 3:4:1:2 或 2:3:1:3 等比例。</p>
<p>将各部分所需克数换算为常见菜品的重量。例如早餐要 36g 碳水，你就选 150g 软米饭；要 19g 蛋白，你就选一只水煮蛋加 40g 瘦猪肉；脂肪 9g，用 10g 橄榄油即可。</p>
<h3 id="步骤三外卖点餐技巧" class="toc-header"><a class="toc-anchor" href="#步骤三外卖点餐技巧">¶</a> 步骤三：外卖点餐技巧</h3>
<p><strong>避开油炸/烧烤</strong>：炸鸡、烤串、杯面、油饼一切在外卖里重油重盐的坚决绕行；</p>
<p><strong>点“沙县”“蒸菜”“清蒸鱼”</strong>：只要是明码标价、主食主菜分明，一目了然；</p>
<p><strong>询问店家少油少盐</strong>：不少店家只要你开口，就可以少放油；</p>
<p><strong>重点选“饭+去皮肉+青菜”</strong>：米饭大约 150g，去皮鸡腿 100g，青菜 80g 做到“三分五分底”。</p>
<h3 id="步骤四在家做饭小技巧" class="toc-header"><a class="toc-anchor" href="#步骤四在家做饭小技巧">¶</a> 步骤四：在家做饭小技巧</h3>
<p><strong>用电子秤先称主食和肉类</strong>：例如煮 100g 生米饭、煎 120g 去皮鸡腿，确保碳蛋脂精准；</p>
<p><strong>蔬菜随意称 50~100g</strong>：绿叶菜含碳极低，想吃随心；</p>
<p><strong>脂肪用一大勺橄榄油或植物油</strong>：15ml≈13.5g，9 kcal/g，约 120 kcal。</p>
<h3 id="步骤五养成检查与调整习惯" class="toc-header"><a class="toc-anchor" href="#步骤五养成检查与调整习惯">¶</a> 步骤五：养成检查与调整习惯</h3>
<p>每周隔天记录一次体重与体脂，结合镜子前的身材变化；</p>
<p>若发现血糖餐后波动大、下午疲倦，要检查碳水比例是否过高；</p>
<p>若长期腹泻或便秘，检查饮食纤维是否足够（蔬菜水果要补齐）；</p>
<p>若肌肉流失严重、力量下降，要适度提高蛋白摄入到 2.0g/kg，并加大无氧训练。</p>
<p><span class="text-big"><strong>不要觉得称食物，记体积麻烦，事实上只要你去记上2-4周，你就不再需要记了，因为正常的饮食计划你已经养成习惯了，按照昨天的食量去吃，就成了！不求快只求稳，一周1kg，一个月4kg，这种速度需要留出1000卡的缺口，还容易造成皮肤松弛，除了大基数以外没必要，每周0.5kg/每个月2kg，对于小基数来说，半年可以蒸发12kg，而这12kg是脂肪为主肌肉为辅，会明显让你看起来轻盈一大圈，减肥这种事情不能死看数据，身材变化更加重要！</strong></span></p>
<hr>
<h2 id="h-10-最终注意事项与常见误区" class="toc-header"><a class="toc-anchor" href="#h-10-最终注意事项与常见误区">¶</a> 10. 最终注意事项与常见误区</h2>
<p><strong>不要把晚餐随便吃</strong><br>晚上离睡眠近，血糖上升后无法及时消耗，易直接转为脂肪储存。不必“绝对不吃碳”，只需“最少吃碳”。</p>
<p><strong>脂肪不是敌人，脂肪摄入要适量</strong><br>一天 0.4g/kg 的脂肪配额，外卖里本身油量若充足，可自行减少；若在家做，确保用优质植物油或鱼油，绝不全断油。</p>
<p><strong>肉必须去皮，肥肉要警惕</strong><br>任何带皮的炸鸡、烧烤、卤猪蹄都尽量绕道而行，留给自己一天 0.4g/kg 脂肪名额；瘦肉和去皮鸡腿能够提供足够蛋白，足够好吃，也不会给你过多负担。</p>
<p><strong>主食分量要精准</strong><br>一碗米饭 150g、两片全麦面包、大约 80g 红薯、130g 燕麦粥，这些量都要心里有数。如果实在在食堂不能精准拿捏，就先在假期训练目测。</p>
<p><strong>外卖大份量、隐藏油量要谨慎</strong><br>点面皮、炒米粉、盖浇饭时，一定把米饭量控制在 100~120g，肉丝、鸡丁这些菜80~100g，青菜随意，但绝不能让油浸菜、炸鸡这类“高脂选项”抢占热量配额。</p>
