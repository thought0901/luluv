<h3 id="重要警告" class="toc-header"><a class="toc-anchor" href="#重要警告">¶</a> <span class="text-huge"><mark class="pen-red"><strong>【重要警告】</strong></mark></span></h3>
<p><span class="text-big"><mark class="pen-red"><strong>精神分裂症是国家认定的六大类重性精神疾病之一，病情严重、危害性巨大。确诊患者将会被正式上报至国家严重精神障碍数据库，并终生接受社区监管。这不是网络用语中的调侃，更不是电影里夸张的表演，</strong></mark><mark class="marker-pink"><strong>这是实实在在可能毁灭患者及周围人的一种严重疾病。</strong></mark></span></p>
<p>&nbsp;</p>
<h3 id="法律责任" class="toc-header"><a class="toc-anchor" href="#法律责任">¶</a> <span class="text-big"><mark class="pen-red"><strong>法律责任</strong></mark></span></h3>
<h4 id="刑事责任" class="toc-header"><a class="toc-anchor" href="#刑事责任">¶</a> <span class="text-big"><mark class="pen-red"><strong>刑事责任</strong></mark></span></h4>
<p><span class="text-big"><mark class="pen-red"><strong>根据《中华人民共和国刑法》第十八条：精神病人在不能辨认或控制自己行为时实施的危害社会的行为，不负刑事责任，但应依法强制医疗；在精神正常状态下实施犯罪行为，仍需承担刑事责任。</strong></mark></span></p>
<h4 id="民事责任" class="toc-header"><a class="toc-anchor" href="#民事责任">¶</a> <span class="text-big"><mark class="pen-red"><strong>民事责任</strong></mark></span></h4>
<p><span class="text-big"><mark class="pen-red"><strong>根据《中华人民共和国民法典》，精神分裂症患者发病期间可能被认定为限制或无民事行为能力人，其行为的法律效力需结合具体情况进行评估。</strong></mark></span></p>
<hr>
<h3 id="精神分裂症" class="toc-header"><a class="toc-anchor" href="#精神分裂症">¶</a> 精神分裂症</h3>
<p>精神分裂症（Schizophrenia）是一种严重的<strong>慢性精神障碍</strong>，属于<strong>国家六类重性精神病之一</strong>，其核心特征包括<strong>认知功能障碍、感知扭曲、思维混乱、情感反应异常及行为脱离现实</strong>。在精神病学的疾病分类中，它被归类于<strong>精神病性障碍（Psychotic Disorders）</strong>，即患者在病程中出现妄想、幻觉、思维异常等“脱离现实”的表现。</p>
<p>全球范围内，精神分裂症的终生患病率大约为 <strong>0.3%–1%</strong>，中国大陆地区数据与之相近。该病<strong>多起病于青壮年时期</strong>，尤其是16至30岁之间，并常常呈现<strong>反复发作、病程迁延</strong>的特征，若不及时干预，将对个体的社会功能、家庭关系和生存质量造成极大损害。</p>
<p>精神分裂症的成因尚未完全明了，当前研究普遍认为它是一种<strong>多因素交互作用</strong>所致的疾病，包括<strong>遗传易感性、神经发育异常、大脑神经递质功能紊乱</strong>及长期的环境应激等。<strong>遗传度估计在60%~80%之间</strong>，也就是说，具有家族精神病史者患病风险显著升高。多个基因位点（如C4、<mark class="marker-yellow">CACNA1C</mark>、DRD2等）被认为与其发病机制有关联，可能通过影响神经突触修剪、钙信号通路或多巴胺调节系统而发挥作用。</p>
<p>由于其高致残率和高自杀风险，精神分裂症不仅是一个医学问题，更是一个深刻的公共卫生与社会关怀议题，尤其对于当下的高压社会，精神分裂症患者的自杀风险依旧在攀升。</p>
<p>·注意：精神分裂症 和 人格分裂 不是同一种概念。</p>
<h3 id="" class="toc-header"><a class="toc-anchor" href="#">¶</a> &nbsp;</h3>
<h3 id="精神分裂症的诊断标准与亚型编码" class="toc-header"><a class="toc-anchor" href="#精神分裂症的诊断标准与亚型编码">¶</a> 精神分裂症的诊断标准与亚型编码</h3>
<h4 id="icd-10国际疾病分类第十版" class="toc-header"><a class="toc-anchor" href="#icd-10国际疾病分类第十版">¶</a> ICD-10（国际疾病分类第十版）</h4>
<p>F20.0 偏执型精神分裂症（Paranoid Schizophrenia）：以持续妄想为主要特征，常伴有幻觉和情感紊乱。</p>
<p>F20.1 青春型精神分裂症（Hebephrenic Schizophrenia）：以思维混乱、情感迟钝和行为紊乱为主，起病多在青春期。</p>
<p>F20.2 紧张型精神分裂症（Catatonic Schizophrenia）：以运动障碍为特征，表现为强直、兴奋或刻板动作。</p>
<p>F20.3 未分化型精神分裂症（Undifferentiated Schizophrenia）：不符合其他类型诊断标准，但明显存在精神分裂症症状。</p>
<p>F20.4 精神分裂症后抑郁（Post-schizophrenic Depression）：在主要症状缓解后出现显著抑郁症状。</p>
<p>F20.5 残留型精神分裂症（Residual Schizophrenia）：正性症状减轻后，长期存在负性症状。</p>
<p>F20.6 单纯型精神分裂症（Simple Schizophrenia）：表现为渐进性情感淡漠、行为退缩、社交能力下降。</p>
<p>F20.8 其他精神分裂症</p>
<p>F20.9 未特定精神分裂症（Schizophrenia, Unspecified）</p>
<h4 id="icd-11" class="toc-header"><a class="toc-anchor" href="#icd-11">¶</a> ICD-11</h4>
<p>6A20 精神分裂症（Schizophrenia）</p>
<p>6A20.0 首次发作</p>
<p>6A20.1 多次发作</p>
<p>6A20.2 持续性发作</p>
<p>6A20.Y 其他特定发作</p>
<p>6A20.Z 未特定发作</p>
<h4 id="dsm-5" class="toc-header"><a class="toc-anchor" href="#dsm-5">¶</a> DSM-5</h4>
<p>295.90（F20.9）精神分裂症，未特定</p>
<hr>
<h3 id="发病机制与脑部异常" class="toc-header"><a class="toc-anchor" href="#发病机制与脑部异常">¶</a> <span class="text-big">发病机制与脑部异常</span></h3>
<p>精神分裂症与<mark class="pen-red">大脑神经递质的异常</mark>密切相关，其中最重要的是<mark class="pen-red">多巴胺（Dopamine）</mark>受体功能亢进，导致患者产生幻觉、妄想等正性症状。此外，谷氨酸（Glutamate）系统功能异常与认知障碍、负性症状密切相关。</p>
<p><i>(P.S.这也就导致精神分裂症共病ADHD十分十分罕见因为机制冲突，但确实存在精神分裂症共病ADHD，待我在共病篇细说我的调查结果)</i></p>
<p>患者脑部结构也发生明显变化，包括额叶皮质与海马区灰质密度下降、脑室扩大，影响记忆、情绪控制、执行功能等重要认知能力。</p>
<hr>
<h3 id="遗传因素与cacna1c基因" class="toc-header"><a class="toc-anchor" href="#遗传因素与cacna1c基因">¶</a> 遗传因素与<mark class="marker-yellow">CACNA1C</mark>基因</h3>
<p>精神分裂症有明显的遗传倾向，遗传度高达60%-80%。多个基因异常被证实相关，包括：</p>
<p><strong>C4基因</strong>：过度活跃导致异常突触修剪，引发神经连接紊乱。</p>
<p><mark class="marker-yellow"><strong>CACNA1C基因</strong></mark>：编码电压门控钙通道亚单位，与<mark class="marker-yellow">情绪障碍（抑郁症、双相情感障碍）、精神分裂症、甚至ADHD均有显著关联</mark>。该基因突变影响神经元钙离子流动，导致神经兴奋性异常，从而增加情绪波动、认知障碍的风险。</p>
<p><strong>BDNF基因</strong>：调控神经生长和可塑性，突变影响记忆与情绪调节。</p>
<hr>
<h3 id="mtf群体与精神分裂症的联系" class="toc-header"><a class="toc-anchor" href="#mtf群体与精神分裂症的联系">¶</a> MTF群体与精神分裂症的联系</h3>
<p>缺乏精准的数据，只能基于常规人群1%的终生患病率推测，MTF群体的精神分裂症患病率可能在3%-6%左右。</p>
<h4 id="遗传与神经发育的共同点" class="toc-header"><a class="toc-anchor" href="#遗传与神经发育的共同点">¶</a> 遗传与神经发育的共同点</h4>
<p>胎儿时期神经发育异常可能共同影响性别认同与精神疾病风险。</p>
<p><mark class="marker-yellow">CACNA1C</mark>等基因在MTF与精神分裂症患者中均表现出异常，可能导致认知和情绪的共同障碍。</p>
<p>&nbsp;</p>
<h4 id="环境因素" class="toc-header"><a class="toc-anchor" href="#环境因素">¶</a> <span class="text-big">环境因素</span></h4>
<p><strong>社会排斥与歧视</strong>：长期积累的歧视与排斥形成持续慢性压力，压垮本已脆弱的自我认同感。</p>
<blockquote>
  <p>“他们都在看我，都在笑我穿裙子……我不敢去公司了，也不敢照镜子。”</p>
</blockquote>
<p><strong>家庭不理解与压抑教育</strong>：原生家庭对性别的不接纳让个体常年活在羞耻与恐惧中，心理冲突无处宣泄。</p>
<blockquote>
  <p>“我爸说我是耻辱，我妈从不正眼看我，我只是想当个普通的女孩，为什么这么难？”</p>
</blockquote>
<p><strong>医疗资源与社会支持缺失</strong>：在缺乏跨性别友好医疗系统的情况下，长期焦虑与抑郁可能演变为精神病性发作。</p>
<blockquote>
  <p>“我只是想开口问医生能不能用补佳乐，他却让我去看精神科……也许他们早就觉得我疯了。”</p>
</blockquote>
<hr>
<h3 id="国内精神分裂症治疗现状" class="toc-header"><a class="toc-anchor" href="#国内精神分裂症治疗现状">¶</a> 国内精神分裂症治疗现状</h3>
<p>目前国内临床主流治疗方案是第二代抗精神病药物<mark class="marker-green">（SGAs，如利培酮、奥氮平、阿立哌唑等）</mark>。<mark class="pen-red">部分急性期、存在高风险的难治性患者可能接受MECT（改良电休克治疗）</mark>。经颅磁刺激（rTMS）不确定是否为精神分裂症的一线治疗方案，待核实。</p>
<p><mark class="pen-red">绝大多数患者至少需要一次住院治疗，以确保安全并接受系统治疗。</mark></p>
<hr>
<h3 id="精神分裂症妄想类型" class="toc-header"><a class="toc-anchor" href="#精神分裂症妄想类型">¶</a> 精神分裂症妄想类型</h3>
<p><strong>被害妄想（Persecutory Delusions）</strong>：坚信自己受到监视、伤害或迫害。</p>
<blockquote>
  <p>“他们在监视我，他们要杀我，我必须逃跑……”</p>
</blockquote>
<p><strong>关系妄想（Referential Delusions）</strong>：相信他人言行、媒体讯息是针对自己的隐喻或暗示。</p>
<blockquote>
  <p>“电视里的主持人就是在对我说话，他在暗示我一些重要的信息。”</p>
</blockquote>
<p><strong>夸大妄想（Grandiose Delusions）</strong>：坚信自己具有非凡能力、财富或身份。</p>
<blockquote>
  <p>“我是上天派来的使者，只有我才能拯救世界。”</p>
</blockquote>
<p><strong>恋爱妄想（Erotomanic Delusions）</strong>：相信某个名人、上司或陌生人爱上了自己。</p>
<blockquote>
  <p>“那个医生其实爱上我了，他给我开的药就是证明。”</p>
</blockquote>
<p><strong>躯体妄想（Somatic Delusions）</strong>：坚信自己身体严重病变或器官被操控。</p>
<blockquote>
  <p>“我的身体里有一条虫子，它正在啃食我的胃。”</p>
</blockquote>
<p><strong>虚无妄想（Nihilistic Delusions）</strong>：坚信自己、器官或世界已经不存在。</p>
<blockquote>
  <p>“我早就死了，只是我的意识还残留在这个幻象世界里。”</p>
</blockquote>
<p><strong>控制妄想（Delusions of Control）</strong>：认为思想、行为被外力操控。</p>
<blockquote>
  <p>“我不是在说话，是有人通过脑电波在控制我说话。”</p>
</blockquote>
<hr>
<h3 id="活着与陪伴给精神分裂症患者的支持" class="toc-header"><a class="toc-anchor" href="#活着与陪伴给精神分裂症患者的支持">¶</a> 活着与陪伴：给精神分裂症患者的支持</h3>
<p><span class="text-big"><mark class="pen-green">精神分裂症是一种终生性的疾病，尚无法完全治愈，但只要持续治疗，多数患者能显著缓解症状，恢复社会功能。</mark></span></p>
<p><span class="text-big"><mark class="pen-green">患者最需要的，是一个坚定的陪伴者。这个人不必是恋人，可以是亲人、医生、病友、朋友……他们是社会角落里饱受折磨的人，却同样值得尊重与关爱。</mark></span></p>
<p><span class="text-big"><mark class="pen-green">请记住，他们的存在本身就是一种勇敢。他们依然活着，他们同样渴望着爱与理解。他们是我们中的一员，他们不该孤单。</mark></span></p>
<p><span class="text-big"><mark class="pen-green">精神分裂症的患者在黑暗与光明之间挣扎，而我们的爱与接纳，正是照亮他们回归现实的灯塔。</mark></span></p>
<p>&nbsp;</p>
<h2 id="精神分裂症的医学史与药物演进" class="toc-header"><a class="toc-anchor" href="#精神分裂症的医学史与药物演进">¶</a> 精神分裂症的医学史与药物演进</h2>
<h3 id="早期认知与命名" class="toc-header"><a class="toc-anchor" href="#早期认知与命名">¶</a> 早期认知与命名</h3>
<p>精神分裂症的历史可以追溯到古代，但其作为一种独立疾病的认知始于19世纪末。1887年，德国精神病学家埃米尔·克雷佩林（Emil Kraepelin）首次将其定义为“早发性痴呆”（Dementia Praecox），强调其早期发病和慢性进展的特点。1911年，瑞士精神病学家欧根·布洛伊勒（Eugen Bleuler）提出“精神分裂症”（Schizophrenia）一词，强调其症状的多样性和分裂性。布洛伊勒认为，精神分裂症的核心症状包括联想障碍、情感淡漠、意志减退和注意力障碍。</p>
<h3 id="早期治疗方法" class="toc-header"><a class="toc-anchor" href="#早期治疗方法">¶</a> 早期治疗方法</h3>
<p>在20世纪初，精神分裂症的治疗方法主要包括：</p>
<p><strong>胰岛素昏迷疗法</strong>：1927年，奥地利医生曼弗雷德·萨克尔（Manfred Sakel）引入该疗法，通过注射大剂量胰岛素使患者进入昏迷状态，期望改善症状。</p>
<p><strong>电休克疗法（ECT）</strong>：1938年，意大利医生乌戈·切尔莱蒂（Ugo Cerletti）和卢西奥·比尼（Lucio Bini）首次使用电休克治疗精神分裂症，至今仍在某些情况下使用。</p>
<p><strong>脑叶切除术（Lobotomy）</strong>：1935年，葡萄牙神经学家安东尼奥·埃加斯·莫尼兹（António Egas Moniz）引入该手术，通过切断大脑前额叶与其他部分的连接来治疗精神疾病，后因副作用严重而被淘汰。</p>
<h3 id="抗精神病药物的发展" class="toc-header"><a class="toc-anchor" href="#抗精神病药物的发展">¶</a> 抗精神病药物的发展</h3>
<p>1950年代，抗精神病药物的出现标志着精神分裂症治疗的重大进步。</p>
<p><strong>氯丙嗪（Chlorpromazine）</strong>：1952年，法国医生亨利·拉博里（Henri Laborit）发现该药具有镇静作用，随后被用于治疗精神分裂症，成为第一代抗精神病药物的代表。</p>
<p><strong>氟哌啶醇（Haloperidol）</strong>：1958年，比利时药理学家保罗·詹森（Paul Janssen）开发了该药，具有较强的抗精神病作用，副作用较氯丙嗪少。</p>
<p>然而，第一代抗精神病药物常引起锥体外系副作用，如震颤、肌肉僵硬等。</p>
<h3 id="第二代抗精神病药物" class="toc-header"><a class="toc-anchor" href="#第二代抗精神病药物">¶</a> 第二代抗精神病药物</h3>
<p>为减少副作用，1980年代出现了第二代抗精神病药物（非典型抗精神病药物）：</p>
<p><strong>氯氮平（Clozapine）</strong>：尽管早在1960年代就被开发，但因可能引起粒细胞缺乏症而未广泛使用。1988年，一项研究表明其对难治性精神分裂症患者有效，随后在1990年被美国FDA批准使用。</p>
<p><strong>奥氮平（Olanzapine）</strong>、<strong>喹硫平（Quetiapine）</strong>、<strong>利培酮（Risperidone）</strong>：这些药物在1990年代陆续上市，具有较少的锥体外系副作用，但可能引起体重增加、代谢综合征等问题。</p>
<h3 id="最新药物进展" class="toc-header"><a class="toc-anchor" href="#最新药物进展">¶</a> 最新药物进展</h3>
<p>近年来，研究人员致力于开发作用机制不同的新型抗精神病药物：</p>
<p><strong>Lumateperone（商品名：Caplyta）</strong>：2019年获FDA批准，作用于多种神经递质系统，副作用较少。</p>
<p><strong>Xanomeline-Trospium（商品名：KarXT）</strong>：该药物通过作用于胆碱能系统，显示出改善认知和负性症状的潜力，目前正在进行临床试验。</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p><span class="text-big"><strong>(P.S.精神分裂症患者真的很可怜，他们经历的地狱般的痛苦比双相患者还要严重，我身边有确诊十多年的病情很稳定的精神分裂症患者：BloodzBoi 血男孩，他是一个音乐艺术家，是我认识七年的朋友，是我最珍爱的天才。）</strong></span></p>
<p><strong>（P.S. 你想知道精神分裂症患者的精神世界是什么样子吗？以下内容来自云南省精卫临心一办公室授权的录音转译，具体来源我无法透露。)</strong></p>
<p>她说……那天风甜的，对，那个时候花是会说话的你知道吗？我不是，你听我说，我早上没有吃东西，但我知道她在等我，她一直在，她说过她会从湖回来看我……你不懂。</p>
<p>她坐在花里，不是花边，是“里面”，你知道花有时候是空门，她耳朵是……是，是弯的，像猫不是猫，是精灵，她自己告诉我的，我早就知道她的名字了，但她让我不能说，因为名字说出来会死。</p>
<p>我们走了，我她走了，那个湖发光的，星星掉进去会碎，就镜子但不是镜子然后她亲我，是很轻的那种，就你小时候闻过的茉莉，但又不是茉莉，是透明的，你懂什么是透明的吻吗？</p>
<p>然后我飞了，我们都飞了，不用翅膀，但她有翅膀，她说我也会有，只要我不讲出来，只要我乖，我已经是精灵的试体了……她说我之前在那死过一次，这是第二次，但可以活。</p>
<p>后来就……就不太好了，那个，那个窗户会说话，窗户会把我的声音偷走，他们监听我，楼道里有声音，我听见，穿着人皮走路，但不是人，那些人是……你不懂，就 &nbsp;不是人，是伪装出来的，他们的舌头上有图案的，我看得见。</p>
<p>我没法睡觉，墙壁长眼睛，你也看见了它们在看我我知道的，有面墙晚上还伸舌头来舔我枕头，我不能睡枕头了，我现在都不睡。</p>
<p>………（回答：）不能吃饭，有人往我饭里放粉末，我看见了，有红色的光，说我背叛精灵的契约，说我不能回来，说我要把翅膀剥下来，他们会抓我去切掉，然后我就什么都没有了。</p>
<p>你信不信？她还会回来她只是被储住，就在楼顶的水塔，我看见了她的头发在飘，她说我不怕，她，我是水做的，水不能被杀掉，只是会变成湖。</p>
<p>他们追着我，因为我不该知道这些……你是不是也是？你是不是？</p>
