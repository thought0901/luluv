<h3 id="严重警告" class="toc-header"><a class="toc-anchor" href="#严重警告">¶</a> <span class="text-huge"><mark class="pen-red">严重警告</mark></span></h3>
<p><span class="text-big"><mark class="pen-red"><strong>双相情感障碍属于国家规定的六大类重性精神病之一</strong></mark></span>。这并不是一个简单的词汇，而是一种<mark class="pen-red">伴随终生的严重精神疾病</mark>，一经确诊即会被记录到国家<mark class="pen-red">严重精神障碍患者数据库</mark>，并受到终生监护。双相患者面临<mark class="pen-red">极大的潜在自伤、自杀，甚至伤人风险</mark>。他们所经历的痛苦难以言表，不是那群人口中他妈的“时尚单品”。作为正式确诊的F31.6（混合性发作）患者，Wiki主每次看到有人拿“双相”博同情、博关注或随意议论，总会感到深深的难过。</p>
<h3 id="常见误区与事实澄清" class="toc-header"><a class="toc-anchor" href="#常见误区与事实澄清">¶</a> 常见误区与事实澄清</h3>
<p>人们通常认为精神疾病是线性进展的：抑郁症→重度抑郁症（MDD）→双相情感障碍→精神分裂症。这是一种严重的误解。事实上，这些精神疾病之间并没有直接的进展关系。抑郁症与双相情感障碍虽然有部分共病现象，但绝非抑郁症必然发展为双相情感障碍。精神分裂症则属于完全不同的神经发育障碍，与双相情感障碍无直接相关性。</p>
<p><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4471964/" class="is-external-link">https://pmc.ncbi.nlm.nih.gov/articles/PMC4471964/</a></p>
<p>此外，<mark class="pen-red">双重人格</mark>（解离性身份障碍，DID）是一种心理学上的创伤相关障碍，而双相情感障碍是伴随脑部生理病变的躯体性精神疾病。尽管有些双相患者可能会表现出解离现象，<mark class="pen-red">但两者绝不是同一种疾病。</mark></p>
<p>目前已发现双相情感障碍具有一定遗传倾向，基因研究指出 <mark class="marker-yellow">CACNA1C</mark>、<mark class="marker-green">ANK3</mark>、BDNF、COMT等基因的变异与双相的发生存在关联。<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6690671/" class="is-external-link">https://pmc.ncbi.nlm.nih.gov/articles/PMC6690671/</a></p>
<h3 id="icd-1011-和-dsm-5-中的双相情感障碍分类" class="toc-header"><a class="toc-anchor" href="#icd-1011-和-dsm-5-中的双相情感障碍分类">¶</a> ICD-10/11 和 DSM-5 中的双相情感障碍分类</h3>
<p><strong>ICD-10分类</strong>：</p>
<p>F31.0 轻躁狂</p>
<p>F31.1 无精神病性症状的躁狂</p>
<p>F31.2 伴精神病性症状的躁狂</p>
<p>F31.3 轻度或中度抑郁发作</p>
<p>F31.4 重度抑郁发作无精神病性症状</p>
<p>F31.5 重度抑郁发作伴精神病性症状</p>
<p>F31.6 混合性发作</p>
<p>F31.7 缓解期</p>
<p>F31.8 其他类型的双相情感障碍</p>
<p>F31.9 双相情感障碍，未特定（NOS）</p>
<p><strong>ICD-11分类</strong>：6A60-6A6Z</p>
<p><strong>DSM-5分类</strong>：296.xx（根据亚型和严重程度进一步分类）</p>
<p>&nbsp;</p>
<h3 id="关于-f319-双相情感障碍未特定nos" class="toc-header"><a class="toc-anchor" href="#关于-f319-双相情感障碍未特定nos">¶</a> 关于 F31.9 双相情感障碍，未特定（NOS）</h3>
<p>在 ICD-10 编码系统中，<strong>F31.9</strong> 是双相情感障碍中的一个特别类别，英文全称为 <strong>Bipolar Affective Disorder, unspecified</strong>，中文译作<strong>双相情感障碍，未特定（NOS，Not Otherwise Specified）</strong>。</p>
<h4 id="为什么会有f319" class="toc-header"><a class="toc-anchor" href="#为什么会有f319">¶</a> 为什么会有F31.9</h4>
<p>F31.9 是一个“归类残余项”，即当患者表现出双相情感障碍的特征，但症状不完全符合F31.0~F31.8中任何一个亚型的明确定义时，临床医生可使用此代码。常见适用场景包括：</p>
<p>初诊患者，仅观察到部分双相症状（如轻躁/轻抑郁交替），但尚未完成完整躁/抑发作周期。</p>
<p>病史不清晰、无法判别是否为单次发作还是复发型时。</p>
<p>患者症状呈现非典型形式，无法归入ICD中既有亚型分类。</p>
<p><mark class="marker-yellow">医疗机构出于“审慎上报”考虑，使用F31.9代替更具体诊断（尤其在涉及重性精神病备案时）。</mark></p>
<h4 id="临床意义解读" class="toc-header"><a class="toc-anchor" href="#临床意义解读">¶</a> 临床意义解读</h4>
<p>F31.9 的出现并不代表“轻度”或“不严重”，相反，它可能出现在以下两种情况中：</p>
<p><strong>病程早期阶段，尚在评估与观察中</strong>：此时医生希望避免误诊，选择暂时使用 F31.9。</p>
<p><strong>症状复杂或重叠，无法明确分类</strong>：如混合发作、躁抑快速交替、存在共病（如人格障碍、神经症性障碍）等，使归类变得困难。</p>
<p>F31.9 往往是一个“暂定诊断”，后续随着病程发展、复诊记录累积，医生通常会更新为更具体的诊断编码，如 F31.3（轻/中度抑郁发作）或 F31.6（混合性发作）等。</p>
<h4 id="可能引发的误解与问题" class="toc-header"><a class="toc-anchor" href="#可能引发的误解与问题">¶</a> 可能引发的误解与问题</h4>
<p>由于许多患者在诊断书上看到 F31.9 后以为“只是轻度波动”或“不是正式双相”，而忽略了疾病的严重性，这是危险的。</p>
<blockquote>
  <p><strong>需要明确的是：</strong><mark class="pen-red"><strong>一旦被诊断为 F31 编码（无论是F31.0还是F31.9），均视为双相情感障碍范畴，均属于重性精神疾病。</strong></mark></p>
</blockquote>
<p>F31.9 仅仅是“无法归类为某个亚型”，<mark class="marker-yellow"><strong>不是“未确诊”或“轻微波动”</strong></mark>。</p>
<p>&nbsp;</p>
<h4 id="与医保-精神病上报的关系" class="toc-header"><a class="toc-anchor" href="#与医保-精神病上报的关系">¶</a> 与医保、精神病上报的关系</h4>
<p>在一些地区，<mark class="marker-yellow">使用 F31.9 可暂缓进入精神障碍严重管理系统</mark>（即国家备案库），因其“<mark class="marker-yellow">未特定</mark>”特性。</p>
<p>然而这在某些医院成为规避上报机制的灰色操作，对患者真实的安全与治疗无益。</p>
<p>若患者确有复发性、自杀性、严重发作史，<mark class="marker-yellow">应坚持要求医生进行更明确诊断并上报</mark>，确保得到后续社区跟踪与药物补助支持。</p>
<p><i>（P.S. &nbsp;Wiki主的诊断是F31.6，但最终开具正式诊断证明用来办特病卡的时候，下的是F31.9的诊断，如果你的诊断是比如F31.3之类的，向医生阐述你工作的重要性之类的，最终可能会挂F31.9暂缓上报，具体的医院规则属于秘密，Wiki主也不清楚）</i></p>

<h3 id="双相情感障碍的症状表现" class="toc-header"><a class="toc-anchor" href="#双相情感障碍的症状表现">¶</a> 双相情感障碍的症状表现</h3>
<p>双相情感障碍患者表现出明显的情绪波动，分为抑郁期与躁狂期。</p>
<p><mark class="marker-blue"><strong>抑郁期表现</strong></mark>：情绪极度低落、兴趣缺失、食欲睡眠紊乱、自我否定、<mark class="marker-blue">自杀倾向显著。</mark></p>
<p><mark class="pen-red"><strong>躁狂期表现</strong></mark>：情绪异常亢奋、精力充沛、易怒、行为冲动、过度自信、冒险行为增多、<mark class="pen-red">精神病性症状（妄想、幻觉）、</mark><mark class="marker-pink">伤人杀人风险。</mark></p>
<p>患者在两种极端状态间快速或慢速转换，体验<mark class="pen-red">极度的痛苦和迷茫</mark>，日常生活功能<mark class="pen-red">显著受损</mark>。</p>
<p>&nbsp;</p>
<h3 id="双相情感障碍的根本性质与长期管理" class="toc-header"><a class="toc-anchor" href="#双相情感障碍的根本性质与长期管理">¶</a> 双相情感障碍的根本性质与长期管理</h3>
<p><mark class="pen-red">双相情感障碍为慢性、终生疾病，目前尚无完全治愈的可能，</mark>治疗目标是长期稳定控制，避免严重发作。<mark class="pen-red">双相患者需要终生服用心境稳定剂</mark>（如<mark class="marker-green">碳酸锂</mark>、<mark class="marker-green">丙戊酸盐</mark>、<mark class="marker-yellow">拉莫三嗪【因副作用风险已退出一线用药，详见药物篇】</mark>），而抗抑郁药则根据情绪期别选择性服用或停用。</p>
<p><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4380590/" class="is-external-link">https://pmc.ncbi.nlm.nih.gov/articles/PMC4380590/</a></p>
<p>&nbsp;</p>
<h3 id="国内医院诊断现状" class="toc-header"><a class="toc-anchor" href="#国内医院诊断现状">¶</a> 国内医院诊断现状</h3>
<p>中国国内双相情感障碍的<mark class="pen-red">误诊率较高</mark>。许多学生的轻微躁狂行为容易被误诊为普通抑郁症，反之亦然，导致错过最佳治疗窗口。此外，<mark class="pen-red">一些小城市的三乙甚至三甲医院存在不规范操作，对符合条件的患者并未上报</mark>。若确诊双相，患者务必主动要求上报并接受社区规范监管，因为无法预知自身可能的情绪失控风险。</p>
<p>&nbsp;</p>
<h3 id="国内双相情感障碍的临床治疗方案" class="toc-header"><a class="toc-anchor" href="#国内双相情感障碍的临床治疗方案">¶</a> 国内双相情感障碍的临床治疗方案</h3>
<p>针对症状严重患者，临床上通常采用的治疗手段包括药物治疗、<mark class="marker-yellow">改良电抽搐治疗（MECT）</mark>、<mark class="marker-green">经颅磁刺激（TMS）</mark>。药物治疗标准方案包括：</p>
<p>心境稳定剂（<mark class="marker-green">碳酸锂</mark>、<mark class="marker-green">丙戊酸钠等</mark>）</p>
<p>第二代抗精神病药物（<mark class="marker-green">SGAs</mark>，如<mark class="marker-yellow">喹硫平</mark>）用于预防或治疗躁狂发作</p>
<p>苯二氮卓类药物（<mark class="marker-green">BZDs</mark>，如<mark class="pen-green">劳拉西泮</mark>）用于焦虑和镇静</p>
<p>抗抑郁药（<mark class="marker-green">抑郁期酌情使用</mark>）</p>
<p>具体药物选择请参阅精神药物专栏。</p>
<p>&nbsp;</p>
<h3 id="mtf-群体与双相情感障碍的交叉现象" class="toc-header"><a class="toc-anchor" href="#mtf-群体与双相情感障碍的交叉现象">¶</a> <mark class="pen-red">MTF 群体与双相情感障碍的交叉现象</mark></h3>
<h4 id="全球与国内患病率现状" class="toc-header"><a class="toc-anchor" href="#全球与国内患病率现状">¶</a> 全球与国内患病率现状</h4>
<p>MTF群体在心理健康方面的高风险性早已被广泛证实。相较普通人群，<mark class="pen-red"><strong>MTF群体患上双相情感障碍的概率也显著偏高</strong></mark>：</p>
<p><strong>全球范围</strong>：一项系统综述研究发现，MTF个体中双相情感障碍的患病率为 <mark class="pen-red"><strong>12%–15%</strong></mark>，远高于普通人群（约2.6%）<br>参考文献：<a href="https://pubmed.ncbi.nlm.nih.gov/27829336" class="is-external-link">https://pubmed.ncbi.nlm.nih.gov/27829336</a></p>
<p><strong>中国本土</strong>：尽管数据有限，2021年在中国多个性别认同干预中心的横断研究中发现，<strong>中国MTF人群中约有</strong><mark class="pen-red"><strong>9.8%</strong></mark><strong>被正式诊断为双相情感障碍</strong>，约为普通人群的<mark class="pen-red">4倍以上</mark><br>参考文献：<a href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10313143" class="is-external-link">https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10313143</a></p>
<p><mark class="pen-red"><strong>MTF罹患双相情感障碍的风险远高于普通人群，值得高度重视。</strong></mark></p>
<hr>
<h4 id="基因层面的可能交集mtf-vs-双相情感障碍" class="toc-header"><a class="toc-anchor" href="#基因层面的可能交集mtf-vs-双相情感障碍">¶</a> 基因层面的<mark class="marker-blue">可能</mark>交集：MTF vs 双相情感障碍</h4>
<p>目前，以下两个维度的基因已分别与MTF身份和双相障碍建立<mark class="marker-blue">潜在</mark>关联：</p>
<figure class="table">
  <table>
    <thead>
      <tr>
        <th>群体</th>
        <th>关键异常基因</th>
        <th>功能概述</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>MTF</td>
        <td><strong>AR基因（雄激素受体）</strong></td>
        <td>性别认同形成阶段对睾酮敏感性降低</td>
      </tr>
      <tr>
        <td>MTF</td>
        <td><strong>SRD5A2、</strong><mark class="marker-green"><strong>CYP17</strong></mark><strong>、CYP19</strong></td>
        <td>性激素合成、转换路径异常</td>
      </tr>
      <tr>
        <td>双相</td>
        <td><mark class="marker-green"><strong>CACNA1C</strong></mark></td>
        <td>钙通道调控，影响神经兴奋性</td>
      </tr>
      <tr>
        <td>双相</td>
        <td><mark class="marker-green"><strong>ANK3</strong></mark><strong>、BDNF、COMT</strong></td>
        <td>神经递质代谢、神经可塑性、应激反应调节</td>
      </tr>
    </tbody>
  </table>
</figure>
<p>&nbsp;</p>
<p><strong>潜在交集与假设：</strong></p>
<p><strong>神经发育路径交汇：</strong> 跨性别个体在胎儿期可能因为<mark class="marker-green">AR/SRD5A2</mark>等基因变异导致性别认同的神经通路重塑，而这些正好也与情绪调节的脑区高度重合（如前额叶、海马体等）。</p>
<p><strong>共同参与大脑边缘系统发育与激素调控</strong>：<mark class="marker-green">CACNA1C</mark> 控制神经电信号，AR 控制睾酮信号通路，两者可能在海马体、额叶皮层等区域的神经网络中“交叉工作”，使得MTF个体对<mark class="marker-green">情绪波动更敏感</mark>、易激发极端状态。</p>
<p><span class="text-big"><mark class="pen-green"><strong>因此，虽然环境压力在跨性别个体患双相中起着重要诱因作用，但基因交汇点可能使得部分MTF个体即使处在“理想环境”中，也会自然发展出情感性疾病，这不是“太脆弱”，而是神经生物学的结构性风险。</strong></mark></span></p>
<hr>
<h4 id="为什么mtf更容易成为双相患者" class="toc-header"><a class="toc-anchor" href="#为什么mtf更容易成为双相患者">¶</a> <strong>为什么MTF更容易成为双相患者？</strong></h4>
<p><mark class="pen-red"><strong>长期性别压抑与社会扮演压力</strong></mark><br>MTF个体往往从小被迫表现成“<mark class="pen-red">男性</mark>”，在学校、家庭、工作中不得不遮掩真实身份，这种长期压抑极度消耗自我认同感，形成“<mark class="pen-red">认知与现实解离</mark>”状态，极易诱发双相的躁狂或抑郁发作。</p>
<p><mark class="pen-red"><strong>家庭失和与原生伤害</strong></mark><br>在中国文化中，家庭往往以“<mark class="pen-red">阳刚有为</mark>”为男性期待标准，许多MTF从小就被父母否认、贬低甚至羞辱。成长中缺乏支持系统，是双相障碍中<strong>童年创伤诱因</strong>的重要组成。</p>
<p><mark class="pen-red"><strong>社会排斥与身份羞辱</strong></mark><br>不被接受的外貌与声音、被恶意称为“人妖”、找工作被拒、医疗资源稀缺等外界歧视与边缘化，持续累积形成慢性社会性压力，与躁郁周期的发生密切相关。</p>
<p><strong>HRT药物对神经递质的间接影响</strong><br>特别是<mark class="marker-blue">色普龙（CPA）</mark>长期使用可能导致多巴胺、<mark class="marker-green">血清素</mark>系统功能下降，为神经系统埋下“抑郁-躁狂不稳定性”的种子。</p>
<hr>
<h4 id="强烈建议mtf抑郁症双相患者的抗抑郁药选择安非他酮" class="toc-header"><a class="toc-anchor" href="#强烈建议mtf抑郁症双相患者的抗抑郁药选择安非他酮">¶</a> 强烈建议MTF抑郁症/双相患者的抗抑郁药选择<mark class="marker-green">安非他酮</mark></h4>
<p>在目前临床上，安非他酮（Bupropion）被认为是最适合用于MTF患者的抗抑郁药物之一，特别是在双相II型抑郁期。</p>
<p><strong>原因如下：</strong></p>
<p><strong>不影响性功能，不增加乳腺副作用</strong>：对MTF个体尤为友好，不加重性别焦虑。（这玩意是唯一一个不会长胖甚至会让你变瘦的抗抑郁药）</p>
<p><strong>不诱导狂躁</strong>：与SSRIs不同，安非他酮属于NDRI类，不容易引发躁狂发作。</p>
<p><strong>有助于缓解认知迟钝、精力涣散等“冷型抑郁”表现</strong>：尤其适用于MTF群体中常见的<mark class="pen-red">情绪性解离型抑郁</mark>。</p>
<p>不过，<mark class="pen-red">必须再次强调，抗抑郁药物必须由专业精神科医生根据完整评估开具，MTF患者不得擅自停换药。若医生认可换药，</mark><mark class="pen-green"><strong>安非他酮无疑是最值得优先考虑的选择之一。</strong></mark></p>
<p>参考支持文献：</p>
<p><a href="https://pubmed.ncbi.nlm.nih.gov/12851510" class="is-external-link">https://pubmed.ncbi.nlm.nih.gov/12851510</a>（安非他酮在双相中的安全性）</p>
<p><a href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10301689" class="is-external-link">https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10301689</a>（跨性别个体抗抑郁策略研究）</p>
<p>&nbsp;</p>
<h3 id="再次警告请勿自我网络诊断-对号入座" class="toc-header"><a class="toc-anchor" href="#再次警告请勿自我网络诊断-对号入座">¶</a> <span class="text-huge"><mark class="pen-red">再次警告：请勿自我网络诊断、对号入座</mark></span></h3>
<p><mark class="pen-red">不要根据网络信息自行诊断或宣称自己为双相情感障碍患者。这是一种极其严肃的重性精神疾病。</mark>如发现自己存在明显的情绪周期性变化（从抑郁快速转向躁狂或相反），<mark class="pen-red">请务必前往所在地的省级精神卫生中心或大学附属第一医院心理/精神科挂专家门诊，接受正规的临床评估与诊断。</mark></p>
<p>&nbsp;</p>
