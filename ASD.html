<p><mark class="pen-green">注：孤独症谱系障碍不属于广义上的精神疾病，关于它定性为精神疾病存在许多争议，严格来说它属于“神经发育障碍”。</mark></p>
<h3 id="关于asd" class="toc-header"><a class="toc-anchor" href="#关于asd">¶</a> 关于ASD</h3>
<p><mark class="marker-yellow">孤独症谱系障碍/aka. 自闭症谱系障碍（Autism Spectrum Disorder, ASD）</mark>，常被简称为<strong>自闭症</strong>或<strong>孤独症</strong>，是一种广泛存在于各年龄段的神经发育障碍。ASD的病理机制异常复杂，涉及遗传、环境、生物化学和神经解剖等多种因素，<strong>尚未被医学界完全破解。</strong></p>
<p><span class="text-big"><strong>【Wiki主不是ASD患者，所以如果有ASD患者想要对Wiki内容进行补充和修改，请加入tg群组联系Wiki主修改！】</strong></span></p>
<h3 id="asd主要表现为以下核心特征" class="toc-header"><a class="toc-anchor" href="#asd主要表现为以下核心特征">¶</a> ASD主要表现为以下核心特征：</h3>
<p><strong>社交沟通障碍</strong>：难以理解和回应社会性暗示，如眼神交流、肢体语言或语调变化。有些孩子不会回应自己的名字，不理解游戏规则，难以进行对等互动。</p>
<p><strong>重复和刻板行为</strong>：重复性的动作（如甩手、原地转圈）、仪式性行为（如坚持某种行事方式或日常流程）、<mark class="marker-yellow">对细节高度敏感</mark>（例如沉迷某些特定话题如电梯、地图、日历等）。</p>
<p><strong>感官异常</strong>：可能对声音、光线、触摸、味道等刺激过于敏感或迟钝，例如对吸尘器的声音尖叫，或反而沉迷于反复看灯光闪烁。</p>
<p><strong>兴趣狭隘</strong>：兴趣集中于特定对象或主题，缺乏广泛的兴趣，例如持续沉迷于某种交通工具、时间表或天文知识。</p>
<p><strong>语言发展异常</strong>：部分患儿语言发育迟缓，另一些虽然词汇丰富但难以进行情境适配或正常对话。</p>
<h4 id="发病年龄" class="toc-header"><a class="toc-anchor" href="#发病年龄">¶</a> 发病年龄</h4>
<p>ASD的症状多在 <mark class="marker-yellow"><strong>1岁半到3岁之间</strong></mark>开始表现，一些明显的信号包括：</p>
<p>12个月大仍未有眼神交流或微笑回应</p>
<p>18个月大仍不说话或只重复词语</p>
<p>24个月大仍无法进行简单的模仿游戏</p>
<h4 id="they-said" class="toc-header"><a class="toc-anchor" href="#they-said">¶</a> THEY SAID …</h4>
<p>“他总是自己一个人玩车轮，一转可以半小时。”</p>
<p>“我们叫他名字，他好像听不到一样。”</p>
<p>“有一次把他的积木换了位置，他大哭一整天。”</p>
<p>“他可以记住每一次我们去哪儿的路线，却说不出一句完整的句子。”</p>
<p>“他从小特别安静，我们还以为是懂事，后来才知道他根本没在听我们说话。”</p>
<p><mark class="pen-red">这些症状并不一定全部出现，但若你或你的孩子有多个符合以上表现，请尽快前往专业的儿童心理科、发育行为科或精神科就诊，但还是那句话！切勿依赖网络自行判断！</mark></p>
<p>&nbsp;</p>
<hr>
<h3 id="发病机制与遗传因素" class="toc-header"><a class="toc-anchor" href="#发病机制与遗传因素">¶</a> 发病机制与遗传因素</h3>
<h4 id="神经发育异常" class="toc-header"><a class="toc-anchor" href="#神经发育异常">¶</a> 神经发育异常</h4>
<p>ASD的核心病理之一是神经系统的异常发育，患者脑区之间连接模式异常，特别是在<mark class="pen-red">前额叶、杏仁核、小脑</mark>等区域。这些区域负责社交互动、情感处理、行为控制及语言功能。突触的过度生成及未能正常“修剪”导致大脑功能异常，最终表现出ASD的典型症状。</p>
<h4 id="基因因素" class="toc-header"><a class="toc-anchor" href="#基因因素">¶</a> 基因因素</h4>
<p>ASD遗传倾向明显，遗传度估计在60%-90%之间。多种基因变异与ASD相关联，包括：</p>
<p>CHD8基因：调节基因表达与脑部发育，突变与严重ASD症状密切相关。</p>
<p><mark class="marker-yellow"><strong>SHANK3</strong></mark><strong>基因：调控突触蛋白，突变可导致神经连接异常，表现为社交和沟通障碍。</strong></p>
<p>MECP2基因：在女性患者中引起雷特综合征（Rett Syndrome），也与部分ASD患者相关。</p>
<p>这些基因片段共同作用，导致个体表现出ASD的特定临床表现。</p>
<hr>
<h3 id="标准诊断分类代码" class="toc-header"><a class="toc-anchor" href="#标准诊断分类代码">¶</a> 标准诊断分类代码</h3>
<p><strong>ICD-10</strong>: F84.0–F84.9</p>
<p>F84.0 典型孤独症</p>
<p>F84.1 非典型孤独症</p>
<p>F84.2 雷特综合征</p>
<p>F84.3 童年瓦解性障碍</p>
<p>F84.4 过度活跃伴智能低下及刻板动作</p>
<p>F84.5 亚斯伯格综合征</p>
<p>F84.8 其他广泛性发育障碍</p>
<p>F84.9 未特定的广泛性发育障碍</p>
<p><strong>ICD-11</strong>: 6A02 孤独症谱系障碍（ASD）</p>
<p><strong>DSM-5</strong>: 299.00 孤独症谱系障碍</p>

<h3 id="临床治疗及药物控制" class="toc-header"><a class="toc-anchor" href="#临床治疗及药物控制">¶</a> 临床治疗及药物控制</h3>
<p><mark class="pen-red">目前尚无药物能根治ASD的核心症状。</mark>临床治疗主要以行为干预为主，包括应用行为分析（ABA）、语言治疗、社交技能培训及职业康复等。</p>
<p>药物治疗主要针对ASD伴随症状：</p>
<p><mark class="marker-green">利培酮（Risperidone）</mark>与<mark class="marker-green">阿立哌唑（Aripiprazole）</mark>：用于控制易激惹、攻击性及刻板行为。</p>
<p><mark class="marker-yellow">选择性血清素再摄取抑制剂（SSRIs）</mark>：用于治疗共病焦虑、抑郁。</p>
<p><mark class="marker-pink">兴奋剂（如哌甲酯）：用于治疗</mark><mark class="marker-green">共病ADHD</mark><mark class="marker-pink">症状。</mark></p>
<hr>
<h3 id="mtf群体与asd的关联" class="toc-header"><a class="toc-anchor" href="#mtf群体与asd的关联">¶</a> MTF群体与ASD的关联</h3>
<p>无法确定具体MTF患病率，因为有多个文献数值。</p>
<p>研究显示，跨性别群体尤其是MTF中ASD的患病率明显高于顺性别群体。根据研究，约<span class="text-big"><strong>24%</strong></span>的跨性别者可能伴有ASD，而顺性别群体的患病率约为5%。不过也有<a href="https://www.scirp.org/journal/paperinformation?paperid=130631" class="is-external-link">另一篇研究 </a>显示，非二元性别群体中，26.3% 的人被确诊患有ASD，跨性别群体中，<span class="text-big"><strong>31.3% </strong></span>的人被确诊患有ASD <i><strong><u>（P.S. Wiki主查到这个患病率的时候都惊了，真的很同情每个MTF，都不容易，都很孤单…）</u></strong></i></p>
<p>（数据来源：https://www.thetransmitter.org/spectrum/largest-study-to-date-confirms-overlap-between-autism-and-gender-diversity）</p>
<p>对MTF-ASD个体的特殊关怀包括社会理解、家庭支持及专业性心理咨询。MTF群体在ASD的基础上，可能更加深刻地体会到社交困难和认知差异带来的社会孤立感，因而需要更多的陪伴和理解。</p>
<p><span class="text-big"><mark class="pen-green"><strong>虽然这方面我们的调查欠缺，但是ASD有一个称之为“女性化表达特例”的泛亚型，而这才是MTF ASD患者最可能出现的特征。</strong></mark></span></p>
<h2 id="自闭症谱系中的女性化表达特例" class="toc-header"><a class="toc-anchor" href="#自闭症谱系中的女性化表达特例">¶</a> 自闭症谱系中的“女性化表达特例”</h2>
<p>（Female Autism Presentation / Gendered Expression of ASD）</p>
<hr>
<h3 id="一-背景与提出缘由" class="toc-header"><a class="toc-anchor" href="#一-背景与提出缘由">¶</a> 一、背景与提出缘由</h3>
<p>传统上，自闭症谱系障碍（ASD）的研究样本以<strong>男性儿童为主</strong>，导致现有的筛查量表、临床标准和社会刻板印象都严重倾向“男性典型表现”，从而<strong>忽略了大量女性与非典型表达者</strong>。</p>
<p>随着研究深入，人们开始意识到：</p>
<p>女性、特别是跨性别女性（MTF）中的ASD患病率<strong>被系统性低估</strong>；</p>
<p>她们的症状常被误诊为<strong>焦虑、抑郁、进食障碍、人格障碍</strong>；</p>
<p>这种“伪装”或“表演性社会适应”现象在学术上被称为：<br><strong>Masking（掩饰）或 Camouflaging（伪装适应）</strong></p>
<hr>

</figure>
<hr>
<h3 id="三-masking行为详解伪装型社交" class="toc-header"><a class="toc-anchor" href="#三-masking行为详解伪装型社交">¶</a> 三、Masking行为详解（伪装型社交）</h3>
<p>Masking指的是ASD女性/MTF患者通过模仿、学习、演示社会行为，来隐藏自身的社交困难。</p>
<p>包括但不限于：</p>
<p>记住并背诵他人使用过的“社交脚本”；</p>
<p>模拟他人的语气、姿势、反应模式；</p>
<p>强迫自己进行眼神接触、微笑等社交符号；</p>
<p>在社交场合完美应对，独处后<strong>彻底崩溃</strong>；</p>
<p>维持“完美女孩”形象，长期处于认知耗竭中。</p>
<p>Masking 在短期内能帮她们“社会生存”，但长期会造成以下副作用：</p>
<p>严重情绪耗竭；</p>
<p>自我认知迷失；</p>
<p>社交创伤与PTSD倾向；</p>
<p>被误诊为边缘型人格障碍（BPD）或抑郁症。</p>
<hr>
<h3 id="四-为何mtf群体更易出现masking" class="toc-header"><a class="toc-anchor" href="#四-为何mtf群体更易出现masking">¶</a> 四、为何MTF群体更易出现Masking？</h3>
<p>跨性别女性（MTF）群体在成长过程中：</p>
<p>面临<strong>两层性别压力</strong>（社会强加的男性性别角色+自我认同的女性角色）；</p>
<p>许多MTF在童年就展现出ASD倾向，却被迫“正常化”以避免霸凌；</p>
<p>她们往往试图掩盖所有“不符合女性形象”的表达方式，从而<strong>在Masking上发展出极致适应机制</strong>。</p>
<p>具体表现如：</p>
<p>极端控制自己的外貌、语气、肢体动作；</p>
<p>学习“女生如何聊天”“女生该如何回应问题”等社交细节；</p>
<p>对社会性别刻板的内化导致更强的自我焦虑；</p>
<p>精神上长期处于“我必须比普通女孩更像女孩”的焦灼状态。</p>
<p>这种表达特例并不代表她们的“障碍较轻”，恰恰相反，她们常常因为不被看见而长年得不到支持，误入更危险的共病，如焦虑症、抑郁症、自伤行为等。因此，临床上对ASD的识别，<strong>必须考虑性别表达差异与MTF的独特处境</strong>，制定出更细化、包容的诊断与干预策略。</p>
<h3 id="是否已有诊断工具修正这一点" class="toc-header"><a class="toc-anchor" href="#是否已有诊断工具修正这一点">¶</a> 是否已有诊断工具修正这一点？</h3>
<p>有一部分正在改良中的筛查工具，如：</p>
<p>RAADS-R 修订版对性别差异有更好包容；</p>
<p>Autism Spectrum Quotient (AQ) 有女性化问卷版本；</p>
<p>Camouflaging Autistic Traits Questionnaire（CAT-Q）专门评估 Masking 强度。</p>
<p>但目前还<strong>未有完美覆盖性别化表达差异的量表</strong>。</p>
<p><mark class="pen-red"><strong>还是那句话…针对MTF群体的精神疾病的诊断、筛查与治疗、临床关怀依旧处于一个开始阶段，前方路漫漫…</strong></mark></p>
<hr>
<h3 id="asd常见共病情况" class="toc-header"><a class="toc-anchor" href="#asd常见共病情况">¶</a> ASD常见共病情况</h3>
<p>ADHD：约30%-80%</p>
<p>抑郁症：约26%</p>
<p>焦虑障碍：约30%</p>
<p>双相情感障碍：约11%</p>
<p>精神分裂症：约7%</p>
<p>双A（AuDHD，即ADHD与ASD共病）的具体探讨将另文展开。</p>
<hr>
<h3 id="亚斯伯格综合征" class="toc-header"><a class="toc-anchor" href="#亚斯伯格综合征">¶</a> 亚斯伯格综合征</h3>
<p>亚斯伯格综合征曾被视作ASD的单独亚型（ICD-10 F84.5），在DSM-5中被纳入广泛的ASD谱系中。它的特征为明显的社交沟通困难、局限的兴趣和重复行为，但智力和语言能力通常正常甚至高于常人。</p>
<p>这种亚型往往表现出明显的高智商或特定领域的杰出才能，但同时也带来了严重的社交障碍。这是“天才病”，是gift也是curse。他们可能在科学、技术或艺术领域取得卓越成就，却难以融入社会。</p>
<p>治疗方法以行为干预和技能训练为主，药物仅用于共病症状。</p>
<hr>
<h3 id="学者综合征特殊中的特殊" class="toc-header"><a class="toc-anchor" href="#学者综合征特殊中的特殊">¶</a> 学者综合征：特殊中的特殊</h3>
<p>学者综合征（Savant Syndrome）并非严格意义上的ASD亚型，但与ASD高度相关。学者综合征患者在一般生活和社交功能受限的情况下，展现出惊人的特殊能力（如记忆力、数学计算、音乐、绘画等）。其发病机制可能涉及大脑右半球某些区域的代偿功能异常。</p>
<p>目前学者综合征的具体遗传基因未明确，但普遍认为与神经发育异常和遗传突变相关。</p>
<hr>
<h3 id="you-are-not-alone" class="toc-header"><a class="toc-anchor" href="#you-are-not-alone">¶</a> YOU ARE NOT ALONE.</h3>
<p>你可能一直在孤独中徘徊，但请记住，你并非真正的孤岛。这个世界上有人正努力理解你、靠近你。他们可能是家人、朋友，也可能是还未遇见的同伴。你的与众不同是你独特的语言，终有一天会被理解与接纳。愿每个你们，都能找到生命中的那道光，温柔地照亮你前行的路。</p>
