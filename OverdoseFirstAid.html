<p style="text-align:center;"><strong>普瑞巴林 / 右美沙芬 / 金刚烷胺 / 美金刚 / 5-MeO 类致幻剂</strong></p>
<hr>
<h2 style="text-align:center;" id="最开头的一眼对照表" class="toc-header"><a class="toc-anchor" href="#最开头的一眼对照表">¶</a> 最开头的一眼对照表：</h2>
<blockquote>
  <p style="text-align:center;"><mark class="pen-red"><strong>“一旦是这个药，第一件事干嘛？这个药最大致命点是什么？”</strong></mark></p>
</blockquote>
<p style="text-align:center;"><span class="text-big"><strong>普瑞巴林 / 加巴喷丁类（“Lyrica 等”）：</strong></span></p>
<p style="text-align:center;"><strong>第一件事：</strong> 立刻打 120，把人放侧卧位，严密看呼吸有没有变浅、变慢。</p>
<p style="text-align:center;"><strong>最大生命危险：</strong> 单吃多半是昏睡、共济失调，但<strong>与酒精 / BZD / 阿片合用时，呼吸抑制 + 昏迷</strong>是致命点。</p>
<p style="text-align:center;">&nbsp;</p>
<p style="text-align:center;"><span class="text-big"><strong>右美沙芬（DXM，感冒糖浆 / 愈美片等）：</strong></span></p>
<p style="text-align:center;"><strong>第一件事：</strong> 立刻打 120，把人拉到安静、光线暗的地方，防止跌倒，把所有感冒药瓶带上。</p>
<p style="text-align:center;"><strong>最大生命危险：</strong> <strong>血清素综合征 + 高热 + 幻觉激越 + 呼吸抑制</strong>，尤其是和 SSRI / SNRI / NaSSA 等抗抑郁药一起吃时。</p>
<p style="text-align:center;">&nbsp;</p>
<p style="text-align:center;"><span class="text-big"><strong>金刚烷胺（amantadine）：</strong></span></p>
<p style="text-align:center;"><strong>第一件事：</strong> 立刻打 120，强调“<strong>疑似金刚烷胺过量，有心律失常风险</strong>”，途中务必仰卧、不要乱动。</p>
<p style="text-align:center;"><strong>最大生命危险：</strong> <strong>严重心律失常（室速、心搏骤停）+ 癫痫 + 呼吸/循环衰竭</strong>。</p>
<p style="text-align:center;">&nbsp;</p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>美金刚（memantine）：</strong></mark></span></p>
<p style="text-align:center;"><strong>第一件事：</strong> 立刻打 120，同时量血压（能量就量），记录非常高的血压、怪异言语（鹦鹉学舌、重复语句）、幻觉。</p>
<p style="text-align:center;"><strong>最大生命危险：</strong> <strong>严重高血压、精神状态改变（激越、幻觉、木僵）、可能的心血管事件 / 抽搐</strong>。</p>
<p style="text-align:center;">&nbsp;</p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>5-MeO 类致幻剂（5-MeO-DMT 等，含“蟾蜍毒”“toad”“布福利盐酸盐”等喊法）：</strong></mark></span></p>
<p style="text-align:center;"><strong>第一件事：</strong> 立刻打 120，明确说“<strong>疑似强致幻剂 5-MeO 类吸食/使用，出现意识丧失或呼吸停顿</strong>”。</p>
<p style="text-align:center;"><strong>最大生命危险：</strong> <strong>呼吸停止 + 严重血压波动 + 血清素综合征（特别是和 MAOI、SSRI 合用时）+ 急性精神病样发作 / 跳楼坠落风险</strong>。</p>
<hr>
<h1 style="text-align:center;" id="统一前提" class="toc-header"><a class="toc-anchor" href="#统一前提">¶</a> &nbsp;统一前提</h1>
<blockquote>
  <p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>怀疑有人为了“O死自己”“大剂量OD”“试验剂量”或自杀，吞/吸了上述任一药物时：</strong></mark></span><br><span class="text-big"><mark class="pen-red"><strong>👉 第一优先永远是：立刻拨打 120（或当地急救电话）。</strong></mark></span></p>
  <p style="text-align:center;"><span class="text-big"><mark class="pen-red">本文的目的，是帮助你在<strong>等救护车的几分钟</strong>里做正确的事，</mark></span><br><span class="text-big"><mark class="pen-red">而不是教人“怎么安全玩药”。</mark></span></p>
</blockquote>
<hr>
<h1 style="text-align:center;" id="一-旁人视角你现在就能做什么" class="toc-header"><a class="toc-anchor" href="#一-旁人视角你现在就能做什么">¶</a> 一、旁人视角：你现在就能做什么？</h1>
<h2 style="text-align:center;" id="h-1-立刻打-120按药名-症状报" class="toc-header"><a class="toc-anchor" href="#h-1-立刻打-120按药名-症状报">¶</a> 1. 立刻打 120，按“药名 + 症状”报</h2>
<p style="text-align:center;">如果你知道药名，可以直接报：</p>
<p style="text-align:center;">“他可能 <strong>超过量服用</strong> 了普瑞巴林（或 Lyrica），现在非常嗜睡 / 站不稳 / 说话含糊。”</p>
<p style="text-align:center;">“她可能<strong>超过量服用</strong>了大量含右美沙芬的感冒药，现在人很兴奋、说话乱、高热出汗、手抖。”</p>
<p style="text-align:center;">“他吞了不少金刚烷胺，心跳很快、感觉很慌。”</p>
<p style="text-align:center;">“她 <strong>超过量服用</strong> 了美金刚，现在血压很高、不停重复一句话、像是在幻觉。”</p>
<p style="text-align:center;">“他抽了疑似 5-MeO 类致幻剂，现在突然倒地不动 / 呼吸很浅。”</p>
<p style="text-align:center;">你也可以只说：</p>
<blockquote>
  <p style="text-align:center;">“疑似乱吃镇静/神经类药物 <strong>超过量服用</strong>，现在出现（昏睡 / 抽搐 / 幻觉 / 高热 / 呼吸变慢），需要急救指导。”</p>
</blockquote>
<hr>
<h2 style="text-align:center;" id="h-2-现场四件事" class="toc-header"><a class="toc-anchor" href="#h-2-现场四件事">¶</a> 2. 现场四件事</h2>
<p style="text-align:center;"><strong>把人移到安全位置</strong></p>
<p style="text-align:center;">远离窗户、阳台、楼梯、浴室。</p>
<p style="text-align:center;"><mark class="pen-red">对致幻剂（5-MeO / 大量 DXM）时期尤其重要，防跳楼 / 误伤他人。</mark></p>
<p style="text-align:center;"><strong>体位：侧卧位 + 清理口鼻</strong></p>
<p style="text-align:center;">预防呕吐物吸入。</p>
<p style="text-align:center;">若有假牙 /口腔异物取出。</p>
<p style="text-align:center;"><strong>看三样东西：呼吸 / 意识 / 体温</strong></p>
<p style="text-align:center;">呼吸：有没有变得<strong>很浅、很慢、打呼噜样呼吸</strong>？</p>
<p style="text-align:center;">意识：还能回答问题吗？有没有忽然叫不醒？</p>
<p style="text-align:center;">体温：明显烫手、出汗、高热（&gt;38.5°C）就是危险信号。</p>
<p style="text-align:center;"><mark class="pen-red"><strong>收集所有药物包装 / 瓶子</strong></mark></p>
<p style="text-align:center;"><mark class="pen-red">普瑞巴林 / 加巴喷丁 / 右美沙芬感冒药盒 / 金刚烷胺 / 美金刚 / 任何一起吃的抗抑郁药 / BZD / 止痛药。</mark></p>
<p style="text-align:center;"><mark class="pen-red">用袋子打包带去医院，<strong>医生宁愿多看几种药，也不要瞎猜</strong>。</mark></p>
<hr>
<h2 style="text-align:center;" id="h-3-千万不要做的几件事" class="toc-header"><a class="toc-anchor" href="#h-3-千万不要做的几件事">¶</a> 3. 千万不要做的几件事</h2>
<p style="text-align:center;"><span class="text-big">❌ <strong>不要强行催吐</strong></span><br><span class="text-big">❌ <strong>不要再给酒 / 能量饮料 / 咖啡 / “压一压”</strong></span><br><span class="text-big">❌ <strong>不要给更多镇静药（BZD、安眠药）想让他“睡过去”</strong></span><br><span class="text-big">❌ 对致幻剂 OD：不要跟他理论、争吵，更不要“刺激刺激他让他清醒”，只需<strong>简短安抚 + 物理隔离危险</strong></span>。</p>
<hr>
<h1 style="text-align:center;" id="二-本人视角如果你自己在-od-或刚刚乱吃完" class="toc-header"><a class="toc-anchor" href="#二-本人视角如果你自己在-od-或刚刚乱吃完">¶</a> 二、本人视角：如果你自己在 OD 或刚刚乱吃完</h1>
<blockquote>
  <p style="text-align:center;"><mark class="pen-red"><strong>如果你还能打开 wiki 看字，说明你还在“可以被救回来”的范围内。</strong></mark></p>
</blockquote>
<p style="text-align:center;"><mark class="pen-red"><strong>这些药物的共同点是：</strong></mark></p>
<p style="text-align:center;"><mark class="pen-red"><strong>并不可靠致死，但很容易让你</strong></mark></p>
<blockquote>
  <p style="text-align:center;"><mark class="pen-red"><strong>经历极其难受的幻觉 / 恐惧</strong></mark></p>
  <p style="text-align:center;"><mark class="pen-red"><strong>抽搐、昏迷</strong></mark></p>
  <p style="text-align:center;"><mark class="pen-red"><strong>心律失常、高血压危象</strong></mark></p>
  <p style="text-align:center;"><mark class="pen-red"><strong>留下一堆你未来会极度后悔的后遗症</strong></mark></p>
</blockquote>
<p style="text-align:center;"><mark class="pen-red"><strong>如果你是“为了试剂量、实验、或者情绪崩了想一把冲”的那种：</strong></mark></p>
<p style="text-align:center;"><mark class="pen-red"><strong>现在立刻打 120，讲清楚你吃了什么。</strong></mark></p>
<p style="text-align:center;"><mark class="pen-red"><strong>不要怕“被骂”“被记录”“被家长知道”。</strong></mark></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red"><strong>真正会毁掉人生的，是脑子坏掉/肾衰/心律失常，而不是在急诊挂一晚盐水。</strong></mark></span></p>
<hr>
<h1 style="text-align:center;" id="三-药理-中毒机制" class="toc-header"><a class="toc-anchor" href="#三-药理-中毒机制">¶</a> 三、药理 &amp; 中毒机制</h1>
<h2 style="text-align:center;" id="h-1-普瑞巴林-加巴喷丁类" class="toc-header"><a class="toc-anchor" href="#h-1-普瑞巴林-加巴喷丁类">¶</a> 1. 普瑞巴林 / 加巴喷丁类</h2>
<p style="text-align:center;">结构类似 GABA，但实际通过<strong>抑制钙通道</strong>来减弱神经元放电。</p>
<p style="text-align:center;">治疗剂量下：镇静、抗惊厥、止神经痛。</p>
<p style="text-align:center;"><strong>超过量服用</strong>：<strong>强镇静，步态不稳，眼球震颤，语言含糊</strong>，重者抽搐、昏迷。</p>
<p style="text-align:center;">单药过量多数为可逆，但与酒 / BZD / 阿片同服时 → 呼吸抑制致死。</p>
<h2 style="text-align:center;" id="h-2-右美沙芬dxm" class="toc-header"><a class="toc-anchor" href="#h-2-右美沙芬dxm">¶</a> 2. 右美沙芬（DXM）</h2>
<p style="text-align:center;">本质是咳嗽药，<strong>高剂量时是 NMDA 拮抗剂 + SRI（抑制 5-HT 回收）</strong>。</p>
<p style="text-align:center;"><strong>超过量服用</strong>：解离感、步态不稳、幻觉、攻击性、心率加快、血压升高。</p>
<p style="text-align:center;">与 SSRI / SNRI / NaSSA / MAOI 合用 → <strong>血清素综合征（高热 + 肌强直 + 意识改变）</strong>。</p>
<h2 style="text-align:center;" id="h-3-金刚烷胺amantadine" class="toc-header"><a class="toc-anchor" href="#h-3-金刚烷胺amantadine">¶</a> 3. 金刚烷胺（amantadine）</h2>
<p style="text-align:center;">早期抗流感 + 帕金森病药，<strong>弱 NMDA 拮抗 + 多巴胺释放</strong>。</p>
<p style="text-align:center;"><strong>超过量服用</strong>：</p>
<p style="text-align:center;">中枢兴奋：激越、幻觉、癫痫、昏迷；</p>
<p style="text-align:center;">心血管：<strong>室性心律失常、心动过速、高血压甚至心搏骤停</strong>；</p>
<p style="text-align:center;">肾功能不全时毒性更重。</p>
<h2 style="text-align:center;" id="h-4-美金刚memantine" class="toc-header"><a class="toc-anchor" href="#h-4-美金刚memantine">¶</a> 4. 美金刚（memantine）</h2>
<p style="text-align:center;">也是 NMDA 拮抗剂（阿尔茨海默症药），理论上“神经保护”，<br>但 OD 时会反过来变成神经系统混乱源头。</p>
<p style="text-align:center;"><strong>超过量服用</strong>：<strong>高血压急症、激越、幻觉、木僵、鹦鹉学舌式语言（echolalia）</strong> 等奇怪精神表现。</p>
<h2 style="text-align:center;" id="h-5-5-meo-类致幻剂5-meo-dmt-等" class="toc-header"><a class="toc-anchor" href="#h-5-5-meo-类致幻剂5-meo-dmt-等">¶</a> 5. 5-MeO 类致幻剂（5-MeO-DMT 等）</h2>
<p style="text-align:center;">强力 5-HT 受体激动剂，几秒到几十秒内进入极端解离/致幻状态。</p>
<p style="text-align:center;"><strong>超过量服用</strong>：</p>
<p style="text-align:center;">瞬间意识丧失 / 倒地不动 / 呼吸停顿</p>
<p style="text-align:center;">血压剧烈波动、心律失常</p>
<p style="text-align:center;">血清素综合征（尤其与 MAOI/SSRI 合用）</p>
<p style="text-align:center;">急性精神病样发作，强烈恐惧、躁动，极高坠楼/自残风险。</p>
<hr>
<h1 style="text-align:center;" id="四-各药物现场表现-急救要点" class="toc-header"><a class="toc-anchor" href="#四-各药物现场表现-急救要点">¶</a> 四、各药物现场表现 &amp; 急救要点</h1>
<h2 style="text-align:center;" id="a-普瑞巴林-加巴喷丁" class="toc-header"><a class="toc-anchor" href="#a-普瑞巴林-加巴喷丁">¶</a> A. 普瑞巴林 / 加巴喷丁</h2>
<p style="text-align:center;"><strong>常见表现：</strong></p>
<p style="text-align:center;">昏昏欲睡、叫一叫能醒、说话含糊</p>
<p style="text-align:center;">摇摇晃晃、走路像醉酒</p>
<p style="text-align:center;">眼球左右抖（眼震）</p>
<p style="text-align:center;">大汗、恶心、呕吐</p>
<p style="text-align:center;">严重时：意识下降、癫痫、呼吸变浅</p>
<p style="text-align:center;"><strong>旁人急救重点：</strong></p>
<p style="text-align:center;"><strong>当成“有呼吸抑制风险的镇静药 OD”处理。</strong></p>
<p style="text-align:center;">侧卧位 + 不离人 + 看胸廓起伏。</p>
<p style="text-align:center;">若和酒/BZD/阿片同服：要对 120 特别强调这一点。</p>
<p style="text-align:center;">不要再加任何镇静类药（包括“只是两片褪黑素”）。</p>
<hr>
<h2 style="text-align:center;" id="b-右美沙芬dxm" class="toc-header"><a class="toc-anchor" href="#b-右美沙芬dxm">¶</a> B. 右美沙芬（DXM）</h2>
<p style="text-align:center;"><strong>典型表现：</strong></p>
<p style="text-align:center;">解离感：人说“我像飘起来 / 不在这个世界上”</p>
<p style="text-align:center;">话多，逻辑混乱，或突然沉默僵住</p>
<p style="text-align:center;">共济失调：站不稳、走路撞墙</p>
<p style="text-align:center;">视觉听觉幻觉</p>
<p style="text-align:center;">心跳快、血压升、瞳孔放大</p>
<p style="text-align:center;">若合并抗抑郁药 → <span class="text-big"><mark class="pen-red">警惕<strong>血清素综合征：</strong></mark></span></p>
<p style="text-align:center;">高热、大汗、肌肉僵硬、肌肉震颤</p>
<p style="text-align:center;">意识混乱、说话胡言乱语</p>
<p style="text-align:center;">有可能短时间内发展为多器官衰竭</p>
<p style="text-align:center;"><strong>旁人急救重点：</strong></p>
<p style="text-align:center;">把人移到<strong>安全、安静、光线偏暗</strong>的房间，避免刺激加重激越。</p>
<p style="text-align:center;">不要拉出去风景区散心、不要让他开车/走楼梯。</p>
<p style="text-align:center;">检查是否同时在吃<strong>抗抑郁药/NaSSA/BZDs</strong>，把所有药都带去急诊。</p>
<hr>
<h2 style="text-align:center;" id="c-金刚烷胺amantadine" class="toc-header"><a class="toc-anchor" href="#c-金刚烷胺amantadine">¶</a> C. 金刚烷胺（amantadine）</h2>
<p style="text-align:center;"><strong>典型表现：</strong></p>
<p style="text-align:center;">焦躁、激越、失眠、幻觉</p>
<p style="text-align:center;">心跳明显加快，心悸</p>
<p style="text-align:center;">高血压，甚至胸痛</p>
<p style="text-align:center;">可能出现癫痫、意识障碍</p>
<p style="text-align:center;">有报道：1–2 g 范围内即可出现<strong>室性心律失常、心搏骤停</strong></p>
<p style="text-align:center;"><strong>旁人急救重点：</strong></p>
<p style="text-align:center;"><strong>关键：马上给 120 提醒“可能有恶性心律失常”</strong>。</p>
<p style="text-align:center;">让病人平躺，避免用力活动（心肌耗氧增加 → 心律更乱）。</p>
<p style="text-align:center;">不要给含肾上腺素样作用的药（普通人现场也基本给不到，提醒就行）。</p>
<hr>
<h2 style="text-align:center;" id="d-美金刚memantine" class="toc-header"><a class="toc-anchor" href="#d-美金刚memantine">¶</a> D. 美金刚（memantine）</h2>
<p style="text-align:center;"><strong>典型表现（根据近年病例）：</strong></p>
<p style="text-align:center;">行为怪异、定向力差</p>
<p style="text-align:center;"><strong>鹦鹉学舌式重复某句话（echolalia）</strong></p>
<p style="text-align:center;">幻觉、激越、或木僵</p>
<p style="text-align:center;">血压显著升高（高血压急症）</p>
<p style="text-align:center;"><strong>旁人急救重点：</strong></p>
<p style="text-align:center;">有血压计就量，记录具体数值（比如 180/110）。</p>
<p style="text-align:center;">如果有心脏病 / 脑血管病史，要在电话里说明。</p>
<p style="text-align:center;">不要自己乱用降压药硬压（有些药物与中枢兴奋状态搭配会更糟）。</p>
<hr>
<h2 style="text-align:center;" id="e-5-meo-类致幻剂5-meo-dmt-等" class="toc-header"><a class="toc-anchor" href="#e-5-meo-类致幻剂5-meo-dmt-等">¶</a> E. 5-MeO 类致幻剂（5-MeO-DMT 等）</h2>
<p style="text-align:center;"><strong>典型表现（OD / 强烈反应）：</strong></p>
<p style="text-align:center;">几秒钟内突然倒地、翻白眼、失去反应</p>
<p style="text-align:center;">呼吸暂停或极浅、唇色发紫</p>
<p style="text-align:center;">一过性极度血压升高或后续低血压、心律不齐</p>
<p style="text-align:center;">惊恐尖叫、极端恐惧、暴力挣扎</p>
<p style="text-align:center;">和 MAOI 或 SSRI/SNRI 同用时：<strong>血清素综合征 + 高热</strong></p>
<p style="text-align:center;"><strong>旁人急救重点：</strong></p>
<p style="text-align:center;"><strong>第一时间判断有没有呼吸</strong>，如无呼吸需立即进行基础心肺复苏（CPR），同时 120。</p>
<p style="text-align:center;">迅速清理周围危险物：玻璃、刀具、阳台门、窗户。</p>
<p style="text-align:center;">不要试图“用力按住他的四肢”——防止他撞伤头部是首要。</p>
<p style="text-align:center;">现场不要再给任何药物（包括 BZD），交给急诊医生处理。</p>
<hr>
<h1 style="text-align:center;" id="五-联用-混搭风险一览" class="toc-header"><a class="toc-anchor" href="#五-联用-混搭风险一览">¶</a> 五、联用 &amp; “混搭”风险一览</h1>
<blockquote>
  <p style="text-align:center;">这一节更多内容在“多药联用急救指南”篇里展开，这里只简要一说：</p>
</blockquote>
<p style="text-align:center;"><strong>普瑞巴林 / 加巴喷丁 + 阿片 + 酒精 / BZD</strong><br>→ <strong>呼吸抑制 + 昏迷 + 死亡</strong>。</p>
<p style="text-align:center;"><strong>右美沙芬 + SSRI / SNRI / NaSSA / MAOI</strong><br>→ 血清素综合征，高热 + 肌强直 + 癫痫。</p>
<p style="text-align:center;"><strong>金刚烷胺 + 其他心脏刺激药 / 抗胆碱药</strong><br>→ 心律失常风险增高。</p>
<p style="text-align:center;"><strong>美金刚 + 其他影响血压/心率的药（包括某些抗精神病药）</strong><br>→ 高血压危象 / 心律问题更难评估。</p>
<p style="text-align:center;"><strong>5-MeO-DMT + MAOI / SSRI / SNRI</strong><br>→ 重度血清素综合征 + 血压极端波动 + 死亡风险显著上升。</p>
<p style="text-align:center;"><strong>结论：</strong></p>
<blockquote>
  <p style="text-align:center;">不要幻想“用别的药去压住这一个药”，<br>在 OD 场景里你唯一该做的是：<strong>叫救护车 + 保命，不是当自己的毒理科医生。</strong></p>
</blockquote>
<hr>
<h1 style="text-align:center;" id="六-写给在玩这些药-或准备靠它们解决问题的人" class="toc-header"><a class="toc-anchor" href="#六-写给在玩这些药-或准备靠它们解决问题的人">¶</a> 六、写给在玩这些药、或准备“靠它们解决问题”的人</h1>
<p style="text-align:center;">很现实地说：</p>
<p style="text-align:center;"><span class="text-huge"><mark class="pen-red"><strong>垃圾，都是垃圾。</strong></mark></span></p>
<p style="text-align:center;"><span class="text-big"><mark class="pen-red">普瑞巴林 / DXM / 金刚烷胺 / 美金刚 / 5-MeO 这堆东西</mark></span><br><span class="text-big"><mark class="pen-red">从来都不是什么“高级玩法”，在急诊医生眼里，它们就是<strong>一堆烂摊子的来源</strong>。</mark></span></p>
<p style="text-align:center;">它们共同的特点是：</p>
<p style="text-align:center;"><strong>体验极不稳定</strong></p>
<p style="text-align:center;">同样剂量，有人说“还好”，有人直接进 ICU。</p>
<p style="text-align:center;">有肾功能、心脏、精神基础问题的人更容易被秒杀。</p>
<p style="text-align:center;"><strong>致死不“干净”</strong></p>
<p style="text-align:center;">大部分 OD 死亡前经历的是<strong>长时间的恐惧、抽搐、高热、窒息感</strong>。</p>
<p style="text-align:center;">没死成的，很可能带着<strong>认知损害、肾损伤、创伤后应激</strong>活下去。</p>
<p style="text-align:center;"><strong>你以为“不会轮到我”</strong></p>
<p style="text-align:center;">那些病例里的小孩 / 年轻人，也都是这么想的。</p>
<p style="text-align:center;">如果你已经 OD，或者正在考虑“用药物解决一切”，<br>你能做到的最酷的一件事，是承认：</p>
<blockquote>
  <p style="text-align:center;">“我搞砸了 / 我现在很危险，但我愿意让人来救我。”</p>
</blockquote>
<p style="text-align:center;">打 120，不是失败。<br>那是你在对未来的自己说：“你还有资格活着骂现在的自己蠢。”</p>
<p style="text-align:center;"><br><span class="text-huge"><mark class="pen-red"><strong>珍爱生命，远离OD。</strong></mark></span></p>
<p style="text-align:center;"><span class="text-huge"><mark class="pen-red"><strong>珍爱生命，远离OD。</strong></mark></span></p>
<p style="text-align:center;"><span class="text-huge"><mark class="pen-red"><strong>珍爱生命，远离OD。</strong></mark></span></p>
<p style="text-align:center;"><span class="text-huge"><mark class="pen-red"><strong>珍爱生命，远离OD。</strong></mark></span></p>

<p>&nbsp;</p>
