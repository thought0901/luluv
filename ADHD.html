1Yi5jb20vb3JnL3JlcG8vYmxvYi9tYWluL3tmaWxlbmFtZX0ifQ==" filename="ADHD.html"><template slot="contents"><div><h2 id="注意缺陷与多动障碍" class="toc-header"><a class="toc-anchor" href="#注意缺陷与多动障碍">¶</a> 注意缺陷与多动障碍</h2>
<p><mark class="pen-green">注：注意缺陷与多动障碍不属于广义上的精神疾病，关于它定性为精神疾病存在许多争议，严格来说它属于“神经发育障碍”。</mark></p>
<h3 id="关于adhd" class="toc-header"><a class="toc-anchor" href="#关于adhd">¶</a> 关于ADHD</h3>
<p><span class="text-big">注意缺陷与多动障碍（Attention Deficit Hyperactivity Disorder, ADHD），俗称“多动症”，是一种常见的神经发育障碍，常见于儿童，也可持续至成年。ADHD的发病机制十分复杂，涉及遗传、环境、神经发育及生化因素。它并不是简单的“好动”或“注意力差”，而是一种 <strong>基因驱动的大脑执行功能障碍</strong>，其发病机制涉及多巴胺系统、前额叶皮层发育延迟、神经网络调节异常等。ADHD 一般在儿童期发病，但<strong>70%以上的患者会延续到成年</strong>，对学习、工作、人际、亲密关系都造成深远影响。</span></p>
<p>&nbsp;</p>
<p><strong>ADHD主要表现为三种症状：注意力不集中（注意缺陷型，ADHD-I）、多动冲动（多动冲动型，ADHD-HI）和两者兼有（混合型，ADHD-C）。</strong></p>
<blockquote>
  <p><strong>注意缺陷型（ADHD-I）</strong>：经常丢三落四、无法长时间专注于任务，表现出“云里雾里”。</p>
  <p><strong>多动冲动型（ADHD-HI）</strong>：无法静坐、说话冲动，常被形容为“上蹿下跳”。</p>
  <p><strong>混合型（ADHD-C）</strong>：结合以上两者症状，是最常见类型。</p>
</blockquote>
<p>ADHD的症状通常在7岁以前显现。</p>
<p>家长描述举例：</p>
<blockquote>
  <p>ADHD-I：“他好像总在发呆，我说什么他都没听到。”</p>
  <p>ADHD-HI：“他就像发动机，从起床到睡觉一刻不停。”</p>
  <p>ADHD-C：“在学校坐不住，回家写作业也三心二意，真不知道该怎么办。”</p>
</blockquote>
<p>成年后的ADHD常见特征表现如下：</p>
<p><strong>对不感兴趣的事物无法维持专注</strong>：例如阅读无趣的文件、开会、听课等极易走神。</p>
<p><strong>三分钟热度</strong>：对新鲜事物充满兴趣，但极难长期坚持，计划频繁变动。</p>
<p><strong>情绪驱动型消费行为</strong>：常在情绪波动时进行非理性购物，事后后悔。</p>
<p><strong>超专注（Hyperfocus）</strong>：在极感兴趣的领域（如游戏、绘画、写作、编程）中可持续专注数小时，反而对日常琐事极度分心。</p>
<p><strong>注意力漂移</strong>：他人说话超过一分钟后便难以集中，脑中开始联想、出神。</p>
<p><strong>健忘与失误频发</strong>：常忘记钥匙、手机、水杯等，重复确认是否关灯、关火。</p>
<p><strong>话语失焦</strong>：一句话刚说完，立刻忘了前半句内容或自己的逻辑走向。</p>
<p>&nbsp;</p>
<h3 id="adhd人群普遍擅长与不擅长的领域" class="toc-header"><a class="toc-anchor" href="#adhd人群普遍擅长与不擅长的领域">¶</a> ADHD人群普遍擅长与不擅长的领域</h3>
<h4 id="adhd人群相对擅长" class="toc-header"><a class="toc-anchor" href="#adhd人群相对擅长">¶</a> &nbsp;ADHD人群相对擅长：</h4>
<p>创造性工作：艺术、写作、音乐、设计、编程等高自由度任务。</p>
<p>危机应对：在紧张环境中反应快，灵活变通。</p>
<p>多任务处理（短时间内切换）：某些 ADHD 人具备在杂乱环境中处理多个事务的能力。</p>
<p>沟通与即兴表达：部分 ADHD 人具有外向性格，擅长社交、演讲、快速应对场面变化。</p>
<h4 id="adhd人群常见困难" class="toc-header"><a class="toc-anchor" href="#adhd人群常见困难">¶</a> &nbsp;ADHD人群常见困难：</h4>
<p>规律重复任务：如打卡、表格填写、流程类行政工作。</p>
<p>时间管理：容易错过会议、拖延任务、计划执行力弱。</p>
<p>自我监督与持续性任务：很难维持长期项目，如论文写作、长周期锻炼。</p>
<p>财务管理：消费行为冲动，常有经济控制问题。</p>
<p>情绪稳定：共病焦虑或轻度抑郁者常表现为情绪易波动、难以调节。</p>
<p>&nbsp;</p>
<h3 id="发病机制与遗传因素" class="toc-header"><a class="toc-anchor" href="#发病机制与遗传因素">¶</a> 发病机制与遗传因素</h3>
<p>ADHD患者的大脑前额叶和纹状体区域存在<mark class="marker-yellow"><strong>多巴胺和去甲肾上腺素水平较低</strong></mark>的现象，导致注意力调节困难和冲动控制障碍。<mark class="marker-yellow">遗传因素占ADHD发病风险的约70-80%，高度遗传性显著。</mark></p>
<p>ADHD相关基因包括DRD4、DAT1、COMT以及可能涉及神经突触发育的<mark class="marker-yellow">SHANK3基因</mark>。尤其值得注意的是，<mark class="marker-yellow">SHANK3基因</mark>异常不仅出现在ASD患者中，最新研究表明也可能与ADHD、精神分裂症相关联，这或许解释了这几种障碍临床症状的部分重叠。</p>
<h3 id="标准诊断分类代码" class="toc-header"><a class="toc-anchor" href="#标准诊断分类代码">¶</a> 标准诊断分类代码</h3>
<p><strong>ICD-10</strong>: F90.0（多动障碍）、F90.1（多动伴行为障碍）、F90.8、F90.9</p>
<p><strong>ICD-11</strong>: 6A05（注意缺陷多动障碍）</p>
<p><strong>DSM-5</strong>: 314.00（注意缺陷型）、314.01（多动冲动型、混合型）</p>

<h3 id="临床治疗与药物控制" class="toc-header"><a class="toc-anchor" href="#临床治疗与药物控制">¶</a> 临床治疗与药物控制</h3>
<p>目前国内治疗方式包括药物、行为干预及认知训练。</p>
<p>常用药物：</p>
<p><mark class="pen-red"><strong>中枢兴奋剂</strong></mark>：<mark class="marker-green">专注达（哌甲酯）</mark>，提高大脑多巴胺水平。</p>
<p><strong>非兴奋剂类药物</strong>：<mark class="marker-green">托莫西汀（Strattera）</mark>，提高去甲肾上腺素水平，间接改善前额叶功能。</p>
<p>&nbsp;</p>
<h3 id="mtf群体与adhd的关联" class="toc-header"><a class="toc-anchor" href="#mtf群体与adhd的关联">¶</a> MTF群体与ADHD的关联</h3>

  <p>暂无可靠的患病率数据，待更新</p>

<h3 id="adhd常见共病情况" class="toc-header"><a class="toc-anchor" href="#adhd常见共病情况">¶</a> ADHD常见共病情况</h3>
<p>抑郁症：18.6%</p>
<p>双相情感障碍：10%-20%</p>
<p>精神分裂症：4%-7%</p>
<p>自闭症谱系障碍（ASD）：30%-80%（<a href="https://psychscenehub.com/psychinsights/adhd-and-autism-comorbidity-a-comprehensive-review" class="is-external-link">https://psychscenehub.com/psychinsights/adhd-and-autism-comorbidity-a-comprehensive-review</a>）</p>
<p>“双A”（AuDHD，ADHD与ASD共病）的详细内容将另文详细阐述。</p>
<p><mark class="pen-red">*ADHD与双相情感障碍/抑郁症在症状上有一定的重叠，例如注意力不集中、情绪波动等，这极有可能导致误诊，且因为具有确诊成人ADHD资质的医生极少所以国内的误诊率很高。然而，研究也表明，ADHD与这些情绪障碍之间存在实际的共病关系，尤其是在成人ADHD患者中 。因此，临床上需要仔细评估患者的症状，以区分是共病还是误诊。</mark></p>
<p>&nbsp;</p>
<h3 id="成人adhd的艰难诊断之路" class="toc-header"><a class="toc-anchor" href="#成人adhd的艰难诊断之路">¶</a> 成人ADHD的艰难诊断之路</h3>
<p>成人ADHD的诊断过程非常非常非常复杂，通常至少需要：本人、父母同时在场提供详细童年史，填写诊断量表，有时甚至需联系过去的老师。然而，能确诊成人ADHD的医生和医疗机构极少。如需查找所在城市的成人ADHD确诊医院与医生，建议关注微信公众号：<span class="text-big"><strong>青衫Neuro</strong></span>。</p>
<p><i>(P.S. Wiki主是在和临心科室里的医生聊天时偶然提到幼年故事后，医生让我去看看我可能有ADHD，于是我去了，于是我真的有…)</i></p>
<figure class="image image_resized" style="width:75.71%;"><img src="/adhd.png"></figure>

<h3 id="adhd药物发展简史" class="toc-header"><a class="toc-anchor" href="#adhd药物发展简史">¶</a> ADHD药物发展简史</h3>
<p><mark class="marker-green">专注达（哌甲酯）</mark>的前身为<mark class="marker-yellow">利他林 ( Ritalin )</mark>，于1955年问世，后<mark class="marker-pink">苯丙胺类兴奋剂药物(例如Adderall)</mark>被研发用于治疗ADHD。非兴奋剂类药物如<mark class="marker-green">托莫西汀</mark>在2002年获批，提供了一种较温和的治疗选择。</p>
<p><span class="text-small">P.S. 讲人话很好理解，ADHD缺多巴胺，利他林和苯丙胺的药理不同，利他林抑制再摄取，苯丙胺直接促进释放，最终同样的结果是脑内多巴胺水平上升，苯丙胺加上甲基，就是甲基苯丙胺，就是俗称的毒品“冰毒”。如果你看过绝命毒师你就会知道，吸了冰的人会特别专注的做某一件事例如挖土挖整整三天，这就是因为冰毒给多巴胺水平拉爆了，而弱化再弱化再变成抑制再摄取，再缓释，就变成了现在的专注达，你吃了专注达以后，能够专心的做事情了，这也就是为什么专注达被列为精神一类药物，因为任何无处方无确诊非法使用专注达的行为直接属于吸毒。</span></p>
<p><span class="text-big"><strong>*也正因此，ADHD</strong><mark class="pen-red"><strong>滥用药物或滥用成瘾性物质</strong></mark><strong>的概率要高非常，非常，非常多，奖赏回路的问题会影响很多方面。</strong></span></p>
<p>&nbsp;</p>
<p><mark class="marker-green">安非他酮（Bupropion）</mark>是唯一一种兼具<mark class="marker-green">抗抑郁和改善ADHD功能的抗抑郁药</mark>，但双相障碍患者需谨慎使用，因其可能诱发躁狂发作。</p>
<p>&nbsp;</p>
<h3 id="adhd药物与hrt的联用风险" class="toc-header"><a class="toc-anchor" href="#adhd药物与hrt的联用风险">¶</a> ADHD药物与HRT的联用风险</h3>
<p>ADHD药物与跨性别群体的激素替代疗法（HRT）用药联用时，一般安全，但应注意以下事项：</p>
<p>CPA（色普龙）可能导致情绪波动，建议观察与ADHD药物联用时的心理状态变化。</p>
<p>补佳乐、螺内酯、比卡鲁胺一般不会与ADHD药物发生严重相互作用，但仍需定期监测肝肾功能和心理状态。</p>
<p>&nbsp;</p>
<h3 id="adhd与阿尔茨海默症的潜在关联" class="toc-header"><a class="toc-anchor" href="#adhd与阿尔茨海默症的潜在关联">¶</a> ADHD与阿尔茨海默症的潜在关联</h3>
<p>尽管 ADHD 与阿尔茨海默症（AD）属于不同领域的神经疾病，但近期研究发现两者在某些生物标志物和遗传基础上可能存在交集：</p>
<p><mark class="marker-yellow"><strong>SHANK3基因缺陷</strong></mark>：该基因影响突触功能，是 ADHD、ASD 、阿尔茨海默症、双相情感障碍、精神分裂症、抑郁症可能的共同风险因子。（SHANK3你坏事做尽）</p>
<p><strong>BDNF（脑源性神经营养因子）</strong>：该蛋白在神经元可塑性中扮演重要角色，其表达异常在 ADHD 与 AD 中均有观察到。</p>
<p><strong>神经炎症与突触退化</strong>：长期未治疗的 ADHD 患者在中年后表现出更多认知退化风险，可能因慢性压力与神经系统失调所致。</p>
<blockquote>
  <p>来源：Cortese, S. et al. (2021). <i>ADHD and dementia: A potential shared neurodevelopmental pathway</i>. DOI: 10.1016/j.neubiorev.2021.01.010</p>
  <p>Hallowell EM, Ratey JJ. <i>Delivered from Distraction: Getting the Most out of Life with Attention Deficit Disorder</i>. (2005)</p>
</blockquote>
<p><i><strong>（简而言之，ADHD确实是更容易患阿尔兹海默症，平时多做脑训练保持脑区域活跃）</strong></i></p>
<p>&nbsp;</p>
<h3 id="如何改善adhd生活质量" class="toc-header"><a class="toc-anchor" href="#如何改善adhd生活质量">¶</a> 如何改善ADHD生活质量</h3>
<p>ADHD并非只有负面影响，患者应善用自身的“超专注”（Hyperfocus）能力，从事喜爱的工作和兴趣领域，实现个人优势。专注达无需每日服用，休息日或非专注任务日可停药，以防止耐药性。</p>
<p>&nbsp;</p>
<h3 id="做个精彩的问题孩子" class="toc-header"><a class="toc-anchor" href="#做个精彩的问题孩子">¶</a> 做个精彩的“问题孩子”</h3>
<p><strong>从童年至成人，ADHD患者经常被贴上“问题孩子”的标签。然而，历史上许多杰出人物都有ADHD，他们因独特的思维模式和超强的专注能力而卓越不凡。“问题孩子”同样可以活得精彩，甚至更出彩，更自由。每一位“问题孩子”都有机会闯出属于自己的天地，问题孩子也能成为漂亮的女生，活出比普通孩子更耀眼的人生。</strong></p>
<p>&nbsp;</p>
