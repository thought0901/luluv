<h3 id="使用警告本页面涉及的绝大多数药物属于中国精神药品管理办法第二类精神药品" class="toc-header"><a class="toc-anchor" href="#使用警告本页面涉及的绝大多数药物属于中国精神药品管理办法第二类精神药品">¶</a> <span class="text-huge"><mark class="pen-red">使用警告：本页面涉及的绝大多数药物属于<strong>中国《精神药品管理办法》<u>第二类精神药品</u></strong></mark></span></h3>
<p><span class="text-big"><mark class="pen-red"><strong>这些药物的处方、使用、携带、转让皆受到严格管控。请务必重视以下风险：</strong></mark></span></p>
<p><span class="text-big"><mark class="pen-red"><strong>非处方获取或滥用这类药物，若被抽血或尿检发现特定代谢物浓度超标，将可能被认定为<u>吸毒行为</u>，构成<u>刑事风险</u>。</strong></mark></span></p>
<p><span class="text-big"><mark class="pen-red"><strong>擅自转赠、线上交换、转卖精神二类处方药，即便无盈利行为，也可能因情节而触犯“<u>非法贩卖精神药品</u>”相关法律。</strong></mark></span></p>
<p><span class="text-big"><mark class="pen-red"><strong>部分强效镇静剂（如某些苯二氮䓬类药物），在高剂量或联合用药下存在致命性呼吸抑制风险，尤其应避免与酒精、阿片类或其他镇静剂同服。</strong></mark></span></p>
<p><span class="text-big"><mark class="marker-yellow"><strong>本页面仅用于精神药理学科普，严禁将所列药物用于非医疗目的，并建议患者严格依医嘱使用、妥善保管、切勿擅自调整剂量或与他人分享药物。</strong></mark></span></p>
<hr>
<h2 id="为什么要使用镇静药" class="toc-header"><a class="toc-anchor" href="#为什么要使用镇静药">¶</a> 为什么要使用镇静药？</h2>
<p>镇静安眠药是一类通过作用于中枢神经系统，<strong>降低神经兴奋性、促进放松与睡眠</strong>的药物。其适应症并不局限于“睡不着”这一日常语言所能涵盖的问题，而广泛用于：</p>
<p>急性失眠发作、时差综合征、倒班障碍等睡眠障碍</p>
<p>焦虑、惊恐、戒断等导致的神经系统过度激活</p>
<p>围手术期镇静、神经科癫痫发作的急救</p>
<p>某些精神科患者的过度兴奋与失控情绪管理</p>
<p>多数此类药物具备“短效、快起效”的药理特征，但也因此存在<strong>极易依赖</strong>与<strong>快速耐受</strong>的问题。部分药物在极低剂量下即可产生镇静或记忆障碍作用，因此也成为<strong>犯罪滥用的高风险药物</strong>之一。</p>
<hr>
<h2 id="镇静安眠药的艰难发展历程" class="toc-header"><a class="toc-anchor" href="#镇静安眠药的艰难发展历程">¶</a> 镇静安眠药的艰难发展历程</h2>
<p>“安眠药”作为一个历史悠久但命运坎坷的药物门类，经历了数代更迭：</p>
<p><strong>巴比妥类药物</strong>于20世纪初进入临床，被视为“万能的镇静剂”，但随即因耐受性强、戒断反跳严重、过量死亡率极高而被淘汰。</p>
<p><strong>苯二氮䓬类药物</strong>在1960年代问世，被誉为“更安全的替代品”，短期内广泛应用于焦虑与失眠。但数十年后，<strong>滥用与依赖问题依旧未解</strong>，大量国家将其列入高度管制。</p>
<p>进入21世纪后，<strong>Z药</strong>与<strong>非GABA路径药物</strong>（如褪黑素受体激动剂、食欲素受体拮抗剂）成为替代希望，然而其<strong>总体疗效提升有限</strong>，而副作用与价格问题又限制了普及。</p>
<p>至今，镇静安眠药依然是<strong>精神科处方量最高的药物类别之一</strong>，但也是医生最谨慎使用的一类药物。合理使用它们，是医学的艺术，更是对风险的长期平衡。</p>
<hr>
<h2 id="哪些人会接受镇静剂处方" class="toc-header"><a class="toc-anchor" href="#哪些人会接受镇静剂处方">¶</a> 哪些人会接受镇静剂处方？</h2>
<p><mark class="marker-yellow"><strong>长期睡眠障碍、焦虑症或恐慌障碍患者</strong></mark></p>
<p><strong>经诊断需镇静诱导的术前患者或癫痫控制患者</strong></p>
<p><strong>伴有HPA轴高敏反应、神经性激越或自主神经失调的精神疾病患者</strong></p>
<p><mark class="marker-yellow">但并非所有“睡不着”都需要安眠药，也并非所有焦虑都需要镇静处理。在临床上，镇静剂从来不是第一线，而是在排除诱因、调节行为、尝试非药物手段失败后的一种<strong>必要工具</strong>。</mark></p>
<hr>
<h2 id="镇静安眠药目前的主流分类" class="toc-header"><a class="toc-anchor" href="#镇静安眠药目前的主流分类">¶</a> 镇静安眠药目前的主流分类</h2>
<p>在目前临床实践中，镇静安眠药主要可以分为以下几大类：</p>
<p><mark class="pen-green"><strong>苯二氮䓬类药物（BZDs）</strong></mark></p>
<p><mark class="pen-green"><strong>非苯类Z药物（Z-drugs）</strong></mark></p>
<p><mark class="pen-green"><strong>食欲素受体拮抗剂（DORAs）</strong></mark></p>
<p><mark class="pen-green"><strong>褪黑素受体激动剂（MRAs）</strong></mark></p>
<p><mark class="marker-yellow"><strong>第一代抗组胺类（仅少数OTC药品）</strong></mark></p>
<p><mark class="marker-yellow"><strong>巴比妥类药物（历史上广泛使用，现已淘汰）</strong></mark></p>
<p><span class="text-big"><strong>其中，BZDs与Z药构成了目前最常规、最普遍使用的临床处方体系。</strong></span></p>
<p>&nbsp;</p>
<h2 id="强度排名" class="toc-header"><a class="toc-anchor" href="#强度排名">¶</a> <span class="text-big"><strong>强度排名</strong></span></h2>

<h1 id="苯二氮类药物-benzodiazepines" class="toc-header"><a class="toc-anchor" href="#苯二氮类药物-benzodiazepines">¶</a> 苯二氮䓬类药物 Benzodiazepines</h1>
<p>苯二氮卓类药物属于镇静剂，既是一类常用的安眠药，同时也是强效的抗焦虑药。它们的诞生与发展背后，有着一段充满智慧与执着的传奇故事。</p>
<p>数十年前，人们在面对焦虑、失眠、癫痫发作时，唯一能依赖的主要是巴比妥类药物。这类药物虽有效，但却像一把双刃剑：剂量稍过便容易出现危险，长期使用也可能成瘾并伴随严重的戒断反应。医学界迫切需要一种新的、安全性更高的药物来取代它。</p>
<p>正是在这样的历史背景下，罗氏制药厂的波兰裔美国化学家Leo Sternbach（利奥·斯特恩巴赫）博士登上了历史舞台。斯特恩巴赫博士原本接到的任务并不是去创造什么新药，而是要模仿一款名为“眠尔通”的巴比妥类药物。然而，这位骄傲而充满激情的化学家对“仿制”并不感兴趣，他的内心深处渴望的是突破和创造。</p>
<p>凭着对化学的热爱与坚定的决心，斯特恩巴赫博士开始了自己的探索之路。他没有循规蹈矩地去模仿，而是毅然决然地从化学染料研究入手。但化学的世界深邃又难测，两年的实验都毫无进展。管理层最终失去了耐心，决定停止他的研究项目，要求他转向别的药物开发。</p>
<p>然而，即便项目被官方终止，斯特恩巴赫博士却并未放弃。在孤独的实验室里，没有助手、没有官方支持，他依然偷偷地、执拗地坚持自己的研究。他对喹啉类化合物和含氮杂环的独特热情，驱使他不断地尝试，调整骨架结构，反复进行环外基团修饰的实验。</p>
<p>最终，他奇迹般地合成了第一个苯二氮卓化合物——氯氮䓬。这种新型化合物结构巧妙，一个苯环与一个二氮杂环稠合而成。它的出现彻底改变了精神药物的版图。经过临床测试，这种新的药物不仅拥有出色的抗焦虑与镇静效果，更重要的是，它的安全性远远优于以往的巴比妥类药物。</p>
<p>这一成功极大地鼓舞了斯特恩巴赫博士，他很快便在同样的苯二氮卓骨架基础上开发出了另一款药物——地西泮（安定）。他将这两个药物以象征性的1美元价格转让给了罗氏制药厂，对他而言，这些药物最大的价值远非金钱所能衡量，他真正看重的是人类健康所能从中获得的巨大改善。</p>
<p>罗氏公司随后陆续推出了氯氮䓬、地西泮、硝西泮、氟西泮、氟硝西泮、氯硝西泮等一系列苯二氮卓类药物，迅速占据了全球市场。这些药物至今仍然是治疗焦虑、失眠、癫痫的重要临床选择。而苯二氮卓类药物的成功，更是为罗氏制药带来了几十亿美元乃至更高的商业收入。</p>
<p>尽管名利双收，斯特恩巴赫博士始终没有迷失在荣耀中。他一生热爱化学，把它视为一门真正的艺术，一种追逐内心渴望的激情。他曾谦虚地说：“我一直在做我热爱的事情。”2005年9月28日，这位享誉世界的化学巨匠在美国北卡罗来纳州教堂山安详离世，享年97岁。</p>
<p>传奇虽落幕，但他的创造永恒地改变了药物治疗领域，也改变了无数焦虑、失眠、癫痫患者的生命轨迹。今天，每当我们手持苯二氮卓药物，或许都该感念一下这位伟大的化学家，Leo Sternbach博士。他的坚持、热忱与无私，为医学界乃至全人类留下了无价的遗产。</p>
<p>&nbsp;</p>

<h3 id="临床表现" class="toc-header"><a class="toc-anchor" href="#临床表现">¶</a> 【临床表现】</h3>
<p><strong>缓解速度</strong>：迅速缓解急性焦虑与惊恐症状。</p>
<p><strong>起效后表现</strong>：显著镇静、抗焦虑、情绪放松感强，亦可能伴随轻度欣快感。</p>
<p><strong>精神适应性</strong>：对严重焦虑、急性惊恐发作患者疗效明显，但长期使用容易产生耐受性、依赖性。</p>
<h3 id="副作用" class="toc-header"><a class="toc-anchor" href="#副作用">¶</a> 【副作用】</h3>
<p>常见：嗜睡、头晕、疲劳、认知功能下降、记忆损害、共济失调。</p>
<p>较少见：情绪波动、易激惹、耐受与戒断反应（需逐步减量）。</p>
<h3 id="额外药效" class="toc-header"><a class="toc-anchor" href="#额外药效">¶</a> 【额外药效】</h3>
<p>除焦虑、惊恐障碍外，对轻度失眠也有一定辅助治疗作用（非主要适应症）。</p>
<h3 id="优劣分析" class="toc-header"><a class="toc-anchor" href="#优劣分析">¶</a> 【优劣分析】</h3>
<p><strong>优点</strong>：</p>
<p>起效迅速，对惊恐障碍、急性焦虑发作极为有效。</p>
<p>药效强，短期效果好。</p>
<p><strong>缺点</strong>：</p>
<p>易耐受与依赖，长期用药需要严格监控。</p>
<p>可能产生明显戒断反应。</p>
<h3 id="药物评价" class="toc-header"><a class="toc-anchor" href="#药物评价">¶</a> 【药物评价】</h3>
<p>国内医生对于<strong>重度失眠、重度焦虑、重度抑郁症</strong>开的最多的药了，基本上这东西白天也能吃，在褪黑素调节足够的情况下吃了并不会睡着，能慢慢缓解焦虑，<mark class="pen-red"><strong>但是这个药的问题是滥用会有欣快感所以很多人都在各个不同医院骗处方，我只能说远离任何药物滥用行为，还是那句话，滥用苯二氮卓会造成严重的呼吸抑制。</strong></mark></p>
<p>&nbsp;</p>

<h3 id="评价-2" class="toc-header"><a class="toc-anchor" href="#评价-2">¶</a> 【评价】</h3>
<p><strong>目前国内安眠药一哥，没什么争议，咪达唑仑在适用性和持续时间上输给它算是二哥。</strong></p>
<p>这药耐受曲线很快，Wiki主第一次吃，<strong>2mg放倒我18个小时，一周后就变成2mg可以入睡，</strong>而现在，wiki主的医嘱是最多<mark class="pen-red"><strong>6mg氯硝西泮联用100mg喹硫平</strong></mark>，这就是氯硝西泮恐怖的耐药性进化，我吃4mg氯硝西泮能没有任何感觉的。</p>
<p><strong>但这款药拯救了我，我的CPTSD发作时、痛苦的回忆蔓延时、打APEX技术瓶颈的焦虑时，是氯硝西泮能让我好好的，至少冷静下来，我很长一段时间都在一直焦虑，莫名的焦虑一切，而焦虑一严重，我的躁狂就有点要犯，是氯硝西泮让我不去伤害自己。于是乎，我把氯硝西泮的化学结构纹在了我身上。</strong></p>

<h2 id="地西泮安定diazepamde-2016084" class="toc-header"><a class="toc-anchor" href="#地西泮安定diazepamde-2016084">¶</a> 地西泮/安定（Diazepam）DE 2016084</h2>
<blockquote>
  <p><mark class="marker-yellow">⚠️ <strong>提示：作为苯二氮卓类药物的“开山之作”，地西泮历史意义重大，但在当前临床中已不再是多数医院的“一线安眠药”。</strong></mark></p>
  <p><mark class="marker-yellow">目前地西泮主要用于<strong>抗癫痫发作、酒精或苯二氮卓类药物停用的解毒期、严重焦虑状态</strong>，或作为其他药物无效时的替代选项。因其<strong>超长半衰期、强蓄积效应与白天残留感</strong>，不适合一般短期失眠治疗。</mark></p>
</blockquote>
<hr>
<h3 id="基本信息-4" class="toc-header"><a class="toc-anchor" href="#基本信息-4">¶</a> 【基本信息】</h3>

<p><strong>化学分子式</strong>：C₁₆H₁₃ClN₂O</p>
<p><strong>药物类别</strong>：苯二氮卓类镇静剂（长效型）</p>
<p><strong>NMPA核准适应症</strong>：用于焦虑状态、癫痫持续状态、酒精戒断、肌肉痉挛、术前镇静等</p>
<p><strong>规格售价</strong>：<br>【精神二类药品，具体售价取决于医院药房；注射剂与片剂视科室使用情况而定】</p>
<hr>

<h3 id="临床表现-4" class="toc-header"><a class="toc-anchor" href="#临床表现-4">¶</a> 【临床表现】</h3>
<p><strong>缓解速度</strong>：相对平缓、稳定，适用于白天焦虑平复或夜间镇静维护</p>
<p><strong>起效后表现</strong>：放松、肌肉松弛、嗜睡感明显，常伴随轻度欣快感</p>
<p><strong>精神适应性</strong>：对强迫性焦虑、酒精停用相关激越有良好效果；但长期使用记忆抑制明显</p>
<hr>
<h3 id="副作用-4" class="toc-header"><a class="toc-anchor" href="#副作用-4">¶</a> 【副作用】</h3>
<p>常见：乏力、嗜睡、注意力减退、共济失调</p>
<p>蓄积性强：长期使用后可能出现“药物倦怠感”或精神性迟钝</p>
<p>特殊：长效代谢物导致<strong>次日残留效应显著</strong>，尤其对高龄患者影响大</p>
<hr>
<h3 id="额外药效-4" class="toc-header"><a class="toc-anchor" href="#额外药效-4">¶</a> 【额外药效】</h3>
<p>是<strong>癫痫持续状态一线注射用药</strong>之一</p>
<p>广泛用于<strong>酒精或药物依赖解毒期的镇静缓解</strong></p>
<p>可用于<strong>肌肉痉挛缓解</strong>（如破伤风、脑瘫）与术前焦虑干预</p>
<hr>
<h3 id="优劣分析-4" class="toc-header"><a class="toc-anchor" href="#优劣分析-4">¶</a> 【优劣分析】</h3>
<p><strong>优点</strong>：多效应、作用稳定、可口服/注射/直肠给药，适用于多类特殊病人</p>
<p><strong>缺点</strong>：过长半衰期导致蓄积过度、嗜睡残留；不适合年轻或仅有轻度失眠者使用</p>
<hr>
<h3 id="评价-3" class="toc-header"><a class="toc-anchor" href="#评价-3">¶</a> 【评价】</h3>
<p>药是个好药，但不适用于现在的失眠/焦虑/抑郁患者，因为有太多更好的选择了，只有在需要长期镇静的时候才会开具，地西泮也被成为安定，这玩意也没少被人滥用。地西泮现在一般都是苯二氮卓药拿来对比强度的背景板…真要说有啥好的，那就是感谢地西泮救过wiki主一命吧….</p>

<h3 id="临床表现-5" class="toc-header"><a class="toc-anchor" href="#临床表现-5">¶</a> 【临床表现】</h3>
<p><strong>缓解速度</strong>：起效迅速，口服剂量 2 mg 通常在30分内显著减轻焦虑；静脉注射仅需几分钟见效，用于急性镇静&nbsp;</p>
<p><strong>起效后表现</strong>：镇静柔和，抗焦虑效果平稳，对认知功能影响小，适用多场景</p>
<p><strong>精神适应性</strong>：适合焦虑引起的失眠和术前辅助镇静，但不适用于极端躁动状态</p>
<hr>
<h3 id="副作用-5" class="toc-header"><a class="toc-anchor" href="#副作用-5">¶</a> 【副作用】</h3>
<p>常见：嗜睡、乏力、轻度认知迟滞、共济失调</p>
<p>特殊：依赖与戒断风险较高，应短期使用，不宜长期每日使用超过4周</p>
<p>安全性：适用于肝肾功能不全者，因其代谢不受CYP450影响</p>
<hr>
<h3 id="额外药效-5" class="toc-header"><a class="toc-anchor" href="#额外药效-5">¶</a> 【额外药效】</h3>
<p><strong>癫痫持续状态（Status epilepticus）一线急救用药</strong>，比地西泮更为稳定&nbsp;</p>
<p>用于<strong>酒精戒断综合征</strong>的快速控制</p>
<p>可用于<strong>术前镇静</strong>、术中焦虑缓解及化疗相关辅助治疗</p>
<hr>
<h3 id="优劣分析-5" class="toc-header"><a class="toc-anchor" href="#优劣分析-5">¶</a> 【优劣分析】</h3>
<p><strong>优点</strong>：起效快、镇静柔和、安全性高；不依赖CYP，适合肝功能不全或MTF群体</p>
<p><strong>缺点</strong>：中效型容易累积，长期使用依赖风险显著；夜间深度睡眠改善有限</p>
<hr>
<h3 id="评价-4" class="toc-header"><a class="toc-anchor" href="#评价-4">¶</a> 【评价】</h3>
<p>劳拉西泮呢，半西泮半唑仑的数据，比较折中，现在开具量挺大的，wiki主也吃过一段时间，不过因为效力对wiki主来说不够所以换掉了。抗焦虑还是可以的，适合和其他抗抑郁药/抗焦虑药联用，加强抗焦虑。</p>
<p>&nbsp;</p>

<p><strong>缺点</strong>：</p>
<p>起效慢，不适合急性入睡需求</p>
<p>中程持续，次日轻度残留可能</p>
<p>对普通失眠者镇静强度相对温和</p>
<hr>

<p>这东西效果太微弱了，如果你身体比较虚弱，那吃奥沙是没啥问题的，奥沙西泮大部分处方都是给老人开的，这东西起效也慢，维持时间也短，在我主观评价这一块的话，奥沙西泮和阿戈美拉汀坐一桌。</p>
<p><strong>如果你开的是奥沙西泮并且吃着没用，那就对咯，去找你的医生换药吧。</strong></p>

<p><strong>精神适应性</strong>：适用于慢性、耐药性失眠及老年患者；不宜用于需快速入睡的短期失眠或急性焦虑状态&nbsp;</p>
<hr>
<h3 id="副作用-7" class="toc-header"><a class="toc-anchor" href="#副作用-7">¶</a> 【副作用】</h3>
<p><strong>常见</strong>：嗜睡、头晕、共济失调、记忆与认知障碍&nbsp;</p>
<p><strong>严重</strong>：次日残余效应显著，增加跌倒与骨折风险；长期使用易产生耐受与戒断症状</p>
<hr>
<h3 id="额外药效-7" class="toc-header"><a class="toc-anchor" href="#额外药效-7">¶</a> 【额外药效】</h3>
<p><strong>抗惊厥</strong>：可辅助控制癫痫发作</p>
<p><strong>肌松</strong>：对肌肉痉挛有一定缓解作用</p>
<p><strong>镇静幅度</strong>：对酒精戒断综合征镇静亦有良好效果</p>
<hr>
<h3 id="优劣分析-7" class="toc-header"><a class="toc-anchor" href="#优劣分析-7">¶</a> 【优劣分析】</h3>
<p><strong>优点</strong>：</p>
<p>长效且稳定，适合顽固性失眠与老年患者</p>
<p>对癫痫和酒精戒断有双重适应症</p>
<p><strong>缺点</strong>：</p>
<p>昼夜“宿醉”效应明显，不适合对次日清醒度要求高者</p>
<p>累积性强，长期依赖与戒断风险高</p>
<hr>
<h3 id="评价-6" class="toc-header"><a class="toc-anchor" href="#评价-6">¶</a> 【评价】</h3>
<p>退居二线咯，变成针对性用药了，硝西泮差氯硝西泮一个氯，少了的东西多的去了，这东西的宿醉感太恐怖了，本来我以为中国已经不卖硝西泮了结果发现还有，那就只能做进wiki了T_T</p>

<h1 id="z药物-z-drugs" class="toc-header"><a class="toc-anchor" href="#z药物-z-drugs">¶</a> Z药物 &nbsp;Z Drugs</h1>
<h3 id="简介" class="toc-header"><a class="toc-anchor" href="#简介">¶</a> 简介</h3>
<p>Z药物（Z-drugs）是指一类非苯二氮卓结构、但作用于GABA_A受体的镇静催眠药。它们并不具备苯二氮卓（BZD）的经典结构骨架，但在功能上与苯二氮卓相似，尤其在<strong>催眠效果、镇静作用机制、快速起效与短效代谢特性</strong>方面几乎平行，因此被统称为“<strong>Z药”</strong>。</p>
<h3 id="命名与来源" class="toc-header"><a class="toc-anchor" href="#命名与来源">¶</a> 命名与来源</h3>
<p>“Z-drugs”这个非正式称呼，起源于这些药物的英文通用名普遍以 <strong>Z</strong> 开头，包括：</p>
<p><strong>Zolpidem</strong>（唑吡坦）</p>
<p><strong>Zopiclone</strong>（佐匹克隆）</p>
<p><strong>Zaleplon</strong>（扎来普隆）</p>
<p>虽然并非所有此类药物均以Z开头（如Eszopiclone为Zopiclone的对映体），但“Z-drugs”一词因其简洁、易识别的特点广为医学界和患者接受，成为对这一药物类别的通用称呼。</p>
<h3 id="出现时间与开发顺序" class="toc-header"><a class="toc-anchor" href="#出现时间与开发顺序">¶</a> 出现时间与开发顺序</h3>
<p>Z药物的开发始于20世纪80年代末期，目的是<strong>寻找一种更安全、依赖性更低、起效更快、次日残留更少</strong>的安眠药物，以替代苯二氮卓在慢性失眠中的广泛使用。主要药物的开发顺序如下：</p>
<p><strong>佐匹克隆（Zopiclone）</strong>：最早在1986年由赛诺菲公司（Sanofi）在法国上市</p>
<p><strong>唑吡坦（Zolpidem）</strong>：1992年在美国FDA批准上市，成为Z类中最广泛使用的代表</p>
<p><strong>扎来普隆（Zaleplon）</strong>：1999年在美国上市，为超短效代表</p>
<p><strong>右佐匹克隆（Eszopiclone）</strong>：佐匹克隆的左旋对映体，2004年在美国上市，被认为起效更快、副作用更轻</p>
<h3 id="开发目的" class="toc-header"><a class="toc-anchor" href="#开发目的">¶</a> 开发目的</h3>
<p>Z药物的开发旨在：</p>
<p>减少苯二氮卓类药物在<strong>长期使用后的耐药与依赖性</strong></p>
<p>避免BZD引发的<strong>次日嗜睡、认知障碍、跌倒等副作用</strong></p>
<p>优化药代动力学参数：<strong>起效更快，代谢更短，残留更少</strong></p>
<p>降低患者的心理依赖与滥用风险，尤其适合<strong>入睡障碍主导型失眠</strong></p>
<h3 id="与苯二氮卓的区别" class="toc-header"><a class="toc-anchor" href="#与苯二氮卓的区别">¶</a> 与苯二氮卓的区别</h3>

<h3 id="临床表现-9" class="toc-header"><a class="toc-anchor" href="#临床表现-9">¶</a> 【临床表现】</h3>
<p><strong>缓解速度</strong>：快速诱导入睡，起效迅速，适用于入睡困难者</p>
<p><strong>起效后表现</strong>：入睡后意识模糊，部分人会出现“意识清醒但身体失控”的现象</p>
<p><strong>精神适应性</strong>：对轻中度短期失眠疗效显著，但对睡眠维持/早醒效果有限</p>
<hr>
<h3 id="副作用-9" class="toc-header"><a class="toc-anchor" href="#副作用-9">¶</a> 【副作用】</h3>
<p><strong>常见</strong>：嗜睡、头昏、协调力下降、口干</p>
<p><strong>特殊</strong>：</p>
<p>梦游、无意识行为（如吃东西、出门、性行为）</p>
<p>幻觉、离体感、欣快感、焦虑加重、攻击性冲动</p>
<p>次日短时记忆丧失与意识混乱（尤其睡眠不足状态服药）</p>
<p>长期使用可能导致心理依赖，存在滥用潜力</p>
<hr>
<h3 id="额外药效-9" class="toc-header"><a class="toc-anchor" href="#额外药效-9">¶</a> 【额外药效】</h3>
<p>唯一的“Z类”药物中有短释放与控释两种剂型（部分国家）</p>
<p>对老年人入睡障碍有使用价值，但剂量需减半</p>
<p><strong>FDA曾特别警告女性代谢慢，应优先从低剂量起始（5mg）</strong></p>
<hr>
<h3 id="优劣分析-9" class="toc-header"><a class="toc-anchor" href="#优劣分析-9">¶</a> 【优劣分析】</h3>
<p><strong>优点</strong>：</p>
<p>起效快、半衰期短，适合仅有入睡困难的患者</p>
<p>次日残留效应相对较轻</p>
<p><strong>缺点</strong>：</p>
<p>可引发梦游与精神异常行为，部分患者出现滥用倾向</p>
<p>仅适合短期使用，长期效果与安全性欠佳</p>
<p>对睡眠维护型失眠无效，易早醒</p>
<hr>
<h3 id="评价-8" class="toc-header"><a class="toc-anchor" href="#评价-8">¶</a> 【评价】</h3>
<p>建议第一次吃思诺思的人在吃的时候找一个人陪着，看看会不会出问题，如果医用剂量（10mg）都出现梦游等行为，就赶紧换药吧。</p>
<p><strong>思诺思是一个经常被拿来娱乐滥用的药物，但这个药其实根本不需要滥用，医学剂量（10mg）就会出现一些奇妙的事情。</strong>思诺思更是一个改善睡眠的药而不是安眠药，Wiki主的安眠药是每个月换一次，思诺思和氯硝西泮对着换。思诺思吃下去后的感觉，怎么说呢，像是朦胧，像Nujabes的Luv Sic 2，我在吃了思诺思的情况下创作了 <a href="https://music.163.com/song?id=2642705023&amp;uct2=U2FsdGVkX18kzzpesIi+bXfyAF8CrXuPLhTcqBmzRng=" class="is-external-link">Sins Pt.1</a> 这首歌，而后由专门为思诺思写了一首意识流的歌： <a href="https://music.163.com/song?id=2646563175&amp;uct2=U2FsdGVkX1+AxQq/dMPwKrmizOsmHJpsUlaVPIc0YX8=" class="is-external-link">Zolpidem</a> ，基本就是抽象化的，吃下去的感觉。</p>
<p><mark class="pen-red">千万不要过量去吃思诺思，会引起危险的。不过可以不在睡前吃，Wiki主开的思诺思是5mg * 20片 版本的，有时候我在白天吃5mg，会有一种很谧境的感觉，感觉像在一场梦里，感觉像是有粉色的滤镜。</mark></p>
<p><strong>但你们不要学Wiki主，他早烂完了）</strong></p>
<p>顺带一提思诺思的化学结构也被Wiki主纹在手臂了。</p>

<hr>

<p><strong>少见</strong>：恶心、头痛、夜惊、双视、激越、依赖及戒断症状&nbsp;</p>

<hr>

<hr>
<h3 id="优劣分析-10" class="toc-header"><a class="toc-anchor" href="#优劣分析-10">¶</a> 【优劣分析】</h3>
<p><strong>优点</strong>：</p>
<p>起效迅速、峰浓度高；</p>
<p>睡眠结构改善显著，生物利用度佳。</p>
<p><strong>缺点</strong>：</p>
<p>金属苦味明显；</p>
<p>幻觉与无意识行为风险较高；</p>
<p>长期使用易产生耐受与依赖。</p>
<hr>
<h3 id="评价-9" class="toc-header"><a class="toc-anchor" href="#评价-9">¶</a> 【评价】</h3>
<p>没吃过，不过一般来讲现在佐匹克隆少了，要么是药房清库存，要么是你不能吃思诺思。</p>
<p>佐匹克隆这个药设计的构架是没问题的，但是Z药都有个通病：挑人。</p>
<p>有的人吃了能睡，有的人吃了就啥事没有，不像BZD稳定对每个人起效。</p>
<p>所以说拿到了吃着没啥用就换了吧。</p>
<p>&nbsp;</p>

<h1 id="褪黑素受体激动剂-mras" class="toc-header"><a class="toc-anchor" href="#褪黑素受体激动剂-mras">¶</a> 褪黑素受体激动剂 MRAs</h1>
<h2 id="简介-1" class="toc-header"><a class="toc-anchor" href="#简介-1">¶</a> 简介</h2>
<p>褪黑素激动剂类（Melatonin receptor agonists）药物是一类作用于<strong>褪黑素受体（MT1与MT2）的镇静助眠药，通过模拟内源性褪黑素的节律调节机制，改善睡眠–觉醒周期紊乱。与传统的GABA增强类安眠药（如苯二氮卓和Z药物）不同，这类药物不直接抑制中枢神经系统</strong>，而是通过<strong>调节生物钟</strong>而实现“生理性入睡”。</p>
<p>褪黑素是一种由松果体在夜间分泌的激素，是调节昼夜节律的核心因子。MT1受体主要促进入睡，MT2受体则与睡眠–觉醒周期的同步有关。受体激动剂的出现，为失眠治疗提供了一种<strong>依赖性低、认知影响小、对睡眠结构友好</strong>的新方案。</p>
<p>目前该类药物在中国大陆已有上市，国际上最具代表性的包括：</p>
<p><strong>Ramelteon</strong>：美国FDA批准用于慢性失眠，临床观察显示无成瘾性；</p>
<p><strong>Agomelatine（阿戈美拉汀）</strong>：国内已上市。既为MT1/MT2激动剂，同时兼具<strong>5-HT₂C受体拮抗作用</strong>，被归类为一种“抗抑郁药中的镇静剂型”。</p>
<p>本栏目只会介绍阿戈美拉汀。</p>
<p>&nbsp;</p>
<h2 id="阿戈美拉汀agomelatine" class="toc-header"><a class="toc-anchor" href="#阿戈美拉汀agomelatine">¶</a> 阿戈美拉汀（Agomelatine）</h2>

<p><strong>药物国际通用名</strong>：Agomelatine</p>
<p><strong>化学分子式</strong>：C₁₅H₁₇NO₂&nbsp;</p>
<p><strong>药物类别</strong>：褪黑素受体激动剂／5-HT₂C受体拮抗剂&nbsp;</p>
<p><strong>NMPA核准适应症</strong>：尚未获NMPA批准；欧盟等地区批准用于重度抑郁症（MDD）&nbsp;</p>
<p><strong>规格售价</strong>：<br>【原研】Les Laboratoires Servier Industrie 阿戈美拉汀片 25mg/14片 价格：231.75元</p>
<p>北京福元医药股份有限公司 阿戈美拉汀片 25mg/14片 价格：139.05元</p>

<h3 id="临床表现-13" class="toc-header"><a class="toc-anchor" href="#临床表现-13">¶</a> 【临床表现】</h3>
<p><strong>缓解速度</strong>：需持续使用1 – 2周方能显著改善睡眠结构与入睡潜伏期&nbsp;</p>
<p><strong>起效后表现</strong>：增加慢波睡眠（深睡眠）时间，减少夜间觉醒，无次日嗜睡或认知迟滞&nbsp;</p>
<p><strong>精神适应性</strong>：除对失眠的节律调节外，兼具<strong>抗抑郁</strong>作用，适合<strong>抑郁伴失眠</strong>、老年或不耐受GABA药物者</p>
<hr>
<h3 id="副作用-13" class="toc-header"><a class="toc-anchor" href="#副作用-13">¶</a> 【副作用】</h3>
<p><strong>常见</strong>：头痛、晕眩、疲劳、恶心、胃肠不适&nbsp;</p>
<p><strong>少见</strong>：肝酶升高（推荐用药前及用药中定期监测肝功能）</p>
<p><strong>禁忌/注意</strong>：孕妇、75岁以上或严重肝功能不全者禁用；合并CYP1A2抑制剂（如氟伏沙明）慎用</p>
<hr>
<h3 id="额外药效-13" class="toc-header"><a class="toc-anchor" href="#额外药效-13">¶</a> 【额外药效】</h3>
<p><strong>兼具抗抑郁效应</strong>：拮抗5-HT₂C受体，促进前额叶去甲肾上腺素和多巴胺释放，改善抑郁症状&nbsp;</p>
<p><strong>生物钟重置</strong>：通过MT₁/MT₂受体激动，修复昼夜节律，对时差综合征亦有研究证据</p>
<hr>
<h3 id="优劣分析-13" class="toc-header"><a class="toc-anchor" href="#优劣分析-13">¶</a> 【优劣分析】</h3>
<p><strong>优点</strong></p>
<p>无依赖性和耐受性风险</p>
<p>无次日嗜睡，认知影响小</p>
<p>兼具抗抑郁，适用于情绪障碍伴失眠</p>
<p>对老年人及肝肾功能不全者相对安全（除需肝功能监测）</p>
<p><strong>缺点</strong></p>
<p>起效慢，需连续使用数周见效</p>
<p>首过效应强，生物利用度低</p>
<p>肝毒性需监测肝酶</p>
<p>价格较高，虽然说有仿制药了</p>
<hr>

<p>这玩意就是个简单改装的褪黑素。</p>
<p>它意外地有抗抑郁效果，但是其实真的很微弱，现在我们这儿院区一般也就是给那种中度轻度抑郁的患者开了吃吃，顺便改善睡眠，要么就是老人，这玩意对老人确实挺有效的。</p>
<p>褪黑素受体激动剂还是有继续研发的动力的，也希望国内有更多褪黑素受体激动剂上市。</p>

<h1 id="食欲素受体拮抗剂orexin-receptor-antagonists" class="toc-header"><a class="toc-anchor" href="#食欲素受体拮抗剂orexin-receptor-antagonists">¶</a> 食欲素受体拮抗剂（Orexin Receptor Antagonists）</h1>
<h3 id="简介-2" class="toc-header"><a class="toc-anchor" href="#简介-2">¶</a> 简介</h3>
<p>食欲素受体拮抗剂（Orexin Receptor Antagonists，简称ORA或更具体的DORA——Dual Orexin Receptor Antagonists）是一类新兴的镇静安眠药物，作用机制不同于传统的苯二氮卓类（BZD）与Z药物。该类药物通过<strong>阻断下丘脑分泌的神经肽“食欲素”（Orexin A与B）对其受体OX₁R与OX₂R的激活</strong>，从而促进自然睡眠的发生。</p>
<p>食欲素系统是维持清醒状态的关键中枢神经调节通路。Orexin在清醒时释放，在睡眠时抑制，其异常激活与多种失眠状态密切相关。通过拮抗OX₁R和OX₂R，DORA类药物可在不影响GABA系统的前提下诱导睡眠，因此<strong>不影响睡眠结构、认知、或引起肌肉松弛、呼吸抑制等传统安眠药副作用</strong>，也<strong>极少产生依赖性或耐受性</strong>。</p>
<p>目前上市的主要DORA类药物包括：</p>
<p><strong>Suvorexant（苏沃雷生）</strong>：最早获批的DORA，于2014年被FDA批准；</p>
<p><strong>Lemborexant（莱博雷生）</strong>：在睡眠维持方面表现优越；</p>
<p><strong>Daridorexant（达立雷生）</strong>：欧洲与美国已上市，具备良好的短中期安全性；</p>
<p><strong>Filorexant</strong> 与 <strong>Almorexant</strong>：虽进入临床研究阶段，但因副作用或市场考量未获批上市。</p>
<p>食欲素拮抗剂的问世被认为是继Z药物后的重大进展，尤其适用于<strong>睡眠维持障碍、老年失眠、对传统安眠药反应差或不耐受者</strong>。其“非镇静型镇静”机制，提供了一个更接近自然生理状态的睡眠诱导方式，是现代失眠治疗中越来越受关注的新方向。</p>
<p>&nbsp;</p>

<h3 id="临床表现-14" class="toc-header"><a class="toc-anchor" href="#临床表现-14">¶</a> 【临床表现】</h3>
<p><strong>缓解速度</strong>：可在30–45分钟内明显缩短入睡时间，适合入睡困难型失眠</p>
<p><strong>起效后表现</strong>：同时减少夜间觉醒频率和夜间早醒，总睡眠时间延长；不显著抑制REM期&nbsp;</p>
<p><strong>精神适应性</strong>：认知功能和日间警觉性影响小，醒后驾车和日间活动安全性较高&nbsp;</p>
<hr>
<h3 id="副作用-14" class="toc-header"><a class="toc-anchor" href="#副作用-14">¶</a> 【副作用】</h3>
<p><strong>常见</strong>：头痛、嗜睡、疲劳、恶心&nbsp;</p>
<p><strong>少见</strong>：梦境异常、次日轻度嗜睡、偶见记忆缺失</p>
<p><strong>罕见</strong>：复杂睡眠行为（梦游、进食）、情绪波动</p>
<hr>
<h3 id="额外药效-14" class="toc-header"><a class="toc-anchor" href="#额外药效-14">¶</a> 【额外药效】</h3>
<p>不影响肌张力和呼吸抑制</p>
<p>无明显成瘾性或耐受性，大规模长期研究（12个月）未见戒断反弹&nbsp;</p>
<hr>
<h3 id="优劣分析-14" class="toc-header"><a class="toc-anchor" href="#优劣分析-14">¶</a> 【优劣分析】</h3>
<p><strong>优点</strong>：</p>
<p>机制独特，不作用于GABA，大幅减少传统安眠药副作用</p>
<p>起效迅速且持续适中，次日残留较轻</p>
<p>不影响REM睡眠结构，认知与情绪平稳</p>
<p><strong>缺点</strong>：</p>
<p>价格较高，专利到期前成本负担较重</p>
<p>对CYP3A4抑制剂需谨慎联合用药</p>
<p>起效需30分钟，非超短效药物</p>
<hr>
<h3 id="评价-13" class="toc-header"><a class="toc-anchor" href="#评价-13">¶</a> 【评价】</h3>
<p>这玩意是颠覆性的药，它从“正变构调节”引导你安眠变成了“通过拮抗食欲素恢复你原始的睡眠”，它改善的是睡眠结构和睡眠质量，并且它的催眠原理是自然地让你产生入睡想法，只是现在没什么测评和消息，wiki主最近去不了广东，没法买到莱博雷生来试药，所以暂时就先放着吧。</p>
